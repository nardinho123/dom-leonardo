    function AtendimentoModal({ detail, onClose, onSend, onSendMidia, onResolve }) {
      const [reply, setReply] = useState('');
      const [gravando, setGravando] = useState(false);
      const [enviandoMidia, setEnviandoMidia] = useState(false);
      const scrollRef = useRef(null);
      const recorderRef = useRef(null);
      const chunksRef = useRef([]);
      const { atendimento, mensagens } = detail;

      useEffect(() => {
        setTimeout(() => {
          if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }, 50);
      }, [mensagens.length]);

      const send = async () => {
        const texto = reply.trim();
        if (!texto) return;
        setReply('');
        await onSend(texto);
      };

      const enviarFoto = async (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        setEnviandoMidia(true);
        try {
          const blob = await resizeImage(file, IMAGE_PRESETS.prato);
          await onSendMidia(blob, 'imagem', 'image/webp', 'webp');
        } catch (err) {
          toast(err.message, 'error');
        } finally {
          setEnviandoMidia(false);
        }
      };

      const toggleAudio = async () => {
        if (gravando) {
          try { recorderRef.current && recorderRef.current.stop(); } catch (_) {}
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
          toast('Navegador nao permite gravar audio.', 'error');
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mimePref = (typeof MediaRecorder.isTypeSupported === 'function' && MediaRecorder.isTypeSupported('audio/webm')) ? 'audio/webm' : '';
          const rec = new MediaRecorder(stream, mimePref ? { mimeType: mimePref } : undefined);
          chunksRef.current = [];
          rec.ondataavailable = ev => { if (ev.data && ev.data.size) chunksRef.current.push(ev.data); };
          rec.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            setGravando(false);
            const tipoBlob = (rec.mimeType || 'audio/webm').split(';')[0];
            const blob = new Blob(chunksRef.current, { type: tipoBlob });
            if (blob.size < 800) return;
            const ext = tipoBlob.includes('ogg') ? 'ogg' : 'webm';
            setEnviandoMidia(true);
            try {
              await onSendMidia(blob, 'audio', tipoBlob, ext);
            } finally {
              setEnviandoMidia(false);
            }
          };
          recorderRef.current = rec;
          rec.start();
          setGravando(true);
        } catch (err) {
          toast('Preciso da permissao do microfone.', 'error');
        }
      };

      return (
        <div className="modal-backdrop">
          <div className="modal">
            <div className="modal-head">
              <div>
                <h3>Marco · {atendimento.cliente_nome || 'Cliente no cardápio'}</h3>
                <p className="muted" style={{margin:'4px 0 0'}}>{fmtDate(atendimento.ultima_mensagem_em || atendimento.aberto_em)}</p>
              </div>
              <button className="btn btn-ghost" onClick={onClose}>Fechar</button>
            </div>
            <div className="modal-body">
              <div className="chat-thread" ref={scrollRef}>
                {mensagens.map(msg => {
                  const midiaUrl = msg.contexto && msg.contexto.midia_url;
                  const midiaTipo = msg.contexto && msg.contexto.midia_tipo;
                  return (
                    <div key={msg.id} className={`chat-bubble ${msg.autor}`}>
                      <strong>{msg.autor === 'admin' ? 'Você' : msg.autor === 'cliente' ? 'Cliente' : 'Sistema'}</strong>
                      {midiaTipo === 'imagem' && midiaUrl && (
                        <a href={midiaUrl} target="_blank" rel="noreferrer"><img src={midiaUrl} alt="foto" style={{ display:'block', maxWidth:'220px', maxHeight:'240px', borderRadius:'10px', margin:'4px 0' }} /></a>
                      )}
                      {midiaTipo === 'audio' && midiaUrl && (
                        <audio src={midiaUrl} controls preload="none" style={{ display:'block', width:'230px', maxWidth:'100%', margin:'4px 0' }}></audio>
                      )}
                      {msg.texto && <span>{msg.texto}</span>}
                      <small>{fmtDate(msg.criado_em)}</small>
                    </div>
                  );
                })}
                {!mensagens.length && <div className="empty">Ainda não tem mensagem nesta conversa.</div>}
              </div>
              <div className="reply-box">
                <textarea
                  value={reply}
                  onChange={e => setReply(e.target.value)}
                  onKeyDown={e => {
                    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send();
                  }}
                  placeholder="Responda como Marco. Ctrl+Enter envia."
                />
                <div className="actions">
                  <label className="btn" style={{ cursor:'pointer', opacity: enviandoMidia ? .5 : 1 }}>
                    📷 Foto
                    <input type="file" accept="image/*" style={{ display:'none' }} onChange={enviarFoto} disabled={enviandoMidia || gravando} />
                  </label>
                  <button className={`btn ${gravando ? 'btn-danger' : ''}`} onClick={toggleAudio} disabled={enviandoMidia}>
                    {gravando ? '■ Parar' : '🎤 Áudio'}
                  </button>
                  <button className="btn" onClick={onResolve}>Resolver</button>
                  <button className="btn btn-primary" onClick={send} disabled={!reply.trim()}>Enviar</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function GestorPedidos({ pedidos, reload, openOrder, aceitarPedido, recusarPedido, updateStatus }) {
      // Estilo iFood: pedido finalizado/recusado fica um tempo como card compacto e depois SAI da tela.
      // O historico completo continua na aba "Pedidos".
      const JANELA_FINALIZADOS_MS = 12 * 60 * 60 * 1000; // 12 horas
      const ehRecente = (p) => {
        const t = new Date(p.atualizado_em || p.criado_em || 0).getTime();
        return Number.isFinite(t) && (Date.now() - t) <= JANELA_FINALIZADOS_MS;
      };
      const lanes = [
        {
          id: 'em_preparo',
          title: 'Em preparo',
          hint: 'Pagos entram aqui. Aceite e acompanhe a cozinha.',
          filter: p => p.pagamento_status === 'pago' && p.status !== 'cancelado' && (
            isPaidPending(p) || (p.aceite_status === 'aceito' && ['novo', 'em_preparo'].includes(p.status))
          ),
        },
        {
          id: 'pronto',
          title: 'Pronto',
          hint: 'Aguardando coleta ou conferência do motoboy.',
          filter: p => p.pagamento_status === 'pago' && p.aceite_status === 'aceito' && p.status === 'pronto',
        },
        {
          id: 'em_rota',
          title: 'Em rota',
          hint: 'Motoboy saiu para entregar.',
          filter: p => p.pagamento_status === 'pago' && p.aceite_status === 'aceito' && p.status === 'saiu_entrega',
        },
        {
          id: 'finalizados',
          title: 'Finalizados',
          hint: 'Concluídos nas últimas 12h. Histórico completo na aba Pedidos.',
          compact: true,
          filter: p => p.pagamento_status === 'pago' && p.status === 'entregue' && ehRecente(p),
        },
        {
          id: 'recusados',
          title: 'Recusados',
          hint: 'Cancelados ou estornados nas últimas 12h.',
          compact: true,
          filter: p => (p.aceite_status === 'recusado' || p.pagamento_status === 'estornado') && ehRecente(p),
        },
      ];

      const tsPedido = (p) => new Date(p.criado_em || 0).getTime() || 0;

      return (
        <section className="panel">
          <div className="section-title">
            <div>
              <h2>Gestor de Pedidos</h2>
              <p>O pagamento caiu, o pedido aparece aqui. Aceite, recuse com estorno ou avance o status.</p>
            </div>
            <button className="btn" onClick={reload}>Atualizar</button>
          </div>
          <div className="gestor-grid">
            {lanes.map(lane => {
              let lanePedidos = pedidos.filter(lane.filter);
              lanePedidos = lanePedidos.slice().sort((a, b) => lane.compact
                ? tsPedido(b) - tsPedido(a)   // finalizados: mais novo primeiro
                : tsPedido(a) - tsPedido(b)); // fila ativa: mais antigo primeiro (urgencia)
              if (lane.compact) lanePedidos = lanePedidos.slice(0, 12);
              return (
                <div className="gestor-lane" key={lane.id}>
                  <header>
                    <div className="gestor-card-row">
                      <div>
                        <h3>{lane.title}</h3>
                        <p>{lane.hint}</p>
                      </div>
                    <span className={`gestor-badge ${lane.id === 'em_preparo' ? 'gold' : ''}`}>{lanePedidos.length}</span>
                    </div>
                  </header>
                  <div className={`gestor-lane-body ${lane.compact ? 'compacta' : ''}`}>
                    {lanePedidos.length === 0 && <div className="gestor-empty">Nada por aqui agora.</div>}
                    {lanePedidos.map(pedido => (
                      lane.compact ? (
                        <PedidoGestorMini
                          key={pedido.id}
                          pedido={pedido}
                          laneId={lane.id}
                          openOrder={openOrder}
                        />
                      ) : (
                        <PedidoGestorCard
                          key={pedido.id}
                          pedido={pedido}
                          laneId={lane.id}
                          openOrder={openOrder}
                          aceitarPedido={aceitarPedido}
                          recusarPedido={recusarPedido}
                          updateStatus={updateStatus}
                        />
                      )
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </section>
      );
    }

    // Card compacto (estilo iFood): numero grande + primeiro nome + status. Clique abre os detalhes.
    function PedidoGestorMini({ pedido, laneId, openOrder }) {
      const recusado = laneId === 'recusados';
      const primeiroNome = String(pedido.cliente_nome || 'Cliente').trim().split(' ')[0];
      return (
        <button type="button" className="gestor-card gestor-mini" onClick={() => openOrder(pedido)}>

          <span className="gestor-mini-nome">{primeiroNome}</span>
          <span className={`gestor-mini-status ${recusado ? 'ruim' : 'ok'}`}>
            {recusado ? '✕ Recusado' : '✓ Concluído'}

        </button>
      );

    function PedidoGestorCard({ pedido, laneId, openOrder, aceitarPedido, recusarPedido, updateStatus }) {

      return (
        <article className={`gestor-card ${pago ? 'pago' : ''}`}>
          <div className="gestor-card-top">
            <div>
              <h4>{orderLabel(pedido)} · {pedido.cliente_nome || 'Cliente'}</h4>
              <div className="order-meta">
                <span>{fmtDate(pedido.criado_em)}</span>
                <span>{pago ? 'Pago' : 'Pendente'}</span>
              </div>
            </div>
            <span className="gestor-badge gold">{fmtMoney(pedido.total)}</span>
          </div>

          <div className="gestor-info">
            <span>📍 {endereco}</span>
            <span>📱 {whatsapp || 'WhatsApp nao informado'}</span>
            <span>👤 {totalPedidos} pedido{totalPedidos === 1 ? '' : 's'} deste cliente</span>

          <div className="gestor-items">
            {itens.length === 0 && <span>Itens ainda nao carregados.</span>}
            {itens.slice(0, 4).map(item => (
              <span key={item.id}>{item.quantidade || 1}x {item.prato_nome}{item.tamanho_nome ? ` · ${item.tamanho_nome}` : ''}</span>
            ))}
            {itens.length > 4 && <span>+ {itens.length - 4} item(ns)</span>}

          <div className="gestor-card-row">
            <button className="btn btn-small" onClick={() => openOrder(pedido)}>Ver detalhes</button>
            {whatsapp && (
              <a className="btn btn-small" target="_blank" href={`https://wa.me/55${normalizePhone(whatsapp).replace(/^55/, '')}`}>WhatsApp</a>
            )}
          </div>

          {laneId === 'em_preparo' && isPaidPending(pedido) && (
            <div className="gestor-actions">
              <button className="btn btn-primary" onClick={() => aceitarPedido(pedido)}>Aceitar</button>
              <button className="btn btn-danger" onClick={() => recusarPedido(pedido)}>Recusar</button>
            </div>
          )}

          {laneId === 'em_preparo' && !isPaidPending(pedido) && (
            <div className="gestor-actions">
              <button className="btn" onClick={() => updateStatus(pedido, 'pronto')}>Pronto</button>
            </div>

          {laneId === 'pronto' && (
            <div className="gestor-actions">
              <button className="btn btn-primary" onClick={() => updateStatus(pedido, 'saiu_entrega')}>Saiu para entrega</button>
            </div>
          )}

          {laneId === 'em_rota' && (
            <div className="gestor-actions">
              <button className="btn btn-primary" onClick={() => updateStatus(pedido, 'entregue')}>Marcar entregue</button>
            </div>
          )}
        </article>
      );
    }

      const endereco = pedido.endereco_snapshot || {};
      return (
        <div className="modal-backdrop">
          <div className="modal">
            <div className="modal-head"><h3>Pedido #{pedido.numero_pedido}</h3><button className="btn btn-ghost" onClick={onClose}>Fechar</button></div>
            <div className="modal-body">
              <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))'}}>
                <div><p className="muted">Cliente</p><h3>{pedido.cliente_nome}</h3><p>{pedido.cliente_whatsapp}</p></div>
                <div><p className="muted">Total</p><h3>{fmtMoney(pedido.total)}</h3><p>Subtotal {fmtMoney(pedido.subtotal)} · Desconto {fmtMoney(pedido.desconto)}</p></div>
                <div><p className="muted">Status</p><h3>{STATUS_LABEL[pedido.status]}</h3><p>{fmtDate(pedido.criado_em)}</p></div>
              </div>
              <hr style={{border:0,borderTop:'1px solid var(--line)',margin:'16px 0'}} />
              <h3>Itens</h3>
              {itens.map(item => (
                <div className="row-card" key={item.id}>
                  <strong>{item.quantidade}x {item.prato_nome} {item.tamanho_nome ? `(${item.tamanho_nome})` : ''}</strong>
                  <p className="money">{fmtMoney(item.preco_total)}</p>
                  {!!item.opcionais_snapshot?.length && <p className="muted">{item.opcionais_snapshot.map(op => `+ ${op.opcional_nome || op.nome}`).join(' · ')}</p>}
                  {item.observacoes && <p>{item.observacoes}</p>}
                </div>
              ))}
              <h3>Endereço</h3>
              <p>{endereco.logradouro}, {endereco.numero}{endereco.complemento ? ` — ${endereco.complemento}` : ''} · {endereco.bairro} · {endereco.cidade}/{endereco.uf}</p>
            </div>
            <div className="modal-foot"><button className="btn" onClick={() => window.print()}>Imprimir</button><button className="btn btn-primary" onClick={onClose}>Ok</button></div>
          </div>
        </div>
      );
    }

    const CRM_SEG = {
      ativo: { label: 'Ativos', cor: '#2faa6a', hint: 'Pediram nos últimos 30 dias' },
      risco: { label: 'Em risco', cor: '#c98a1e', hint: '30 a 60 dias sem pedir' },
      inativo: { label: 'Inativos', cor: '#c0392b', hint: 'Mais de 60 dias sem pedir' },
      sem_pedido: { label: 'Sem pedido', cor: '#888', hint: 'Cadastrados, ainda não compraram' },
    };

    function CRM({ clientes, pedidos }) {
      const [filtro, setFiltro] = useState('todos');
      const [busca, setBusca] = useState('');
      const DIA = 86400000;
      const now = Date.now();

      const enriquecidos = useMemo(() => {
        const diasDesde = d => d ? Math.floor((now - new Date(d).getTime()) / DIA) : null;
        const seg = c => {
          const dias = diasDesde(c.ultimo_pedido_em);
          if (!Number(c.total_pedidos) || dias === null) return 'sem_pedido';
          if (dias <= 30) return 'ativo';
          if (dias <= 60) return 'risco';
          return 'inativo';
        };
        return clientes
          .map(c => ({ ...c, dias: diasDesde(c.ultimo_pedido_em), segmento: seg(c) }))
          .sort((a, b) => Number(b.total_gasto || 0) - Number(a.total_gasto || 0));
      }, [clientes]);

      const kpi = useMemo(() => {
        const total = clientes.length;
        const receita = clientes.reduce((s, c) => s + Number(c.total_gasto || 0), 0);
        const somaPedidos = clientes.reduce((s, c) => s + Number(c.total_pedidos || 0), 0);
        const cont = { ativo: 0, risco: 0, inativo: 0, sem_pedido: 0 };
        enriquecidos.forEach(c => { cont[c.segmento] = (cont[c.segmento] || 0) + 1; });
        return {
          total, receita, somaPedidos,
          ticket: somaPedidos ? receita / somaPedidos : 0,
          ltv: total ? receita / total : 0,
          cont,
          churn: total ? Math.round(((cont.risco + cont.inativo) / total) * 100) : 0,
        };
      }, [clientes, enriquecidos]);

      const funil = useMemo(() => {
        const t = pedidos.length;
        const pagos = pedidos.filter(p => p.pagamento_status === 'pago' || p.pago_em).length;
        const aceitos = pedidos.filter(p => p.aceite_status === 'aceito').length;
        const entregues = pedidos.filter(p => p.status === 'entregue').length;
        const recusados = pedidos.filter(p => p.aceite_status === 'recusado').length;
        return { t, pagos, aceitos, entregues, recusados };
      }, [pedidos]);

      const lista = enriquecidos.filter(c =>
        (filtro === 'todos' || c.segmento === filtro) &&
        (!busca || (c.nome || '').toLowerCase().includes(busca.toLowerCase()) || String(c.whatsapp || '').includes(busca)));

      const card = (titulo, valor, sub) => (
        <div style={{ background: 'var(--surface,#fff)', border: '1px solid rgba(0,0,0,.08)', borderRadius: 14, padding: '14px 16px' }}>
          <div className="muted" style={{ fontSize: 12 }}>{titulo}</div>
          <div style={{ fontSize: 22, fontWeight: 800, marginTop: 4 }}>{valor}</div>
          {sub && <div className="muted" style={{ fontSize: 11, marginTop: 2 }}>{sub}</div>}
        </div>
      );

      const barra = (label, valor, base, cor) => {
        const pct = base ? Math.round((valor / base) * 100) : 0;
        return (
          <div style={{ marginBottom: 8 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, marginBottom: 4 }}>
              <span>{label}</span><strong>{valor} <span className="muted">({pct}%)</span></strong>
            </div>
            <div style={{ height: 8, borderRadius: 6, background: 'rgba(0,0,0,.08)' }}>
              <div style={{ width: pct + '%', height: '100%', borderRadius: 6, background: cor }}></div>
            </div>
          </div>
        );
      };

      return (
        <section className="card panel">
          <div className="panel-head">
            <h3>CRM · Clientes</h3>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: 12, marginBottom: 16 }}>
            {card('Clientes', kpi.total, `${kpi.cont.ativo} ativos`)}
            {card('Receita total', fmtMoney(kpi.receita), `${kpi.somaPedidos} pedidos`)}
            {card('Ticket médio', fmtMoney(kpi.ticket), 'por pedido')}
            {card('LTV médio', fmtMoney(kpi.ltv), 'por cliente')}
            {card('Churn', kpi.churn + '%', 'sem pedir há 30+ dias')}
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 16 }} className="crm-cols">
            <div style={{ border: '1px solid rgba(0,0,0,.08)', borderRadius: 14, padding: 16 }}>
              <h4 style={{ margin: '0 0 12px' }}>Funil de pedidos</h4>
              {barra('Pedidos criados', funil.t, funil.t, '#8a8a8a')}
              {barra('Pagos', funil.pagos, funil.t, '#3a7bd5')}
              {barra('Aceitos', funil.aceitos, funil.t, '#2faa6a')}
              {barra('Entregues', funil.entregues, funil.t, '#1f8a52')}
              {barra('Recusados (estorno)', funil.recusados, funil.t, '#c0392b')}
            </div>
            <div style={{ border: '1px solid rgba(0,0,0,.08)', borderRadius: 14, padding: 16 }}>
              <h4 style={{ margin: '0 0 12px' }}>Segmentos</h4>
              {Object.keys(CRM_SEG).map(k => (
                <div key={k} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '7px 0', borderBottom: '1px solid rgba(0,0,0,.05)' }}>
                  <div>
                    <span style={{ display: 'inline-block', width: 10, height: 10, borderRadius: 3, background: CRM_SEG[k].cor, marginRight: 8 }}></span>
                    <strong>{CRM_SEG[k].label}</strong>
                    <div className="muted" style={{ fontSize: 11, marginLeft: 18 }}>{CRM_SEG[k].hint}</div>
                  </div>
                  <button className="btn btn-small" onClick={() => setFiltro(k)}>{kpi.cont[k] || 0}</button>
                </div>
              ))}
            </div>
          </div>

          <div className="panel-head" style={{ gap: 8, flexWrap: 'wrap' }}>
            <div className="actions" style={{ flexWrap: 'wrap' }}>
              {['todos', 'ativo', 'risco', 'inativo', 'sem_pedido'].map(k => (
                <button key={k} className={`btn btn-small ${filtro === k ? 'btn-primary' : ''}`} onClick={() => setFiltro(k)}>
                  {k === 'todos' ? 'Todos' : CRM_SEG[k].label}
                </button>
              ))}
            </div>
            <input className="input" placeholder="Buscar nome ou WhatsApp" value={busca} onChange={e => setBusca(e.target.value)} style={{ maxWidth: 240 }} />
          </div>

          <div className="table-wrap">
            <table>
              <thead><tr><th>Cliente</th><th>WhatsApp</th><th>Segmento</th><th>Pedidos</th><th>LTV</th><th>Último pedido</th><th></th></tr></thead>
              <tbody>
                {lista.map(c => (
                  <tr key={c.id}>
                    <td><strong>{c.nome || 'Sem nome'}</strong></td>
                    <td>{c.whatsapp}</td>
                    <td><span style={{ background: CRM_SEG[c.segmento].cor, color: '#fff', borderRadius: 999, padding: '2px 9px', fontSize: 11, fontWeight: 700 }}>{CRM_SEG[c.segmento].label}</span></td>
                    <td>{c.total_pedidos || 0}</td>
                    <td className="money">{fmtMoney(c.total_gasto)}</td>
                    <td>{c.ultimo_pedido_em ? `${fmtDate(c.ultimo_pedido_em)} · ${c.dias}d` : '—'}</td>
                    <td>{c.whatsapp && <a className="btn btn-small" target="_blank" rel="noreferrer" href={`https://wa.me/55${String(c.whatsapp).replace(/\D/g, '').replace(/^55/, '')}`}>WhatsApp</a>}</td>
                  </tr>
                ))}
                {!lista.length && <tr><td colSpan="7" className="empty">Nenhum cliente neste filtro.</td></tr>}
              </tbody>
            </table>
          </div>
        </section>
      );
    }

    function Clientes({ clientes }) {
      return (
        <section className="card panel">
          <div className="panel-head"><h3>Clientes</h3></div>
          <div className="table-wrap">
            <table>
              <thead><tr><th>Nome</th><th>WhatsApp</th><th>Pedidos</th><th>Total gasto</th><th>Último pedido</th></tr></thead>
              <tbody>
                {clientes.map(c => <tr key={c.id}><td><strong>{c.nome}</strong></td><td>{c.whatsapp}</td><td>{c.total_pedidos}</td><td className="money">{fmtMoney(c.total_gasto)}</td><td>{fmtDate(c.ultimo_pedido_em)}</td></tr>)}
                {!clientes.length && <tr><td colSpan="5" className="empty">Nenhum cliente ainda.</td></tr>}
              </tbody>
            </table>
          </div>
        </section>
      );
    }

    function TopoPreview({ topo, aberta = true }) {
      const nome = String(topo.nome || 'Dom Leonardo').trim();
      const parts = nome.split(/\s+/);
      const w1 = parts.shift() || nome;
      const w2 = parts.join(' ');
      const chips = [[topo.chip_2_valor, topo.chip_2_label], [topo.chip_1_valor, topo.chip_1_label], [topo.chip_3_valor, topo.chip_3_label]];
      return (
        <div style={{ background: '#f7f3ea', borderRadius: 16, padding: '22px 16px', textAlign: 'center', border: '1px solid rgba(160,120,20,.18)' }}>
          <div style={{ fontFamily: "'Jost',sans-serif", fontSize: 9, letterSpacing: '.3em', textTransform: 'uppercase', color: '#9c7c1e', fontWeight: 600 }}>{topo.kicker}</div>
          <div style={{ position: 'relative', display: 'inline-flex', margin: '14px 0 2px' }}>
            <div style={{ width: 78, height: 78, borderRadius: '50%', overflow: 'hidden', background: '#fff', border: '1px solid rgba(160,120,20,.45)', boxShadow: '0 10px 20px rgba(40,28,8,.16)' }}>
              {topo.logo_url ? <img src={topo.logo_url} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> : <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', fontFamily: "'Playfair Display',serif", color: '#c0972c', fontSize: 24 }}>DL</div>}
            </div>
            <span style={{ position: 'absolute', top: -8, right: -22, border: `2px solid ${aberta ? '#b8901f' : '#a8392b'}`, color: aberta ? '#1a1305' : '#a8392b', background: '#fffdf8', fontFamily: "'Bebas Neue',sans-serif", letterSpacing: '.12em', fontSize: 10, padding: '3px 7px', borderRadius: 4, boxShadow: '0 5px 12px rgba(40,28,8,.18)' }}>{aberta ? 'ABERTO' : 'FECHADO'}</span>
          </div>
          <div style={{ width: 96, height: 2, background: 'linear-gradient(90deg,transparent,#1a1305,transparent)', margin: '7px auto 12px' }}></div>
          <div style={{ fontFamily: "'Jost',sans-serif", fontSize: 10, letterSpacing: '.26em', textTransform: 'uppercase', color: '#1a1305', fontWeight: 600, marginBottom: 6 }}>Bem-vindo</div>
          <div style={{ fontFamily: "'Playfair Display',Georgia,serif", color: '#c0972c', fontSize: 34, lineHeight: .92, letterSpacing: '-.03em' }}>{w1}{w2 && <em style={{ display: 'block', fontStyle: 'italic', fontWeight: 400 }}>{w2}</em>}</div>
          <p style={{ fontFamily: "'Cormorant Garamond',Georgia,serif", fontStyle: 'italic', color: '#6b5a3a', fontSize: 15, lineHeight: 1.4, margin: '10px auto 0', maxWidth: '30ch' }}>{topo.descricao}</p>
          <div style={{ display: 'flex', gap: 18, justifyContent: 'center', flexWrap: 'wrap', marginTop: 16 }}>
            {chips.map((c, i) => (
              <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
                <span style={{ fontFamily: "'Jost',sans-serif", fontWeight: 700, color: '#1a1305', fontSize: 13 }}>{c[0]}</span>
                <span style={{ fontFamily: "'Jost',sans-serif", fontSize: 8.5, letterSpacing: '.18em', textTransform: 'uppercase', color: '#9c7c1e' }}>{c[1]}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function TopoEditor({ config, onSave }) {
      const cur = (config && config.topo_config && typeof config.topo_config === 'object' && !Array.isArray(config.topo_config)) ? config.topo_config : {};
      const [form, setForm] = useState(null);
      useEffect(() => {
        const c = (config && config.topo_config && typeof config.topo_config === 'object') ? config.topo_config : {};
        setForm({
          logoFile: null,
          descricao: c.descricao || '',
          endereco: c.endereco || '',
          telefone: c.telefone || '',
          horario_texto: c.horario_texto || '',
          area_entrega: c.area_entrega || 'Curitiba e região',
          maps_url: c.maps_url || '',
          chip_1_label: c.chip_1_label || 'Preparo',
          chip_1_valor: c.chip_1_valor || '5 min',
          chip_2_label: c.chip_2_label || 'Entrega',
          chip_2_valor: c.chip_2_valor || '12 a 30 min',
          chip_3_label: c.chip_3_label || 'Varia pelo',
          chip_3_valor: c.chip_3_valor || 'endereço',
          lojaAberta: config ? config.loja_aberta_manual !== false : true,
        });
      }, [config]);
      if (!form) return null;
      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
      return (
        <section className="card panel">
          <div className="panel-head">
            <div><h3>Topo do cardápio</h3><p className="muted" style={{ margin: '4px 0 0' }}>O primeiro que o cliente vê. Edite e salve.</p></div>
            <button className="btn btn-primary" onClick={() => onSave(form)}>Salvar topo</button>
          </div>
          <div className="topo-editor">
            <TopoPreview aberta={form.lojaAberta} topo={{ ...TOPO_DEFAULTS, ...cur, descricao: form.descricao, chip_1_label: form.chip_1_label, chip_1_valor: form.chip_1_valor, chip_2_label: form.chip_2_label, chip_2_valor: form.chip_2_valor, chip_3_label: form.chip_3_label, chip_3_valor: form.chip_3_valor }} />
            <div className="topo-fields">
              <ImageInput label="Logo (centro do topo)" value={cur.logo_url} file={form.logoFile} onFile={f => set('logoFile', f)} kind="logo" empty="DL" />
              <label className="field full" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10, cursor: 'pointer' }}>
                <span><strong>Loja {form.lojaAberta ? 'aberta' : 'fechada'}</strong><br /><span className="muted" style={{ fontSize: 12 }}>Muda a plaquinha ABERTO/FECHADO no topo</span></span>
                <input type="checkbox" checked={form.lojaAberta} onChange={e => set('lojaAberta', e.target.checked)} />
              </label>
              <div className="field full"><TextField label="Texto abaixo do Dom Leonardo" value={form.descricao} onChange={v => set('descricao', v)} textarea /></div>
              <div className="field full" style={{ fontSize: 12, fontWeight: 700, color: 'var(--muted)', textTransform: 'uppercase', marginTop: 4 }}>Selos de entrega (os 3 chips do topo)</div>
              <div className="topo-field-row">
                <TextField label="Chip 1 - título" value={form.chip_1_label} onChange={v => set('chip_1_label', v)} />
                <TextField label="Chip 1 - valor" value={form.chip_1_valor} onChange={v => set('chip_1_valor', v)} />
              </div>
              <div className="topo-field-row">
                <TextField label="Chip 2 - título" value={form.chip_2_label} onChange={v => set('chip_2_label', v)} />
                <TextField label="Chip 2 - valor" value={form.chip_2_valor} onChange={v => set('chip_2_valor', v)} />
              </div>
              <div className="topo-field-row">
                <TextField label="Chip 3 - título" value={form.chip_3_label} onChange={v => set('chip_3_label', v)} />
                <TextField label="Chip 3 - valor" value={form.chip_3_valor} onChange={v => set('chip_3_valor', v)} />
              </div>
              <TextField label="Horário de funcionamento" value={form.horario_texto} onChange={v => set('horario_texto', v)} placeholder="Ex.: Ter a Dom · 18h às 23h30" />
              <TextField label="Área de entrega" value={form.area_entrega} onChange={v => set('area_entrega', v)} />
              <div className="field full"><TextField label="Endereço" value={form.endereco} onChange={v => set('endereco', v)} /></div>
              <TextField label="Telefone / WhatsApp" value={form.telefone} onChange={v => set('telefone', v)} placeholder="(41) 9 9999-9999" />
              <TextField label="Link do Google Maps" value={form.maps_url} onChange={v => set('maps_url', v)} placeholder="https://maps.app.goo.gl/..." />
            </div>
          </div>
        </section>
      );
    }

    function ConfigScreen({ config, onSave }) {
      const [form, setForm] = useState(null);
      useEffect(() => {
        if (!config) return;
        setForm({
          topo: mergeTopoConfig(config),
          logoFile: null,
          capaFile: null,
          capaVideoFile: null,
        });
      }, [config]);
      if (!form) return <div className="empty">Carregando topo do cardápio...</div>;
      const setTopo = (key, value) => setForm(prev => ({ ...prev, topo: { ...prev.topo, [key]: value } }));
      const setLogoFile = (file) => {
        if (!file) return;
        const preview = URL.createObjectURL(file);
        setForm(prev => ({ ...prev, logoFile: file, topo: { ...prev.topo, logo_url: preview } }));
      };
      const setCapaFile = (file) => {
        if (!file) return;
        const preview = URL.createObjectURL(file);
        const tipo = file.type === 'image/gif' ? 'gif' : 'imagem';
        setForm(prev => ({ ...prev, capaFile: file, topo: { ...prev.topo, capa_url: preview, capa_tipo: tipo } }));
      };
      const setCapaVideoFile = (file) => {
        if (!file) return;
        const preview = URL.createObjectURL(file);
        setForm(prev => ({ ...prev, capaVideoFile: file, topo: { ...prev.topo, capa_video_url: preview, capa_tipo: 'video' } }));
      };
      return (
        <section className="card panel">
          <div className="panel-head">
            <div>
              <h3>Topo do cardápio</h3>
              <p className="muted" style={{margin:'4px 0 0'}}>Edite a primeira dobra que o cliente vê no celular.</p>
            </div>
            <button className="btn btn-primary" onClick={() => onSave(form)}>Salvar topo</button>
          </div>
          <div className="topo-editor">
            <TopoPreview topo={form.topo} />
            <div className="topo-fields">
              <ImageInput label="Logo opcional" value={form.topo.logo_url} file={form.logoFile} onFile={setLogoFile} kind="logo" empty="DL" />
              <ImageInput label="Capa imagem ou GIF" value={form.topo.capa_url} file={form.capaFile} onFile={setCapaFile} kind="capa" empty="CAPA" />
              <VideoInput label="Capa em vídeo opcional" value={form.topo.capa_video_url} file={form.capaVideoFile} onFile={setCapaVideoFile} />
              <SelectField label="Tipo de capa exibida" value={form.topo.capa_tipo} onChange={v => setTopo('capa_tipo', v)}>
                <option value="imagem">Imagem</option>
                <option value="gif">GIF animado</option>
                <option value="video">Vídeo sem áudio em loop</option>
              </SelectField>
              <TextField label="Texto pequeno" value={form.topo.kicker} onChange={v => setTopo('kicker', v)} />
              <TextField label="Nome principal" value={form.topo.nome} onChange={v => setTopo('nome', v)} />
              <div className="field full"><TextField label="Descrição curta" value={form.topo.descricao} onChange={v => setTopo('descricao', v)} textarea /></div>
              <div className="topo-field-row">
                <TextField label="Chip 1 - título" value={form.topo.chip_1_label} onChange={v => setTopo('chip_1_label', v)} />
                <TextField label="Chip 1 - valor" value={form.topo.chip_1_valor} onChange={v => setTopo('chip_1_valor', v)} />
              </div>
              <div className="topo-field-row">
                <TextField label="Chip 2 - título" value={form.topo.chip_2_label} onChange={v => setTopo('chip_2_label', v)} />
                <TextField label="Chip 2 - valor" value={form.topo.chip_2_valor} onChange={v => setTopo('chip_2_valor', v)} />
              </div>
              <div className="topo-field-row">
                <TextField label="Chip 3 - título" value={form.topo.chip_3_label} onChange={v => setTopo('chip_3_label', v)} />
                <TextField label="Chip 3 - valor" value={form.topo.chip_3_valor} onChange={v => setTopo('chip_3_valor', v)} />
              </div>
              <TextField label="Faixa inferior - destaque" value={form.topo.faixa_titulo} onChange={v => setTopo('faixa_titulo', v)} />
              <TextField label="Faixa inferior - texto" value={form.topo.faixa_texto} onChange={v => setTopo('faixa_texto', v)} />
              <div className="field full" style={{ borderTop: '1px solid rgba(0,0,0,.08)', paddingTop: 12, marginTop: 4 }}>
                <strong style={{ fontSize: 13 }}>Informações de contato (painel "Informações")</strong>
              </div>
              <TextField label="Horário (texto livre)" value={form.topo.horario_texto} onChange={v => setTopo('horario_texto', v)} placeholder="Ex.: Ter a Dom · 18h às 23h30" />
              <TextField label="Área de entrega" value={form.topo.area_entrega} onChange={v => setTopo('area_entrega', v)} />
              <div className="field full"><TextField label="Endereço" value={form.topo.endereco} onChange={v => setTopo('endereco', v)} /></div>
              <TextField label="Telefone / WhatsApp de contato" value={form.topo.telefone} onChange={v => setTopo('telefone', v)} placeholder="(41) 9 9999-9999" />
              <TextField label="Link do Google Maps (como chegar)" value={form.topo.maps_url} onChange={v => setTopo('maps_url', v)} placeholder="https://maps.app.goo.gl/..." />
              <div className="field full"><TextField label='Como funciona a entrega' value={form.topo.como_funciona} onChange={v => setTopo('como_funciona', v)} textarea /></div>
            </div>
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
