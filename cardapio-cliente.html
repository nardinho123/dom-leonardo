<style>
:root{
  --red:#EA1D2C;--red-dark:#c91825;--green:#50A773;--purple:#9B59E5;--blue:#2F80ED;--yellow:#F2C94C;--orange:#F2994A;

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}

button{cursor:pointer}

.store-card{position:relative;margin:-44px 12px 10px;background:#fff;border-radius:18px;padding:54px 14px 14px;box-shadow:var(--shadow);z-index:3}

.cart-footer{position:sticky;bottom:0;background:#fff;padding:12px calc(12px) calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;box-shadow:0 -8px 20px rgba(0,0,0,.08)}

.toast{position:fixed;left:12px;right:12px;bottom:88px;background:#222;color:#fff;border-radius:12px;padding:12px 14px;z-index:70;font-size:13px}
.chat-body{padding:14px;display:grid;gap:10px;max-height:52vh;overflow:auto;background:#f7f7f7}
.chat-modal-back{align-items:center;padding:18px}
.chat-sheet{width:min(420px,100%);max-height:76vh;border-radius:22px;box-shadow:0 18px 48px rgba(0,0,0,.25);overflow:hidden}

@keyframes typingDot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-3px);opacity:1}}
.chat-input{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;background:#fff}

<body>
<div id="root"></div>
<script type="text/babel">
const { useEffect, useMemo, useState, useRef } = React;

const SUPABASE_URL = 'https://jewamqbdonudiapxbzay.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VeJTrMvtl5PAEvvc6R0CKA_nzjxQiAY';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function fmtR$(v){ return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function initials(name){ return (name||'Dom').split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase(); }
function minPrice(prato){ return Number(prato.preco_promocional ?? prato.preco_base ?? 0); }
function allPratos(cardapio){ return (cardapio?.categorias||[]).flatMap(c => (c.pratos||[]).map(p => ({...p,categoria_nome:c.nome,categoria_slug:c.slug}))); }
function toneClass(color){ return `tone-${color || 'vermelho'}`; }
function couponValue(c){
  if(!c) return '';
  if(c.tipo === 'percentual') return `${Number(c.valor || 0)}% off`;
  if(c.tipo === 'valor_fixo') return `${fmtR$(c.valor)} off`;
  if(c.tipo === 'frete_gratis') return 'Entrega gratis';
  return 'Cupom';
}
function timeLeft(date){
  if(!date) return '';
  const ms = new Date(date).getTime() - Date.now();
  if(ms <= 0) return 'Expira agora';
  const min = Math.floor(ms / 60000);
  if(min < 60) return `Expira em ${min} min`;
  const h = Math.floor(min / 60);
  if(h < 24) return `Expira em ${h}h ${min % 60}min`;
  return `Expira em ${Math.floor(h / 24)} dia(s)`;
}
function getVisitorKey(){
  const key = 'dom_visitor_key';
  let value = localStorage.getItem(key);
  if(!value){ value = makeId(); localStorage.setItem(key, value); }
  return value;
}
async function resolveVisitorKey(){
  const key = 'dom_visitor_key';
  const local = localStorage.getItem(key);
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/cardapio-bind-visitor`, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
      body: JSON.stringify({ visitor_key: local || null })
    });
    if(res.ok){
      const data = await res.json();
      if(data?.visitor_key){
        localStorage.setItem(key, data.visitor_key);
        return data.visitor_key;
      }
    }
  } catch(_) { /* fallback abaixo */ }
  if(local) return local;
  const novo = makeId();
  localStorage.setItem(key, novo);
  return novo;
}
function browserInfo(){
  return {
    user_agent: navigator.userAgent,
    language: navigator.language,
    platform: navigator.platform,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    screen: `${window.screen?.width || 0}x${window.screen?.height || 0}`,
    viewport: `${window.innerWidth}x${window.innerHeight}`
  };
}
function makeId(){
  if(window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

function Photo({ url, name, className }){
  return <div className={className}>{url ? <img src={url} alt={name}/> : <span>{initials(name)}</span>}</div>;
}

function App(){
  const [cardapio,setCardapio] = useState(null);
  const [loading,setLoading] = useState(true);
  const [error,setError] = useState('');
  const [activeCat,setActiveCat] = useState('');
  const [detail,setDetail] = useState(null);
  const [editingIndex,setEditingIndex] = useState(null);
  const [bagOpen,setBagOpen] = useState(false);
  const [checkoutOpen,setCheckoutOpen] = useState(false);
  const [couponDetail,setCouponDetail] = useState(null);
  const [chatOpen,setChatOpen] = useState(false);
  const [tracking,setTracking] = useState(null);
  const [cart,setCart] = useState(() => {
    try { return JSON.parse(localStorage.getItem('dom_cart')||'[]'); } catch { return []; }
  });
  const [toast,setToast] = useState('');

  useEffect(()=>{ load(); initTracking(); },[]);
  useEffect(()=>{ localStorage.setItem('dom_cart', JSON.stringify(cart)); },[cart]);
  useEffect(()=>{ if(toast){ const t=setTimeout(()=>setToast(''),2600); return ()=>clearTimeout(t); } },[toast]);
  useEffect(()=>{
    if(!tracking) return;
    const id = setInterval(() => track('heartbeat', { url: location.pathname }), 45000);
    return () => clearInterval(id);
  },[tracking]);

  async function initTracking(){
    try {
      const visitorKey = await resolveVisitorKey();
      const sessionKey = sessionStorage.getItem('dom_session_key') || makeId();
      sessionStorage.setItem('dom_session_key', sessionKey);
      const { data } = await sb.rpc('cardapio_identificar_visitante', {
        p_visitor_key: visitorKey,
        p_session_key: sessionKey,
        p_browser_info: browserInfo(),
        p_url: location.pathname + location.search,
        p_referrer: document.referrer || null
      });
      setTracking({ visitor_key: visitorKey, sessao_id: data?.sessao_id });
    } catch (error) {
      console.warn('tracking off', error.message);
    }
  }

  async function track(tipo, metadata = {}){
    if(!tracking?.visitor_key) return;
    try {
      await sb.rpc('cardapio_track_event', {
        p_visitor_key: tracking.visitor_key,
        p_sessao_id: tracking.sessao_id || null,
        p_tipo: tipo,
        p_metadata: { ...metadata, url: location.pathname + location.search }
      });
    } catch (error) {
      console.warn('track failed', error.message);
    }
  }

  async function load(){
    setLoading(true); setError('');
    const { data, error } = await sb.rpc('get_cardapio_publico');
    if(error){ setError(error.message); }
    else { setCardapio(data); setActiveCat(data?.categorias?.[0]?.id || ''); }
    setLoading(false);
  }

  const pratos = useMemo(()=>allPratos(cardapio),[cardapio]);
  const destaques = pratos.filter(p=>p.badge_destaque).slice(0,6);
  const bebidas = (cardapio?.categorias||[]).find(c=>c.slug==='bebidas')?.pratos || [];
  const subtotal = cart.reduce((s,it)=>s + Number(it.preco_unitario||0) * Number(it.quantidade||1),0);
  const totalQtd = cart.reduce((s,it)=>s + Number(it.quantidade||1),0);

  const detailRef = useRef(null);

  function openDetail(prato, index=null){
    track('item_click', { prato_id: prato.id, prato_nome: prato.nome, origem: index != null ? 'cart_edit' : 'cardapio' });
    detailRef.current = { prato_id: prato.id, prato_nome: prato.nome, opened_at: Date.now() };
    setEditingIndex(index);
    setDetail({ prato, preset:index!=null ? cart[index] : null });
  }

  function closeDetail(extra = {}){
    if(detailRef.current){
      const { prato_id, prato_nome, opened_at } = detailRef.current;
      track('item_close', { prato_id, prato_nome, duracao_ms: Date.now() - opened_at, ...extra });
      detailRef.current = null;
    }
    setDetail(null); setEditingIndex(null);
  }

  function onSaved(item){
    track('add_to_cart', { prato_id: item.prato.id, prato_nome: item.prato.nome, quantidade: item.quantidade, valor: item.preco_unitario });
    setCart(prev => {
      if(editingIndex!=null) return prev.map((x,i)=>i===editingIndex ? item : x);
      return [...prev, item];
    });
    closeDetail({ resultado: 'add_to_cart' });
    setToast('O Dom colocou na sacola.');
  }

  async function addBebida(prato){
    track('add_to_cart', { prato_id: prato.id, prato_nome: prato.nome, quantidade: 1, origem: 'upsell_bebida' });
    const { data, error } = await sb.rpc('calcular_preco_item', {
      p_prato_id: prato.id, p_tamanho_id: null, p_opcionais_ids: []
    });
    if(error) return setToast(error.message);
    setCart(prev => [...prev, {
      uid: makeId(), prato, tamanho:null, opcionais:[], quantidade:1,
      observacoes:'', preco_unitario:Number(data||0)
    }]);
    setToast('Bebida adicionada.');
  }

  function openChat(){
    track('chat_open', { origem: 'botao_fixo' });
    setChatOpen(true);
  }

  if(loading) return <SkeletonApp/>;
  if(error) return <div className="empty">Nao consegui carregar o cardapio.<br/>{error}<br/><button className="top-pill" onClick={load}>Tentar de novo</button></div>;

  const rest = cardapio.restaurante || {};
  return <div className={`app theme-${rest.tema || 'branco'}`}>
    <header className="hero">
      <button className="top-pill">{rest.aberta_agora ? 'Aberto agora' : 'Dom fora do horario'}</button>
      {rest.capa_tipo === 'video' && rest.capa_video_url
        ? <video className="hero-img hero-video" src={rest.capa_video_url} poster={rest.capa_url || ''} autoPlay muted loop playsInline />
        : <div className={`hero-img${rest.capa_url?' has-photo':''}`} style={rest.capa_url?{backgroundImage:`url(${rest.capa_url})`}:null}>DOM</div>}
    </header>

    <section className="store-card">
      <div className="logo">{rest.logo_url ? <img src={rest.logo_url} alt="Dom Leonardo"/> : 'D'}</div>
      <div className="store-title">
        <div>
          <h1>{rest.nome}</h1>
          <div className="small">{rest.descricao}</div>
        </div>
        <div className="rating">★ {Number(rest.avaliacao||4.9).toFixed(1)}</div>
      </div>
      <div className="store-meta">
        <span className={`meta-chip ${rest.aberta_agora?'open':'closed'}`}>{rest.aberta_agora?'Aberto':'Fechado'}</span>
        <span className="meta-chip">{rest.tempo_entrega_min}-{rest.tempo_entrega_max} min</span>
        <span className="meta-chip">{Number(rest.taxa_entrega||0)>0?fmtR$(rest.taxa_entrega):'Entrega a combinar'}</span>
        <span className="meta-chip">Pedido minimo {fmtR$(rest.pedido_minimo)}</span>
        <span className="meta-chip">Entrega rastreavel</span>
      </div>
    </section>

    <section className="coupon-section">
      <div className="coupon-section-title">
        <h2>{rest.cupons_titulo || 'Cupons do Dom'}</h2>
        <span>{rest.cupons_descricao || 'Toque para ver os detalhes.'}</span>
      </div>
      <div className="coupon-row">
        {(cardapio.cupons || []).map(c => <button className="coupon" key={c.id} onClick={() => { track('coupon_open', { cupom: c.codigo }); setCouponDetail(c); }}>
          <strong className={toneClass(c.cor)} style={{background:'transparent'}}>{c.codigo}</strong>
          <span>{c.descricao || couponValue(c)}</span>
        </button>)}
        <button className="coupon" onClick={() => { track('coupon_open', { cupom: 'Canal proprio' }); setCouponDetail({codigo:'Canal proprio', cor:'cinza', descricao:'Sem comissao pesada. Mais tempero, menos taxa.', pratos:[]}); }}>
          <strong className={toneClass('cinza')} style={{background:'transparent'}}>Canal proprio</strong>
          <span>Sem comissao pesada. Mais tempero, menos taxa.</span>
        </button>
      </div>
    </section>

    {(cardapio.categorias||[]).length > 0 && <nav className="category-tabs">
      {(cardapio.categorias||[]).map(c => <button key={c.id} className={activeCat===c.id?'active':''} onClick={()=>{track('category_click', { categoria_id:c.id, categoria_nome:c.nome }); setActiveCat(c.id); document.getElementById(c.id)?.scrollIntoView({block:'start'});}}>{c.icone||''} {c.nome}</button>)}
    </nav>}

    {(cardapio.categorias||[]).length === 0 && <div className="empty-menu">
      <strong>O Dom ainda esta montando o cardapio.</strong>
      Assim que os itens forem cadastrados no painel, eles aparecem aqui automaticamente.
    </div>}

    {destaques.length > 0 && <>
      <div className="section"><h2>{rest.destaques_titulo || 'O Dom recomenda'}</h2><p>{rest.destaques_descricao || 'Os pratos que mais saem por aqui.'}</p></div>
      <div className="highlights">
        {destaques.map(p => <article className="highlight-card" key={p.id} onClick={()=>openDetail(p)}>
          <div className="highlight-photo-wrap">
            <Photo url={p.foto_url} name={p.nome} className="highlight-photo"/>
            <span className={`badge highlight-label ${toneClass(p.badge_cor)}`}>{p.badge_destaque}</span>
          </div>
          <div className="highlight-body">
            <h3>{p.nome}</h3>
            <p>{p.descricao_curta || p.descricao_completa}</p>
          </div>
        </article>)}
      </div>
    </>}

    {(cardapio.categorias||[]).map(c => <section key={c.id} id={c.id}>
      <div className="section"><h2>{c.nome}</h2><p>{c.descricao}</p></div>
      <div className="dish-list">
        {(c.pratos||[]).length === 0 && <div className="empty">Essa parte do Dom ainda vai ganhar prato.</div>}
        {(c.pratos||[]).map(p => <DishCard key={p.id} prato={{...p,categoria_slug:c.slug}} onClick={()=>openDetail({...p,categoria_slug:c.slug})}/>)}
      </div>
    </section>)}

    <div className="bottom-bag">
      <button className="bag-btn" onClick={()=>{track('open_cart', { itens: totalQtd, subtotal }); setBagOpen(true);}}>
        <span>{totalQtd ? `${totalQtd} item(ns) na sacola` : 'Ver sacola'}</span>
        <b>{fmtR$(subtotal)}</b>
      </button>
    </div>
    <button className="waiter-btn" onClick={openChat}>Chamar o Dom</button>

    {detail && <DetailModal data={detail} onClose={()=>closeDetail({ resultado: 'fechou' })} onSaved={onSaved}/>}
    {bagOpen && <CartModal cart={cart} setCart={setCart} subtotal={subtotal} bebidas={bebidas} onClose={()=>setBagOpen(false)} onEdit={openDetail} onAddBebida={addBebida} onCheckout={()=>setCheckoutOpen(true)}/>}
    {checkoutOpen && <CheckoutModal cardapio={cardapio} cart={cart} subtotal={subtotal} tracking={tracking} track={track} onClose={()=>setCheckoutOpen(false)} onSuccess={()=>{track('order_created', { subtotal }); setCart([]); setBagOpen(false); setCheckoutOpen(false);}}/>}
    {couponDetail && <CouponModal cupom={couponDetail} onClose={()=>setCouponDetail(null)} />}
    {chatOpen && <ChatModal tracking={tracking} bot={rest.chatbot || {}} onClose={()=>setChatOpen(false)} />}
    {toast && <div className="toast">{toast}</div>}
  </div>;
}

function SkeletonApp(){
  return <div className="app">
    <div className="hero"><div className="hero-img">DOM</div></div>
    <div className="store-card"><div className="logo">D</div><h1>Dom Leonardo</h1><div className="small">Carregando o cardapio...</div></div>
    <div className="loading">{[1,2,3,4].map(i=><div className="skeleton" key={i}/>)}</div>

function DetailModal({ data, onClose, onSaved }){
  const prato = data.prato;
  const preset = data.preset;
  const defaultSize = preset?.tamanho || (prato.tamanhos||[]).find(t=>t.padrao) || (prato.tamanhos||[])[0] || null;
  const [tamanho,setTamanho] = useState(defaultSize);
  const [selected,setSelected] = useState(() => {
    const map = {};
    (preset?.opcionais||[]).forEach(o => { if(!map[o.grupo_id]) map[o.grupo_id]=[]; map[o.grupo_id].push(o.id); });
    return map;
  });
  const [qty,setQty] = useState(preset?.quantidade || 1);
  const [obs,setObs] = useState(preset?.observacoes || '');
  const [unit,setUnit] = useState(preset?.preco_unitario || minPrice(prato));
  const [pricing,setPricing] = useState(false);
  const [err,setErr] = useState('');
  const optionIds = Object.values(selected).flat();

  useEffect(()=>{ recalc(); },[tamanho?.id, JSON.stringify(optionIds)]);

  async function recalc(){
    setPricing(true); setErr('');
    const { data, error } = await sb.rpc('calcular_preco_item', {
      p_prato_id: prato.id,
      p_tamanho_id: tamanho?.id || null,
      p_opcionais_ids: optionIds
    });
    if(error) setErr(error.message); else setUnit(Number(data||0));
    setPricing(false);
  }

  function toggle(group,opt){
    setSelected(prev => {
      const current = prev[group.id] || [];
      const has = current.includes(opt.id);
      let next = current;
      if(has) next = current.filter(id=>id!==opt.id);
      else if(group.max_escolhas === 1 || group.tipo === 'unico') next = [opt.id];
      else if(current.length < Number(group.max_escolhas||99)) next = [...current,opt.id];
      else return prev;
      return {...prev,[group.id]:next};
    });
  }

  function validate(){
    if((prato.tamanhos||[]).length && !tamanho) return 'Escolha um tamanho.';
    for(const g of prato.grupos_opcionais||[]){
      const count = (selected[g.id]||[]).length;
      if(count < Number(g.min_escolhas||0)) return `Escolha pelo menos ${g.min_escolhas} opcao em ${g.nome}.`;
      if(count > Number(g.max_escolhas||99)) return `Escolha no maximo ${g.max_escolhas} em ${g.nome}.`;
    }
    if(err) return err;
    return '';
  }

  function save(){
    const problem = validate();
    if(problem){ setErr(problem); return; }
    const opts = (prato.grupos_opcionais||[]).flatMap(g => (g.opcionais||[]).filter(o => (selected[g.id]||[]).includes(o.id)).map(o => ({...o, grupo_id:g.id, grupo_nome:g.nome})));
    onSaved({
      uid: preset?.uid || makeId(),
      prato, tamanho, opcionais:opts, quantidade:qty, observacoes:obs, preco_unitario:unit
    });
  }

  return <div className="modal-back">
    <div className="sheet full">
      <div className="sheet-head"><button className="icon-btn" onClick={onClose}>×</button><b>{prato.nome}</b><span/></div>
      <Photo url={prato.foto_url} name={prato.nome} className="detail-photo"/>
      <div className="detail-body">
        <h2>{prato.nome}</h2>
        <div className="detail-desc">{prato.descricao_completa || prato.descricao_curta}</div>
        {!!(prato.cupons||[]).length && <div className="dish-coupons" style={{marginBottom:10}}>
          {(prato.cupons||[]).map(c => <span className={`badge ${toneClass(c.cor || 'roxo')}`} key={c.id}>{c.codigo}{c.valor ? ` · ${c.tipo === 'percentual' ? `${c.valor}%` : fmtR$(c.valor)}` : ''}</span>)}
        </div>}
        <div className="price">
          {prato.preco_promocional && <span className="old-price">{fmtR$(prato.preco_base)}</span>}
          a partir de {fmtR$(minPrice(prato))}
        </div>
      </div>
      {(prato.tamanhos||[]).length > 0 && <div className="group">
        <div className="group-title"><div><h3>Tamanho</h3><small>Escolha 1 opcao</small></div><span className="req">OBRIGATORIO</span></div>
        {prato.tamanhos.map(t => <div className="choice" key={t.id} onClick={()=>setTamanho(t)}>
          <div><div className="choice-title">{t.nome}</div>{t.peso_g && <div className="choice-desc">{t.peso_g}g</div>}<div className="choice-price">{Number(t.preco_delta)>0?`+ ${fmtR$(t.preco_delta)}`:'incluido'}</div></div>
          <span className={`radio ${tamanho?.id===t.id?'active':''}`}/>
        </div>)}
      </div>}
      {(prato.grupos_opcionais||[]).map(g => <div className="group" key={g.id}>
        <div className="group-title">
          <div><h3>{g.nome}</h3><small>Escolha {g.min_escolhas ? `de ${g.min_escolhas} a ` : 'ate '}{g.max_escolhas} opcao(oes)</small></div>
          {Number(g.min_escolhas)>0 && <span className="req">OBRIGATORIO</span>}
        </div>
        {(g.opcionais||[]).map(o => {
          const active = (selected[g.id]||[]).includes(o.id);
          return <div className="option-line" key={o.id} onClick={()=>toggle(g,o)}>
            <Photo url={o.foto_url} name={o.nome} className="option-photo"/>
            <div><div className="choice-title">{o.nome}</div><div className="choice-desc">{o.descricao}</div><div className="choice-price">{Number(o.preco_delta)>0?`+ ${fmtR$(o.preco_delta)}`:'sem acrescimo'}</div></div>
            <button className={`plus ${active?'active':''}`}>{active?'✓':'+'}</button>
          </div>;
        })}
      </div>)}
      <div className="form"><label>Observacao do item</label><textarea value={obs} onChange={e=>setObs(e.target.value)} placeholder="Ex: sem cebola, capricha no parmesao..."/></div>
      {err && <div className="warn">{err}</div>}
      <div className="detail-footer">
        <div className="stepper"><button onClick={()=>setQty(Math.max(1,qty-1))}>-</button><span>{qty}</span><button onClick={()=>setQty(qty+1)}>+</button></div>
        <button className="add-btn" disabled={pricing} onClick={save}>{pricing?'Calculando...':`Adicionar — ${fmtR$(unit*qty)}`}</button>
      </div>
    </div>
  </div>;
}

function ChatModal({ tracking, bot, onClose }){
  const [messages,setMessages] = useState([]);
  const [text,setText] = useState('');
  const [loading,setLoading] = useState(false);
  const [err,setErr] = useState('');
  const visitorKey = tracking?.visitor_key || getVisitorKey();

  useEffect(()=>{
    if(!visitorKey) return;
    let cancelled = false;
    let timer = null;
    async function tick(){
      if(cancelled) return;
      if(document.visibilityState === 'visible'){
        await loadMessages();
      }
      if(cancelled) return;
      timer = setTimeout(tick, 8000);
    }
    tick();
    function onVis(){ if(document.visibilityState === 'visible') loadMessages(); }
    document.addEventListener('visibilitychange', onVis);
    return () => {
      cancelled = true;
      if(timer) clearTimeout(timer);
      document.removeEventListener('visibilitychange', onVis);
    };
  },[visitorKey]);

  async function loadMessages(){
    if(!visitorKey) return;
    const { data } = await sb.rpc('cardapio_listar_mensagens_visitante', { p_visitor_key: visitorKey });
    setMessages(Array.isArray(data) ? data : []);
  }

  async function send(){
    const msg = text.trim();
    if(!msg) return;
    setLoading(true);
    setErr('');
    setText('');
    const optimistic = { id: `tmp-${Date.now()}`, autor: 'visitante', mensagem: msg, criado_em: new Date().toISOString(), _optimistic: true };
    setMessages(prev => [...prev, optimistic]);
    const { error } = await sb.functions.invoke('garcom-bot', {
      body: {
        visitor_key: visitorKey,
        sessao_id: tracking?.sessao_id || null,
        mensagem: msg
      }
    });
    setLoading(false);
    if(error){
      setErr(error.message || 'Nao consegui chamar o garcom virtual agora.');
      setMessages(prev => prev.filter(m => m.id !== optimistic.id));
      setText(msg);
      return;
    }
    await loadMessages();
  }

  return <div className="modal-back chat-modal-back" onClick={onClose}>
    <div className="sheet chat-sheet" onClick={e=>e.stopPropagation()}>
      <div className="sheet-head"><b>{bot?.nome || 'Falar com o Dom'}</b><button className="icon-btn chat-close" onClick={onClose}>x</button></div>
      <div className="chat-body">
        {!messages.length && !loading && <div className="chat-bubble admin">Me chama por aqui que eu vejo no painel em tempo real.</div>}
        {messages.map(m => <div key={m.id} className={`chat-bubble ${m.autor === 'visitante' ? 'visitante' : 'admin'}`}>{m.mensagem}</div>)}
        {loading && <div className="chat-bubble admin chat-typing"><span/><span/><span/></div>}
      </div>
      {err && <div className="warn">{err}</div>}
      <div className="chat-input">
        <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')send();}} placeholder="Escreva sua mensagem..." disabled={loading} />
        <button disabled={loading || !text.trim()} onClick={send}>{loading ? '...' : 'Enviar'}</button>
      </div>
    </div>
  </div>;
}

          <button className="danger" onClick={()=>setCart(prev=>prev.filter((_,idx)=>idx!==i))}>Excluir</button>
          <div className="stepper" style={{width:92,height:34}}><button onClick={()=>setCart(prev=>prev.map((x,idx)=>idx===i?{...x,quantidade:Math.max(1,x.quantidade-1)}:x))}>-</button><span>{it.quantidade}</span><button onClick={()=>setCart(prev=>prev.map((x,idx)=>idx===i?{...x,quantidade:x.quantidade+1}:x))}>+</button></div>
          <b>{fmtR$(it.preco_unitario*it.quantidade)}</b>
        </div>
      </div>)}
      {bebidas.length > 0 && <div className="upsell"><h3>O Dom tambem recomenda</h3><div className="upsell-row">{bebidas.map(b=><div className="upsell-card" key={b.id}><Photo url={b.foto_url} name={b.nome} className="cart-thumb"/><b>{b.nome}</b><div className="price">{fmtR$(b.preco_base)}</div><button className="plus" onClick={()=>onAddBebida(b)}>+</button></div>)}</div></div>}
      <div className="cart-footer"><div><div className="total-label">Total</div><div className="total-value">{fmtR$(subtotal)}</div></div><button className="continue-btn" disabled={!cart.length} onClick={onCheckout}>Continuar</button></div>
    </div>
  </div>;
}

function CheckoutModal({ cardapio, cart, subtotal, tracking, track, onClose, onSuccess }){
  const rest = cardapio.restaurante || {};
  const [form,setForm] = useState({nome:'',whatsapp:'',cep:'',logradouro:'',numero:'',complemento:'',bairro:'',cidade:'Curitiba',uf:'PR',referencia:'',pagamento:'pix_manual',troco:'',cupom:'',obs:''});
  const [loading,setLoading] = useState(false);
  const [msg,setMsg] = useState('');
  function set(k,v){ setForm({...form,[k]:v}); }

  async function confirm(){
    setMsg('');
    if(!form.nome || !form.whatsapp || !form.logradouro || !form.numero || !form.bairro) return setMsg('Preencha nome, WhatsApp e endereco.');
    setLoading(true);
    const visitorKey = tracking?.visitor_key || getVisitorKey();
    if(visitorKey){
      try { await sb.rpc('cardapio_resolver_visitante', { p_visitor_key: visitorKey, p_whatsapp: form.whatsapp, p_nome: form.nome }); } catch(_) { /* segue sem mesclar */ }
    }
    const payload = {
      p_cliente:{ nome:form.nome, whatsapp:form.whatsapp },
      p_endereco:{ cep:form.cep, logradouro:form.logradouro, numero:form.numero, complemento:form.complemento, bairro:form.bairro, cidade:form.cidade, uf:form.uf, ponto_referencia:form.referencia },
      p_itens:cart.map(it=>({ prato_id:it.prato.id, tamanho_id:it.tamanho?.id || null, opcionais_ids:it.opcionais.map(o=>o.id), quantidade:it.quantidade, observacoes:it.observacoes || null })),
      p_forma_pagamento:form.pagamento,
      p_troco_para:form.troco ? Number(form.troco) : null,
      p_cupom_codigo:form.cupom || null,
      p_observacoes:form.obs || null,
      p_origem:'cardapio_html'
    };
    const { data, error } = await sb.rpc('criar_pedido', payload);
    setLoading(false);
    if(error) return setMsg(error.message);
    const whatsapp = (rest.whatsapp || '5541000000000').replace(/\D/g,'');
    const text = data?.mensagem_whatsapp || `Pedido Dom Leonardo ${data?.numero_pedido||''}`;
    window.open(`https://wa.me/${whatsapp}?text=${encodeURIComponent(text)}`,'_blank');
    onSuccess();
  }
  useEffect(()=>{ track?.('checkout_open', { subtotal, itens: cart.length }); },[]);
  return <div className="modal-back">
    <div className="sheet full">
      <div className="sheet-head"><button className="icon-btn" onClick={onClose}>×</button><b>Finalizar pedido</b><span/></div>
      <div className="warn">O pagamento e a entrega sao combinados pelo WhatsApp. O pedido tambem fica salvo no sistema.</div>
      <div className="form">
        <label>Nome</label><input value={form.nome} onChange={e=>set('nome',e.target.value)} placeholder="Seu nome"/>
        <label>WhatsApp</label><input value={form.whatsapp} onChange={e=>set('whatsapp',e.target.value)} placeholder="41999999999"/>
        <label>Endereco</label><input value={form.logradouro} onChange={e=>set('logradouro',e.target.value)} placeholder="Rua / Avenida"/>
        <div className="form-row"><div><label>Bairro</label><input value={form.bairro} onChange={e=>set('bairro',e.target.value)}/></div><div><label>Numero</label><input value={form.numero} onChange={e=>set('numero',e.target.value)}/></div></div>
        <div className="form-row"><div><label>Complemento</label><input value={form.complemento} onChange={e=>set('complemento',e.target.value)}/></div><div><label>CEP</label><input value={form.cep} onChange={e=>set('cep',e.target.value)}/></div></div>
        <div className="form-row"><div><label>Cidade</label><input value={form.cidade} onChange={e=>set('cidade',e.target.value)}/></div><div><label>UF</label><input value={form.uf} onChange={e=>set('uf',e.target.value)}/></div></div>
        <label>Referencia</label><input value={form.referencia} onChange={e=>set('referencia',e.target.value)} placeholder="Portao, bloco, ponto de referencia..."/>
        <label>Forma de pagamento</label><select value={form.pagamento} onChange={e=>set('pagamento',e.target.value)}><option value="pix_manual">Pix manual</option><option value="cartao_entrega">Cartao na entrega</option><option value="dinheiro">Dinheiro</option><option value="nao_definido">Combinar no WhatsApp</option></select>
        {form.pagamento==='dinheiro' && <><label>Troco para</label><input type="number" value={form.troco} onChange={e=>set('troco',e.target.value)}/></>}
        <label>Cupom</label><input value={form.cupom} onChange={e=>set('cupom',e.target.value.toUpperCase())} placeholder="BEMVINDO10"/>
        <label>Observacoes do pedido</label><textarea value={form.obs} onChange={e=>set('obs',e.target.value)} placeholder="Alguma informacao para o Dom?"/>
      </div>
      {msg && <div className="warn">{msg}</div>}
      <div className="cart-footer"><div><div className="total-label">Subtotal estimado</div><div className="total-value">{fmtR$(subtotal)}</div></div><button className="continue-btn" disabled={loading} onClick={confirm}>{loading?'Enviando...':'Confirmar'}</button></div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
