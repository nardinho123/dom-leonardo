<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0908" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<title>Dom Leonardo - Cardapio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --safe-top:env(safe-area-inset-top);
  --safe-bottom:env(safe-area-inset-bottom);
  --gold:#d4af37;
  --gold-2:#e7c66d;
  --gold-dim:#8a6f1f;
  --bg:#0a0908;
  --bg-soft:#110f0c;
  --card:#1c1814;
  --card-2:#15120e;
  --line:rgba(212,175,55,.18);
  --line-strong:rgba(212,175,55,.32);
  --text:#f3ece0;
  --muted:#9f978b;
  --danger:#d95b4b;
  --ok:#72c18b;
  --shadow:0 22px 60px rgba(0,0,0,.46);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);overflow-x:hidden}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,sans-serif;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);overscroll-behavior-y:contain}
button,input,textarea,select{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{font-size:16px}
::-webkit-scrollbar{width:0;height:0}
.font-serif{font-family:"Cormorant Garamond","Playfair Display",Georgia,serif}
.app{min-height:100dvh;background:
  radial-gradient(circle at 20% -10%,rgba(212,175,55,.18),transparent 28%),
  radial-gradient(circle at 100% 12%,rgba(139,46,26,.22),transparent 30%),
  linear-gradient(180deg,#0a0908 0%,#110d0a 48%,#080706 100%);
  padding-bottom:calc(112px + var(--safe-bottom));
}
.shell{width:100%;max-width:760px;margin:0 auto;position:relative}
.hero{padding:18px 18px 12px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.hero-top>div:first-child{min-width:0}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:800}
h1{margin:2px 0 0;font-size:34px;line-height:.95;color:var(--gold);font-weight:500}
.hero-copy{margin:12px 0 0;color:var(--muted);font-size:14px;line-height:1.5;max-width:430px}
.store-status{display:none;text-align:right;font-size:12px;color:var(--muted);flex:0 0 auto;min-width:92px}
.store-status strong{display:block;color:var(--gold);font-size:13px;margin-top:2px}
.meta-row{display:flex;gap:8px;overflow-x:auto;padding:12px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:rgba(28,24,20,.68);border-radius:999px;padding:8px 11px;color:var(--text);font-size:12px;font-weight:750}
.chip.gold{background:linear-gradient(180deg,rgba(212,175,55,.20),rgba(212,175,55,.08));color:var(--gold);border-color:var(--line-strong)}
.help-card{margin:0 18px 12px;padding:14px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(28,24,20,.94),rgba(17,15,12,.96));box-shadow:0 14px 42px rgba(0,0,0,.32);display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}
.help-card p{margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.35}
.help-card strong{color:var(--text);font-size:15px}
.help-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini-btn{border:1px solid var(--line-strong);border-radius:999px;padding:8px 11px;color:var(--gold);font-size:12px;font-weight:850;background:rgba(212,175,55,.08)}
.category-rail{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:10px 18px;background:linear-gradient(180deg,rgba(10,9,8,.98),rgba(10,9,8,.84));backdrop-filter:blur(14px);border-bottom:1px solid rgba(212,175,55,.08)}
.cat-btn{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:10px 13px;background:rgba(28,24,20,.78);font-size:13px;font-weight:850;color:var(--muted)}
.cat-btn.active{color:#1a1305;background:linear-gradient(180deg,var(--gold-2),var(--gold-dim));border-color:transparent}
.section{padding:16px 18px 4px}
.section h2{font-size:22px;margin:0;color:var(--gold);font-weight:500}
.section p{font-size:13px;color:var(--muted);margin:4px 0 0;line-height:1.4}
.dish-list{padding:0 18px 10px;display:grid;gap:12px}
.dish-card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(28,24,20,.98),rgba(17,15,12,.98));box-shadow:0 14px 44px rgba(0,0,0,.28);overflow:hidden;display:grid;grid-template-columns:1fr 116px;gap:12px;min-height:152px}
.dish-info{padding:14px 0 14px 14px;min-width:0}
.dish-card h3{font-size:17px;margin:0 0 7px;line-height:1.18;font-weight:850;color:var(--text)}
.dish-card p{font-size:12.5px;line-height:1.42;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dish-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.price{color:var(--gold);font-weight:900;font-size:15px}
.old-price{color:var(--muted);font-size:12px;text-decoration:line-through;margin-right:4px}
.order-btn{background:linear-gradient(180deg,var(--gold-2),var(--gold-dim));color:#1a1305;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:950;box-shadow:0 8px 20px rgba(212,175,55,.18)}
.photo{background:linear-gradient(135deg,#4b2418,#a45032 52%,#22140f);display:grid;place-items:center;text-align:center;color:#f6df9d;font-weight:950;overflow:hidden}
.dish-photo{height:100%;min-height:152px;border-radius:20px 0 0 20px}
.photo img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(212,175,55,.26);background:rgba(212,175,55,.12);color:var(--gold);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;margin-bottom:8px}
.empty,.loading{margin:16px 18px;padding:22px;border:1px solid var(--line);border-radius:20px;background:rgba(28,24,20,.8);color:var(--muted);text-align:center}
.skeleton{height:152px;margin:12px 18px;border-radius:24px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(212,175,55,.11),rgba(255,255,255,.04));background-size:220% 100%;animation:skeleton 1.3s linear infinite}
@keyframes skeleton{to{background-position:-220% 0}}
.bag-bar{position:fixed;left:0;right:0;bottom:0;z-index:70;padding:10px 14px calc(10px + var(--safe-bottom));background:linear-gradient(180deg,rgba(10,9,8,.35),rgba(10,9,8,.96) 24%);backdrop-filter:blur(14px);pointer-events:none}
.bag-inner{max-width:760px;margin:0 auto;pointer-events:auto;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.bag-btn{width:100%;height:56px;border-radius:18px;background:linear-gradient(180deg,var(--gold-2),var(--gold-dim));color:#1a1305;font-weight:950;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 16px 36px rgba(0,0,0,.38)}
.bag-secondary{height:56px;border:1px solid var(--line-strong);border-radius:18px;padding:0 14px;background:rgba(28,24,20,.94);color:var(--gold);font-weight:900;white-space:nowrap}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:90;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
.sheet{width:100%;max-width:760px;max-height:94dvh;background:var(--bg-soft);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.sheet.full{height:96dvh}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(17,15,12,.96);backdrop-filter:blur(12px)}
.sheet-title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;font-weight:950;color:var(--text)}
.sheet-scroll{overflow:auto;flex:1}
.detail-photo{height:260px;font-size:28px}
.detail-body{padding:16px}
.detail-body h2{font-size:28px;line-height:1.02;margin:0 0 8px;color:var(--gold);font-weight:500}
.detail-desc{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:12px}
.group{border-top:8px solid rgba(255,255,255,.035);padding:15px 16px}
.group-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.group-title h3{margin:0;font-size:16px}
.group-title small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.req{background:rgba(212,175,55,.16);border:1px solid var(--line-strong);color:var(--gold);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:950;white-space:nowrap}
.choice{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.055)}
.choice:last-child{border-bottom:0}
.choice-title{font-size:14px;font-weight:850}
.choice-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
.choice-price{font-size:12px;color:var(--gold);font-weight:900;margin-top:4px}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.18);display:grid;place-items:center}
.radio.active{border-color:var(--gold)}
.radio.active:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold)}
.option-line{grid-template-columns:54px 1fr auto}
.option-photo{width:54px;height:54px;border-radius:14px;font-size:11px}
.plus{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);color:var(--gold);font-size:18px;font-weight:950;background:rgba(212,175,55,.06)}
.plus.active{background:linear-gradient(180deg,var(--gold-2),var(--gold-dim));color:#1a1305}
.form{padding:16px}
.form label{display:block;font-size:12px;color:var(--muted);font-weight:850;margin:0 0 7px}
.form textarea,.form input{width:100%;border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.18);color:var(--text);padding:13px;outline:none}
.form textarea{min-height:80px;resize:vertical}
.detail-footer,.cart-footer{flex:none;position:sticky;bottom:0;background:rgba(17,15,12,.98);padding:12px 14px calc(12px + var(--safe-bottom));border-top:1px solid var(--line);display:grid;grid-template-columns:114px 1fr;gap:10px}
.stepper{height:50px;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:space-around;font-weight:950;background:rgba(255,255,255,.03)}
.stepper button{font-size:21px;color:var(--gold);font-weight:950;width:36px;height:36px}
.primary-btn{height:50px;border-radius:16px;background:linear-gradient(180deg,var(--gold-2),var(--gold-dim));color:#1a1305;font-weight:950;padding:0 14px}
.primary-btn:disabled{opacity:.55}
.ghost-btn{height:50px;border-radius:16px;border:1px solid var(--line-strong);color:var(--gold);font-weight:900;background:rgba(212,175,55,.06);padding:0 14px}
.warn{margin:12px 16px;padding:12px;border:1px solid rgba(217,91,75,.34);background:rgba(217,91,75,.10);border-radius:16px;color:#ffb2a8;font-size:13px;line-height:1.35}
.cart-list{padding:10px 14px 120px;display:grid;gap:10px}
.cart-item{border:1px solid var(--line);border-radius:20px;background:rgba(28,24,20,.86);padding:12px;display:grid;grid-template-columns:64px 1fr;gap:10px}
.cart-thumb{width:64px;height:64px;border-radius:16px;font-size:11px}
.cart-title{font-size:14px;font-weight:900}
.cart-desc{font-size:12px;color:var(--muted);margin:4px 0;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);border-radius:999px;padding:4px 7px;font-size:10px;color:var(--muted)}
.cart-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.danger{color:#ff9b8f;font-weight:900;font-size:13px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(96px + var(--safe-bottom));z-index:130;max-width:732px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;color:var(--text);box-shadow:0 16px 44px rgba(0,0,0,.45);font-size:14px}
.marco-sticker{position:fixed;right:16px;bottom:calc(84px + var(--safe-bottom));width:64px;height:64px;z-index:74;filter:drop-shadow(0 4px 18px rgba(212,175,55,.25));transition:transform 480ms cubic-bezier(.34,1.56,.64,1)}
.marco-sticker.attention{animation:balanca 1.6s ease-in-out infinite}
@keyframes balanca{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(3deg) translateY(-2px)}}
.marco-badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:999px;background:linear-gradient(180deg,var(--gold-2),var(--gold-dim));color:#1a1305;font-size:12px;font-weight:950;display:grid;place-items:center;border:2px solid var(--bg)}
.balao{position:fixed;right:88px;bottom:calc(92px + var(--safe-bottom));max-width:64vw;background:var(--card-2);border:1px solid var(--line);padding:10px 14px;border-radius:18px 18px 4px 18px;font-size:14px;line-height:1.35;z-index:75;box-shadow:0 8px 22px rgba(0,0,0,.45);opacity:0;transform:translateY(8px);pointer-events:none;transition:.28s}
.balao.shown{opacity:1;transform:translateY(0)}
.chat-back{z-index:100}
.chat-sheet{height:84dvh}
.messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:11px 14px;border-radius:17px;font-size:15px;line-height:1.42}
.msg.marco{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.cliente{align-self:flex-end;background:linear-gradient(180deg,var(--gold-2),var(--gold-dim));color:#1a1305;border-bottom-right-radius:5px;font-weight:650}
.msg small{display:block;color:var(--gold);font-weight:900;font-size:11px;margin-bottom:3px}
.typing{align-self:flex-start;background:var(--card);border:1px solid var(--line);padding:14px 18px;border-radius:16px;display:flex;gap:5px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:typing 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-3px);opacity:1}}
.chat-input{flex:none;display:grid;grid-template-columns:44px 1fr 48px;gap:8px;padding:12px 14px calc(12px + var(--safe-bottom));border-top:1px solid var(--line);background:rgba(17,15,12,.98)}
.chat-input input{border:1px solid var(--line);background:rgba(0,0,0,.16);color:var(--text);border-radius:16px;padding:0 13px;outline:none;min-width:0}
.chat-input button{height:44px;border-radius:15px;background:rgba(212,175,55,.10);border:1px solid var(--line-strong);color:var(--gold);font-weight:950}
.chat-input .send{background:linear-gradient(180deg,var(--gold-2),var(--gold-dim));color:#1a1305;border:0}
@media(min-width:760px){
  .app{background:#070604}
  .shell{box-shadow:0 0 0 1px var(--line);min-height:100dvh;background:linear-gradient(180deg,#0a0908,#110d0a)}
  .bag-inner,.toast{max-width:760px}
}
@media(max-width:430px){
  .store-status{display:none}
  h1{font-size:32px}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useEffect, useMemo, useRef, useState } = React;

const SUPABASE_URL = 'https://jewamqbdonudiapxbzay.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VeJTrMvtl5PAEvvc6R0CKA_nzjxQiAY';
const GARCOM_URL = `${SUPABASE_URL}/functions/v1/garcom-responder`;
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function fmtR(v){ return Number(v || 0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function makeId(){ return (crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`); }
function minPrice(p){ return Number(p?.preco_promocional ?? p?.preco_base ?? 0); }
function cleanPhone(v){ return String(v || '').replace(/\D/g,''); }
function allPratos(cardapio){ return (cardapio?.categorias || []).flatMap(c => (c.pratos || []).map(p => ({...p,categoria_nome:c.nome,categoria_slug:c.slug}))); }
function itemTotal(it){ return Number(it.preco_unitario || 0) * Number(it.quantidade || 1); }
function vibrate(ms){ try{ navigator.vibrate?.(ms); }catch(_){} }

function deviceId(){
  const key = 'garcom_device_id';
  let id = localStorage.getItem(key);
  if(!id){ id = makeId(); localStorage.setItem(key,id); }
  return id;
}
function getSessaoId(){ return localStorage.getItem('garcom_sessao_id'); }
function setSessaoId(id){ if(id) localStorage.setItem('garcom_sessao_id', id); }

async function callGarcom(body){
  const res = await fetch(GARCOM_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},
    body: JSON.stringify({ sessao_id:getSessaoId(), device_id:deviceId(), ...body })
  });
  const json = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(json?.error || `HTTP ${res.status}`);
  if(json?.sessao_id) setSessaoId(json.sessao_id);
  return json;
}

function saveCustomer(data){
  localStorage.setItem('dom_cliente_hibrido', JSON.stringify(data));
}
function loadCustomer(){
  try { return JSON.parse(localStorage.getItem('dom_cliente_hibrido') || '{}'); }
  catch(_){ return {}; }
}

function Photo({ url, name, className }){
  return <div className={`photo ${className || ''}`}>{url ? <img src={url} alt={name || 'Item'} loading="lazy"/> : <span>{String(name || 'DOM').slice(0,16)}</span>}</div>;
}

function MarcoSticker(){
  return (
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bgMarco" cx="50%" cy="40%" r="55%">
          <stop offset="0%" stopColor="#2a2520"/><stop offset="100%" stopColor="#15120e"/>
        </radialGradient>
        <linearGradient id="goldMarco" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#e7c66d"/><stop offset="100%" stopColor="#a47e1e"/>
        </linearGradient>
      </defs>
      <circle cx="32" cy="32" r="30" fill="url(#bgMarco)" stroke="url(#goldMarco)" strokeWidth="1.5"/>
      <circle cx="32" cy="24" r="9" fill="#f3d8b8"/>
      <path d="M22 22 Q22 14 32 14 Q42 14 42 22 L42 19 Q40 16 32 16 Q24 16 22 19 Z" fill="#3b2818"/>
      <path d="M28 26 Q32 28 36 26" stroke="#3b2818" strokeWidth="1.2" fill="none" strokeLinecap="round"/>
      <circle cx="29" cy="23" r="1" fill="#1a1305"/><circle cx="35" cy="23" r="1" fill="#1a1305"/>
      <path d="M29 27 Q32 29 35 27" stroke="#1a1305" strokeWidth="0.9" fill="none" strokeLinecap="round"/>
      <path d="M28 34 L32 32 L36 34 L36 38 L32 36 L28 38 Z" fill="url(#goldMarco)"/>
      <path d="M20 38 Q32 36 44 38 L44 50 Q32 52 20 50 Z" fill="#1a1305"/>
      <path d="M28 36 L28 50 L36 50 L36 36 Z" fill="#f3ece0"/>
      <rect x="14" y="40" width="6" height="14" rx="2" fill="url(#goldMarco)" transform="rotate(-12 17 47)"/>
    </svg>
  );
}

function App(){
  const [cardapio,setCardapio] = useState(null);
  const [loading,setLoading] = useState(true);
  const [error,setError] = useState('');
  const [activeCat,setActiveCat] = useState('');
  const [detail,setDetail] = useState(null);
  const [editingIndex,setEditingIndex] = useState(null);
  const [bagOpen,setBagOpen] = useState(false);
  const [cart,setCart] = useState(() => {
    try { return JSON.parse(localStorage.getItem('dom_cart_hibrido') || '[]'); }
    catch(_){ return []; }
  });
  const [toast,setToast] = useState('');
  const [chatOpen,setChatOpen] = useState(false);
  const [messages,setMessages] = useState([]);
  const [typing,setTyping] = useState(false);
  const [input,setInput] = useState('');
  const [flow,setFlow] = useState(null);
  const [customer,setCustomer] = useState(loadCustomer);
  const [pedido,setPedido] = useState(null);
  const msgEndRef = useRef(null);

  useEffect(() => { load(); }, []);
  useEffect(() => { localStorage.setItem('dom_cart_hibrido', JSON.stringify(cart)); }, [cart]);
  useEffect(() => { saveCustomer(customer); }, [customer]);
  useEffect(() => { if(toast){ const t = setTimeout(()=>setToast(''),2600); return ()=>clearTimeout(t); } }, [toast]);
  useEffect(() => { msgEndRef.current?.scrollIntoView({behavior:'smooth',block:'end'}); }, [messages,typing,chatOpen]);

  async function load(){
    setLoading(true); setError('');
    const { data, error } = await sb.rpc('get_cardapio_publico');
    if(error) setError(error.message);
    else { setCardapio(data); setActiveCat(data?.categorias?.[0]?.id || ''); }
    setLoading(false);
  }

  const rest = cardapio?.restaurante || {};
  const subtotal = cart.reduce((sum,it) => sum + itemTotal(it), 0);
  const qtd = cart.reduce((sum,it) => sum + Number(it.quantidade || 1), 0);
  const bebidas = (cardapio?.categorias || []).find(c => c.slug === 'bebidas')?.pratos || [];

  function pushMsg(autor,texto){
    setMessages(prev => [...prev, { id:makeId(), autor, texto }]);
  }
  function marco(texto){ pushMsg('marco', texto); }

  function openDetail(prato, index = null){
    vibrate(12);
    setEditingIndex(index);
    setDetail({ prato, preset:index !== null ? cart[index] : null });
  }

  function onSaved(item){
    setCart(prev => editingIndex !== null ? prev.map((it,i) => i === editingIndex ? item : it) : [...prev,item]);
    setDetail(null);
    setEditingIndex(null);
    setToast('Anotado na sacola. Pode escolher mais alguma coisa.');
    vibrate([20,40,20]);
  }

  function updateQty(index, delta){
    setCart(prev => prev.map((it,i) => i === index ? {...it, quantidade:Math.max(1, Number(it.quantidade || 1) + delta)} : it));
  }

  function resumoCarrinho(){
    return cart.map(it => `${it.quantidade}x ${it.prato.nome}${it.tamanho ? ` (${it.tamanho.nome})` : ''}`).join(', ');
  }

  function openChatFromButton(){
    setChatOpen(true);
    if(!messages.length) {
      setTimeout(() => marco(customer.nome ? `Oi, ${customer.nome}. Tô por aqui se quiser ajuda pra escolher.` : 'Opa, tô por aqui. Se quiser, eu te ajudo a escolher sem enrolar.'), 180);
    }
  }

  function startDeliveryEstimate(){
    setChatOpen(true);
    const step = customer.nome ? 'endereco' : 'nome';
    setFlow({ type:'tempo', step });
    if(step === 'nome') marco('Claro. Antes de calcular, como posso te chamar?');
    else marco(`Boa, ${customer.nome}. Me passa rua, número e bairro que eu calculo uma estimativa honesta pra você.`);
  }

  function startCheckout(){
    if(!cart.length){ setToast('Sua sacola ainda está vazia.'); return; }
    setBagOpen(false);
    setChatOpen(true);
    const missing = !customer.nome ? 'nome' : !customer.endereco_texto ? 'endereco' : !customer.telefone ? 'telefone' : 'enviar';
    setFlow({ type:'checkout', step:missing });
    const intro = `Opa, vi aqui: ${resumoCarrinho()}. Vou levar para o Dom analisar, mas antes te faço três perguntas rapidinhas pra entregar certo.`;
    marco(intro);
    setTimeout(() => {
      if(missing === 'nome') marco('Como posso te chamar?');
      else if(missing === 'endereco') marco(`${customer.nome}, qual é seu endereço? Pode mandar rua, número e bairro.`);
      else if(missing === 'telefone') marco('E seu telefone? É só pro motoboy te ligar se não achar a casa.');
      else submitPedido(customer);
    }, 520);
  }

  async function saveField(acao, payload){
    try { await callGarcom({ acao, ...payload }); }
    catch(err){ console.warn('garcom save failed', err.message); }
  }

  async function submitPedido(clienteAtual){
    setTyping(true);
    try {
      const resp = await callGarcom({
        acao:'enviar_pedido_admin',
        cliente: {
          nome: clienteAtual.nome,
          telefone: clienteAtual.telefone,
          endereco_texto: clienteAtual.endereco_texto
        },
        carrinho: cart,
        observacoes: 'Pedido criado pelo Cardapio Garcom Hibrido'
      });
      setPedido(resp.pedido || null);
      setTyping(false);
      marco(resp?.falas?.[0]?.texto || 'Perfeito. Enviei seu pedido para o Dom analisar. Quando ele aceitar, a cozinha começa.');
      setCart([]);
      localStorage.removeItem('dom_cart_hibrido');
      setFlow(null);
      setToast('Pedido enviado para o painel do Dom.');
    } catch(err) {
      setTyping(false);
      marco(`Hum, não consegui enviar agora: ${err.message}. Quer tentar de novo?`);
    }
  }

  async function handleFlowAnswer(text){
    const current = flow;
    if(!current) return false;
    if(current.type === 'tempo'){
      if(current.step === 'nome'){
        const next = {...customer, nome:text};
        setCustomer(next);
        await saveField('salvar_nome', { nome:text });
        setFlow({ type:'tempo', step:'endereco' });
        marco(`Prazer, ${text}. Agora me passa rua, número e bairro que eu vejo o tempo pra você.`);
        return true;
      }
      if(current.step === 'endereco'){
        const next = {...customer, endereco_texto:text};
        setCustomer(next);
        setTyping(true);
        await saveField('salvar_endereco', { endereco_texto:text });
        try {
          const resp = await callGarcom({ acao:'estimar_entrega', endereco_texto:text });
          setTyping(false);
          marco(resp?.falas?.[0]?.texto || estimativaLocal(rest));
        } catch(_) {
          setTyping(false);
          marco(estimativaLocal(rest));
        }
        setFlow(null);
        return true;
      }
    }
    if(current.type === 'checkout'){
      if(current.step === 'nome'){
        const next = {...customer, nome:text};
        setCustomer(next);
        await saveField('salvar_nome', { nome:text });
        setFlow({ type:'checkout', step:'endereco' });
        marco(`Fechado, ${text}. Qual é o endereço? Rua, número e bairro já resolve.`);
        return true;
      }
      if(current.step === 'endereco'){
        const next = {...customer, endereco_texto:text};
        setCustomer(next);
        await saveField('salvar_endereco', { endereco_texto:text });
        setFlow({ type:'checkout', step:'telefone' });
        marco('Agora o telefone, por favor. É só pro motoboy te ligar se não achar a casa.');
        return true;
      }
      if(current.step === 'telefone'){
        const next = {...customer, telefone:text};
        setCustomer(next);
        await saveField('salvar_telefone', { telefone:text });
        setFlow({ type:'checkout', step:'enviar' });
        marco('Perfeito. Vou mandar para o Dom analisar agora.');
        await submitPedido(next);
        return true;
      }
    }
    return false;
  }

  function estimativaLocal(rest){
    const min = rest.tempo_entrega_min || 35;
    const max = rest.tempo_entrega_max || 50;
    return `Pra esse endereço, eu trabalharia com algo perto de ${min}-${max} min por enquanto. Se a rua estiver muito travada, eu te aviso antes de prometer milagre.`;
  }

  async function sendChat(){
    const text = input.trim();
    if(!text) return;
    setInput('');
    pushMsg('cliente', text);
    if(await handleFlowAnswer(text)) return;
    setTyping(true);
    try {
      const resp = await callGarcom({ mensagem:text, cliente_nome_provisorio:customer.nome || null });
      if(resp.cliente_nome && resp.cliente_nome !== customer.nome) setCustomer(prev => ({...prev, nome:resp.cliente_nome}));
      const falas = Array.isArray(resp.falas) ? resp.falas.filter(f => f.autor === 'marco' || f.destinatario === 'cliente') : [];
      setTyping(false);
      if(falas.length) {
        falas.forEach((f, i) => setTimeout(() => marco(f.texto), i * 450));
      } else {
        marco('Tô aqui. Me fala como posso ajudar.');
      }
    } catch(err) {
      setTyping(false);
      marco('Deu uma travadinha aqui, mas eu continuo por perto. Pode mandar de novo?');
    }
  }

  if(loading) return <div className="app"><div className="shell"><HeaderSkeleton /></div></div>;
  if(error) return <div className="app"><div className="shell"><div className="empty">Nao consegui carregar o cardapio.<br/>{error}<br/><button className="mini-btn" onClick={load}>Tentar de novo</button></div></div></div>;

  return (
    <div className="app">
      <div className="shell">
        <header className="hero">
          <div className="hero-top">
            <div>
              <div className="eyebrow">Trattoria delivery</div>
              <h1 className="font-serif">{rest.nome || 'Dom Leonardo'}</h1>
            </div>
            <div className="store-status">
              {rest.aberta_agora ? 'Aberto agora' : 'Fora do horario'}
              <strong>{rest.tempo_entrega_min || 35}-{rest.tempo_entrega_max || 50} min</strong>
            </div>
          </div>
          <p className="hero-copy">{rest.descricao || 'Gastronomia italiana feita com mão, história e um garçom digital bem atento.'}</p>
          <div className="meta-row">
            <span className="chip gold">Entrega {Number(rest.taxa_entrega || 0) ? fmtR(rest.taxa_entrega) : 'a combinar'}</span>
            <span className="chip">Pedido minimo {fmtR(rest.pedido_minimo)}</span>
            <button className="chip" onClick={startDeliveryEstimate}>Ver tempo de entrega</button>
          </div>
        </header>

        <section className="help-card">
          <MarcoSticker />
          <div>
            <strong>Peça sozinho ou chame o Marco.</strong>
            <p>Você monta a sacola como no app. Se travar, o garçom entra sem bagunçar a tela.</p>
            <div className="help-actions">
              <button className="mini-btn" onClick={openChatFromButton}>Chamar garçom</button>
              <button className="mini-btn" onClick={startDeliveryEstimate}>Ver tempo</button>
            </div>
          </div>
        </section>

        <nav className="category-rail">
          {(cardapio?.categorias || []).map(c => (
            <button key={c.id} className={`cat-btn ${activeCat === c.id ? 'active' : ''}`} onClick={() => { setActiveCat(c.id); document.getElementById('cat-'+c.id)?.scrollIntoView({block:'start'}); }}>
              {c.icone ? `${c.icone} ` : ''}{c.nome}
            </button>
          ))}
        </nav>

        {(cardapio?.categorias || []).map(c => (
          <section key={c.id} id={'cat-'+c.id}>
            <div className="section">
              <h2 className="font-serif">{c.nome}</h2>
              {c.descricao && <p>{c.descricao}</p>}
            </div>
            <div className="dish-list">
              {(c.pratos || []).map(p => <DishCard key={p.id} prato={{...p,categoria_slug:c.slug}} onOpen={() => openDetail({...p,categoria_slug:c.slug})}/>)}
              {!(c.pratos || []).length && <div className="empty">Essa parte ainda vai ganhar prato.</div>}
            </div>
          </section>
        ))}
      </div>

      <button className="marco-sticker attention" onClick={openChatFromButton} aria-label="Chamar Marco">
        <MarcoSticker />
        {!!qtd && <span className="marco-badge">{qtd}</span>}
      </button>
      <div className={`balao ${!chatOpen && !cart.length ? 'shown' : ''}`}>Se ficar em dúvida, me chama.</div>

      {!!cart.length && <div className="bag-bar">
        <div className="bag-inner">
          <button className="bag-btn" onClick={() => setBagOpen(true)}><span>{qtd} item(ns) na sacola</span><b>{fmtR(subtotal)}</b></button>
          <button className="bag-secondary" onClick={startCheckout}>Finalizar</button>
        </div>
      </div>}

      {detail && <DetailSheet data={detail} onClose={() => { setDetail(null); setEditingIndex(null); }} onSaved={onSaved} startDeliveryEstimate={startDeliveryEstimate} />}
      {bagOpen && <CartSheet cart={cart} setCart={setCart} subtotal={subtotal} bebidas={bebidas} onClose={() => setBagOpen(false)} onEdit={(prato,i) => { setBagOpen(false); openDetail(prato,i); }} onCheckout={startCheckout} />}
      {chatOpen && <ChatSheet messages={messages} typing={typing} input={input} setInput={setInput} send={sendChat} onClose={() => setChatOpen(false)} msgEndRef={msgEndRef} startDeliveryEstimate={startDeliveryEstimate} />}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

function HeaderSkeleton(){
  return <>
    <div className="hero"><div className="eyebrow">Trattoria delivery</div><h1 className="font-serif">Dom Leonardo</h1><p className="hero-copy">Carregando o cardápio...</p></div>
    {[1,2,3].map(i => <div className="skeleton" key={i}/>)}
  </>;
}

function DishCard({ prato, onOpen }){
  return (
    <article className="dish-card" onClick={onOpen}>
      <div className="dish-info">
        {prato.badge_destaque && <span className="badge">{prato.badge_destaque}</span>}
        <h3>{prato.nome}</h3>
        <p>{prato.descricao_curta || prato.descricao_completa || 'Feito na cozinha do Dom.'}</p>
        <div className="dish-bottom">
          <span className="price">{prato.preco_promocional && <span className="old-price">{fmtR(prato.preco_base)}</span>}a partir de {fmtR(minPrice(prato))}</span>
          <button className="order-btn" onClick={e => { e.stopPropagation(); onOpen(); }}>Pedir</button>
        </div>
      </div>
      <Photo url={prato.foto_url} name={prato.nome} className="dish-photo" />
    </article>
  );
}

function DetailSheet({ data, onClose, onSaved, startDeliveryEstimate }){
  const prato = data.prato;
  const preset = data.preset;
  const defaultSize = preset?.tamanho || (prato.tamanhos || []).find(t => t.padrao) || (prato.tamanhos || [])[0] || null;
  const [tamanho,setTamanho] = useState(defaultSize);
  const [selected,setSelected] = useState(() => {
    const map = {};
    (preset?.opcionais || []).forEach(o => { if(!map[o.grupo_id]) map[o.grupo_id] = []; map[o.grupo_id].push(o.id); });
    return map;
  });
  const [qty,setQty] = useState(preset?.quantidade || 1);
  const [obs,setObs] = useState(preset?.observacoes || '');
  const [unit,setUnit] = useState(preset?.preco_unitario || minPrice(prato));
  const [pricing,setPricing] = useState(false);
  const [err,setErr] = useState('');
  const optionIds = Object.values(selected).flat();

  useEffect(() => { recalc(); }, [tamanho?.id, JSON.stringify(optionIds)]);

  async function recalc(){
    setPricing(true); setErr('');
    const { data, error } = await sb.rpc('calcular_preco_item', {
      p_prato_id: prato.id,
      p_tamanho_id: tamanho?.id || null,
      p_opcionais_ids: optionIds
    });
    if(error) setErr(error.message); else setUnit(Number(data || 0));
    setPricing(false);
  }

  function toggle(group,opt){
    setSelected(prev => {
      const current = prev[group.id] || [];
      const has = current.includes(opt.id);
      let next = current;
      if(has) next = current.filter(id => id !== opt.id);
      else if(group.max_escolhas === 1 || group.tipo === 'unico') next = [opt.id];
      else if(current.length < Number(group.max_escolhas || 99)) next = [...current,opt.id];
      else return prev;
      return {...prev,[group.id]:next};
    });
  }

  function validate(){
    if((prato.tamanhos || []).length && !tamanho) return 'Escolha um tamanho.';
    for(const g of (prato.grupos_opcionais || [])){
      const count = (selected[g.id] || []).length;
      if(count < Number(g.min_escolhas || 0)) return `Escolha pelo menos ${g.min_escolhas} opcao em ${g.nome}.`;
      if(count > Number(g.max_escolhas || 99)) return `Escolha no maximo ${g.max_escolhas} em ${g.nome}.`;
    }
    if(err) return err;
    return '';
  }

  function save(){
    const problem = validate();
    if(problem){ setErr(problem); return; }
    const opts = (prato.grupos_opcionais || []).flatMap(g => (g.opcionais || [])
      .filter(o => (selected[g.id] || []).includes(o.id))
      .map(o => ({...o, grupo_id:g.id, grupo_nome:g.nome})));
    onSaved({ uid:preset?.uid || makeId(), prato, tamanho, opcionais:opts, quantidade:qty, observacoes:obs, preco_unitario:unit });
  }

  return (
    <div className="modal-back">
      <div className="sheet full">
        <div className="sheet-head"><button className="icon-btn" onClick={onClose}>x</button><b className="sheet-title">{prato.nome}</b><button className="mini-btn" onClick={startDeliveryEstimate}>Tempo</button></div>
        <div className="sheet-scroll">
          <Photo url={prato.foto_url} name={prato.nome} className="detail-photo" />
          <div className="detail-body">
            <h2 className="font-serif">{prato.nome}</h2>
            <div className="detail-desc">{prato.descricao_completa || prato.descricao_curta || 'Prato feito na cozinha do Dom Leonardo.'}</div>
            <div className="price">{prato.preco_promocional && <span className="old-price">{fmtR(prato.preco_base)}</span>}a partir de {fmtR(minPrice(prato))}</div>
          </div>
          {(prato.tamanhos || []).length > 0 && <div className="group">
            <div className="group-title"><div><h3>Tamanho</h3><small>Escolha 1 opcao</small></div><span className="req">OBRIGATORIO</span></div>
            {prato.tamanhos.map(t => <div className="choice" key={t.id} onClick={() => setTamanho(t)}>
              <div><div className="choice-title">{t.nome}</div>{t.peso_g && <div className="choice-desc">{t.peso_g}g</div>}<div className="choice-price">{Number(t.preco_delta) > 0 ? `+ ${fmtR(t.preco_delta)}` : 'incluido'}</div></div>
              <span className={`radio ${tamanho?.id === t.id ? 'active' : ''}`} />
            </div>)}
          </div>}
          {(prato.grupos_opcionais || []).map(g => <div className="group" key={g.id}>
            <div className="group-title">
              <div><h3>{g.nome}</h3><small>Escolha {g.min_escolhas ? `de ${g.min_escolhas} a ` : 'ate '}{g.max_escolhas} opcao(oes)</small></div>
              {Number(g.min_escolhas) > 0 && <span className="req">OBRIGATORIO</span>}
            </div>
            {(g.opcionais || []).map(o => {
              const active = (selected[g.id] || []).includes(o.id);
              return <div className="choice option-line" key={o.id} onClick={() => toggle(g,o)}>
                <Photo url={o.foto_url} name={o.nome} className="option-photo"/>
                <div><div className="choice-title">{o.nome}</div><div className="choice-desc">{o.descricao}</div><div className="choice-price">{Number(o.preco_delta) > 0 ? `+ ${fmtR(o.preco_delta)}` : 'sem acrescimo'}</div></div>
                <button className={`plus ${active ? 'active' : ''}`}>{active ? '✓' : '+'}</button>
              </div>;
            })}
          </div>)}
          <div className="form"><label>Observacao do item</label><textarea value={obs} onChange={e => setObs(e.target.value)} placeholder="Ex: sem cebola, capricha no parmesao..." /></div>
          {err && <div className="warn">{err}</div>}
        </div>
        <div className="detail-footer">
          <div className="stepper"><button onClick={() => setQty(Math.max(1,qty-1))}>-</button><span>{qty}</span><button onClick={() => setQty(qty+1)}>+</button></div>
          <button className="primary-btn" disabled={pricing} onClick={save}>{pricing ? 'Calculando...' : `Adicionar - ${fmtR(unit * qty)}`}</button>
        </div>
      </div>
    </div>
  );
}

function CartSheet({ cart, setCart, subtotal, bebidas, onClose, onEdit, onCheckout }){
  return (
    <div className="modal-back">
      <div className="sheet full">
        <div className="sheet-head"><button className="icon-btn" onClick={onClose}>x</button><b>Sacola do Dom</b><button className="danger" onClick={() => setCart([])}>Limpar</button></div>
        <div className="sheet-scroll">
          <div className="cart-list">
            {!cart.length && <div className="empty">Sua sacola esta vazia.</div>}
            {cart.map((it,i) => <div className="cart-item" key={it.uid}>
              <Photo url={it.prato.foto_url} name={it.prato.nome} className="cart-thumb"/>
              <div>
                <div className="cart-title">{it.prato.nome}</div>
                <div className="cart-desc">{it.prato.descricao_curta}</div>
                <div className="tags">
                  {it.tamanho && <span className="tag">{it.tamanho.nome}</span>}
                  {it.opcionais.map(o => <span className="tag" key={o.id}>{o.nome}</span>)}
                  {it.observacoes && <span className="tag">{it.observacoes}</span>}
                </div>
                <div className="cart-actions">
                  <button className="danger" onClick={() => onEdit(it.prato,i)}>Editar</button>
                  <div className="stepper" style={{width:96,height:36}}><button onClick={() => setCart(prev => prev.map((x,idx) => idx === i ? {...x,quantidade:Math.max(1,x.quantidade-1)} : x))}>-</button><span>{it.quantidade}</span><button onClick={() => setCart(prev => prev.map((x,idx) => idx === i ? {...x,quantidade:x.quantidade+1} : x))}>+</button></div>
                  <button className="danger" onClick={() => setCart(prev => prev.filter((_,idx) => idx !== i))}>Remover</button>
                </div>
                <div className="price" style={{marginTop:8}}>{fmtR(itemTotal(it))}</div>
              </div>
            </div>)}
          </div>
        </div>
        <div className="cart-footer">
          <div><div style={{color:'var(--muted)',fontSize:12}}>Total da sacola</div><div className="price" style={{fontSize:20}}>{fmtR(subtotal)}</div></div>
          <button className="primary-btn" disabled={!cart.length} onClick={onCheckout}>Finalizar pedido</button>
        </div>
      </div>
    </div>
  );
}

function ChatSheet({ messages, typing, input, setInput, send, onClose, msgEndRef, startDeliveryEstimate }){
  return (
    <div className="modal-back chat-back">
      <div className="sheet chat-sheet">
        <div className="sheet-head">
          <div style={{width:42,height:42}}><MarcoSticker /></div>
          <div style={{flex:1}}><b>Marco</b><div style={{fontSize:12,color:'var(--muted)'}}>Garçom do Dom Leonardo</div></div>
          <button className="icon-btn" onClick={onClose}>x</button>
        </div>
        <div className="messages">
          {!messages.length && <div className="msg marco"><small>Marco</small>Me chama por aqui. Eu ajudo sem tirar você do cardápio.</div>}
          {messages.map(m => <div className={`msg ${m.autor}`} key={m.id}>{m.autor === 'marco' && <small>Marco</small>}{m.texto}</div>)}
          {typing && <div className="typing"><span/><span/><span/></div>}
          <div ref={msgEndRef} />
        </div>
        <div className="chat-input">
          <button onClick={startDeliveryEstimate}>⏱</button>
          <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if(e.key === 'Enter') send(); }} placeholder="Mensagem para o Marco..." />
          <button className="send" onClick={send}>➤</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
