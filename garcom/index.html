<style>
  :root {
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
    --gold: #d4af37;
    --gold-dim: #8a6f1f;
    --bg: #0a0908;
    --bg-elev: #15120e;
    --bg-card: #1c1814;
    --line: rgba(212, 175, 55, 0.18);
    --text: #f3ece0;
    --text-dim: #8d8579;
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    overscroll-behavior-y: contain;
    min-height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }
  input, textarea, button, select { font-size: 16px; }
  button { background: none; border: 0; color: inherit; padding: 0; cursor: pointer; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* Title font */
  .font-serif { font-family: "Cormorant Garamond", "Playfair Display", Georgia, serif; }

  /* Sticker do Marco - ronda */
  .marco-sticker {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 24px);
    right: 16px;
    width: 64px;
    height: 64px;
    z-index: 50;
    cursor: pointer;
    filter: drop-shadow(0 4px 18px rgba(212,175,55,0.25));
    transition: transform 600ms cubic-bezier(.34,1.56,.64,1), opacity 600ms;
    will-change: transform, opacity;
  }
  .marco-sticker.hidden { transform: translateY(120px); opacity: 0; }
  .marco-sticker.peek { transform: translateY(0); opacity: 1; }
  .marco-sticker.attention { animation: balanca 1.6s ease-in-out infinite; }
  @keyframes balanca {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50% { transform: rotate(3deg) translateY(-2px); }
  }
  .marco-sticker .halo {
    position: absolute; inset: -6px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,0.28) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 400ms;
  }
  .marco-sticker.attention .halo { opacity: 1; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.08); }
  }

  /* Balão de fala */
  .balao {
    position: fixed;
    right: 88px;
    bottom: calc(var(--safe-bottom) + 30px);
    max-width: 64vw;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 18px 18px 4px 18px;
    font-size: 14px;
    line-height: 1.35;
    z-index: 51;
    box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    transform: translateY(8px);
    opacity: 0;
    pointer-events: none;
    transition: transform 320ms cubic-bezier(.4,0,.2,1), opacity 320ms;
  }
  .balao.shown {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .balao::after {
    content: '';
    position: absolute;
    right: -6px;
    bottom: 12px;
    width: 12px; height: 12px;
    background: var(--bg-elev);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    transform: rotate(-45deg);
  }

  /* Bottom sheet do chat */
  .bottom-sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px) saturate(120%);
    -webkit-backdrop-filter: blur(6px) saturate(120%);
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    transition: opacity 280ms;
  }
  .bottom-sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  .bottom-sheet {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    height: 85vh;
    background: var(--bg-elev);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
    z-index: 90;
    transform: translateY(100%);
    transition: transform 360ms cubic-bezier(.25,.8,.25,1);
    display: flex;
    flex-direction: column;
    padding-bottom: var(--safe-bottom);
  }
  .bottom-sheet.open { transform: translateY(0); }
  .bottom-sheet .grip {
    width: 44px; height: 4px;
    background: rgba(255,255,255,0.18);
    border-radius: 2px;
    margin: 10px auto 6px;
  }
  .bottom-sheet header {
    padding: 8px 18px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bottom-sheet .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.4;
  }
  .msg.marco {
    background: var(--bg-card);
    border: 1px solid var(--line);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.cliente {
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    color: #1a1305;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    font-weight: 600;
  }
  .msg-typing {
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 14px 18px;
    border-radius: 16px;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    display: flex;
    gap: 4px;
  }
  .msg-typing span {
    width: 6px; height: 6px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: typing 1.4s infinite ease-in-out;
  }
  .msg-typing span:nth-child(2) { animation-delay: 0.18s; }
  .msg-typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .bottom-sheet footer {
    padding: 12px 16px calc(12px + var(--safe-bottom));
    border-top: 1px solid var(--line);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .input-msg {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 10px 16px;
    color: var(--text);
    outline: none;
    min-height: 44px;
  }
  .input-msg:focus { border-color: var(--gold-dim); }
  .btn-icon {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    transition: transform 120ms, background 120ms;
  }
  .btn-icon:active { transform: scale(0.92); background: var(--bg-elev); }
  .btn-send {
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    border-color: var(--gold-dim);
    color: #1a1305;
  }

  /* Long-press action menu */
  .quick-menu {
    position: fixed;
    right: 16px;
    bottom: calc(var(--safe-bottom) + 100px);
    z-index: 70;
    display: flex;
    flex-direction: column-reverse;
    gap: 8px;
    transform: scale(0.85) translateY(8px);
    transform-origin: bottom right;
    opacity: 0;
    pointer-events: none;
    transition: opacity 220ms, transform 220ms cubic-bezier(.34,1.56,.64,1);
  }
  .quick-menu.open { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }
  .quick-menu button {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    padding: 10px 16px;
    border-radius: 22px;
    font-size: 14px;
    min-height: 44px;
    color: var(--text);
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .quick-menu button:active { background: var(--bg-card); }

  /* Cartões de prato */
  .prato-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    transition: transform 200ms;
  }
  .prato-card:active { transform: scale(0.985); }
  .prato-card img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    display: block;
  }
  .prato-badge {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    color: var(--gold);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Léo PIP (futuro) */
  .leo-pip {
    position: fixed;
    top: calc(var(--safe-top) + 12px);
    right: 12px;
    width: 80px;
    height: 80px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 16px;
    z-index: 60;
    display: grid;
    place-items: center;
    transform: translateY(-110%);
    transition: transform 400ms cubic-bezier(.34,1.56,.64,1);
  }
  .leo-pip.shown { transform: translateY(0); }
</style>
</head>

// Frases de RONDA/IDLE (UI local, antes do chat abrir)
const FALAS_RONDA = ['Passando...', 'Tô por aqui.', 'Tudo certo?', 'Tô de olho 😉'];
const FALAS_IDLE_45S = [
  'Tá tudo certo aí?',
  'Se ficar na dúvida, é só assobiar 😉',
  'Se quiser uma sugestão, é só pedir.',
  'Posso te contar o que tá saindo melhor hoje.'
];

// ============================================================================
// SUPABASE / EDGE FUNCTION
// ============================================================================
const SUPABASE_URL = 'https://jewamqbdonudiapxbzay.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_VeJTrMvtl5PAEvvc6R0CKA_nzjxQiAY';
const GARCOM_RESPONDER_URL = SUPABASE_URL + '/functions/v1/garcom-responder';

function deviceId() {
  let id = localStorage.getItem('garcom_device_id');
  if (!id) {
    id = 'dev_' + crypto.randomUUID();
    localStorage.setItem('garcom_device_id', id);
  }
  return id;
}

function getSessaoId() { return localStorage.getItem('garcom_sessao_id'); }
function setSessaoId(id) { if (id) localStorage.setItem('garcom_sessao_id', id); }
function limparSessao() { localStorage.removeItem('garcom_sessao_id'); }

async function chamarMarco(mensagem) {
  const r = await fetch(GARCOM_RESPONDER_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    },
    body: JSON.stringify({
      sessao_id: getSessaoId(),
      mensagem,
      device_id: deviceId(),
    }),
  });
  if (!r.ok) {
    const t = await r.text();
    throw new Error(t || ('HTTP ' + r.status));
  }
  const data = await r.json();
  if (data?.sessao_id) setSessaoId(data.sessao_id);
  return data;
}

function sortear(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function vibrate(ms) { try { navigator.vibrate?.(ms); } catch (_) {} }
function fmtBRL(v) { return 'R$ ' + v.toFixed(2).replace('.', ','); }

// ============================================================================
// APP
// ============================================================================
function App() {
  const [garcomState, setGarcomState] = useState('hidden'); // hidden | peek | attention
  const [balaoTexto, setBalaoTexto] = useState(null);
  const [chatOpen, setChatOpen] = useState(false);
  const [quickMenu, setQuickMenu] = useState(false);
  const [mensagens, setMensagens] = useState([]);
  const [digitando, setDigitando] = useState(false);
  const [muted, setMuted] = useState(false);
  const [leoVisivel, setLeoVisivel] = useState(false);
  const [input, setInput] = useState('');

  const lpTimer = useRef(null);
  const balaoTimer = useRef(null);
  const rondaTimer = useRef(null);
  const idleTimer = useRef(null);
  const ultimaInteracao = useRef(Date.now());

  // Ronda do Marco - aparece a cada 40-90s
  useEffect(() => {
    const agendarRonda = () => {
      const delay = 40000 + Math.random() * 50000;
      rondaTimer.current = setTimeout(() => {
        if (!chatOpen) {
          setGarcomState('peek');
          const fala = sortear(FALAS_RONDA);
          setBalaoTexto(fala);
          // Some depois de 4-5s
          setTimeout(() => setBalaoTexto(null), 4500);
          setTimeout(() => {
            if (!chatOpen) setGarcomState('attention');
          }, 5000);
        }
        agendarRonda();
      }, delay);
    };
    // Primeira aparição em 3s
    setTimeout(() => {
      setGarcomState('peek');
      const saudacao = sortear(SAUDACOES);
      setBalaoTexto(saudacao);
      setTimeout(() => setBalaoTexto(null), 5000);
      setTimeout(() => setGarcomState('attention'), 5500);
      agendarRonda();
    }, 2500);
    return () => clearTimeout(rondaTimer.current);
  }, [chatOpen]);

  // Idle de 45s
  useEffect(() => {
    const checkIdle = () => {
      idleTimer.current = setTimeout(() => {
        if (!chatOpen && Date.now() - ultimaInteracao.current > 45000) {
          const fala = sortear(FALAS_IDLE_45S);
          setBalaoTexto(fala);
          setTimeout(() => setBalaoTexto(null), 5000);
        }
        checkIdle();
      }, 50000);
    };
    checkIdle();
    return () => clearTimeout(idleTimer.current);
  }, [chatOpen]);

  // Reseta idle ao tocar a tela
  useEffect(() => {
    const reset = () => { ultimaInteracao.current = Date.now(); };
    window.addEventListener('touchstart', reset, { passive: true });
    window.addEventListener('scroll', reset, { passive: true });
    return () => {
      window.removeEventListener('touchstart', reset);
      window.removeEventListener('scroll', reset);
    };
  }, []);

  // Tap no Marco - abre chat
  const tapMarco = () => {
    vibrate(15);
    if (quickMenu) { setQuickMenu(false); return; }
    abrirChat();
  };

  const abrirChat = async () => {
    setChatOpen(true);
    setBalaoTexto(null);
    setGarcomState('peek');
    // Primeira abertura → chama o Marco de verdade com uma saudação implícita
    if (mensagens.length === 0) {
      setDigitando(true);
      try {
        const resp = await chamarMarco('(cliente acabou de abrir o chat, sauda ele)');
        setDigitando(false);
        const f = resp?.falas?.[0];
        if (f) {
          setMensagens([{ id: Date.now(), autor: 'marco', texto: f.texto }]);
        }
      } catch (err) {
        setDigitando(false);
        setMensagens([{ id: Date.now(), autor: 'marco', texto: 'Eita, o salão tá com problema técnico. Tenta de novo daqui a pouco?' }]);
        console.error(err);
      }
    }
  };

  const fecharChat = () => {
    setChatOpen(false);
    setQuickMenu(false);
  };

  // Long-press no Marco
  const onPressStart = () => {
    lpTimer.current = setTimeout(() => {
      vibrate(40);
      setQuickMenu(true);
    }, 500);
  };
  const onPressEnd = () => {
    clearTimeout(lpTimer.current);
  };

  const assobiar = async () => {
    vibrate([30, 60, 30]);
    setQuickMenu(false);
    setChatOpen(true);
    setBalaoTexto(null);
    setDigitando(true);
    try {
      const resp = await chamarMarco('(o cliente acabou de assobiar pra te chamar, atende ele de pronto)');
      setDigitando(false);
      const f = resp?.falas?.[0];
      if (f) setMensagens(m => [...m, { id: Date.now(), autor: 'marco', texto: f.texto }]);
    } catch (err) {
      setDigitando(false);
      console.error(err);
    }
  };

  const enviarMsg = async () => {
    if (!input.trim()) return;
    const msg = input.trim();
    setMensagens(m => [...m, { id: Date.now(), autor: 'cliente', texto: msg }]);
    setInput('');
    setDigitando(true);
    try {
      const resp = await chamarMarco(msg);
      const f = resp?.falas?.[0];
      // Respeita o delay humano calculado pelo servidor
      const delay = Math.max(400, Math.min(f?.delay_ms ?? 1500, 5000));
      setTimeout(() => {
        setDigitando(false);
        if (f) setMensagens(m => [...m, { id: Date.now(), autor: 'marco', texto: f.texto }]);
      }, delay);
    } catch (err) {
      setDigitando(false);
      setMensagens(m => [...m, {
        id: Date.now(),
        autor: 'marco',
        texto: 'Ops, deu uma travada aqui. Manda de novo, por favor.'
      }]);
      console.error(err);
    }
  };

  // Long-press num prato → fala do Marco
  const longPressPrato = (prato) => {
    vibrate(30);
    setBalaoTexto(`Boa escolha! ${prato.nome.split(' ').slice(0,2).join(' ')} é dos meus favoritos.`);
    setTimeout(() => setBalaoTexto(null), 3500);
  };

  return (
    <div className="min-h-dvh">
      {/* Cabeçalho */}
      <header className="px-5 pt-4 pb-3 border-b border-[var(--line)]">
        <div className="flex items-center justify-between">
          <div>
            <div className="text-xs uppercase tracking-[0.18em] text-[var(--text-dim)]">Trattoria</div>
            <h1 className="font-serif text-3xl mt-0.5" style={{color:'var(--gold)'}}>Dom Leonardo</h1>
          </div>
          <div className="text-right text-xs text-[var(--text-dim)]">
            <div>Aberto agora</div>
            <div className="text-[var(--gold)] font-semibold">⏱ 35 — 45 min</div>
          </div>
        </div>
      </header>

      {/* Apresentação */}
      <section className="px-5 py-5">
        <p className="text-sm leading-relaxed text-[var(--text-dim)]">
          Gastronomia italiana feita com mão e história. Cardápio enxuto, ingredientes vivos.
        </p>
      </section>

      {/* Cardápio */}
      <section className="px-5 pb-32">
        <h2 className="font-serif text-xl mb-3" style={{color:'var(--gold)'}}>Pratos</h2>
        <div className="grid gap-4">
          {PRATOS.map(p => (
            <article
              key={p.id}
              className="prato-card relative"
              onContextMenu={(e) => { e.preventDefault(); longPressPrato(p); }}
              onTouchStart={() => { lpTimer.current = setTimeout(() => longPressPrato(p), 500); }}
              onTouchEnd={() => clearTimeout(lpTimer.current)}
            >
              <div className="relative">
                <img src={p.foto} alt={p.nome} loading="lazy" />
                {p.badge && <span className="prato-badge">{p.badge}</span>}
              </div>
              <div className="p-4">
                <h3 className="font-serif text-lg leading-tight">{p.nome}</h3>
                {p.descricao && (
                  <p className="text-[13px] text-[var(--text-dim)] mt-1.5 leading-relaxed">
                    {p.descricao}
                  </p>
                )}
                <div className="mt-3 flex items-center justify-between">
                  <span className="text-lg font-semibold" style={{color:'var(--gold)'}}>{fmtBRL(p.preco)}</span>
                  <button
                    className="px-4 py-2 rounded-full text-sm font-semibold"
                    style={{background:'linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%)', color:'#1a1305', minHeight:'44px'}}
                    onClick={() => {
                      vibrate(20);
                      setBalaoTexto(`Anotado: ${p.nome.split(' ').slice(0,2).join(' ')} ✍️`);
                      setTimeout(() => setBalaoTexto(null), 2500);
                    }}
                  >
                    Adicionar
                  </button>
                </div>
              </div>
            </article>
          ))}
        </div>
      </section>

      {/* Léo PIP (escondido por padrão, futuro: aparece após pedido) */}
      <div className={`leo-pip ${leoVisivel ? 'shown' : ''}`}>
        <div style={{width: '56px', height: '56px'}}><LeoSticker /></div>
      </div>

      {/* Marco sticker */}
      <button
        className={`marco-sticker ${garcomState}`}
        onClick={tapMarco}
        onTouchStart={onPressStart}
        onTouchEnd={onPressEnd}
        onMouseDown={onPressStart}
        onMouseUp={onPressEnd}
        onMouseLeave={onPressEnd}
        aria-label="Chamar o Marco"
      >
        <span className="halo"></span>
        <MarcoSticker />
      </button>

      {/* Balão de fala */}
      <div className={`balao ${balaoTexto && !chatOpen ? 'shown' : ''}`}>
        {balaoTexto}
      </div>

      {/* Quick menu (long-press) */}
      <div className={`quick-menu ${quickMenu ? 'open' : ''}`}>
        <button onClick={assobiar}>🎵 Assobiar</button>
        <button onClick={() => { setMuted(m => !m); setQuickMenu(false); }}>
          {muted ? '🔊 Ativar som' : '🔇 Mutar som'}
        </button>
        <button onClick={() => { setQuickMenu(false); abrirChat(); }}>💬 Abrir chat</button>
      </div>

      {/* Backdrop + Bottom sheet */}
      <div className={`bottom-sheet-backdrop ${chatOpen ? 'open' : ''}`} onClick={fecharChat}></div>
      <div className={`bottom-sheet ${chatOpen ? 'open' : ''}`}>
        <div className="grip" />
        <header>
          <div style={{width:'40px', height:'40px'}}><MarcoSticker /></div>
          <div className="flex-1">
            <div className="font-serif text-lg leading-none" style={{color:'var(--gold)'}}>Marco</div>
            <div className="text-xs text-[var(--text-dim)] mt-0.5">Garçom · online</div>
          </div>
          <button className="btn-icon" onClick={fecharChat} aria-label="Fechar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M6 6l12 12M6 18L18 6"/></svg>
          </button>
        </header>

        <div className="messages">
          {mensagens.map(m => (
            <div key={m.id} className={`msg ${m.autor}`}>{m.texto}</div>
          ))}
          {digitando && (
            <div className="msg-typing">
              <span></span><span></span><span></span>
            </div>
          )}
        </div>

        <footer>
          <button className="btn-icon" onClick={assobiar} aria-label="Assobiar">
            <span style={{fontSize:'18px'}}>🎵</span>
          </button>
          <input
            className="input-msg"
            placeholder="Mensagem para o Marco..."
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && enviarMsg()}
          />
          <button className="btn-icon btn-send" onClick={enviarMsg} aria-label="Enviar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
          </button>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  // Service Worker (PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
