<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0908" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Dom Leonardo" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="manifest.json" />
<title>Dom Leonardo - Cardapio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
    --gold: #d4af37;
    --gold-dim: #8a6f1f;
    --bg: #0a0908;
    --bg-elev: #15120e;
    --bg-card: #1c1814;
    --line: rgba(212, 175, 55, 0.18);
    --text: #f3ece0;
    --text-dim: #8d8579;
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    overscroll-behavior-y: contain;
    min-height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }
  input, textarea, button, select { font-size: 16px; }
  button { background: none; border: 0; color: inherit; padding: 0; cursor: pointer; }
  #root { width: 100%; max-width: 100vw; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* Title font */
  .font-serif { font-family: "Cormorant Garamond", "Playfair Display", Georgia, serif; }

  /* Sticker do Marco - ronda */
  .marco-sticker {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 24px);
    right: 16px;
    width: 64px;
    height: 64px;
    z-index: 50;
    cursor: pointer;
    filter: drop-shadow(0 4px 18px rgba(212,175,55,0.25));
    transition: transform 600ms cubic-bezier(.34,1.56,.64,1), opacity 600ms;
    will-change: transform, opacity;
  }
  .marco-sticker.hidden { transform: translateY(120px); opacity: 0; }
  .marco-sticker.peek { transform: translateY(0); opacity: 1; }
  .marco-sticker.attention { animation: balanca 1.6s ease-in-out infinite; }
  @keyframes balanca {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50% { transform: rotate(3deg) translateY(-2px); }
  }
  .marco-sticker .halo {
    position: absolute; inset: -6px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,0.28) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 400ms;
  }
  /* Badge do carrinho sobre o Marco */
  .marco-cart-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border-radius: 11px;
    background: linear-gradient(180deg, #e7c66d 0%, #a47e1e 100%);
    color: #1a1305;
    font-size: 12px;
    font-weight: 700;
    display: grid;
    place-items: center;
    border: 2px solid var(--bg);
    z-index: 1;
    transform: scale(0);
    transition: transform 240ms cubic-bezier(.34,1.56,.64,1);
  }
  .marco-cart-badge.show { transform: scale(1); }
  .marco-cart-badge.pulse { animation: badgePulse 700ms ease-out; }
  @keyframes badgePulse {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .marco-sticker.attention .halo { opacity: 1; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.08); }
  }

  /* Balao de fala */
  .balao {
    position: fixed;
    right: 88px;
    bottom: calc(var(--safe-bottom) + 30px);
    max-width: 64vw;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 18px 18px 4px 18px;
    font-size: 14px;
    line-height: 1.35;
    z-index: 51;
    box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    transform: translateY(8px);
    opacity: 0;
    pointer-events: none;
    transition: transform 320ms cubic-bezier(.4,0,.2,1), opacity 320ms;
  }
  .balao.shown {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .balao::after {
    content: '';
    position: absolute;
    right: -6px;
    bottom: 12px;
    width: 12px; height: 12px;
    background: var(--bg-elev);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    transform: rotate(-45deg);
  }

  /* Bottom sheet do chat */
  .bottom-sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px) saturate(120%);
    -webkit-backdrop-filter: blur(6px) saturate(120%);
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    transition: opacity 280ms;
  }
  .bottom-sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  .bottom-sheet {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    height: 85vh;
    background: var(--bg-elev);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
    z-index: 90;
    transform: translateY(100%);
    transition: transform 360ms cubic-bezier(.25,.8,.25,1);
    display: flex;
    flex-direction: column;
    padding-bottom: var(--safe-bottom);
  }
  .bottom-sheet.open { transform: translateY(0); }
  .bottom-sheet .grip {
    width: 44px; height: 4px;
    background: rgba(255,255,255,0.18);
    border-radius: 2px;
    margin: 10px auto 6px;
  }
  .bottom-sheet header {
    padding: 8px 18px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bottom-sheet .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.4;
  }
  .msg.marco {
    background: var(--bg-card);
    border: 1px solid var(--line);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.cliente {
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    color: #1a1305;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    font-weight: 600;
  }
  .msg-typing {
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 14px 18px;
    border-radius: 16px;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    display: flex;
    gap: 4px;
  }
  .msg-typing span {
    width: 6px; height: 6px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: typing 1.4s infinite ease-in-out;
  }
  .msg-typing span:nth-child(2) { animation-delay: 0.18s; }
  .msg-typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Carrinho pill (dentro do bottom sheet, abaixo do header) */
  .cart-pill {
    margin: 8px 14px;
    padding: 10px 14px;
    background: linear-gradient(180deg, rgba(212,175,55,0.18) 0%, rgba(212,175,55,0.08) 100%);
    border: 1px solid rgba(212,175,55,0.45);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 200ms;
    min-height: 48px;
  }
  .cart-pill:active { transform: scale(0.98); }
  .cart-pill.pulse { animation: cartPulse 700ms ease-out; }
  @keyframes cartPulse {
    0%   { transform: scale(1); box-shadow: 0 0 0 0 rgba(212,175,55,0.6); }
    40%  { transform: scale(1.04); box-shadow: 0 0 0 10px rgba(212,175,55,0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212,175,55,0); }
  }
  .cart-left { display: flex; align-items: center; gap: 10px; }
  .cart-emoji { font-size: 22px; line-height: 1; }
  .cart-count {
    font-size: 13px;
    color: var(--text);
    line-height: 1.15;
  }
  .cart-count strong { color: var(--gold); font-weight: 700; }
  .cart-total {
    font-weight: 700;
    color: var(--gold);
    font-size: 16px;
  }

  /* Drawer expandido do carrinho (dentro do bottom sheet) */
  .cart-drawer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 320ms cubic-bezier(.4,0,.2,1);
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  .cart-drawer.open { max-height: 50vh; overflow-y: auto; }
  .cart-item {
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .cart-item:last-child { border-bottom: none; }
  .cart-item .qty {
    flex: 0 0 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--gold);
    color: #1a1305;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 13px;
  }
  .cart-item .info { flex: 1; }
  .cart-item .info .nome { font-size: 14px; font-weight: 600; }
  .cart-item .info .obs { font-size: 12px; color: var(--text-dim); margin-top: 2px; font-style: italic; }
  .cart-item .preco { font-size: 14px; font-weight: 600; color: var(--gold); }
  .cart-empty {
    text-align: center;
    padding: 24px 16px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .checkout-btn {
    width: calc(100% - 28px);
    margin: 10px 14px 14px;
    min-height: 46px;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    color: #1a1305;
    font-weight: 800;
    box-shadow: 0 10px 22px rgba(212,175,55,0.14);
  }

  .btn-icon {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    transition: transform 120ms, background 120ms;
  }
  .btn-icon:active { transform: scale(0.92); background: var(--bg-elev); }
  /* Cartoes de prato */
  .prato-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    transition: transform 200ms;
  }
  .prato-card:active { transform: scale(0.985); }
  .prato-card img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    display: block;
  }
  .prato-badge {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    color: var(--gold);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .prato-helper-block {
    margin-top: 8px;
    display: grid;
    gap: 5px;
  }
  .prato-microcopy {
    color: rgba(235, 229, 216, 0.64);
    font-size: 10.5px;
    line-height: 1.25;
    letter-spacing: 0.01em;
  }
  .prato-sizecopy {
    color: rgba(212, 175, 55, 0.82);
    font-size: 11px;
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: 0.015em;
  }
  .prato-action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .prato-soft-btn {
    background: #0a0908;
    border: 1px solid rgba(212,175,55,0.18);
    color: rgba(235, 229, 216, 0.82);
    border-radius: 999px;
    padding: 7px 11px;
    min-height: 32px;
    font-size: 10.5px;
    font-weight: 850;
    line-height: 1;
    box-shadow: 0 3px 12px rgba(0,0,0,0.24);
  }
  .prato-soft-btn:active {
    transform: scale(0.97);
    border-color: rgba(212,175,55,0.38);
  }

  .prato-card.compact {
    display: grid;
    grid-template-columns: 1fr 112px;
    gap: 10px;
    padding: 11px;
    cursor: pointer;
  }
  .prato-card.compact img {
    width: 112px;
    height: 112px;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
  }
  .prato-card.compact .prato-badge { top: 8px; left: 8px; font-size: 10px; }
  .prato-card.compact .prato-copy {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2px 0;
  }
  .prato-card.compact .prato-title { font-size: 16px; line-height: 1.08; }
  .prato-card.compact .prato-desc {
    color: var(--text-dim);
    font-size: 11.5px;
    line-height: 1.28;
    margin-top: 5px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .prato-card.compact .prato-price {
    color: var(--gold);
    font-size: 15px;
    font-weight: 850;
  }
  .prato-card.compact .prato-cta {
    min-height: 38px;
    padding: 0 14px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    color: #1a1305;
    font-size: 12px;
    font-weight: 900;
  }

  .dish-backdrop,
  .bag-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.58);
    backdrop-filter: blur(7px) saturate(120%);
    -webkit-backdrop-filter: blur(7px) saturate(120%);
    opacity: 0;
    pointer-events: none;
    z-index: 95;
    transition: opacity 260ms ease;
  }
  .dish-backdrop.open,
  .bag-backdrop.open { opacity: 1; pointer-events: auto; }

  .dish-sheet,
  .bag-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 92vh;
    background: var(--bg-elev);
    color: var(--text);
    border: 1px solid var(--line);
    border-bottom: 0;
    border-radius: 24px 24px 0 0;
    z-index: 96;
    transform: translateY(105%);
    transition: transform 360ms cubic-bezier(.25,.8,.25,1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 -18px 44px rgba(0,0,0,0.7);
  }
  .dish-sheet.open,
  .bag-sheet.open { transform: translateY(0); }
  .dish-scroll,
  .bag-scroll {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 130px;
  }
  .dish-hero { position: relative; min-height: 210px; background: #070605; }
  .dish-hero img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
    opacity: 0.92;
  }
  .dish-hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(10,9,8,.34) 70%, var(--bg-elev) 100%);
    pointer-events: none;
  }
  .dish-close,
  .bag-close {
    position: absolute;
    top: 12px;
    left: 14px;
    width: 42px;
    height: 42px;
    border-radius: 999px;
    background: rgba(0,0,0,0.56);
    border: 1px solid rgba(255,255,255,0.14);
    display: grid;
    place-items: center;
    z-index: 2;
  }
  .dish-store-pill {
    position: absolute;
    left: 18px;
    bottom: 18px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: calc(100% - 36px);
    padding: 8px 13px 8px 9px;
    background: rgba(21,18,14,0.88);
    border: 1px solid rgba(212,175,55,0.24);
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.32);
  }
  .dish-store-logo,
  .bag-logo {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--gold), var(--gold-dim));
    color: #1a1305;
    display: grid;
    place-items: center;
    font-weight: 950;
  }
  .dish-info {
    padding: 20px 20px 14px;
    border-bottom: 1px solid rgba(212,175,55,0.10);
  }
  .dish-info h2 {
    font-size: 24px;
    line-height: 1.02;
    margin: 0;
    color: var(--text);
  }
  .dish-info p {
    margin: 10px 0 0;
    color: rgba(243,236,224,0.72);
    font-size: 13px;
    line-height: 1.35;
  }
  .dish-start-price {
    margin-top: 18px;
    color: var(--gold);
    font-size: 18px;
    font-weight: 850;
  }
  .choice-block { border-top: 8px solid rgba(0,0,0,0.18); }
  .choice-head {
    padding: 16px 20px;
    background: rgba(255,255,255,0.035);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .choice-title {
    font-size: 19px;
    color: rgba(243,236,224,0.82);
    font-weight: 850;
  }
  .choice-subtitle {
    margin-top: 3px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .choice-required {
    flex: 0 0 auto;
    background: #050505;
    border: 1px solid rgba(255,255,255,0.08);
    color: #fff;
    border-radius: 8px;
    padding: 7px 9px;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.04em;
  }
  .choice-row {
    min-height: 68px;
    padding: 13px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-top: 1px solid rgba(212,175,55,0.10);
  }
  .choice-main { flex: 1; min-width: 0; }
  .choice-name {
    font-size: 14px;
    line-height: 1.18;
    color: var(--text);
    font-weight: 750;
  }
  .choice-price,
  .choice-desc {
    margin-top: 5px;
    color: var(--text-dim);
    font-size: 11.5px;
    line-height: 1.25;
  }
  .choice-dot {
    width: 28px;
    height: 28px;
    border-radius: 999px;
    border: 2px solid rgba(243,236,224,0.14);
    background: rgba(255,255,255,0.05);
    display: grid;
    place-items: center;
  }
  .choice-dot.active {
    border-color: var(--gold);
    background: rgba(212,175,55,0.14);
  }
  .choice-dot.active::after {
    content: '';
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--gold);
  }
  .obs-input {
    width: 100%;
    min-height: 86px;
    border-radius: 16px;
    resize: none;
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 12px 14px;
    color: var(--text);
    outline: none;
  }
  .obs-input:focus { border-color: var(--gold-dim); }
  .help-size-btn {
    margin: 0 20px 14px;
    min-height: 38px;
    padding: 0 13px;
    border-radius: 999px;
    background: #070605;
    border: 1px solid rgba(212,175,55,0.20);
    color: rgba(243,236,224,0.82);
    font-size: 12px;
    font-weight: 850;
  }
  .option-thumb {
    width: 58px;
    height: 58px;
    border-radius: 14px;
    object-fit: cover;
    flex: 0 0 auto;
    background: rgba(255,255,255,0.05);
  }
  .option-thumb.fallback {
    display: grid;
    place-items: center start;
    color: var(--gold);
    font-size: 10px;
    font-weight: 950;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid rgba(212,175,55,0.14);
    background:
      radial-gradient(circle at 30% 20%, rgba(212,175,55,0.20), transparent 42%),
      rgba(0,0,0,0.22);
  }
  .stepper-small,
  .qty-stepper {
    display: inline-flex;
    align-items: center;
    border: 1px solid rgba(212,175,55,0.16);
    background: rgba(255,255,255,0.035);
    border-radius: 14px;
    overflow: hidden;
  }
  .stepper-small button,
  .qty-stepper button {
    width: 38px;
    height: 38px;
    color: var(--gold);
    font-size: 24px;
    font-weight: 700;
    display: grid;
    place-items: center;
  }
  .stepper-small span,
  .qty-stepper span {
    min-width: 26px;
    text-align: center;
    font-weight: 850;
    color: var(--text);
  }
  .plus-only {
    width: 42px;
    height: 42px;
    border-radius: 999px;
    color: var(--gold);
    font-size: 30px;
    font-weight: 700;
    display: grid;
    place-items: center;
  }
  .dish-footer,
  .bag-footer,
  .sacola-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;

// ============================================================================
// SUPABASE / EDGE FUNCTION
// ============================================================================
const SUPABASE_URL = 'https://jewamqbdonudiapxbzay.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_VeJTrMvtl5PAEvvc6R0CKA_nzjxQiAY';
const GARCOM_RESPONDER_URL = SUPABASE_URL + '/functions/v1/garcom-responder';

localStorage.removeItem('garcom_sessao_id');
localStorage.removeItem('garcom_device_id');

async function listarPratos() {
  const r = await fetch(`${GARCOM_RESPONDER_URL}?_=${Date.now()}`, {
    method: 'POST',
    cache: 'no-store',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    },
    body: JSON.stringify({ acao: 'listar_pratos' }),
  });
  if (!r.ok) throw new Error(await r.text());
  const data = await r.json();
  return {
    categorias: Array.isArray(data?.categorias) ? data.categorias : [],
    pratos: Array.isArray(data?.pratos) ? data.pratos : [],
    config: data?.config ?? {},
    microcopy: { ...DEFAULT_MICROCOPY, ...(data?.microcopy ?? {}) },
    chatConfig: { ...DEFAULT_CHAT_CONFIG, ...(data?.chat_config ?? {}) },
  };
}

function sortear(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function vibrate(ms) { try { navigator.vibrate?.(ms); } catch (_) {} }
function fmtBRL(v) { return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ','); }
function clampText(value, max = 110) {
  const text = String(value || '').trim();
  return text.length > max ? text.slice(0, max - 1).trim() + '...' : text;
}

}

// ============================================================================

function App() {
  const [garcomState, setGarcomState] = useState('hidden'); // hidden | peek | attention
  const [balaoTexto, setBalaoTexto] = useState(null);
  const [chatOpen, setChatOpen] = useState(false);
  const [mensagens, setMensagens] = useState([]);
  const [carrinho, setCarrinho] = useState([]);
  const [carrinhoTotal, setCarrinhoTotal] = useState(0);
  const [carrinhoPulse, setCarrinhoPulse] = useState(false);
  const [carrinhoOpen, setCarrinhoOpen] = useState(false);
  const [pratos, setPratos] = useState([]);
  const [categorias, setCategorias] = useState([]);
  const [microcopy, setMicrocopy] = useState(DEFAULT_MICROCOPY);
  const [chatConfig, setChatConfig] = useState(DEFAULT_CHAT_CONFIG);
  const [deliveryConfig, setDeliveryConfig] = useState({ taxa_entrega_padrao: 0, pedido_minimo: 0, tempo_entrega_min: 20, tempo_entrega_max: 30 });
  const [carregandoPratos, setCarregandoPratos] = useState(true);
  const [menuErro, setMenuErro] = useState(null);
  const [categoriaAtiva, setCategoriaAtiva] = useState('todos');
  const [pratoAberto, setPratoAberto] = useState(null);
  const [detailQty, setDetailQty] = useState(1);
  const [detailSizeId, setDetailSizeId] = useState(null);
  const [detailOptions, setDetailOptions] = useState({});
  const [detailObs, setDetailObs] = useState('');
  const [sacolaOpen, setSacolaOpen] = useState(false);
  const [welcomeOpen, setWelcomeOpen] = useState(() => localStorage.getItem('dom_welcome_seen') !== '1');
  const [welcomeName, setWelcomeName] = useState('');
  const [chatLeadMode, setChatLeadMode] = useState(null);
  const [leadAddress, setLeadAddress] = useState('');
  const [checkoutLoading, setCheckoutLoading] = useState(false);
  const [checkoutErro, setCheckoutErro] = useState('');
  const [checkoutForm, setCheckoutForm] = useState(() => {
    try {
      return {
        nome: '',
        whatsapp: '',
        cep: '',
        logradouro: '',
        numero: '',
        bairro: '',
        complemento: '',
        ponto_referencia: '',
        cidade: 'Curitiba',
        uf: 'PR',
        ...JSON.parse(localStorage.getItem('dom_checkout_form') || '{}'),
      };
    } catch (_) {
      return { nome: '', whatsapp: '', cep: '', logradouro: '', numero: '', bairro: '', complemento: '', ponto_referencia: '', cidade: 'Curitiba', uf: 'PR' };
    }
  });

  const lpTimer = useRef(null);
  const balaoTimer = useRef(null);
  const rondaTimer = useRef(null);
  const idleTimer = useRef(null);
  const ultimaInteracao = useRef(Date.now());

  // Ronda do Marco - aparece a cada 40-90s
  useEffect(() => {
    const agendarRonda = () => {
      const delay = 40000 + Math.random() * 50000;
      rondaTimer.current = setTimeout(() => {
        if (!chatOpen) {
          setGarcomState('peek');
          const fala = sortear(FALAS_RONDA);
          setBalaoTexto(fala);
          // Some depois de 4-5s
          setTimeout(() => setBalaoTexto(null), 4500);
          setTimeout(() => {
            if (!chatOpen) setGarcomState('attention');
          }, 5000);
        }
        agendarRonda();
      }, delay);
    };
    // Primeira aparicao em 3s
    setTimeout(() => {
      setGarcomState('peek');
      setBalaoTexto(sortear(chatConfig.saudacoes ?? SAUDACOES_INICIAIS));
      setTimeout(() => setBalaoTexto(null), 5000);
      setTimeout(() => setGarcomState('attention'), 5500);
      agendarRonda();
    }, 2500);
    return () => clearTimeout(rondaTimer.current);
  }, [chatOpen, chatConfig.saudacoes]);

  // Idle de 45s
  useEffect(() => {
    const checkIdle = () => {
      idleTimer.current = setTimeout(() => {
        if (!chatOpen && Date.now() - ultimaInteracao.current > 45000) {
          const fala = sortear(FALAS_IDLE_45S);
          setBalaoTexto(fala);
          setTimeout(() => setBalaoTexto(null), 5000);
        }
        checkIdle();
      }, 50000);
    };
    checkIdle();
    return () => clearTimeout(idleTimer.current);
  }, [chatOpen]);

  useEffect(() => {
    const reset = () => { ultimaInteracao.current = Date.now(); };
    window.addEventListener('touchstart', reset, { passive: true });
    window.addEventListener('scroll', reset, { passive: true });
    return () => {
      window.removeEventListener('touchstart', reset);
      window.removeEventListener('scroll', reset);
    };
  }, []);

  useEffect(() => {
    let vivo = true;
    listarPratos()
      .then((dados) => {
        if (!vivo) return;
        if (dados.pratos?.length) setPratos(dados.pratos);
        setCategorias(dados.categorias ?? []);
        setDeliveryConfig(prev => ({ ...prev, ...(dados.config ?? {}) }));
        setMicrocopy({ ...DEFAULT_MICROCOPY, ...(dados.microcopy ?? {}) });
        setChatConfig({ ...DEFAULT_CHAT_CONFIG, ...(dados.chatConfig ?? {}) });
        setMenuErro(null);
      })
      .catch((err) => {
        if (!vivo) return;
        setPratos([]);
        setMenuErro('Nao consegui carregar o cardapio do painel agora. Recarregue a pagina em alguns segundos.');
        console.error(err);
      })
      .finally(() => {
        if (vivo) setCarregandoPratos(false);
      });
    return () => { vivo = false; };
  }, []);

  useEffect(() => {
    localStorage.setItem('dom_checkout_form', JSON.stringify(checkoutForm));
  }, [checkoutForm]);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const pagamento = params.get('pagamento');
    const pedido = params.get('pedido');
    if (!pagamento) return;
    const textos = {
      sucesso: `Pagamento aprovado${pedido ? ` no pedido #${pedido}` : ''}. O Dom ja recebeu por aqui.`,
      pendente: `Pagamento pendente${pedido ? ` no pedido #${pedido}` : ''}. Se foi Pix, o Mercado Pago confirma em instantes.`,
      falha: `Pagamento nao concluiu${pedido ? ` no pedido #${pedido}` : ''}. Voce pode tentar de novo pela sacola.`,
    };
    setTimeout(() => {
      setChatOpen(true);
      setMensagens([{ id: Date.now(), autor: 'marco', texto: textos[pagamento] || textos.pendente }]);
    }, 650);
  }, []);

  useEffect(() => {
    const timer = setTimeout(() => {
      if (!chatOpen) {
        setGarcomState('peek');
        setBalaoTexto(sortear(chatConfig.mensagens_automaticas ?? DEFAULT_CHAT_CONFIG.mensagens_automaticas));
        clearTimeout(balaoTimer.current);
        balaoTimer.current = setTimeout(() => {
          setBalaoTexto(null);
          if (!chatOpen) setGarcomState('attention');
        }, 5200);
      }
    }, 120000);
    return () => clearTimeout(timer);
  }, [chatOpen, chatConfig.mensagens_automaticas]);

  const calcSubtotal = (items) => items.reduce((s, it) => s + Number(it.subtotal ?? (it.preco * it.qtd) ?? 0), 0);
  const totalItens = carrinho.reduce((s, it) => s + Number(it.qtd || 0), 0);
  const taxaEntrega = Number(deliveryConfig.taxa_entrega_padrao || 0);
  const totalComEntrega = carrinhoTotal + taxaEntrega;
  const tempoEntregaTexto = `${deliveryConfig.tempo_entrega_min || 20} a ${deliveryConfig.tempo_entrega_max || 30} min`;
  const pratosVisiveis = categoriaAtiva === 'todos'
    ? pratos
    : pratos.filter(p => String(p.categoria_id) === String(categoriaAtiva));
  const destaques = pratos
    .filter(p => p.badge_destaque || p.selo_experiencia || p.frase_fome)
    .slice(0, 9);

  const tamanhosDoPrato = (prato) => {
    const list = (prato?.tamanhos ?? []).filter(t => t.ativo !== false);
    return list.length ? list : [{
      id: `padrao-${prato?.id}`,
      nome: 'Padrao serve 1 pessoa',
      peso_g: '',
      preco_delta: 0,
      padrao: true,
    }];
  };

  const gruposDoPrato = (prato) => (prato?.grupos ?? [])
    .filter(g => g.ativo !== false)
    .map(g => ({ ...g, opcionais: (g.opcionais ?? []).filter(o => o.ativo !== false) }));

  const primeiroTamanho = (prato) => {
    const tamanhos = tamanhosDoPrato(prato);
    return (tamanhos.find(t => t.padrao) ?? tamanhos[0])?.id ?? null;
  };

  const abrirDetalhe = (prato) => {
    vibrate(14);
    setPratoAberto(prato);
    setDetailQty(1);
    setDetailSizeId(primeiroTamanho(prato));
    setDetailOptions({});
    setDetailObs('');
  };

  const fecharDetalhe = () => {
    setPratoAberto(null);
    setDetailOptions({});
    setDetailObs('');
  };

  const quantidadeGrupo = (grupoId, options = detailOptions) => {
    const map = options[String(grupoId)] ?? {};
    return Object.values(map).reduce((s, qtd) => s + Number(qtd || 0), 0);
  };

  const qtdOpcional = (grupoId, opcionalId) => {
    return Number(detailOptions[String(grupoId)]?.[String(opcionalId)] ?? 0);
  };

  const alterarOpcional = (grupo, opcional, delta) => {
    setDetailOptions(prev => {
      const gid = String(grupo.id);
      const oid = String(opcional.id);
      const atualGrupo = { ...(prev[gid] ?? {}) };
      const atual = Number(atualGrupo[oid] ?? 0);
      const max = Math.max(1, Number(grupo.max_escolhas || 1));

      if (delta > 0) {
        if (max === 1) {
          return { ...prev, [gid]: { [oid]: 1 } };
        }
        const totalGrupo = Object.values(atualGrupo).reduce((s, qtd) => s + Number(qtd || 0), 0);
        if (totalGrupo >= max) {
          vibrate(35);
          setBalaoTexto(`Nesse grupo da pra escolher ate ${max}.`);
          setTimeout(() => setBalaoTexto(null), 3200);
          return prev;
        }
      }

      const novo = Math.max(0, atual + delta);
      if (novo <= 0) delete atualGrupo[oid];
      else atualGrupo[oid] = novo;
      return { ...prev, [gid]: atualGrupo };
    });
  };

  const opcionaisSelecionados = (prato = pratoAberto) => {
    return gruposDoPrato(prato).flatMap(grupo => {
      const map = detailOptions[String(grupo.id)] ?? {};
      return (grupo.opcionais ?? [])
        .map(opcional => ({ ...opcional, grupo_id: grupo.id, grupo_nome: grupo.nome, qtd: Number(map[String(opcional.id)] ?? 0) }))
        .filter(opcional => opcional.qtd > 0);
    });
  };

  const tamanhoSelecionado = (prato = pratoAberto) => {
    return tamanhosDoPrato(prato).find(t => String(t.id) === String(detailSizeId)) ?? null;
  };

  const calcularUnitarioDetalhe = (prato = pratoAberto) => {
    if (!prato) return 0;
    const tamanho = tamanhoSelecionado(prato);
    const tamanhoDelta = Number(tamanho?.preco_delta || 0);
    const opcionaisTotal = opcionaisSelecionados(prato).reduce((s, op) => s + Number(op.preco_delta || 0) * Number(op.qtd || 0), 0);
    return Number(prato.preco || 0) + tamanhoDelta + opcionaisTotal;
  };

  const detalheValido = (prato = pratoAberto) => {
    if (!prato) return false;
    if (tamanhosDoPrato(prato).length && !detailSizeId) return false;
    return gruposDoPrato(prato).every(grupo => quantidadeGrupo(grupo.id) >= Number(grupo.min_escolhas || 0));
  };

  const adicionarDetalheNaSacola = () => {
    if (!pratoAberto || !detalheValido(pratoAberto)) return;
    const tamanho = tamanhoSelecionado(pratoAberto);
    const opcionais = opcionaisSelecionados(pratoAberto).map(op => ({
      id: op.id,
      grupo_id: op.grupo_id,
      grupo_nome: op.grupo_nome,
      nome: op.nome,
      qtd: op.qtd,
      preco_delta: Number(op.preco_delta || 0),
    }));
    const unitario = calcularUnitarioDetalhe(pratoAberto);
    const item = {
      local_id: crypto.randomUUID(),
      prato_id: pratoAberto.id,
      nome: pratoAberto.nome,
      foto: pratoAberto.foto,
      qtd: detailQty,
      preco: unitario,
      subtotal: unitario * detailQty,
      tamanho: tamanho ? {
        id: tamanho.id,
        nome: tamanho.nome,
        peso_g: tamanho.peso_g,
        preco_delta: Number(tamanho.preco_delta || 0),
      } : null,
      opcionais,
      obs: detailObs.trim(),
    };
    const novos = [...carrinho, item];
    setCarrinho(novos);
    setCarrinhoTotal(calcSubtotal(novos));
    setCarrinhoPulse(true);
    setTimeout(() => setCarrinhoPulse(false), 700);
    fecharDetalhe();
    setBalaoTexto(`Anotado: ${detailQty}x ${pratoAberto.nome}.`);
    setTimeout(() => setBalaoTexto(null), 3600);
    vibrate([20, 30, 20]);
  };

  const removerItemSacola = (localId) => {
    const novos = carrinho.filter(it => it.local_id !== localId);
    setCarrinho(novos);
    setCarrinhoTotal(calcSubtotal(novos));
    vibrate(18);
  };

  const abrirSacola = () => {
    setSacolaOpen(true);
  };

  // Tap no Marco - abre chat
  const tapMarco = () => {
    vibrate(15);
    abrirChat();
  };

  const abrirChat = async () => {
    setChatOpen(true);
    setBalaoTexto(null);
    setGarcomState('peek');
    if (mensagens.length === 0) {
      const saudacao = sortear(chatConfig.saudacoes ?? SAUDACOES_INICIAIS);
      const mensagem = sortear(chatConfig.mensagens_automaticas ?? DEFAULT_CHAT_CONFIG.mensagens_automaticas);
      setMensagens([
        { id: Date.now(), autor: 'marco', texto: saudacao },
        { id: Date.now() + 1, autor: 'marco', texto: mensagem },
      ]);
    }
  };

  const fecharChat = () => {
    setChatOpen(false);
  };

  // Long-press no Marco
  const onPressStart = () => {
    lpTimer.current = setTimeout(() => {
      vibrate(40);
      abrirChat();
    }, 500);
  };
  const onPressEnd = () => {
    clearTimeout(lpTimer.current);
  };

  const mostrarMensagemAutomatica = (texto) => {
    setChatOpen(true);
    setBalaoTexto(null);
    setMensagens(m => [...m, { id: Date.now(), autor: 'marco', texto }]);
  };

  const fecharBoasVindas = () => {
    const nome = welcomeName.trim();
    if (nome) setCheckoutField('nome', nome);
    localStorage.setItem('dom_welcome_seen', '1');
    setWelcomeOpen(false);
  };

  const parseEnderecoRapido = (texto) => {
    const raw = String(texto || '').trim();
    if (!raw) return {};
    const digits = raw.replace(/\D/g, '');
    if (digits.length === 8 && raw.length <= 12) return { cep: digits };
    const match = raw.match(/\b\d+[a-zA-Z]?\b/);
    if (!match) return { logradouro: raw };
    const numero = match[0];
    const antes = raw.slice(0, match.index).replace(/[,;-]+$/g, '').trim();
    const depois = raw.slice((match.index || 0) + numero.length).replace(/^[,;-]+/g, '').trim();
    return {
      logradouro: antes || raw,
      numero,
      bairro: depois,
    };
  };

  const pedirTempoEntrega = (prato = null) => {
    const nome = checkoutForm.nome?.trim();
    const intro = prato ? `Boa escolha olhando ${prato.nome}. ` : '';
    setChatLeadMode('delivery');
    setLeadAddress(checkoutForm.cep || [checkoutForm.logradouro, checkoutForm.numero, checkoutForm.bairro].filter(Boolean).join(', '));
    mostrarMensagemAutomatica(`${intro}Opa, me fala sua rua, numero e bairro ou seu CEP que eu ja vejo uma estimativa mais honesta pra voce.`);
  };

  const salvarEnderecoRapido = () => {
    const parsed = parseEnderecoRapido(leadAddress);
    if (!Object.keys(parsed).length) return;
    setCheckoutForm(prev => ({ ...prev, ...parsed }));
    setChatLeadMode(null);
    const tempo = `${deliveryConfig.tempo_entrega_min || 20} a ${deliveryConfig.tempo_entrega_max || 30} min`;
    setMensagens(m => [...m, {
      id: Date.now(),
      autor: 'marco',
      texto: `Boa. Com esse endereco, a media fica em torno de ${tempo}. No fechamento eu so confirmo os detalhes pra nao mandar o motoboy passear errado.`,
    }]);
  };

  const setCheckoutField = (key, value) => {
    setCheckoutForm(prev => ({ ...prev, [key]: value }));
    if (checkoutErro) setCheckoutErro('');
  };

  const checkoutValido = () => {
    const required = ['nome', 'whatsapp', 'logradouro', 'numero', 'bairro'];
    return required.every(key => String(checkoutForm[key] || '').trim());
  };

  const fecharPedido = async () => {
    if (!carrinho.length) return;
    if (!checkoutValido()) {
      setCheckoutErro('Preencha nome, telefone, rua, numero e bairro para o Dom conseguir entregar certinho.');
      return;
    }

    setCheckoutLoading(true);
    setCheckoutErro('');
    try {
      const r = await fetch(GARCOM_RESPONDER_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({
          acao: 'criar_checkout',
          cliente: {
            nome: checkoutForm.nome,
            whatsapp: checkoutForm.whatsapp,
          },
          endereco: {
            cep: checkoutForm.cep,
            logradouro: checkoutForm.logradouro,
            numero: checkoutForm.numero,
            bairro: checkoutForm.bairro,
            complemento: checkoutForm.complemento,
            ponto_referencia: checkoutForm.ponto_referencia,
            cidade: checkoutForm.cidade || 'Curitiba',
            uf: checkoutForm.uf || 'PR',
          },
          itens: carrinho,
          site_url: window.location.origin + window.location.pathname,
        }),
      });
      const data = await r.json();
      if (!r.ok || !data?.mercado_pago?.init_point) {
        throw new Error(data?.detalhe?.message || data?.error || 'Nao consegui abrir o Mercado Pago agora.');
      }
      window.location.href = data.mercado_pago.init_point;
    } catch (err) {
      setCheckoutErro(err.message || String(err));
      mostrarMensagemAutomatica('Tive um problema para abrir o pagamento. Confere os dados e tenta de novo em instantes.');
    } finally {
      setCheckoutLoading(false);
    }
  };

  // Long-press num prato -> fala do Marco
  const longPressPrato = (prato) => {
    vibrate(30);
    setBalaoTexto(`Boa escolha! ${prato.nome.split(' ').slice(0,2).join(' ')} e dos meus favoritos.`);
    setTimeout(() => setBalaoTexto(null), 3500);
  };

  return (
    <div className="min-h-dvh">
      <header className="hero-shell">
        <div className="hero-kicker">Trattoria delivery</div>
        <h1 className="font-serif hero-title">Dom Leonardo</h1>
        <p className="hero-copy">
          Massa quente, risoto cremoso e aquele cheiro de manteiga boa chegando na tampa.
          Escolha sem pressa; a sacola fica pronta no fim.
        </p>
        <div className="hero-actions">
          <button className="hero-soft-btn" onClick={() => pedirTempoEntrega()}>
            Quanto tempo para chegar na minha casa?
          </button>
        </div>
        <div className="trust-row">
          <div className="trust-chip"><span>Entrega media</span><strong>{tempoEntregaTexto}</strong></div>
          <div className="trust-chip"><span>Avaliacao</span><strong>{Number(deliveryConfig.restaurante_avaliacao || 4.9).toFixed(1)} estrelas</strong></div>
          <div className="trust-chip"><span>Pagamento</span><strong>Mercado Pago</strong></div>
        </div>
      </header>

      <section className="px-5 pt-6">
        <div className="section-head">
          <div>
            <h2 className="font-serif text-2xl" style={{color:'var(--gold)'}}>Hoje o Dom recomenda</h2>
            <p>Fotos grandes, escolhas seguras e pratos que chegam bem.</p>
          </div>
        </div>
        <div className="destaques-strip">
          {(destaques.length ? destaques : pratos.slice(0, 6)).map(p => (
            <button className="destaque-card" key={p.id} onClick={() => abrirDetalhe(p)}>
              <div className="relative">
                <img src={p.foto} alt={p.nome} loading="lazy" />
                <span className="prato-badge">{p.badge_destaque || p.selo_experiencia || 'Escolha segura'}</span>
              </div>
              <div className="destaque-body">
                <strong>{p.nome}</strong>
                <small>{clampText(p.frase_fome || p.descricao, 82)}</small>
                <div className="destaque-price">a partir de {fmtBRL(p.preco)}</div>
              </div>
            </button>
          ))}
        </div>
      </section>
      {/* Cardapio */}
      <section className="px-5 pb-36">
        <div className="cat-strip">
          <button className={`cat-chip ${categoriaAtiva === 'todos' ? 'active' : ''}`} onClick={() => setCategoriaAtiva('todos')}>Todos</button>
          {categorias.map(cat => (
            <button key={cat.id} className={`cat-chip ${String(categoriaAtiva) === String(cat.id) ? 'active' : ''}`} onClick={() => setCategoriaAtiva(cat.id)}>
              {cat.nome}
            </button>
          ))}
        </div>
        <h2 className="font-serif text-xl mb-3" style={{color:'var(--gold)'}}>Cardapio</h2>
        <div className="grid gap-4">
          {carregandoPratos && <div className="cart-empty">Carregando cardapio...</div>}
          {menuErro && <div className="cart-empty">{menuErro}</div>}
          {pratosVisiveis.map(p => (
            <article
              key={p.id}
              className="prato-card compact relative"
              data-prato-id={p.id}
              data-prato-nome={p.nome}
              onClick={() => abrirDetalhe(p)}
              onContextMenu={(e) => { e.preventDefault(); longPressPrato(p); }}
              onTouchStart={() => { lpTimer.current = setTimeout(() => longPressPrato(p), 520); }}
              onTouchEnd={() => clearTimeout(lpTimer.current)}
            >
              <div className="prato-copy">
                <div>
                  {p.badge && (
                    <span className="inline-block mb-2 px-2.5 py-1 rounded-full text-[10px] uppercase tracking-[0.08em]" style={{background:'rgba(212,175,55,0.12)', color:'var(--gold)', border:'1px solid rgba(212,175,55,0.2)'}}>
                      {p.badge}
                    </span>
                  )}
                  <h3 className="font-serif prato-title">{p.nome}</h3>
                  {p.frase_fome && <div className="sensory-line">{p.frase_fome}</div>}
                  {p.descricao && <p className="prato-desc">{p.descricao}</p>}
                  <div className="prato-helper-block">
                    <div className="prato-microcopy">{p.porcao_texto || microcopy.tamanhos_texto}</div>
                    <div className="prato-microcopy">{microcopy.entrega_texto}</div>
                  </div>
                  <button
                    className="prato-soft-btn"
                    onClick={(e) => { e.stopPropagation(); pedirTempoEntrega(p); }}
                  >
                    Quanto tempo pra chegar?
                  </button>
                </div>
                <div className="mt-3 flex items-end justify-between gap-2">
                  <span className="prato-price">a partir de {fmtBRL(p.preco)}</span>
                  <button
                    className="prato-cta"
                    onClick={(e) => { e.stopPropagation(); abrirDetalhe(p); }}
                  >
                    Pedir
                  </button>
                </div>
              </div>
              <div className="relative">
                <img src={p.foto} alt={p.nome} loading="lazy" />
              </div>
            </article>
          ))}
        </div>
      </section>

      {/* Leo PIP (escondido por padrao, futuro: aparece apos pedido) */}
      {/* Detalhe do prato - fluxo estilo delivery */}
      <div className={`dish-backdrop ${pratoAberto ? 'open' : ''}`} onClick={fecharDetalhe}></div>
      <section className={`dish-sheet ${pratoAberto ? 'open' : ''}`} aria-hidden={!pratoAberto}>
        {pratoAberto && (
          <>
            <div className="dish-scroll">
              <div className="dish-hero">
                <button className="dish-close" onClick={fecharDetalhe} aria-label="Voltar">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <img src={pratoAberto.foto} alt={pratoAberto.nome} />
                <div className="dish-store-pill">
                  <div className="dish-store-logo">DL</div>
                  <div>
                    <strong>Dom Leonardo</strong>
                    <div className="text-xs text-[var(--text-dim)]">Monte do seu jeito</div>
                  </div>
                </div>
              </div>

              <div className="dish-info">
                {(pratoAberto.selo_experiencia || pratoAberto.badge_destaque) && (
                  <span className="experience-chip">{pratoAberto.selo_experiencia || pratoAberto.badge_destaque}</span>
                )}
                <h2 className="font-serif">{pratoAberto.nome}</h2>
                {pratoAberto.frase_fome && <p style={{color:'rgba(243,236,224,0.9)', fontWeight:700}}>{pratoAberto.frase_fome}</p>}
                {pratoAberto.descricao && <p>{clampText(pratoAberto.descricao, 165)}</p>}
                <button className="dish-soft-btn" onClick={() => pedirTempoEntrega(pratoAberto)}>
                  Quanto tempo para chegar na minha casa?
                </button>
                <div className="dish-start-price">a partir de {fmtBRL(pratoAberto.preco)}</div>
              </div>

              <div className="dish-senses">
                <div className="sense-card">
                  <strong>Porcao sem misterio</strong>
                  <p>{pratoAberto.porcao_texto || microcopy.tamanhos_texto}</p>
                </div>
                <div className="sense-card">
                  <strong>Como chega ai</strong>
                  <p>{pratoAberto.como_chega_texto || 'Vai em embalagem firme e bem fechada para preservar calor, textura e molho.'}</p>
                </div>
                {pratoAberto.melhor_para && (
                  <div className="sense-card">
                    <strong>Melhor para</strong>
                    <p>{pratoAberto.melhor_para}</p>
                  </div>
                )}
              </div>

              <div className="choice-block">
                <div className="choice-head">
                  <div>
                    <div className="choice-title">Tamanho</div>
                    <div className="choice-subtitle">Escolha 1 opcao</div>
                  </div>
                  <span className="choice-required">OBRIGATORIO</span>
                </div>
                {tamanhosDoPrato(pratoAberto).map(tam => (
                  <button
                    key={tam.id}
                    className="choice-row"
                    onClick={() => { setDetailSizeId(tam.id); vibrate(10); }}
                  >
                    <div className="choice-main">
                      <div className="choice-name">{tam.nome}{tam.peso_g ? ` (${tam.peso_g}g)` : ''}</div>
                      <div className="choice-price">
                        {Number(tam.preco_delta || 0) > 0 ? `+ ${fmtBRL(Number(tam.preco_delta))}` : 'sem adicional'}
                      </div>
                    </div>
                    <span className={`choice-dot ${String(detailSizeId) === String(tam.id) ? 'active' : ''}`}></span>
                  </button>
                ))}
                <button className="help-size-btn" onClick={() => mostrarMensagemAutomatica(`${pratoAberto.nome}: ${pratoAberto.duvida_tamanho_texto || microcopy.tamanhos_texto}.`)}>
                  {microcopy.fome_botao_texto}
                </button>
              </div>

              {gruposDoPrato(pratoAberto).map(grupo => (
                <div className="choice-block" key={grupo.id}>
                  <div className="choice-head">
                    <div>
                      <div className="choice-title">{grupo.nome}</div>
                      <div className="choice-subtitle">
                        {Number(grupo.min_escolhas || 0) > 0
                          ? `Escolha no minimo ${grupo.min_escolhas}`
                          : `Escolha ate ${grupo.max_escolhas || 1} opcao${Number(grupo.max_escolhas || 1) > 1 ? 'es' : ''}`}
                      </div>
                    </div>
                    {Number(grupo.min_escolhas || 0) > 0 && <span className="choice-required">OBRIGATORIO</span>}
                  </div>
                  {(grupo.opcionais ?? []).map(opcional => {
                    const qtd = qtdOpcional(grupo.id, opcional.id);
                    return (
                      <div className="choice-row" key={opcional.id}>
                        <div className="choice-main">
                          <div className="choice-name">{opcional.nome}</div>
                          {opcional.descricao && <div className="choice-desc">{opcional.descricao}</div>}
                          <div className="choice-price">
                            {Number(opcional.preco_delta || 0) > 0 ? `+ ${fmtBRL(Number(opcional.preco_delta))}` : 'sem adicional'}
                          </div>
                        </div>
                        {opcional.foto ? (
                          <img className="option-thumb" src={opcional.foto} alt="" loading="lazy" />
                        ) : (
                          <div className="option-thumb fallback">extra</div>
                        )}
                        {qtd > 0 ? (
                          <div className="stepper-small">
                            <button onClick={() => alterarOpcional(grupo, opcional, -1)}>-</button>
                            <span>{qtd}</span>
                            <button onClick={() => alterarOpcional(grupo, opcional, 1)}>+</button>
                          </div>
                        ) : (
                          <button className="plus-only" onClick={() => alterarOpcional(grupo, opcional, 1)}>+</button>
                        )}
                      </div>
                    );
                  })}
                </div>
              ))}

              <div className="choice-block">
                <div className="choice-head">
                  <div>
                    <div className="choice-title">Observacao</div>
                    <div className="choice-subtitle">Opcional, do jeitinho que voce gosta</div>
                  </div>
                </div>
                <div style={{padding:'14px 20px'}}>
                  <textarea
                    className="obs-input"
                    style={{width:'100%', minHeight: 86, borderRadius: 16, resize:'none'}}
                    value={detailObs}
                    onChange={e => setDetailObs(e.target.value)}
                    placeholder="Ex: sem cebola, ponto da carne, embalagem separada..."
                  ></textarea>
                </div>
              </div>
            </div>

            <div className="dish-footer">
              <div className="qty-stepper">
                <button onClick={() => setDetailQty(q => Math.max(1, q - 1))}>-</button>
                <span>{detailQty}</span>
                <button onClick={() => setDetailQty(q => q + 1)}>+</button>
              </div>
              <button className={`add-dish-btn ${detalheValido(pratoAberto) ? '' : 'disabled'}`} onClick={adicionarDetalheNaSacola}>
                <span>Adicionar</span>
                <span>{fmtBRL(calcularUnitarioDetalhe(pratoAberto) * detailQty)}</span>
              </button>
            </div>
          </>
        )}
      </section>

      {/* Sacola */}
      {carrinho.length > 0 && !chatOpen && !pratoAberto && !sacolaOpen && (
        <div className={`sacola-bar ${carrinhoPulse ? 'pulse' : ''}`}>
          <div className="sacola-summary">
            <small>Total sem entrega</small>
            <strong>{fmtBRL(carrinhoTotal)} / {totalItens} {totalItens === 1 ? 'item' : 'itens'}</strong>
          </div>
          <button className="sacola-main-btn" onClick={abrirSacola}>Ver sacola</button>
        </div>
      )}

      <div className={`bag-backdrop ${sacolaOpen ? 'open' : ''}`} onClick={() => setSacolaOpen(false)}></div>
      <section className={`bag-sheet ${sacolaOpen ? 'open' : ''}`} aria-hidden={!sacolaOpen}>
        <div className="bag-head">
          <button className="bag-close" onClick={() => setSacolaOpen(false)} aria-label="Voltar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <h2>Sacola</h2>
          {!!carrinho.length && <button className="bag-clear" onClick={() => { setCarrinho([]); setCarrinhoTotal(0); }}>Limpar</button>}
        </div>
        <div className="bag-scroll">
          <div className="bag-store">
            <div className="bag-logo">DL</div>
            <div>
              <strong>Dom Leonardo</strong>
              <button className="bag-link" onClick={() => setSacolaOpen(false)}>Adicionar mais itens</button>
            </div>
          </div>

          {!carrinho.length && <div className="cart-empty">Sua sacola esta vazia.</div>}
          {carrinho.map(item => (
            <div className="bag-item" key={item.local_id}>
              <div>
                <div className="bag-item-title">{item.qtd}x {item.nome}</div>
                <div className="bag-item-meta">
                  {item.tamanho?.nome && <div>{item.tamanho.nome}{item.tamanho.peso_g ? ` (${item.tamanho.peso_g}g)` : ''}</div>}
                  {item.opcionais?.length > 0 && <div>{item.opcionais.map(op => `${op.qtd}x ${op.nome}`).join(', ')}</div>}
                  {item.obs && <div>obs: {item.obs}</div>}
                </div>
                <button className="bag-remove" onClick={() => removerItemSacola(item.local_id)}>Remover</button>
              </div>
              <div className="bag-item-price">{fmtBRL(item.subtotal)}</div>
            </div>
          ))}

          <div className="checkout-form">
            <h3>{deliveryConfig.checkout_titulo || 'Fechar pedido com seguranca'}</h3>
            <p>{deliveryConfig.checkout_subtitulo || 'Informe os dados de entrega e pague pelo Mercado Pago.'}</p>
            <div className="checkout-grid">
              <input className="checkout-input" value={checkoutForm.nome} onChange={e => setCheckoutField('nome', e.target.value)} placeholder="Seu nome" />
              <input className="checkout-input" value={checkoutForm.whatsapp} onChange={e => setCheckoutField('whatsapp', e.target.value)} placeholder="Telefone / WhatsApp do motoboy" inputMode="tel" />
              <input className="checkout-input" value={checkoutForm.cep} onChange={e => setCheckoutField('cep', e.target.value)} placeholder="CEP (opcional, ajuda no tempo de entrega)" inputMode="numeric" />
              <input className="checkout-input" value={checkoutForm.logradouro} onChange={e => setCheckoutField('logradouro', e.target.value)} placeholder="Rua / Avenida" />
              <div style={{display:'grid', gridTemplateColumns:'0.8fr 1.2fr', gap:10}}>
                <input className="checkout-input" value={checkoutForm.numero} onChange={e => setCheckoutField('numero', e.target.value)} placeholder="Numero" />
                <input className="checkout-input" value={checkoutForm.bairro} onChange={e => setCheckoutField('bairro', e.target.value)} placeholder="Bairro" />
              </div>
              <input className="checkout-input" value={checkoutForm.complemento} onChange={e => setCheckoutField('complemento', e.target.value)} placeholder="Complemento (opcional)" />
              <input className="checkout-input" value={checkoutForm.ponto_referencia} onChange={e => setCheckoutField('ponto_referencia', e.target.value)} placeholder="Ponto de referencia (opcional)" />
            </div>
            {checkoutErro && <div className="checkout-error">{checkoutErro}</div>}
            <div className="mp-note">Pagamento seguro pelo Mercado Pago. O Access Token fica protegido na Edge Function do Supabase.</div>
          </div>

          <div className="bag-values">
            <h3>Resumo de valores</h3>
            <div className="value-row"><span>Subtotal</span><strong>{fmtBRL(carrinhoTotal)}</strong></div>
            <div className="value-row"><span>Taxa de entrega</span><strong>{fmtBRL(taxaEntrega)}</strong></div>
            <div className="value-row total"><span>Total estimado</span><strong>{fmtBRL(totalComEntrega)}</strong></div>
          </div>
        </div>
        <div className="bag-footer">
          <button className="bag-primary-btn" onClick={fecharPedido} disabled={checkoutLoading}>
            <span>{checkoutLoading ? 'Abrindo Mercado Pago...' : (deliveryConfig.checkout_botao_texto || 'Pagar com Mercado Pago')}</span>
            <span>{fmtBRL(totalComEntrega)}</span>
          </button>
        </div>
      </section>

      {/* Marco sticker */}
      <button
        className={`marco-sticker ${garcomState}`}
        onClick={tapMarco}
        onTouchStart={onPressStart}
        onTouchEnd={onPressEnd}
        onMouseDown={onPressStart}
        onMouseUp={onPressEnd}
        onMouseLeave={onPressEnd}
        aria-label="Chamar o Marco"
      >
        <span className="halo"></span>
        <span className={`marco-cart-badge ${carrinho.length > 0 ? 'show' : ''} ${carrinhoPulse ? 'pulse' : ''}`}>
          {carrinho.reduce((s, it) => s + it.qtd, 0)}
        </span>
        <MarcoSticker />
      </button>

      {/* Balao de fala */}
      <div className={`balao ${balaoTexto && !chatOpen ? 'shown' : ''}`}>
        {balaoTexto}
      </div>

      {/* Backdrop + Bottom sheet */}
      <div className={`bottom-sheet-backdrop ${chatOpen ? 'open' : ''}`} onClick={fecharChat}></div>
      <div className={`bottom-sheet ${chatOpen ? 'open' : ''}`}>
        <div className="grip" />
        <header>
          <div style={{width:'40px', height:'40px'}}><MarcoSticker /></div>
          <div className="flex-1">
            <div className="font-serif text-lg leading-none" style={{color:'var(--gold)'}}>Marco</div>
            <div className="text-xs text-[var(--text-dim)] mt-0.5">Garcom - online</div>
          </div>
          <button className="btn-icon" onClick={fecharChat} aria-label="Fechar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M6 6l12 12M6 18L18 6"/></svg>
          </button>
        </header>

        {/* Carrinho pill - aparece quando tem itens */}
        {carrinho.length > 0 && (
          <>
            <div
              className={`cart-pill ${carrinhoPulse ? 'pulse' : ''}`}
              onClick={() => { vibrate(15); setCarrinhoOpen(o => !o); }}
            >
              <div className="cart-left">
                <span className="cart-emoji">Sacola</span>
                <div className="cart-count">
                  <strong>{carrinho.reduce((s, it) => s + it.qtd, 0)}</strong> {carrinho.reduce((s, it) => s + it.qtd, 0) === 1 ? 'item' : 'itens'}
                  <br/>
                  <span style={{fontSize: '11px', color: 'var(--text-dim)'}}>{carrinhoOpen ? 'tap pra esconder' : 'tap pra ver'}</span>
                </div>
              </div>
              <span className="cart-total">{fmtBRL(carrinhoTotal)}</span>
            </div>
            <div className={`cart-drawer ${carrinhoOpen ? 'open' : ''}`}>
              {carrinho.map((it, i) => (
                <div key={i} className="cart-item">
                  <div className="qty">{it.qtd}</div>
                  <div className="info">
                    <div className="nome">{it.nome}</div>
                    {it.obs && <div className="obs">obs: {it.obs}</div>}
                  </div>
                  <div className="preco">{fmtBRL(it.preco * it.qtd)}</div>
                </div>
              ))}
              <button className="checkout-btn" onClick={() => { setChatOpen(false); setSacolaOpen(true); }}>Fechar pedido</button>
            </div>
          </>
        )}

        <div className="messages">
          {mensagens.map(m => (
            <div key={m.id} className={`msg ${m.autor}`}>{m.texto}</div>
          ))}
          {chatLeadMode === 'delivery' && (
            <div className="msg marco" style={{width:'min(100%, 360px)'}}>
              <div style={{fontWeight:900, color:'var(--gold)', marginBottom:8}}>Me passa o endereco rapidinho</div>
              <input
                className="checkout-input"
                value={leadAddress}
                onChange={e => setLeadAddress(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') salvarEnderecoRapido(); }}
                placeholder="Rua, numero e bairro ou CEP"
              />
              <button className="checkout-btn" style={{width:'100%', margin:'10px 0 0'}} onClick={salvarEnderecoRapido}>
                Ver media de entrega
              </button>
            </div>
          )}
        </div>
      </div>

      <div
        className={`welcome-gate ${welcomeOpen ? 'open' : ''}`}
        onClick={fecharBoasVindas}
      >
        <div className="welcome-card" onClick={e => e.stopPropagation()}>
          <h2 className="font-serif welcome-title">Bem-vindo ao Dom Leonardo</h2>
          <p className="welcome-copy">
            Se quiser, me fala seu nome. Se preferir so olhar o cardapio, toca fora e entra direto.
          </p>
          <input
            className="welcome-input"
            value={welcomeName}
            onChange={e => setWelcomeName(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') fecharBoasVindas(); }}
            placeholder="Seu nome (opcional)"
            autoComplete="name"
          />
          <div className="welcome-hint">Toque fora para continuar sem preencher.</div>
          <button className="checkout-btn" style={{width:'100%', margin:'14px 0 0'}} onClick={fecharBoasVindas}>
            Entrar no cardapio
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  // Limpa service workers antigos do Garcom para o cardapio sempre vir do painel.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(reg => {
          if (reg.scope.includes('/garcom/')) reg.unregister().catch(() => {});
        });
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
