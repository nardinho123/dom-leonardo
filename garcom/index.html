<script>
  // Faxina de cache legado: evita tela branca presa em Service Worker antigo.
  (function limparCacheLegadoDomLeonardo() {
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', function() {
      Promise.all([
        navigator.serviceWorker.getRegistrations()
          .then(function(regs) { return Promise.all(regs.map(function(reg) { return reg.unregister().catch(function() {}); })); })
          .catch(function() {}),
        window.caches
          ? caches.keys().then(function(keys) { return Promise.all(keys.map(function(key) { return caches.delete(key).catch(function() {}); })); }).catch(function() {})
          : Promise.resolve()
      ]).then(function() {
        if (navigator.serviceWorker.controller && !sessionStorage.getItem('dl_sw_cleanup_reloaded')) {
          sessionStorage.setItem('dl_sw_cleanup_reloaded', '1');
          window.location.reload();
        }
      });
    });
  })();
</script>

      AddToCart: true,
      InitiateCheckout: true,

    }

    function compactData(data) {

        client_user_agent: navigator.userAgent,
        custom_data: compactData(data)

      try {

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
    --gold: #d4af37;
    --gold-dim: #8a6f1f;
    --bg: #0a0908;
    --bg-elev: #15120e;
    --bg-card: #1c1814;
    --line: rgba(212, 175, 55, 0.18);
    --text: #f3ece0;
    --text-dim: #8d8579;
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    overscroll-behavior-y: contain;
    min-height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }
  input, textarea, button, select { font-size: 16px; }
  button { background: none; border: 0; color: inherit; padding: 0; cursor: pointer; }
  #root { width: 100%; max-width: 100vw; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* Title font */
  .font-serif { font-family: "Cormorant Garamond", "Playfair Display", Georgia, serif; }

  /* Sticker do Marco - ronda */
  .marco-sticker {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 24px);
    right: 16px;
    width: 64px;
    height: 64px;
    z-index: 50;
    cursor: pointer;
    filter: drop-shadow(0 4px 18px rgba(212,175,55,0.25));
    transition: transform 600ms cubic-bezier(.34,1.56,.64,1), opacity 600ms;
    will-change: transform, opacity;
  }
  .marco-sticker.hidden { transform: translateY(120px); opacity: 0; }
  .marco-sticker.peek { transform: translateY(0); opacity: 1; }
  .marco-sticker.attention { animation: balanca 1.6s ease-in-out infinite; }
  @keyframes balanca {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50% { transform: rotate(3deg) translateY(-2px); }
  }
  .marco-sticker .halo {
    position: absolute; inset: -6px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,0.28) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 400ms;
  }
  /* Badge do carrinho sobre o Marco */
  .marco-cart-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border-radius: 11px;
    background: linear-gradient(180deg, #e7c66d 0%, #a47e1e 100%);
    color: #1a1305;
    font-size: 12px;
    font-weight: 700;
    display: grid;
    place-items: center;
    border: 2px solid var(--bg);
    z-index: 1;
    transform: scale(0);
    transition: transform 240ms cubic-bezier(.34,1.56,.64,1);
  }
  .marco-cart-badge.show { transform: scale(1); }
  .marco-cart-badge.pulse { animation: badgePulse 700ms ease-out; }
  @keyframes badgePulse {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .marco-sticker.attention .halo { opacity: 1; animation: pulse 2s ease-in-out infinite; }
  .marco-sticker.top-mode {
    top: calc(var(--safe-top) + 14px);
    bottom: auto;
    right: 14px;
    width: 56px;
    height: 56px;
    z-index: 225;
    opacity: 1;
    transform: translateY(0) scale(0.92);
  }
  .marco-sticker.top-mode.hidden,
  .marco-sticker.top-mode.peek,
  .marco-sticker.top-mode.attention {
    opacity: 1;
    transform: translateY(0) scale(0.92);
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.08); }
  }

  /* Balao de fala */
  .balao {
    position: fixed;
    right: 88px;
    bottom: calc(var(--safe-bottom) + 30px);
    max-width: 64vw;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 18px 18px 4px 18px;
    font-size: 14px;
    line-height: 1.35;
    z-index: 51;
    box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    transform: translateY(8px);
    opacity: 0;
    pointer-events: none;
    transition: transform 320ms cubic-bezier(.4,0,.2,1), opacity 320ms;
  }
  .balao.shown {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .balao::after {
    content: '';
    position: absolute;
    right: -6px;
    bottom: 12px;
    width: 12px; height: 12px;
    background: var(--bg-elev);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    transform: rotate(-45deg);
  }

  /* Bottom sheet do chat */
  .bottom-sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px) saturate(120%);
    -webkit-backdrop-filter: blur(6px) saturate(120%);
    z-index: 230;
    opacity: 0;
    pointer-events: none;
    transition: opacity 280ms;
  }
  .bottom-sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  .bottom-sheet {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    height: 85vh;
    background: var(--bg-elev);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
    z-index: 240;
    transform: translateY(100%);
    transition: transform 360ms cubic-bezier(.25,.8,.25,1);
    display: flex;
    flex-direction: column;
    padding-bottom: var(--safe-bottom);
  }
  .bottom-sheet.open { transform: translateY(0); }
  .bottom-sheet .grip {
    width: 44px; height: 4px;
    background: rgba(255,255,255,0.18);
    border-radius: 2px;
    margin: 10px auto 6px;
  }
  .bottom-sheet header {
    padding: 8px 18px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bottom-sheet .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .chat-compose {
    display: grid;
    grid-template-columns: 1fr 48px;
    gap: 9px;
    padding: 10px 14px calc(10px + var(--safe-bottom));
    border-top: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(21,18,14,0.72), var(--bg-elev));
  }
  .chat-input {
    min-height: 46px;
    border-radius: 999px;
    border: 1px solid rgba(212,175,55,0.24);
    background: rgba(0,0,0,0.22);
    color: var(--text);
    outline: none;
    padding: 0 15px;
  }
  .chat-input:focus { border-color: rgba(212,175,55,0.52); }
  .chat-send {
    width: 48px;
    height: 46px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--gold), var(--gold-dim));
    color: #1a1305;
    display: grid;
    place-items: center;
    font-weight: 950;
  }
  .chat-send:disabled {
    opacity: .45;
    filter: grayscale(.5);
  }
  .chat-attach {
    width: 42px;
    height: 46px;
    flex: none;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(212,175,55,0.28);
    color: var(--gold);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .chat-attach.off { opacity: .45; pointer-events: none; }
  .chat-attach.rec {
    background: #e0463a;
    border-color: #e0463a;
    color: #fff;
    animation: pixPulse 1.3s ease-out infinite;
  }
  .msg-foto {
    display: block;
    max-width: 200px;
    max-height: 240px;
    border-radius: 12px;
    object-fit: cover;
    cursor: pointer;
  }
  .msg-audio { display: block; width: 210px; max-width: 60vw; margin: 2px 0; }
  .msg .msg-texto { display: block; }
  .msg-foto + .msg-texto, .msg-audio + .msg-texto { margin-top: 6px; }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.4;
  }
  .msg.marco {
    background: var(--bg-card);
    border: 1px solid var(--line);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.cliente {
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    color: #1a1305;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    font-weight: 600;
  }
  .msg-typing {
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 14px 18px;
    border-radius: 16px;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    display: flex;
    gap: 4px;
  }
  .msg-typing span {
    width: 6px; height: 6px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: typing 1.4s infinite ease-in-out;
  }
  .msg-typing span:nth-child(2) { animation-delay: 0.18s; }
  .msg-typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Carrinho pill (dentro do bottom sheet, abaixo do header) */
  .cart-pill {
    margin: 8px 14px;
    padding: 10px 14px;
    background: linear-gradient(180deg, rgba(212,175,55,0.18) 0%, rgba(212,175,55,0.08) 100%);
    border: 1px solid rgba(212,175,55,0.45);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 200ms;
    min-height: 48px;
  }
  .cart-pill:active { transform: scale(0.98); }
  .cart-pill.pulse { animation: cartPulse 700ms ease-out; }
  @keyframes cartPulse {
    0%   { transform: scale(1); box-shadow: 0 0 0 0 rgba(212,175,55,0.6); }
    40%  { transform: scale(1.04); box-shadow: 0 0 0 10px rgba(212,175,55,0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212,175,55,0); }
  }
  .cart-left { display: flex; align-items: center; gap: 10px; }
  .cart-emoji { font-size: 22px; line-height: 1; }
  .cart-count {
    font-size: 13px;
    color: var(--text);
    line-height: 1.15;
  }
  .cart-count strong { color: var(--gold); font-weight: 700; }
  .cart-total {
    font-weight: 700;
    color: var(--gold);
    font-size: 16px;
  }

  /* Drawer expandido do carrinho (dentro do bottom sheet) */
  .cart-drawer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 320ms cubic-bezier(.4,0,.2,1);
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  .cart-drawer.open { max-height: 50vh; overflow-y: auto; }
  .cart-item {
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .cart-item:last-child { border-bottom: none; }
  .cart-item .qty {
    flex: 0 0 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--gold);
    color: #1a1305;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 13px;
  }
  .cart-item .info { flex: 1; }
  .cart-item .info .nome { font-size: 14px; font-weight: 600; }
  .cart-item .info .obs { font-size: 12px; color: var(--text-dim); margin-top: 2px; font-style: italic; }
  .cart-item .preco { font-size: 14px; font-weight: 600; color: var(--gold); }
  .cart-empty {
    text-align: center;
    padding: 24px 16px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .checkout-btn {
    width: calc(100% - 28px);
    margin: 10px 14px 14px;
    min-height: 46px;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    color: #1a1305;
    font-weight: 800;
    box-shadow: 0 10px 22px rgba(212,175,55,0.14);
  }

  .btn-icon {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    transition: transform 120ms, background 120ms;
  }
  .btn-icon:active { transform: scale(0.92); background: var(--bg-elev); }
  /* Cartoes de prato */
  .prato-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    transition: transform 200ms;
  }
  .prato-card:active { transform: scale(0.985); }
  .prato-card img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    display: block;
    cursor: zoom-in;
  }
  .prato-badge {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    color: var(--gold);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .prato-helper-block {
    margin-top: 8px;
    display: grid;
    gap: 5px;
  }
  .prato-microcopy {
    color: rgba(235, 229, 216, 0.64);
    font-size: 10.5px;
    line-height: 1.25;
    letter-spacing: 0.01em;
  }
  .prato-sizecopy {
    color: rgba(212, 175, 55, 0.82);
    font-size: 11px;
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: 0.015em;
  }
  .prato-action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .prato-soft-btn {
    background: #0a0908;
    border: 1px solid rgba(212,175,55,0.18);
    color: rgba(235, 229, 216, 0.82);
    border-radius: 999px;
    padding: 7px 11px;
    min-height: 32px;
    font-size: 10.5px;
    font-weight: 850;
    line-height: 1;
    box-shadow: 0 3px 12px rgba(0,0,0,0.24);
  }

// Etapa do pedido (visao do cliente) a partir do status publico.
function etapaDoPedido(st) {
  if (!st) return { idx: 0, key: 'aguardando_aceite', terminal: false };
  if (st.aceite_status === 'recusado' || st.pagamento_status === 'estornado' || st.status === 'cancelado') {

  }

  if (st.status === 'saiu_entrega') return { idx: 2, key: 'a_caminho', terminal: false };

// Comprime imagem no navegador antes de enviar (canvas -> jpeg base64 sem prefixo).
function comprimirImagemBase64(file, maxLado = 1280, q = 0.72) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let width = img.width, height = img.height;
      if (width > maxLado || height > maxLado) {
        const r = Math.min(maxLado / width, maxLado / height);
        width = Math.round(width * r);
        height = Math.round(height * r);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', q);
      resolve({ base64: dataUrl.split(',')[1], mime: 'image/jpeg' });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Imagem invalida.')); };
    img.src = url;
  });
}
function blobParaBase64(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',')[1]);
    fr.onerror = () => reject(new Error('Falha ao ler audio.'));
    fr.readAsDataURL(blob);
  });
}

function haversineKm(a, b) {
  if (!a || !b) return null;
  const R = 6371;
  const rad = (d) => d * Math.PI / 180;
  const dLat = rad(b.lat - a.lat);
  const dLng = rad(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
}

      if (field === 'rua' || field === 'numero') {
        next.ruaNumero = [next.rua, next.numero].filter(Boolean).join(', ');
      }
      if (field === 'ruaNumero') {
        const partes = splitRuaNumero(value);
        next.rua = partes.logradouro;
        next.numero = partes.numero || next.numero;
      }
      if (field === 'rua' || field === 'numero' || field === 'bairro') {
        const ruaNumero = [next.rua, next.numero].filter(Boolean).join(', ');
        setWhatsEndereco(v => ({ ...v, ruaNumero, bairro: next.bairro || v.bairro || '' }));
      }
      return next;
    });
    setCheckoutErrors(prev => {
      if (!prev[field]) return prev;
      const next = { ...prev };
      delete next[field];
      return next;
    });
    if (field === 'rua' || field === 'numero' || field === 'bairro' || field === 'ruaNumero') {

    if (!nome) errors.nome = true;

  const calcularEntregaCheckout = async () => {
    let coords = (Number.isFinite(mapPin?.lat) && Number.isFinite(mapPin?.lng))
      ? { lat: mapPin.lat, lng: mapPin.lng }
      : null;
    const { logradouro, numero, bairro } = enderecoCheckout();
    if (!coords && (!logradouro || !bairro)) {
      setEntregaError('Use a localizacao ou preencha rua e bairro para calcular a entrega.');
      return;
    }

    setEntregaLoading(true);
    setEntregaError('');
    try {
      // Sem pino: geocodifica o endereco digitado (server-side, chave de servidor).
      if (!coords) {
        const g = await fetch(REVERSE_GEOCODE_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({ endereco: { logradouro, numero, bairro, cidade: 'Curitiba', uf: 'PR' } }),
        });
        const gd = await g.json().catch(() => ({}));
        if (gd?.ok && Number.isFinite(gd.lat) && Number.isFinite(gd.lng)) {
          coords = { lat: gd.lat, lng: gd.lng };
          setMapPin(coords);
        }
      }
      if (!coords) {
        setEntregaError('Nao achei esse endereco no mapa. Confere a rua e o bairro, por favor.');
        return;
      }

      const faixas = await carregarFaixasEntrega();
      if (!faixas.length) {
        setEntregaError('Nao consegui carregar as faixas de entrega agora.');
        return;
      }
      const distKm = haversineKm(COZINHA_ORIGEM, coords);
      const maxRaio = faixas[faixas.length - 1].raio_km;
      const faixa = faixas.find(f => f.raio_km >= distKm) || faixas[faixas.length - 1];
      const dentro = distKm <= maxRaio + 0.001;
      setEntregaEstimativa({
        frete_bruto: faixa.taxa,
        texto_tempo: `${faixa.tempo_min} min`,
        distancia_texto: `${distKm.toFixed(1).replace('.', ',')} km`,
        dentro_raio: dentro,
        fonte: 'tabela',
        endereco_formatado: mapAddressLabel || '',
      });
    } catch (err) {
      setEntregaError('Nao consegui calcular a entrega agora. Tenta de novo em instantes.');
    } finally {
      setEntregaLoading(false);
    }
  };

      } else {
        const ta = document.createElement('textarea');
        ta.value = code;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      setPixCopiado(true);
      vibrate(20);
      setTimeout(() => setPixCopiado(false), 2500);

  const tamanhosDoPrato = (prato) => {

  const gruposDoPrato = (prato) => (prato?.grupos ?? [])

  const primeiroTamanho = (prato) => {

  const abrirDetalhe = (prato) => {
    vibrate(14);
    trackMeta('ViewContent', {

    abriuPratoRef.current = true;

    clearTimeout(detailGuideTimer.current);
    setPratoAberto(prato);
    setDetailQty(1);
    setDetailSizeId(primeiroTamanho(prato));
    setDetailOptions({});
    setDetailObs('');
    detailGuideTimer.current = setTimeout(() => {
      if (detailInteragiuRef.current || chatOpen) return;
      falarMarco('Toca no tamanho ou no + para selecionar. Duvida grande? Aperta no Marco fixo aqui embaixo e cai na cozinha.', 7200);
    }, 3800);

  const abrirFoto = (src, alt = '') => {
    if (!src) return;
    vibrate(10);
    trackMeta('PhotoView', {
      content_name: alt || pratoAberto?.nome || 'Foto do prato',
      content_type: 'product',

  const fecharDetalhe = () => {
    clearTimeout(detailGuideTimer.current);
    setPratoAberto(null);
    setDetailOptions({});
    setDetailObs('');
  };

  const quantidadeGrupo = (grupoId, options = detailOptions) => {
    const map = options[String(grupoId)] ?? {};
    return Object.values(map).reduce((s, qtd) => s + Number(qtd || 0), 0);
  };

  const qtdOpcional = (grupoId, opcionalId) => {
    return Number(detailOptions[String(grupoId)]?.[String(opcionalId)] ?? 0);
  };

  const alterarOpcional = (grupo, opcional, delta) => {
    detailInteragiuRef.current = true;
    setDetailOptions(prev => {
      const gid = String(grupo.id);
      const oid = String(opcional.id);
      const atualGrupo = { ...(prev[gid] ?? {}) };
      const atual = Number(atualGrupo[oid] ?? 0);
      const max = Math.max(1, Number(grupo.max_escolhas || 1));

      if (delta > 0) {
        if (max === 1) {
          return { ...prev, [gid]: { [oid]: 1 } };
        }
        const totalGrupo = Object.values(atualGrupo).reduce((s, qtd) => s + Number(qtd || 0), 0);
        if (totalGrupo >= max) {
          vibrate(35);
          setBalaoTexto(`Nesse grupo da pra escolher ate ${max}.`);
          setTimeout(() => setBalaoTexto(null), 3200);
          return prev;
        }
      }

      const novo = Math.max(0, atual + delta);
      if (novo <= 0) delete atualGrupo[oid];
      else atualGrupo[oid] = novo;
      return { ...prev, [gid]: atualGrupo };
    });
  };

  const opcionaisSelecionados = (prato = pratoAberto) => {
    return gruposDoPrato(prato).flatMap(grupo => {
      const map = detailOptions[String(grupo.id)] ?? {};
      return (grupo.opcionais ?? [])
        .map(opcional => ({ ...opcional, grupo_id: grupo.id, grupo_nome: grupo.nome, qtd: Number(map[String(opcional.id)] ?? 0) }))
        .filter(opcional => opcional.qtd > 0);
    });
  };

  const tamanhoSelecionado = (prato = pratoAberto) => {
    return tamanhosDoPrato(prato).find(t => String(t.id) === String(detailSizeId)) ?? null;
  };

  const selecionarTamanho = (tamanho) => {
    detailInteragiuRef.current = true;
    clearTimeout(detailGuideTimer.current);
    setDetailSizeId(tamanho.id);
    vibrate(10);
    const key = String(tamanho?.peso_g || tamanho?.nome || tamanho?.id || '');

      falarMarco(fraseTamanho(tamanho), 6200);
    }

  const calcularUnitarioDetalhe = (prato = pratoAberto) => {
    if (!prato) return 0;
    const tamanho = tamanhoSelecionado(prato);
    const tamanhoDelta = Number(tamanho?.preco_delta || 0);
    const opcionaisTotal = opcionaisSelecionados(prato).reduce((s, op) => s + Number(op.preco_delta || 0) * Number(op.qtd || 0), 0);
    return Number(prato.preco || 0) + tamanhoDelta + opcionaisTotal;
  };

  const detalheValido = (prato = pratoAberto) => {
    if (!prato) return false;
    if (tamanhosDoPrato(prato).length && !detailSizeId) return false;
    return gruposDoPrato(prato).every(grupo => quantidadeGrupo(grupo.id) >= Number(grupo.min_escolhas || 0));

  const adicionarDetalheNaSacola = () => {

    detailInteragiuRef.current = true;

      nome: op.nome,

  const enviarImagemChat = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file || chatSending) return;
    setChatSending(true);
    const localId = `local-img-${Date.now()}`;
    try {
      const { base64, mime } = await comprimirImagemBase64(file);
      setMensagens(m => [...m, { id: localId, autor: 'cliente', midia_url: `data:${mime};base64,${base64}`, midia_tipo: 'imagem' }]);
      const data = await registrarMensagemCliente('', { base64, mime, tipo: 'imagem' });
      const url = data?.mensagem?.contexto?.midia_url;
      if (url) setMensagens(m => m.map(msg => msg.id === localId ? { ...msg, remote_id: data.mensagem.id, midia_url: url } : msg));
    } catch (err) {
      setMensagens(m => [...m, { id: `err-${Date.now()}`, autor: 'marco', texto: 'Nao consegui enviar a foto. Tenta de novo.' }]);
    } finally {
      setChatSending(false);
    }

  const toggleGravacaoAudio = async () => {
    if (gravandoAudio) {
      try { mediaRecorderRef.current && mediaRecorderRef.current.stop(); } catch (_) {}
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
      setMensagens(m => [...m, { id: `err-${Date.now()}`, autor: 'marco', texto: 'Seu navegador nao permite gravar audio por aqui.' }]);
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimePref = (typeof MediaRecorder.isTypeSupported === 'function' && MediaRecorder.isTypeSupported('audio/webm')) ? 'audio/webm' : '';
      const rec = new MediaRecorder(stream, mimePref ? { mimeType: mimePref } : undefined);
      audioChunksRef.current = [];
      rec.ondataavailable = ev => { if (ev.data && ev.data.size) audioChunksRef.current.push(ev.data); };
      rec.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        setGravandoAudio(false);
        const tipoBlob = (rec.mimeType || 'audio/webm').split(';')[0];
        const blob = new Blob(audioChunksRef.current, { type: tipoBlob });
        if (blob.size < 800) return;
        setChatSending(true);
        const localId = `local-aud-${Date.now()}`;
        try {
          setMensagens(m => [...m, { id: localId, autor: 'cliente', midia_url: URL.createObjectURL(blob), midia_tipo: 'audio' }]);
          const base64 = await blobParaBase64(blob);
          const data = await registrarMensagemCliente('', { base64, mime: tipoBlob, tipo: 'audio' });
          const url = data?.mensagem?.contexto?.midia_url;
          if (url) setMensagens(m => m.map(msg => msg.id === localId ? { ...msg, remote_id: data.mensagem.id, midia_url: url } : msg));
        } catch (err) {
          setMensagens(m => [...m, { id: `err-${Date.now()}`, autor: 'marco', texto: 'Nao consegui enviar o audio.' }]);
        } finally {
          setChatSending(false);
        }
      };
      mediaRecorderRef.current = rec;
      rec.start();
      setGravandoAudio(true);
      vibrate(15);
    } catch (err) {
      setMensagens(m => [...m, { id: `err-${Date.now()}`, autor: 'marco', texto: 'Preciso da permissao do microfone pra gravar o audio.' }]);
    }
  };

    return (
      <>
        <div className="nhoque-intro">O nhoque é da casa. Você escolhe o molho:</div>
        <div className="sauce-tabs">
          {lista.map((p, i) => (
            <button key={`${prefix}-tab-${p.id}`} className={i === sel ? 'on' : ''} type="button" onClick={() => setNhoqueSel(s => ({ ...s, [prefix]: i }))}>
              <span className="dot" style={{ background: sauceColor(p.nome) }}></span>
              {String(p.nome).replace(/nhoque|molho/gi, '').trim() || p.nome}
            </button>
          ))}
        </div>
        <div className="sauce-stage">
          {lista.map((p, i) => (
            <div key={`${prefix}-card-${p.id}`} className={`sauce-card ${i === sel ? 'on' : ''}`}>
              {renderDishClaude(p, `${prefix}-c`)}
            </div>
          ))}
        </div>
      </>
    );
  };

  const renderDoceCard = (p, prefix = 'doce') => (
    <div key={`${prefix}-${p.id}`} className="doce-card" onClick={() => abrirDetalhe(p)}>
      <img src={p.foto} alt={p.nome} loading="lazy" />
      <div className="wedge"></div>
      <div className="vig"></div>
      <div className="fc">
        <div className="k">
          <svg className="ic" viewBox="0 0 24 24"><path d="M5 8h11v5a5 5 0 01-5 5H10a5 5 0 01-5-5z"/><path d="M16 9h2a2 2 0 010 4h-2"/><path d="M8 3v2M11 3v2"/></svg>
          Doce final
        </div>
        <h3>{p.nome}</h3>
        {introPrato(p) && <p>{introPrato(p)}</p>}
        <span className="price">{fmtBRL(p.preco)}</span>
        <br />
        <button className="btn-order" type="button" onClick={(e) => { e.stopPropagation(); abrirDetalhe(p); }}>Pedir →</button>
      </div>
    </div>
  );

  const renderSecaoCardapio = (secao, index) => {
    const tipo = secao.tipo_visual || 'lista_editorial';
    const pratosSecao = secao.pratos || [];
    const pxClass = tipo === 'lista_editorial' ? 'px-white'
      : tipo === 'risotos' ? 'px-wine'
      : tipo === 'sobremesas' ? 'px-espresso' : '';
    const style = {
      ...(secao.cor_fundo ? { background: secao.cor_fundo } : {}),
      ...(secao.cor_texto ? { color: secao.cor_texto } : {}),
    };
    return (
      <section className={`section ${pxClass}`.trim()} key={secao.id} id={`secao-${secao.id}`} style={style}>
        <header className="section-head">
          <div className="number">Capítulo {String(index + 1).padStart(2, '0')}</div>
          <h2>{secao.titulo}</h2>
          {secao.descricao && <p>{secao.descricao}</p>}
        </header>
        {tipo === 'carrossel_horizontal' && (
          <div className="poster-row">{pratosSecao.map(p => renderPosterCard(p, secao.id))}</div>
        )}
        {tipo === 'feature_foto_grande' && (
          <div className="feature-stack">
            {pratosSecao[0] && renderFeatureCard(pratosSecao[0], secao.id)}
            {pratosSecao.length > 1 && (
              <div className="dish-list">{pratosSecao.slice(1).map(p => renderPratoCard(p, secao.id))}</div>
            )}
          </div>
        )}
        {tipo === 'nhoque_molhos' && renderNhoqueSection(pratosSecao, secao.id)}
        {tipo === 'sobremesas' && (
          <div className="doce-grid">{pratosSecao.map(p => renderDoceCard(p, secao.id))}</div>
        )}
        {!['carrossel_horizontal','feature_foto_grande','nhoque_molhos','sobremesas'].includes(tipo) && (
          <div className="dish-list">{pratosSecao.map(p => renderPratoCard(p, secao.id))}</div>
        )}
      </section>

  const topo = { ...DEFAULT_TOPO_CONFIG, ...(deliveryConfig.topo || {}) };
  const heroLogoUrl = String(topo.logo_url || '').trim();
  const heroCapaUrl = String(topo.capa_url || '').trim();
  const heroVideoUrl = String(topo.capa_video_url || '').trim();
  const heroTipo = String(topo.capa_tipo || 'imagem').toLowerCase();
  const heroMediaUrl = heroTipo === 'video' ? (heroVideoUrl || heroCapaUrl) : heroCapaUrl;
  const heroIsVideo = heroTipo === 'video' && !!heroMediaUrl;
  const heroHasMedia = !!heroMediaUrl;
  const heroShellClass = ['hero-shell', heroHasMedia ? 'has-media' : '', heroLogoUrl ? 'has-logo' : ''].filter(Boolean).join(' ');
  const nomeCapa = String(topo.nome || 'Dom Leonardo').trim();
  const nomeCapaParts = nomeCapa.split(/\s+/);
  const nomeCapa1 = nomeCapaParts.shift() || nomeCapa;
  const nomeCapa2 = nomeCapaParts.join(' ');
  const totalCategoriasCapa = (categorias || []).length;
  const totalPratosCapa = (pratos || []).length;

  return (
    <div className="min-h-dvh">

        <div className="capa-grain"></div>
        <div className="capa-top">
          {heroLogoUrl ? (
            <div className="capa-logo"><img src={heroLogoUrl} alt={nomeCapa} /></div>
          ) : <span></span>}
          <span className="capa-pill">Aberto agora</span>
        </div>
        <div className="capa-center">
          <span className="capa-eyebrow">{topo.kicker}</span>
          <span className="capa-bemvindo">Bem-vindo</span>
          <h1 className="capa-title">{nomeCapa1}{nomeCapa2 && <em>{nomeCapa2}</em>}</h1>
          <div className="capa-orn"><span className="l"></span><i>◆</i><span className="r"></span></div>
          <p className="capa-sub">{topo.descricao}</p>
          <div className="capa-meta">{totalCategoriasCapa} capítulos · {totalPratosCapa} pratos</div>
        </div>
        <div className="capa-cue">role o menu ↓</div>

        <nav className="nav" aria-label="Categorias">
          <button className={categoriaAtiva === 'todos' ? 'on' : ''} onClick={() => selecionarCategoriaCardapio('todos', 'Todos')}>Todos</button>
          {categorias.map(cat => (
            <button key={cat.id} className={String(categoriaAtiva) === String(cat.id) ? 'on' : ''} onClick={() => selecionarCategoriaCardapio(cat.id, cat.nome)}>
              {cat.nome}
            </button>
          ))}
        </nav>
        <div className="prototype-sections">
          {carregandoPratos && <div className="cart-empty">Carregando cardapio...</div>}
          {menuErro && <div className="cart-empty">{menuErro}</div>}

            <div className="cart-empty">Nenhum prato encontrado nessa categoria.</div>
          )}
        </div>

      {/* Detalhe do prato - fluxo estilo delivery */}

                <button className="dish-close" onClick={fecharDetalhe} aria-label="Voltar">

                </button>
                <img
                  src={pratoAberto.foto}
                  alt={pratoAberto.nome}
                  onClick={() => abrirFoto(pratoAberto.foto, pratoAberto.nome)}
                />
                <div className="dish-store-pill">
                  <div className="dish-store-logo">DL</div>
                  <div>
                    <strong>Dom Leonardo</strong>
                    <div className="text-xs text-[var(--text-dim)]">Monte do seu jeito</div>
                  </div>
                </div>
              </div>

              <div className="dish-info">
                {(pratoAberto.selo_experiencia || pratoAberto.badge_destaque) && (

                <h2 className="font-serif">{pratoAberto.nome}</h2>
                {pratoAberto.frase_fome && <p style={{color:'rgba(243,236,224,0.9)', fontWeight:700}}>{pratoAberto.frase_fome}</p>}
                {pratoAberto.descricao && <p>{clampText(pratoAberto.descricao, 165)}</p>}
                <div className="dish-start-price">a partir de {fmtBRL(pratoAberto.preco)}</div>
              </div>

              <div className="choice-block">
                <div className="choice-head">
                  <div>
                    <div className="choice-title">Tamanho</div>
                    <div className="choice-subtitle">Escolha 1 opcao</div>
                  </div>
                  <span className="choice-required">OBRIGATORIO</span>
                </div>
                {tamanhosDoPrato(pratoAberto).map(tam => (
                  <button
                    key={tam.id}
                    className="choice-row"
                    onClick={() => selecionarTamanho(tam)}
                  >
                    <div className="choice-main">
                      <div className="choice-name">{labelTamanho(tam)}</div>
                      <div className="choice-price">
                        {Number(tam.preco_delta || 0) > 0 ? `+ ${fmtBRL(Number(tam.preco_delta))}` : 'sem adicional'}
                      </div>
                    </div>
                    <span className={`choice-dot ${String(detailSizeId) === String(tam.id) ? 'active' : ''}`}></span>
                  </button>
                ))}

              </div>

              {gruposDoPrato(pratoAberto).map(grupo => (
                <div className="choice-block" key={grupo.id}>
                  <div className="choice-head">
                    <div>
                      <div className="choice-title">{grupo.nome}</div>
                      <div className="choice-subtitle">
                        {Number(grupo.min_escolhas || 0) > 0
                          ? `Escolha no minimo ${grupo.min_escolhas}`

                      </div>
                    </div>
                    {Number(grupo.min_escolhas || 0) > 0 && <span className="choice-required">OBRIGATORIO</span>}
                  </div>
                  {(grupo.opcionais ?? []).map(opcional => {
                    const qtd = qtdOpcional(grupo.id, opcional.id);
                    return (
                      <div className="choice-row" key={opcional.id}>
                        <div className="choice-main">
                          <div className="choice-name">{opcional.nome}</div>
                          {opcional.descricao && <div className="choice-desc">{opcional.descricao}</div>}
                          <div className="choice-price">
                            {Number(opcional.preco_delta || 0) > 0 ? `+ ${fmtBRL(Number(opcional.preco_delta))}` : 'sem adicional'}
                          </div>
                        </div>
                        {opcional.foto ? (
                          <img
                            className="option-thumb"
                            src={opcional.foto}
                            alt={opcional.nome}
                            loading="lazy"
                            onClick={(e) => { e.stopPropagation(); abrirFoto(opcional.foto, opcional.nome); }}
                          />
                        ) : (
                          <div className="option-thumb fallback">extra</div>
                        )}
                        {qtd > 0 ? (
                          <div className="stepper-small">
                            <button onClick={() => alterarOpcional(grupo, opcional, -1)}>-</button>
                            <span>{qtd}</span>
                            <button onClick={() => alterarOpcional(grupo, opcional, 1)}>+</button>
                          </div>
                        ) : (
                          <button className="plus-only" onClick={() => alterarOpcional(grupo, opcional, 1)}>+</button>
                        )}
                      </div>
                    );
                  })}
                </div>
              ))}

              <div className="choice-block">
                <div className="choice-head">
                  <div>
                    <div className="choice-title">Observacao</div>
                    <div className="choice-subtitle">Opcional, do jeitinho que voce gosta</div>
                  </div>
                </div>
                <div style={{padding:'14px 20px'}}>
                  <textarea
                    className="obs-input"
                    style={{width:'100%', minHeight: 86, borderRadius: 16, resize:'none'}}
                    value={detailObs}
                    onChange={e => { detailInteragiuRef.current = true; setDetailObs(e.target.value); }}
                    placeholder="Ex: sem cebola, ponto da carne, embalagem separada..."
                  ></textarea>
                </div>
              </div>
            </div>

            <div className="dish-footer">
              <div className="qty-stepper">
                <button onClick={() => { detailInteragiuRef.current = true; setDetailQty(q => Math.max(1, q - 1)); }}>-</button>
                <span>{detailQty}</span>
                <button onClick={() => { detailInteragiuRef.current = true; setDetailQty(q => q + 1); }}>+</button>
              </div>
              <button className={`add-dish-btn ${detalheValido(pratoAberto) ? '' : 'disabled'}`} onClick={adicionarDetalheNaSacola}>
                <span>Adicionar</span>
                <span>{fmtBRL(calcularUnitarioDetalhe(pratoAberto) * detailQty)}</span>
              </button>
            </div>
          </>
        )}
      </section>

      {/* Sacola */}
      {carrinho.length > 0 && !chatOpen && !pratoAberto && !sacolaOpen && (
        <div className={`sacola-bar ${carrinhoPulse ? 'pulse' : ''}`}>
          <div className="sacola-summary">
            <small>Total sem entrega</small>
            <strong>{fmtBRL(carrinhoTotal)} / {totalItens} {totalItens === 1 ? 'item' : 'itens'}</strong>
          </div>
          <button className="sacola-main-btn" onClick={abrirSacola}>Ver sacola</button>
        </div>
      )}

      <div
        className={`bag-backdrop ${sacolaOpen ? 'open' : ''} ${whatsEnderecoOpen ? 'checkout-mode' : ''}`}
        onClick={() => {
          if (!whatsEnderecoOpen) setSacolaOpen(false);
        }}
      ></div>
      <section className={`bag-sheet ${sacolaOpen ? 'open' : ''}`} aria-hidden={!sacolaOpen}>
        <div className="bag-head">
          <button className="bag-close" onClick={() => {
            if (whatsEnderecoOpen) {
              resetStripeCheckout();
              setCheckoutErrors({});
              setWhatsEnderecoOpen(false);
            } else {
              setSacolaOpen(false);
            }
          }} aria-label="Voltar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <h2>Sacola</h2>
          {!!carrinho.length && <button className="bag-clear" onClick={() => { resetStripeCheckout(); resetCheckoutDados(); setCarrinho([]); setCarrinhoTotal(0); setWhatsEnderecoOpen(false); }}>Limpar</button>}
        </div>
        <div className="bag-scroll">
          <div className="bag-store">
            <div className="bag-logo">DL</div>
            <div>
              <strong>Dom Leonardo</strong>
              <button className="bag-link" onClick={() => { setWhatsEnderecoOpen(false); setSacolaOpen(false); }}>Adicionar mais itens</button>
            </div>
          </div>

          {!carrinho.length && <div className="cart-empty">Sua sacola esta vazia.</div>}
          {carrinho.map(item => (
            <div className="bag-item" key={item.local_id}>
              <div>
                <div className="bag-item-title">{item.qtd}x {item.nome}</div>
                <div className="bag-item-meta">
                  {item.tamanho?.nome && <div>{labelTamanho(item.tamanho)}</div>}
                  {item.opcionais?.length > 0 && <div>{item.opcionais.map(op => `${op.qtd}x ${op.nome}`).join(', ')}</div>}
                  {item.obs && <div>obs: {item.obs}</div>}
                </div>
                <button className="bag-remove" onClick={() => removerItemSacola(item.local_id)}>Remover</button>
              </div>
              <div className="bag-item-price">{fmtBRL(item.subtotal)}</div>
            </div>
          ))}

          {whatsEnderecoOpen && checkoutStage === 'dados' && (
            <div className="bag-values">
              <div className="checkout-card">
                <div className="checkout-mini-grid">
                  <div className="checkout-section">
                    <h3>Endereço para entrega</h3>
                    <p>Quanto mais certinho o ponto, menos chance do entregador ficar rodando.</p>
                    <div className="checkout-map-panel">
                      <div className="checkout-map-head">
                        <div>
                          <strong>Permitir localização <span>(recomendado)</span></strong>
                          <span>Ajuda a achar sua rua e posicionar o pino de entrega.</span>
                        </div>
                        <div className="checkout-map-chip">{mapPin ? 'pino pronto' : 'opcional'}</div>
                      </div>
                      <button className="checkout-location-btn" disabled={mapsLoading} onClick={usarLocalizacaoAtual}>
                        {mapsLoading ? 'Abrindo localização...' : <>Permitir localização <strong>(recomendado)</strong></>}
                      </button>
                      {mapsReady && (
                        <>
                          <input
                            ref={addressSearchRef}
                            className="checkout-input checkout-map-search"
                            placeholder="Ou busque rua, numero ou CEP"
                            defaultValue={mapAddressLabel}
                            autoComplete="off"
                          />
                          <div ref={mapCanvasRef} className="checkout-map-canvas"></div>
                          <div className="checkout-map-actions">
                            <button type="button" disabled={mapsLoading} onClick={usarLocalizacaoAtual}>
                              Usar minha localização
                            </button>
                          </div>
                          <p className="checkout-map-note">
                            {mapAddressLabel || 'Se a entrada for em outro ponto, arrasta o pino no mapa.'}
                          </p>
                        </>
                      )}
                      {!mapsReady && <p className="checkout-map-note">Se preferir, preenche manualmente. O mapa é só para facilitar.</p>}
                      {mapsError && <div className="checkout-map-error">{mapsError}</div>}
                    </div>
                  </div>

                  <div className="checkout-field full">
                    <label className="checkout-label">Rua</label>
                    <input
                      className={`checkout-input ${checkoutErrors.rua ? 'invalid' : ''}`}
                      value={checkoutDados.rua}
                      onChange={e => setCheckoutField('rua', e.target.value)}
                      placeholder="Ex.: Rua das Flores"
                      autoComplete="address-line1"
                    />
                  </div>
                  <div className="checkout-field">
                    <label className="checkout-label">Número</label>
                    <input
                      className={`checkout-input ${checkoutErrors.numero ? 'invalid' : ''}`}
                      value={checkoutDados.numero}
                      onChange={e => setCheckoutField('numero', e.target.value)}
                      placeholder="Ex.: 123"
                      inputMode="numeric"
                      autoComplete="address-line2"
                    />
                  </div>
                  <div className="checkout-field">
                    <label className="checkout-label">Bairro</label>
                    <input
                      className={`checkout-input ${checkoutErrors.bairro ? 'invalid' : ''}`}
                      value={checkoutDados.bairro}
                      onChange={e => setCheckoutField('bairro', e.target.value)}
                      placeholder="Ex.: Centro"
                      autoComplete="address-level3"
                    />
                  </div>
                  <div className="checkout-field full">
                    <label className="checkout-label">Complemento <span className="opt">(opcional)</span></label>
                    <input
                      className="checkout-input"
                      value={checkoutDados.complemento}
                      onChange={e => setCheckoutField('complemento', e.target.value)}
                      placeholder="Apto, bloco, ponto de referência"
                      autoComplete="address-line3"
                    />

                  <div className="checkout-section">

                    <p>Só pra te identificar e o entregador te achar.</p>

                  <div className="checkout-field">

                    <input
                      className={`checkout-input ${checkoutErrors.nome ? 'invalid' : ''}`}
                      value={checkoutDados.nome}
                      onChange={e => setCheckoutField('nome', e.target.value)}
                      placeholder="Como te chamar"
                      autoComplete="name"
                    />
                  </div>
                  <div className="checkout-field">
                    <label className="checkout-label">WhatsApp</label>
                    <input
                      className={`checkout-input ${checkoutErrors.whatsapp ? 'invalid' : ''}`}
                      value={checkoutDados.whatsapp}
                      onChange={e => setCheckoutField('whatsapp', e.target.value)}
                      placeholder="(41) 9 9999-9999"
                      inputMode="tel"
                      autoComplete="tel"
                    />

                </div>

                  <div className="delivery-estimate-title">
                    <strong>Entrega na sua casa</strong>
                    <span>{entregaEstimativa?.fonte === 'google_maps' ? 'Google Maps' : 'estimativa'}</span>
                  </div>
                  {entregaEstimativa ? (
                    <>
                      <div className="delivery-estimate-grid">

                          <strong>{entregaEstimativa.texto_tempo}</strong>
                        </div>

                      <p className="delivery-estimate-note">

                {entregaError && <div className="checkout-error">{entregaError}</div>}

                  <span>Mercado Pago · na hora</span>

                <div className="pix-copia">

                    {pixCopiado ? 'Código copiado ✓' : 'Copiar código Pix'}
                  </button>
                </div>
                <div className="pix-status">
                  <span className="pix-status-dot"></span>
                  Aguardando o pagamento… confirmo aqui sozinho assim que o Pix cair.
                </div>
                <div className="pix-total">
                  <span>Total</span>
                  <strong>{fmtBRL(pixData?.total || totalComEntrega)}</strong>
                </div>
                {checkoutError && <div className="checkout-error">{checkoutError}</div>}
              </div>
            </div>
          )}

          {whatsEnderecoOpen && checkoutStage === 'sucesso' && (() => {
            const et = etapaDoPedido(pedidoStatus);
            const recusado = et.key === 'recusado';
            const steps = [
              { k: 'aguardando_aceite', label: 'Pago' },
              { k: 'preparo', label: 'Em preparo' },
              { k: 'a_caminho', label: 'A caminho' },
              { k: 'entregue', label: 'Entregue' },
            ];
            const cur = recusado ? -1 : et.idx;
            const numero = pedidoStatus?.numero_pedido || pedidoEmAcompanhamento?.numero || '';
            const msgEtapa = {
              aguardando_aceite: 'Pagamento confirmado! Esperando o Dom aceitar na cozinha…',
              preparo: 'O Dom aceitou e esta preparando seu pedido. 👨‍🍳',
              a_caminho: 'Saiu para entrega! 🛵',
              entregue: 'Entregue. Buon appetito! 🍝',
            };
            return (
              <div className="bag-values">
                <div className="checkout-card pedido-card">
                  <h3>{recusado ? 'Pedido nao aceito' : `Pedido${numero ? ` #${numero}` : ''}`}</h3>
                  {recusado ? (
                    <div className="pedido-recusado">
                      O Dom nao conseguiu preparar agora e seu Pix foi <strong>estornado</strong> — o valor volta pra sua conta. Qualquer duvida, chama o Marco aqui.
                    </div>
                  ) : (
                    <>
                      <div className="pedido-track">
                        {steps.map((s, i) => (
                          <div key={s.k} className={`pedido-step ${i <= cur ? 'done' : ''} ${i === cur ? 'current' : ''}`}>
                            <span className="pedido-dot"></span>
                            <span className="pedido-step-label">{s.label}</span>
                          </div>
                        ))}
                      </div>
                      <p className="pedido-track-msg">{msgEtapa[et.key] || 'Acompanhe seu pedido por aqui.'}</p>
                      {pedidoStatus?.uber_tracking_url && et.key === 'a_caminho' && (
                        <a className="pedido-track-link" href={pedidoStatus.uber_tracking_url} target="_blank" rel="noreferrer">Rastrear o motoboy →</a>
                      )}
                      <p className="pedido-track-hint">Pode fechar — o Marco te avisa aqui a cada novidade.</p>
                    </>
                  )}
                </div>
              </div>
            );
          })()}

          {checkoutStage === 'dados' && (
          <div className="bag-values">
            <h3>Resumo de valores</h3>
            <div className="value-row"><span>Subtotal</span><strong>{fmtBRL(carrinhoTotal)}</strong></div>
            <div className="value-row">
              <span>Taxa de entrega</span>
              <strong>{cupomResumo.ok && cupomResumo.freteGratis ? 'Gratis' : fmtBRL(taxaEntregaFinal)}</strong>
            </div>
            {descontoFreteChef > 0 && !(cupomResumo.ok && cupomResumo.freteGratis) && (
              <div className="value-row discount">
                <span>Frete por conta do chef</span>
                <strong>- {fmtBRL(descontoFreteChef)}</strong>
              </div>
            )}
            {descontoCupom > 0 && (
              <div className="value-row discount">
                <span>Desconto {String(cupomAplicado?.codigo || '').toUpperCase()}</span>
                <strong>- {fmtBRL(descontoCupom)}</strong>
              </div>
            )}
            <div className="value-row total"><span>Total estimado</span><strong>{fmtBRL(totalComEntrega)}</strong></div>
          </div>
          )}
        </div>
        <div className={`bag-footer ${whatsEnderecoOpen ? 'address-step' : ''}`}>
          {!whatsEnderecoOpen ? (
            <button className="bag-primary-btn" onClick={fecharPedido}>
              <span>Finalizar pedido</span>
              <span>{fmtBRL(totalComEntrega)}</span>
            </button>
          ) : checkoutStage === 'dados' ? (
            <div className="checkout-actions">
              <button className="checkout-primary" disabled={checkoutLoading} onClick={gerarPixMercadoPago}>
                {checkoutLoading ? 'Gerando Pix...' : `Gerar Pix · ${fmtBRL(totalComEntrega)}`}
              </button>
              <button className="checkout-secondary" disabled={checkoutLoading} onClick={() => finalizarPedidoDireto()}>
                Finalizar pelo WhatsApp
              </button>
            </div>
          ) : checkoutStage === 'pagamento' ? (
            <div className="checkout-actions">
              <button className="checkout-primary" disabled={pixVerificando} onClick={verificarPagamentoPix}>
                {pixVerificando ? 'Verificando...' : 'Já paguei'}
              </button>
              <button className="checkout-secondary" disabled={pixVerificando} onClick={resetStripeCheckout}>
                Voltar e editar dados
              </button>
            </div>
          ) : (
            <div className="checkout-actions">
              <button className="checkout-primary" onClick={() => { resetStripeCheckout(); setWhatsEnderecoOpen(false); setSacolaOpen(false); }}>
                Voltar ao cardápio
              </button>
            </div>
          )}
        </div>
      </section>

      {pedidoStatus && !sacolaOpen && !chatOpen && !pratoAberto && !acompanhamentoOpen && (() => {
        const et = etapaDoPedido(pedidoStatus);
        return (
          <button className={`pedido-pill ${et.key === 'recusado' ? 'recusado' : ''}`} onClick={() => setAcompanhamentoOpen(true)}>
            <span className="pedido-pill-dot"></span>
            <span>📦 Pedido{pedidoStatus.numero_pedido ? ` #${pedidoStatus.numero_pedido}` : ''} · {ETAPA_LABEL[et.key] || 'acompanhar'}</span>
          </button>
        );
      })()}

      {acompanhamentoOpen && (() => {
        const et = etapaDoPedido(pedidoStatus);
        const recusado = et.key === 'recusado';
        const steps = [
          { k: 'aguardando_aceite', label: 'Pago' },
          { k: 'preparo', label: 'Em preparo' },
          { k: 'a_caminho', label: 'A caminho' },
          { k: 'entregue', label: 'Entregue' },
        ];
        const cur = recusado ? -1 : et.idx;
        const msgEtapa = {
          aguardando_aceite: 'Pagamento confirmado! Esperando o Dom aceitar na cozinha…',
          preparo: 'O Dom aceitou e esta preparando seu pedido. 👨‍🍳',
          a_caminho: 'Saiu para entrega! 🛵',
          entregue: 'Entregue. Buon appetito! 🍝',
        };
        return (
          <div className="acomp-backdrop" onClick={() => setAcompanhamentoOpen(false)}>
            <div className="acomp-card" onClick={e => e.stopPropagation()}>
              <button className="acomp-close" onClick={() => setAcompanhamentoOpen(false)} aria-label="Fechar">✕</button>
              <h3>{recusado ? 'Pedido nao aceito' : `Seu pedido${pedidoStatus?.numero_pedido ? ` #${pedidoStatus.numero_pedido}` : ''}`}</h3>
              {recusado ? (
                <div className="pedido-recusado">O Dom nao conseguiu preparar e seu Pix foi estornado — o valor volta pra sua conta.</div>
              ) : (
                <>
                  <div className="pedido-track">
                    {steps.map((s, i) => (
                      <div key={s.k} className={`pedido-step ${i <= cur ? 'done' : ''} ${i === cur ? 'current' : ''}`}>
                        <span className="pedido-dot"></span>
                        <span className="pedido-step-label">{s.label}</span>
                      </div>
                    ))}
                  </div>
                  <p className="pedido-track-msg">{msgEtapa[et.key] || 'Acompanhe seu pedido por aqui.'}</p>
                  {pedidoStatus?.uber_tracking_url && et.key === 'a_caminho' && (
                    <a className="pedido-track-link" href={pedidoStatus.uber_tracking_url} target="_blank" rel="noreferrer">Rastrear o motoboy →</a>
                  )}
                </>
              )}
              <button className="acomp-chat-btn" onClick={() => { setAcompanhamentoOpen(false); setSacolaOpen(false); setPratoAberto(null); setChatOpen(true); }}>
                {(et.key === 'entregue' || recusado) ? 'Algum problema? Fala com a gente' : 'Falar com a gente'}
              </button>
            </div>
          </div>
        );
      })()}

      {fotoAberta && (
        <div className="photo-viewer-backdrop" onClick={() => setFotoAberta(null)}>
          <div className="photo-viewer" onClick={e => e.stopPropagation()}>
            <button className="photo-close" onClick={() => setFotoAberta(null)} aria-label="Fechar foto">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M6 6l12 12M6 18L18 6"/></svg>
            </button>
            <img src={fotoAberta.src} alt={fotoAberta.alt || 'Foto do prato'} />
          </div>
        </div>
      )}

      {/* Marco sticker */}
      <button
        className={`marco-sticker ${garcomState} ${(pratoAberto || sacolaOpen || fotoAberta) ? 'top-mode' : ''}`}
        onClick={tapMarco}
        onTouchStart={onPressStart}
        onTouchEnd={onPressEnd}
        onMouseDown={onPressStart}
        onMouseUp={onPressEnd}
        onMouseLeave={onPressEnd}
        aria-label="Chamar o Marco"
      >
        <span className="halo"></span>
        <span className={`marco-cart-badge ${carrinho.length > 0 ? 'show' : ''} ${carrinhoPulse ? 'pulse' : ''}`}>
          {carrinho.reduce((s, it) => s + it.qtd, 0)}
        </span>
        <MarcoSticker />
      </button>

      {/* Balao de fala */}
      <div className={`balao ${balaoTexto && !chatOpen ? 'shown' : ''}`}>
        {balaoTexto}
      </div>

      {/* Backdrop + Bottom sheet */}
      <div className={`bottom-sheet-backdrop ${chatOpen ? 'open' : ''}`} onClick={fecharChat}></div>
      <div className={`bottom-sheet ${chatOpen ? 'open' : ''}`}>
        <div className="grip" />
        <header>
          <div style={{width:'40px', height:'40px'}}><MarcoSticker /></div>
          <div className="flex-1">
            <div className="font-serif text-lg leading-none" style={{color:'var(--gold)'}}>Marco</div>
            <div className="text-xs text-[var(--text-dim)] mt-0.5">Garcom - online</div>
          </div>
          <button className="btn-icon" onClick={fecharChat} aria-label="Fechar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M6 6l12 12M6 18L18 6"/></svg>
          </button>
        </header>

        {/* Carrinho pill - aparece quando tem itens */}
        {carrinho.length > 0 && (
          <>
            <div
              className={`cart-pill ${carrinhoPulse ? 'pulse' : ''}`}
              onClick={() => { vibrate(15); setCarrinhoOpen(o => !o); }}
            >
              <div className="cart-left">
                <span className="cart-emoji">Sacola</span>
                <div className="cart-count">
                  <strong>{carrinho.reduce((s, it) => s + it.qtd, 0)}</strong> {carrinho.reduce((s, it) => s + it.qtd, 0) === 1 ? 'item' : 'itens'}
                  <br/>
                  <span style={{fontSize: '11px', color: 'var(--text-dim)'}}>{carrinhoOpen ? 'tap pra esconder' : 'tap pra ver'}</span>
                </div>
              </div>
              <span className="cart-total">{fmtBRL(carrinhoTotal)}</span>
            </div>
            <div className={`cart-drawer ${carrinhoOpen ? 'open' : ''}`}>
              {carrinho.map((it, i) => (
                <div key={i} className="cart-item">
                  <div className="qty">{it.qtd}</div>
                  <div className="info">
                    <div className="nome">{it.nome}</div>
                    {it.obs && <div className="obs">obs: {it.obs}</div>}
                  </div>
                  <div className="preco">{fmtBRL(it.preco * it.qtd)}</div>
                </div>
              ))}
              <button className="checkout-btn" onClick={() => { setChatOpen(false); setSacolaOpen(true); }}>Fechar pedido</button>
            </div>
          </>
        )}

        <div className="messages">
          {mensagens.map(m => (
            <div key={m.id} className={`msg ${m.autor}`}>
              {m.midia_tipo === 'imagem' && m.midia_url && (
                <img className="msg-foto" src={m.midia_url} alt="foto" onClick={() => setFotoAberta({ src: m.midia_url, alt: 'Foto do chat' })} />
              )}
              {m.midia_tipo === 'audio' && m.midia_url && (
                <audio className="msg-audio" src={m.midia_url} controls preload="none"></audio>
              )}
              {m.texto && <span className="msg-texto">{m.texto}</span>}
            </div>
          ))}
        </div>
        <div className="chat-compose">
          <label className={`chat-attach ${chatSending ? 'off' : ''}`} aria-label="Enviar foto">
            <input type="file" accept="image/*" style={{ display: 'none' }} onChange={enviarImagemChat} disabled={chatSending} />
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.2"/></svg>
          </label>
          <button className={`chat-attach ${gravandoAudio ? 'rec' : ''}`} onClick={toggleGravacaoAudio} disabled={chatSending} aria-label={gravandoAudio ? 'Parar gravacao' : 'Gravar audio'}>
            {gravandoAudio
              ? <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
              : <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>}
          </button>
          <input
            className="chat-input"
            value={chatInput}
            onChange={e => setChatInput(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') enviarMensagemChat(); }}
            placeholder={gravandoAudio ? 'Gravando audio...' : 'Mensagem para o Marco...'}
            autoComplete="off"
            disabled={gravandoAudio}
          />
          <button className="chat-send" onClick={enviarMensagemChat} disabled={!chatInput.trim() || chatSending} aria-label="Enviar mensagem">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  // Limpa service workers antigos do Garcom para o cardapio sempre vir do painel.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(reg => {
          if (reg.scope.includes('/garcom/')) reg.unregister().catch(() => {});
        });
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
