            };
            return (
              <div className="bag-values">
                <div className="checkout-card pedido-card">
                  <h3>{recusado ? 'Pedido nao aceito' : `Pedido${numero ? ` #${numero}` : ''}`}</h3>
                  {recusado ? (
                    <div className="pedido-recusado">
                      O Dom nao conseguiu preparar agora e seu Pix foi <strong>estornado</strong> — o valor volta pra sua conta. Qualquer duvida, chama o Marco aqui.
                    </div>
                  ) : (
                    <>
                      <div className="pedido-track">
                        {steps.map((s, i) => (
                          <div key={s.k} className={`pedido-step ${i <= cur ? 'done' : ''} ${i === cur ? 'current' : ''}`}>
                            <span className="pedido-dot"></span>
                            <span className="pedido-step-label">{s.label}</span>
                          </div>
                        ))}
                      </div>
                      <p className="pedido-track-msg">{msgEtapa[et.key] || 'Acompanhe seu pedido por aqui.'}</p>
                      {pedidoStatus?.uber_tracking_url && et.key === 'a_caminho' && (
                        <a className="pedido-track-link" href={pedidoStatus.uber_tracking_url} target="_blank" rel="noreferrer">Rastrear o motoboy →</a>
                      )}
                      <p className="pedido-track-hint">Pode fechar — o Marco te avisa aqui a cada novidade.</p>
                      <button className="co-wa-btn" style={{ marginTop: '14px' }} onClick={() => finalizarNoWhatsApp(true)}>
                        <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m0 18.15h-.01c-1.53 0-3.03-.41-4.34-1.19l-.31-.18-3.23.85.86-3.15-.2-.32a8.2 8.2 0 0 1-1.26-4.36c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.82c0 4.54-3.69 8.24-8.23 8.24m4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.8-.79.97-.14.16-.29.18-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.43-.14-.01-.31-.01-.48-.01a.93.93 0 0 0-.67.31c-.23.25-.87.85-.87 2.07s.89 2.4 1.02 2.56c.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28"/></svg>
                        Enviar meu pedido no WhatsApp
                      </button>
                    </>
                  )}
                </div>
              </div>
            );
          })()}

        </div>
        <div className={`bag-footer ${whatsEnderecoOpen ? 'address-step' : ''}`}>
          {!whatsEnderecoOpen ? (
            <button className="bag-primary-btn" onClick={fecharPedido}>
              <span>Finalizar pedido</span>
              <span>{fmtBRL(totalComEntrega)}</span>
            </button>
          ) : checkoutStage === 'dados' ? (
            <div className="checkout-actions">
              <button className="checkout-primary" disabled={checkoutLoading} onClick={revisarPedidoCheckout}>
                Avançar · {fmtBRL(totalComEntrega)}
              </button>
            </div>
          ) : checkoutStage === 'revisao' ? (
            <div className="checkout-actions">
              <button className="checkout-primary" disabled={checkoutLoading} onClick={fazerPedidoRevisado}>
                Fazer pedido · {fmtBRL(totalComEntrega)}
              </button>
              <button className="checkout-secondary" disabled={checkoutLoading} onClick={() => setCheckoutStage('dados')}>
                Voltar
              </button>
            </div>
          ) : checkoutStage === 'preparando' ? (
            <div className="checkout-actions">
              <button className="checkout-primary" disabled>
                Avisando o chef...
              </button>
            </div>
          ) : checkoutStage === 'pagamento' ? (
            <div className="checkout-actions">
              <button className="checkout-primary" disabled={pixVerificando || pixExpirado} onClick={verificarPagamentoPix}>
                {pixExpirado ? 'Pix expirado' : (pixVerificando ? 'Verificando...' : 'Já paguei')}
              </button>
              <button className="checkout-secondary" disabled={pixVerificando} onClick={resetStripeCheckout}>
                {pixExpirado ? 'Gerar novo Pix' : 'Voltar e editar dados'}
              </button>
            </div>
          ) : (
            <div className="checkout-actions">
              <button className="checkout-primary" onClick={() => { resetStripeCheckout(); setWhatsEnderecoOpen(false); setSacolaOpen(false); }}>
                Voltar ao cardápio
              </button>
            </div>
          )}
        </div>
      </section>

      {/* pílula do topo removida: o acompanhamento do pedido vive no Marco (Fase 2) */}

      {acompanhamentoOpen && (() => {
        const et = etapaDoPedido(pedidoStatus);
        const recusado = et.key === 'recusado';
        const steps = [
          { k: 'aguardando_aceite', label: 'Pago' },
          { k: 'preparo', label: 'Em preparo' },
          { k: 'a_caminho', label: 'A caminho' },
          { k: 'entregue', label: 'Entregue' },
        ];
        const cur = recusado ? -1 : et.idx;
        const msgEtapa = {
          aguardando_aceite: 'Pagamento confirmado! Esperando o Dom aceitar na cozinha…',
          preparo: 'O Dom aceitou e esta preparando seu pedido. 👨‍🍳',
          a_caminho: 'Saiu para entrega! 🛵',
          entregue: 'Entregue. Buon appetito! 🍝',
        };
        return (
          <div className="acomp-backdrop" onClick={() => setAcompanhamentoOpen(false)}>
            <div className="acomp-card" onClick={e => e.stopPropagation()}>
              <button className="acomp-close" onClick={() => setAcompanhamentoOpen(false)} aria-label="Fechar">✕</button>
              <h3>{recusado ? 'Pedido nao aceito' : `Seu pedido${pedidoStatus?.numero_pedido ? ` #${pedidoStatus.numero_pedido}` : ''}`}</h3>
              {recusado ? (
                <div className="pedido-recusado">O Dom nao conseguiu preparar e seu Pix foi estornado — o valor volta pra sua conta.</div>
              ) : (
                <>
                  <div className="pedido-track">
                    {steps.map((s, i) => (
                      <div key={s.k} className={`pedido-step ${i <= cur ? 'done' : ''} ${i === cur ? 'current' : ''}`}>
                        <span className="pedido-dot"></span>
                        <span className="pedido-step-label">{s.label}</span>
                      </div>
                    ))}
                  </div>
                  <p className="pedido-track-msg">{msgEtapa[et.key] || 'Acompanhe seu pedido por aqui.'}</p>
                  {pedidoStatus?.uber_tracking_url && et.key === 'a_caminho' && (
                    <a className="pedido-track-link" href={pedidoStatus.uber_tracking_url} target="_blank" rel="noreferrer">Rastrear o motoboy →</a>
                  )}
                </>
              )}
              <button className="acomp-chat-btn" onClick={() => { setAcompanhamentoOpen(false); setSacolaOpen(false); setPratoAberto(null); setChatOpen(true); }}>
                {(et.key === 'entregue' || recusado) ? 'Algum problema? Fala com a gente' : 'Falar com a gente'}
              </button>
            </div>
          </div>
        );
      })()}

      {infoOpen && (
        <div className="acomp-backdrop" onClick={() => setInfoOpen(false)}>
          <div className="acomp-card info-card" onClick={e => e.stopPropagation()}>
            <button className="acomp-close" onClick={() => setInfoOpen(false)} aria-label="Fechar">✕</button>
            <h3>Informações</h3>
            <div className="info-row"><span className="info-ic">🕒</span><div><strong>Horário</strong><p>{horarioResumo}</p></div></div>
            <div className="info-row"><span className="info-ic">🛵</span><div><strong>Como funciona a entrega</strong><p>{topo.como_funciona}</p></div></div>
            <div className="info-row"><span className="info-ic">📍</span><div><strong>Onde atendemos</strong><p>{topo.area_entrega}</p></div></div>
            {topo.endereco && (
              <div className="info-row"><span className="info-ic">🏠</span><div><strong>Endereço</strong><p>{topo.endereco}</p>{topo.maps_url && <a href={topo.maps_url} target="_blank" rel="noreferrer" className="info-link">Como chegar →</a>}</div></div>
            )}
            {telefoneDigits && (
              <div className="info-row"><span className="info-ic">📞</span><div><strong>Contato</strong><p>{telefoneContato}</p><a href={`https://wa.me/${telefoneDigits.startsWith('55') ? telefoneDigits : '55' + telefoneDigits}`} target="_blank" rel="noreferrer" className="info-link">Chamar no WhatsApp →</a></div></div>
            )}
          </div>
        </div>
      )}

      {fotoAberta && (
        <div className="photo-viewer-backdrop" onClick={() => setFotoAberta(null)}>
          <div className="photo-viewer" onClick={e => e.stopPropagation()}>
            <button className="photo-close" onClick={() => setFotoAberta(null)} aria-label="Fechar foto">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M6 6l12 12M6 18L18 6"/></svg>
            </button>
            <img src={fotoAberta.src} alt={fotoAberta.alt || 'Foto do prato'} />
          </div>
        </div>
      )}

      {/* Marco sticker */}
      <button
        className={`marco-sticker ${garcomState} ${(pratoAberto || fotoAberta || sacolaOpen) ? 'top-mode' : ''} ${sacolaOpen ? 'top-center' : ''} ${(carrinho.length > 0 && !sacolaOpen && !pratoAberto && !fotoAberta) ? 'raised' : ''}`}
        onClick={tapMarco}
        onTouchStart={onPressStart}
        onTouchEnd={onPressEnd}
        onMouseDown={onPressStart}
        onMouseUp={onPressEnd}
        onMouseLeave={onPressEnd}
        aria-label="Chamar o Marco"
      >
        <span className="halo"></span>
        <span className={`marco-cart-badge ${carrinho.length > 0 ? 'show' : ''} ${carrinhoPulse ? 'pulse' : ''}`}>
          {carrinho.reduce((s, it) => s + it.qtd, 0)}
        </span>
        <MarcoSticker />
      </button>

      {/* Balao de fala */}
      <div className={`balao ${balaoTexto && !chatOpen ? 'shown' : ''} ${(pratoAberto || fotoAberta || sacolaOpen) ? 'top-mode' : ''}`}>
        {balaoTexto}
      </div>

      {/* Backdrop + Bottom sheet */}
      <div className={`bottom-sheet-backdrop ${chatOpen ? 'open' : ''}`} onClick={fecharChat}></div>
      <div className={`bottom-sheet ${chatOpen ? 'open' : ''}`}>
        <div className="grip" />
        <header>
          <div style={{width:'40px', height:'40px'}}><MarcoSticker /></div>
          <div className="flex-1">
            <div className="font-serif text-lg leading-none" style={{color:'var(--gold)'}}>Marco</div>
            <div className="text-xs text-[var(--text-dim)] mt-0.5">Garcom - online</div>
          </div>
          <button className="btn-icon" onClick={fecharChat} aria-label="Fechar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M6 6l12 12M6 18L18 6"/></svg>
          </button>
        </header>

        {/* Carrinho pill - aparece quando tem itens */}
        {carrinho.length > 0 && (
          <>
            <div
              className={`cart-pill ${carrinhoPulse ? 'pulse' : ''}`}
              onClick={() => { vibrate(15); setCarrinhoOpen(o => !o); }}
            >
              <div className="cart-left">
                <span className="cart-emoji">Sacola</span>
                <div className="cart-count">
                  <strong>{carrinho.reduce((s, it) => s + it.qtd, 0)}</strong> {carrinho.reduce((s, it) => s + it.qtd, 0) === 1 ? 'item' : 'itens'}
                  <br/>
                  <span style={{fontSize: '11px', color: 'var(--text-dim)'}}>{carrinhoOpen ? 'tap pra esconder' : 'tap pra ver'}</span>
                </div>
              </div>
              <span className="cart-total">{fmtBRL(carrinhoTotal)}</span>
            </div>
            <div className={`cart-drawer ${carrinhoOpen ? 'open' : ''}`}>
              {carrinho.map((it, i) => (
                <div key={i} className="cart-item">
                  <div className="qty">{it.qtd}</div>
                  <div className="info">
                    <div className="nome">{it.nome}</div>
                    {it.obs && <div className="obs">obs: {it.obs}</div>}
                  </div>
                  <div className="preco">{fmtBRL(it.preco * it.qtd)}</div>
                </div>
              ))}
              <button className="checkout-btn" onClick={() => { setChatOpen(false); setSacolaOpen(true); }}>Fechar pedido</button>
            </div>
          </>
        )}

        <div className="messages">
          {mensagens.map(m => (
            <div key={m.id} className={`msg ${m.autor}`}>
              {m.midia_tipo === 'imagem' && m.midia_url && (
                <img className="msg-foto" src={m.midia_url} alt="foto" onClick={() => setFotoAberta({ src: m.midia_url, alt: 'Foto do chat' })} />
              )}
              {m.midia_tipo === 'audio' && m.midia_url && (
                <audio className="msg-audio" src={m.midia_url} controls preload="none"></audio>
              )}
              {m.texto && <span className="msg-texto">{m.texto}</span>}
            </div>
          ))}
        </div>
        <div className="chat-compose">
          <label className={`chat-attach ${chatSending ? 'off' : ''}`} aria-label="Enviar foto">
            <input type="file" accept="image/*" style={{ display: 'none' }} onChange={enviarImagemChat} disabled={chatSending} />
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.2"/></svg>
          </label>
          <button className={`chat-attach ${gravandoAudio ? 'rec' : ''}`} onClick={toggleGravacaoAudio} disabled={chatSending} aria-label={gravandoAudio ? 'Parar gravacao' : 'Gravar audio'}>
            {gravandoAudio
              ? <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
              : <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>}
          </button>
          <input
            className="chat-input"
            value={chatInput}
            onChange={e => setChatInput(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') enviarMensagemChat(); }}
            placeholder={gravandoAudio ? 'Gravando audio...' : 'Mensagem para o Marco...'}
            autoComplete="off"
            disabled={gravandoAudio}
          />
          <button className="chat-send" onClick={enviarMensagemChat} disabled={!chatInput.trim() || chatSending} aria-label="Enviar mensagem">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  // Limpa service workers antigos do Garcom para o cardapio sempre vir do painel.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(reg => {
          if (reg.scope.includes('/garcom/')) reg.unregister().catch(() => {});
        });
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
