<script>
  // Faxina de cache legado: evita tela branca presa em Service Worker antigo.
  (function limparCacheLegadoDomLeonardo() {
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', function() {
      Promise.all([
        navigator.serviceWorker.getRegistrations()
          .then(function(regs) { return Promise.all(regs.map(function(reg) { return reg.unregister().catch(function() {}); })); })
          .catch(function() {}),
        window.caches
          ? caches.keys().then(function(keys) { return Promise.all(keys.map(function(key) { return caches.delete(key).catch(function() {}); })); }).catch(function() {})
          : Promise.resolve()
      ]).then(function() {
        if (navigator.serviceWorker.controller && !sessionStorage.getItem('dl_sw_cleanup_reloaded')) {
          sessionStorage.setItem('dl_sw_cleanup_reloaded', '1');
          window.location.reload();
        }
      });
    });
  })();
</script>
<script>
  (function(w, d) {

    var PIXEL_ID = '2687533954980204';
    var CAPI_URL = 'https://jewamqbdonudiapxbzay.supabase.co/functions/v1/meta-conversions';
    var standardEvents = {
      PageView: true,
      ViewContent: true,
      AddToCart: true,
      InitiateCheckout: true,
      Contact: true,
      Search: true,
      Lead: true
    };

    function uid(prefix) {
      if (w.crypto && typeof w.crypto.randomUUID === 'function') return prefix + '_' + w.crypto.randomUUID();
      return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 11);
    }

    function text(value, max) {
      return String(value || '').replace(/\s+/g, ' ').trim().slice(0, max || 180);
    }

    function getCookie(name) {
      return d.cookie.split('; ').find(function(row) { return row.indexOf(name + '=') === 0; })?.split('=')[1] || '';
    }

    function setCookie(name, value, days) {
      var expires = new Date(Date.now() + days * 864e5).toUTCString();

        var created = uid('visitor');
        localStorage.setItem(key, created);
        return created;
      } catch (_) {
        return uid('visitor');
      }
    }

    function ensureFbc() {
      var current = getCookie('_fbc');
      if (current) return decodeURIComponent(current);
      try {
        var fbclid = new URLSearchParams(w.location.search).get('fbclid');
        if (!fbclid) return '';

      } catch (_) {

        if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';

      }(w,d,'script','https://connect.facebook.net/en_US/fbevents.js');
      w.fbq('init', PIXEL_ID);
    }

    function compactData(data) {
      var out = {};
      Object.keys(data || {}).slice(0, 28).forEach(function(key) {
        var cleanKey = String(key).replace(/[^a-zA-Z0-9_]/g, '').slice(0, 40);

        else out[cleanKey] = text(value, 180);
      });
      return out;
    }

    function sendServerEvent(eventName, eventId, data) {
      var payload = {
        event_name: eventName,
        event_id: eventId,
        event_time: Math.floor(Date.now() / 1000),
        event_source_url: w.location.href,
        external_id: ensureClientId(),
        fbp: decodeURIComponent(getCookie('_fbp') || ''),
        fbc: ensureFbc(),
        client_user_agent: navigator.userAgent,
        custom_data: compactData(data)
      };

      try {
        fetch(CAPI_URL, {
          method: 'POST',
          mode: 'cors',
          keepalive: true,
          headers: { 'Content-Type': 'application/json' },

      return text(el.getAttribute('aria-label') || el.getAttribute('title') || el.innerText || el.value || el.href || el.className, 120);
    }

    function trackClick(event) {
      var el = event.target && event.target.closest && event.target.closest('button,a,[role="button"],input[type="button"],input[type="submit"],.prato-card,.destaque-card,.cat-chip,.coupon-suggestion');
      if (!el || el.closest('[data-meta-ignore]')) return;
      w.domMetaTrack('DomButtonClick', {
        click_text: labelFor(el),

    d.addEventListener('click', trackClick, true);
    var boot = function() {
      w.domMetaTrack('PageView', {

    if (d.readyState === 'loading') d.addEventListener('DOMContentLoaded', boot, { once: true });

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<style>
  :root {
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
    --gold: #d4af37;
    --gold-dim: #8a6f1f;
    --bg: #0a0908;
    --bg-elev: #15120e;
    --bg-card: #1c1814;
    --line: rgba(212, 175, 55, 0.18);
    --text: #f3ece0;
    --text-dim: #8d8579;
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    overscroll-behavior-y: contain;
    min-height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }
  input, textarea, button, select { font-size: 16px; }
  button { background: none; border: 0; color: inherit; padding: 0; cursor: pointer; }
  #root { width: 100%; max-width: 100vw; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* Title font */
  .font-serif { font-family: "Cormorant Garamond", "Playfair Display", Georgia, serif; }

  /* Sticker do Marco - ronda */
  .marco-sticker {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 24px);
    right: 16px;
    width: 64px;
    height: 64px;
    z-index: 50;
    cursor: pointer;
    filter: drop-shadow(0 4px 18px rgba(212,175,55,0.25));
    transition: transform 600ms cubic-bezier(.34,1.56,.64,1), opacity 600ms;
    will-change: transform, opacity;
  }
  .marco-sticker.hidden { transform: translateY(120px); opacity: 0; }
  .marco-sticker.peek { transform: translateY(0); opacity: 1; }
  .marco-sticker.attention { animation: balanca 1.6s ease-in-out infinite; }
  @keyframes balanca {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50% { transform: rotate(3deg) translateY(-2px); }
  }
  .marco-sticker .halo {
    position: absolute; inset: -6px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,0.28) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 400ms;
  }
  /* Badge do carrinho sobre o Marco */
  .marco-cart-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border-radius: 11px;
    background: linear-gradient(180deg, #e7c66d 0%, #a47e1e 100%);
    color: #1a1305;
    font-size: 12px;
    font-weight: 700;
    display: grid;
    place-items: center;
    border: 2px solid var(--bg);
    z-index: 1;
    transform: scale(0);
    transition: transform 240ms cubic-bezier(.34,1.56,.64,1);
  }
  .marco-cart-badge.show { transform: scale(1); }
  .marco-cart-badge.pulse { animation: badgePulse 700ms ease-out; }
  @keyframes badgePulse {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .marco-sticker.attention .halo { opacity: 1; animation: pulse 2s ease-in-out infinite; }
  .marco-sticker.top-mode {
    top: calc(var(--safe-top) + 14px);
    bottom: auto;
    right: 14px;
    width: 56px;
    height: 56px;
    z-index: 225;
    opacity: 1;
    transform: translateY(0) scale(0.92);
  }
  .marco-sticker.top-mode.hidden,
  .marco-sticker.top-mode.peek,
  .marco-sticker.top-mode.attention {
    opacity: 1;
    transform: translateY(0) scale(0.92);
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.08); }
  }

  /* Balao de fala */
  .balao {
    position: fixed;
    right: 88px;
    bottom: calc(var(--safe-bottom) + 30px);
    max-width: 64vw;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 18px 18px 4px 18px;
    font-size: 14px;
    line-height: 1.35;
    z-index: 51;
    box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    transform: translateY(8px);
    opacity: 0;
    pointer-events: none;
    transition: transform 320ms cubic-bezier(.4,0,.2,1), opacity 320ms;
  }
  .balao.shown {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .balao::after {
    content: '';
    position: absolute;
    right: -6px;
    bottom: 12px;
    width: 12px; height: 12px;
    background: var(--bg-elev);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    transform: rotate(-45deg);
  }

  /* Bottom sheet do chat */
  .bottom-sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px) saturate(120%);
    -webkit-backdrop-filter: blur(6px) saturate(120%);
    z-index: 230;
    opacity: 0;
    pointer-events: none;
    transition: opacity 280ms;
  }
  .bottom-sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  .bottom-sheet {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    height: 85vh;
    background: var(--bg-elev);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
    z-index: 240;
    transform: translateY(100%);
    transition: transform 360ms cubic-bezier(.25,.8,.25,1);
    display: flex;
    flex-direction: column;
    padding-bottom: var(--safe-bottom);
  }
  .bottom-sheet.open { transform: translateY(0); }
  .bottom-sheet .grip {
    width: 44px; height: 4px;
    background: rgba(255,255,255,0.18);
    border-radius: 2px;
    margin: 10px auto 6px;
  }
  .bottom-sheet header {
    padding: 8px 18px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bottom-sheet .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .chat-compose {
    display: grid;
    grid-template-columns: 1fr 48px;
    gap: 9px;
    padding: 10px 14px calc(10px + var(--safe-bottom));
    border-top: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(21,18,14,0.72), var(--bg-elev));
  }
  .chat-input {
    min-height: 46px;
    border-radius: 999px;
    border: 1px solid rgba(212,175,55,0.24);
    background: rgba(0,0,0,0.22);
    color: var(--text);
    outline: none;
    padding: 0 15px;
  }
  .chat-input:focus { border-color: rgba(212,175,55,0.52); }
  .chat-send {
    width: 48px;
    height: 46px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--gold), var(--gold-dim));
    color: #1a1305;
    display: grid;
    place-items: center;
    font-weight: 950;
  }
  .chat-send:disabled {
    opacity: .45;
    filter: grayscale(.5);
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.4;
  }
  .msg.marco {
    background: var(--bg-card);
    border: 1px solid var(--line);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.cliente {
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    color: #1a1305;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    font-weight: 600;
  }
  .msg-typing {
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 14px 18px;
    border-radius: 16px;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    display: flex;
    gap: 4px;
  }
  .msg-typing span {
    width: 6px; height: 6px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: typing 1.4s infinite ease-in-out;
  }
  .msg-typing span:nth-child(2) { animation-delay: 0.18s; }
  .msg-typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Carrinho pill (dentro do bottom sheet, abaixo do header) */
  .cart-pill {
    margin: 8px 14px;
    padding: 10px 14px;
    background: linear-gradient(180deg, rgba(212,175,55,0.18) 0%, rgba(212,175,55,0.08) 100%);
    border: 1px solid rgba(212,175,55,0.45);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 200ms;
    min-height: 48px;
  }
  .cart-pill:active { transform: scale(0.98); }
  .cart-pill.pulse { animation: cartPulse 700ms ease-out; }
  @keyframes cartPulse {
    0%   { transform: scale(1); box-shadow: 0 0 0 0 rgba(212,175,55,0.6); }
    40%  { transform: scale(1.04); box-shadow: 0 0 0 10px rgba(212,175,55,0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212,175,55,0); }
  }
  .cart-left { display: flex; align-items: center; gap: 10px; }
  .cart-emoji { font-size: 22px; line-height: 1; }
  .cart-count {
    font-size: 13px;
    color: var(--text);
    line-height: 1.15;
  }
  .cart-count strong { color: var(--gold); font-weight: 700; }
  .cart-total {
    font-weight: 700;
    color: var(--gold);
    font-size: 16px;
  }

  /* Drawer expandido do carrinho (dentro do bottom sheet) */
  .cart-drawer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 320ms cubic-bezier(.4,0,.2,1);
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  .cart-drawer.open { max-height: 50vh; overflow-y: auto; }
  .cart-item {
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .cart-item:last-child { border-bottom: none; }
  .cart-item .qty {
    flex: 0 0 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--gold);
    color: #1a1305;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 13px;
  }
  .cart-item .info { flex: 1; }
  .cart-item .info .nome { font-size: 14px; font-weight: 600; }
  .cart-item .info .obs { font-size: 12px; color: var(--text-dim); margin-top: 2px; font-style: italic; }
  .cart-item .preco { font-size: 14px; font-weight: 600; color: var(--gold); }
  .cart-empty {
    text-align: center;
    padding: 24px 16px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .checkout-btn {
    width: calc(100% - 28px);
    margin: 10px 14px 14px;
    min-height: 46px;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    color: #1a1305;
    font-weight: 800;
    box-shadow: 0 10px 22px rgba(212,175,55,0.14);
  }

  .btn-icon {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    transition: transform 120ms, background 120ms;
  }
  .btn-icon:active { transform: scale(0.92); background: var(--bg-elev); }
  /* Cartoes de prato */
  .prato-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    transition: transform 200ms;
  }
  .prato-card:active { transform: scale(0.985); }
  .prato-card img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    display: block;
    cursor: zoom-in;
  }
  .prato-badge {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    color: var(--gold);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .prato-helper-block {
    margin-top: 8px;
    display: grid;
    gap: 5px;
  }
  .prato-microcopy {
    color: rgba(235, 229, 216, 0.64);
    font-size: 10.5px;
    line-height: 1.25;
    letter-spacing: 0.01em;
  }
  .prato-sizecopy {
    color: rgba(212, 175, 55, 0.82);
    font-size: 11px;
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: 0.015em;
  }
  .prato-action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .prato-soft-btn {
    background: #0a0908;
    border: 1px solid rgba(212,175,55,0.18);
    color: rgba(235, 229, 216, 0.82);
    border-radius: 999px;
    padding: 7px 11px;
    min-height: 32px;
    font-size: 10.5px;
    font-weight: 850;
    line-height: 1;
    box-shadow: 0 3px 12px rgba(0,0,0,0.24);
  }
  .prato-soft-btn:active {
    transform: scale(0.97);
    border-color: rgba(212,175,55,0.38);
  }

  .prato-card.compact {
    display: grid;
    grid-template-columns: 1fr 138px;
    gap: 12px;
    padding: 12px;
    cursor: pointer;
  }
  .prato-card.compact img {
    width: 138px;
    height: 138px;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
  }
  .prato-card.compact .prato-badge { top: 8px; left: 8px; font-size: 10px; }
  .prato-card.compact .prato-copy {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2px 0;
  }
  .prato-card.compact .prato-title { font-size: 16px; line-height: 1.08; }
  .prato-card.compact .prato-desc {
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.3;
    margin-top: 7px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .prato-card.compact .prato-price {
    color: var(--gold);
    font-size: 15px;
    font-weight: 850;
  }
  .prato-card.compact .prato-cta {
    min-height: 38px;
    padding: 0 14px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    color: #1a1305;

    if (!texto || chatOpen) return;

  // Ronda do Marco - aparece a cada 40-90s

        agendarRonda();

      setGarcomState('peek');
      setBalaoTexto(sortear(chatConfig.saudacoes ?? SAUDACOES_INICIAIS));

  // Reseta idle ao tocar a tela

    window.addEventListener('scroll', reset, { passive: true });
    return () => {
      window.removeEventListener('touchstart', reset);
      window.removeEventListener('scroll', reset);
    };
  }, []);

  useEffect(() => {
    const orientarScroll = () => {
      ultimaInteracao.current = Date.now();
      if (scrollGuideShownRef.current || abriuPratoRef.current || chatOpen || pratoAberto || sacolaOpen) return;
      clearTimeout(scrollGuideTimer.current);

        if (scrollGuideShownRef.current || abriuPratoRef.current || chatOpen || pratoAberto || sacolaOpen) return;

        falarMarco('Curtiu algum prato? Toca em Ver para abrir tamanhos e opcionais.');
      }, 2600);
    };
    window.addEventListener('scroll', orientarScroll, { passive: true });

      window.removeEventListener('scroll', orientarScroll);
      clearTimeout(scrollGuideTimer.current);

        if (!vivo) return;

        setCategorias(dados.categorias ?? []);
        setCupons(dados.cupons ?? []);
        setDeliveryConfig(prev => ({ ...prev, ...(dados.config ?? {}) }));
        setMicrocopy({ ...DEFAULT_MICROCOPY, ...(dados.microcopy ?? {}) });
        setChatConfig({ ...DEFAULT_CHAT_CONFIG, ...(dados.chatConfig ?? {}) });
        setMenuErro(null);
      })
      .catch((err) => {
        if (!vivo) return;
        setPratos([]);
        setMenuErro('Nao consegui carregar o cardapio do painel agora. Recarregue a pagina em alguns segundos.');
        console.error(err);
      })
      .finally(() => {
        if (vivo) setCarregandoPratos(false);
      });
    return () => { vivo = false; };
  }, []);

  useEffect(() => {

      try {

          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({
            acao: 'listar_atendimento',
            device_id: chatDeviceId.current,
          }),
        });
        const data = await r.json();
        if (!vivo || !Array.isArray(data?.mensagens)) return;
        setMensagens(prev => {
          const ids = new Set(prev.map(m => String(m.remote_id || m.id)));
          const novas = data.mensagens
            .filter(msg => !ids.has(String(msg.id)))
            .map(msg => ({
              id: msg.id,
              remote_id: msg.id,
              autor: msg.autor === 'admin' ? 'marco' : msg.autor,
              texto: msg.texto,
            }));
          return novas.length ? [...prev, ...novas].slice(-80) : prev;
        });
      } catch (err) {
        console.warn('Nao consegui sincronizar atendimento', err);
      }
    };
    sync();
    const timer = setInterval(sync, 4500);
    return () => { vivo = false; clearInterval(timer); };
  }, [chatOpen]);

  useEffect(() => {

      sucesso: `Pagamento aprovado${pedido ? ` no pedido #${pedido}` : ''}. O Dom ja recebeu por aqui.`,

    };
    setTimeout(() => {
      setChatOpen(true);
      setMensagens([{ id: Date.now(), autor: 'marco', texto: textos[pagamento] || textos.pendente }]);
    }, 650);
  }, []);

  useEffect(() => {
    if (!stripeCheckout?.client_secret || checkoutStage !== 'pagamento' || !sacolaOpen) return;

      setCheckoutError('Nao consegui carregar o Stripe.js. Recarregue a pagina e tente de novo.');
      return;
    }

    const mountPaymentElement = () => {
      const node = document.getElementById('stripe-payment-element');

      try {
        if (stripePaymentElementRef.current) {
          stripePaymentElementRef.current.unmount();
          stripePaymentElementRef.current = null;
        }

          clientSecret: stripeCheckout.client_secret,

            theme: 'stripe',

        const paymentElement = stripeElementsRef.current.create('payment', {

  useEffect(() => {
    const timer = setTimeout(() => {

        setGarcomState('peek');

        clearTimeout(balaoTimer.current);
        balaoTimer.current = setTimeout(() => {
          setBalaoTexto(null);
          if (!chatOpen) setGarcomState('attention');
        }, 5200);
      }
    }, 120000);
    return () => clearTimeout(timer);
  }, [chatOpen, chatConfig.mensagens_automaticas]);

  const calcSubtotal = (items) => items.reduce((s, it) => s + Number(it.subtotal ?? (it.preco * it.qtd) ?? 0), 0);
  const totalItens = carrinho.reduce((s, it) => s + Number(it.qtd || 0), 0);
  const taxaEntrega = Number(entregaEstimativa?.frete_bruto ?? deliveryConfig.taxa_entrega_padrao ?? 0);
  const FRETE_CHEF_MINIMO = 60;
  const FRETE_CHEF_LIMITE = 10;
  const cuponsDisponiveis = cupons.filter(c => {
    const limiteOk = !c.usos_max || Number(c.usos_atual || 0) < Number(c.usos_max);
    return c.ativo !== false && limiteOk && cupomDentroDaData(c);
  });
  const avaliarCupom = (cupom, subtotal = carrinhoTotal) => {
    if (!cupom) return { ok: false, motivo: 'Cupom nao encontrado.', desconto: 0, freteGratis: false };
    if (!cupomDentroDaData(cupom)) return { ok: false, motivo: 'Esse cupom nao esta dentro da validade.', desconto: 0, freteGratis: false };
    if (cupom.usos_max && Number(cupom.usos_atual || 0) >= Number(cupom.usos_max)) return { ok: false, motivo: 'Esse cupom ja atingiu o limite de usos.', desconto: 0, freteGratis: false };
    const minimo = Number(cupom.valor_minimo_pedido || 0);
    if (subtotal < minimo) return { ok: false, motivo: `Faltam ${fmtBRL(minimo - subtotal)} para usar esse cupom.`, desconto: 0, freteGratis: false };
    const valor = Number(cupom.valor || 0);
    if (cupom.tipo === 'percentual') return { ok: true, desconto: Math.min(subtotal, subtotal * (valor / 100)), freteGratis: false };
    if (cupom.tipo === 'valor_fixo') return { ok: true, desconto: Math.min(subtotal, valor), freteGratis: false };
    if (cupom.tipo === 'frete_gratis') return { ok: true, desconto: 0, freteGratis: true };
    return { ok: false, motivo: 'Tipo de cupom invalido.', desconto: 0, freteGratis: false };
  };
  const cupomResumo = cupomAplicado ? avaliarCupom(cupomAplicado) : { ok: false, desconto: 0, freteGratis: false };
  const descontoCupom = cupomResumo.ok ? Number(cupomResumo.desconto || 0) : 0;
  const freteChefAtivo = carrinhoTotal >= FRETE_CHEF_MINIMO;
  const descontoFreteChef = freteChefAtivo ? Math.min(taxaEntrega, FRETE_CHEF_LIMITE) : 0;
  const taxaEntregaComChef = Math.max(0, taxaEntrega - descontoFreteChef);
  const taxaEntregaFinal = cupomResumo.ok && cupomResumo.freteGratis ? 0 : taxaEntregaComChef;
  const faltaFreteChef = Math.max(0, FRETE_CHEF_MINIMO - carrinhoTotal);
  const totalComEntrega = Math.max(0, carrinhoTotal + taxaEntregaFinal - descontoCupom);
  const preparoTexto = '5 minutos';
  const entregaTexto = '12 a 30 minutos, dependendo do endereco';
  const montarTextoWhatsApp = (origem = 'topo', opts = {}) => {
    const linhas = [
      'Ola, Dom Leonardo!',
      origem === 'sacola'
        ? 'Quero finalizar meu pedido.'
        : 'Vim pelo cardapio e quero falar com voces.',
    ];

    if (carrinho.length) {
      linhas.push('', 'Minha sacola:');
      carrinho.forEach((item, idx) => {
        linhas.push(`${idx + 1}. ${item.qtd}x ${item.nome}`);
        if (item.tamanho?.nome) {
          linhas.push(`   Tamanho: ${labelTamanho(item.tamanho)}`);
        }
        if (item.opcionais?.length) {
          linhas.push(`   Adicionais: ${item.opcionais.map(op => `${op.qtd}x ${op.nome}`).join(', ')}`);
        }
        if (item.obs) linhas.push(`   Obs: ${item.obs}`);
        linhas.push(`   Subtotal: ${fmtBRL(item.subtotal)}`);
      });
      linhas.push('', `Subtotal: ${fmtBRL(carrinhoTotal)}`);
      if (freteChefAtivo && descontoFreteChef > 0 && !(cupomResumo.ok && cupomResumo.freteGratis)) {
        linhas.push(`Frete do chef: - ${fmtBRL(descontoFreteChef)} em pedidos acima de ${fmtBRL(FRETE_CHEF_MINIMO)}`);
      }
      linhas.push(`Taxa de entrega: ${cupomResumo.ok && cupomResumo.freteGratis ? 'gratis' : fmtBRL(taxaEntregaFinal)}`);
      linhas.push(`Preparo estimado: ${preparoTexto}`);
      linhas.push(`Entrega estimada: ${entregaEstimativa?.texto_tempo || entregaTexto}`);
      if (entregaEstimativa?.distancia_texto) linhas.push(`Distancia: ${entregaEstimativa.distancia_texto}`);
      if (descontoCupom > 0) linhas.push(`Desconto: - ${fmtBRL(descontoCupom)}`);
      if (cupomResumo.ok && cupomAplicado?.codigo) linhas.push(`Cupom: ${String(cupomAplicado.codigo).toUpperCase()}`);
      linhas.push(`Total estimado: ${fmtBRL(totalComEntrega)}`);
    }

    const ruaNumero = String(whatsEndereco.ruaNumero || '').trim();
    const bairro = String(whatsEndereco.bairro || '').trim();
    if (origem === 'sacola' && !opts.ignorarEndereco && (ruaNumero || bairro)) {
      linhas.push('', 'Endereco informado no cardapio:');
      if (ruaNumero) linhas.push(`Rua e numero: ${ruaNumero}`);
      if (bairro) linhas.push(`Bairro: ${bairro}`);
    }

    linhas.push('', `Link do cardapio: ${window.location.origin}${window.location.pathname}`);
    return linhas.join('\n');
  };
  const abrirWhatsApp = (origem = 'topo', opts = {}) => {
    const texto = montarTextoWhatsApp(origem, opts);
    trackMeta('Contact', {
      contact_channel: 'whatsapp',
      origin: origem,
      value: totalComEntrega,
      currency: 'BRL',
      num_items: totalItens,
      content_type: 'product',
      content_ids: carrinho.map(item => String(item.prato_id || item.local_id || item.nome)).slice(0, 20),
    });
    window.open(`https://wa.me/${WHATSAPP_DOM}?text=${encodeURIComponent(texto)}`, '_blank', 'noopener,noreferrer');
  };

  const resetStripeCheckout = () => {
    try {
      if (stripePaymentElementRef.current) stripePaymentElementRef.current.unmount();
    } catch (_) {}
    stripePaymentElementRef.current = null;
    stripeElementsRef.current = null;
    setStripeCheckout(null);
    setCheckoutStage('dados');
    setCheckoutError('');
  };

  const splitRuaNumero = (value) => {
    const text = String(value || '').replace(/\s+/g, ' ').trim();
    const match = text.match(/^(.*?)[,\s]+(\d+[a-zA-Z0-9\\/-]*)$/);
    if (!match) return { logradouro: text, numero: '' };
    return { logradouro: match[1].replace(/,\s*$/, '').trim(), numero: match[2].trim() };
  };

  const setCheckoutField = (field, value) => {
    setCheckoutDados(prev => ({ ...prev, [field]: value }));
    if (field === 'ruaNumero' || field === 'bairro') {
      setEntregaEstimativa(null);
      setEntregaError('');
    }
    if (stripeCheckout) resetStripeCheckout();
  };

  const validarCheckoutDados = () => {
    const nome = checkoutDados.nome.trim();
    const whatsapp = checkoutDados.whatsapp.replace(/\D/g, '');
    const bairro = checkoutDados.bairro.trim();
    const { logradouro, numero } = splitRuaNumero(checkoutDados.ruaNumero);
    if (!nome) return 'Me fala seu nome para o Dom identificar o pedido.';
    if (whatsapp.length < 10) return 'Coloca um WhatsApp com DDD para o motoboy te encontrar.';
    if (!logradouro || !numero) return 'Coloca rua e numero juntos, por exemplo: Rua X, 123.';
    if (!bairro) return 'Coloca o bairro para calcularmos a entrega certinho.';
    return '';
  };

  const calcularEntregaCheckout = async () => {
    const { logradouro, numero } = splitRuaNumero(checkoutDados.ruaNumero);
    const bairro = checkoutDados.bairro.trim();
    if (!logradouro || !numero || !bairro) {
      setEntregaError('Coloca rua, numero e bairro. Exemplo: Francisco Dallaribera, 1811 + Santa Felicidade.');
      vibrate(35);
      return;
    }

    setEntregaLoading(true);
    setEntregaError('');
    try {
      const r = await fetch(GARCOM_RESPONDER_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({
          acao: 'calcular_entrega_google',
          device_id: chatDeviceId.current,
          subtotal: carrinhoTotal,
          endereco: {
            logradouro,
            numero,
            bairro,
            cidade: 'Curitiba',
            uf: 'PR',
          },
        }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data?.entrega) {
        throw new Error(data?.error || 'Nao consegui calcular essa rota agora.');
      }

      setEntregaEstimativa(data.entrega);
      const trecho = data.entrega?.fonte === 'google_maps'
        ? `Olhei a rota: da uns ${data.entrega.texto_tempo}${data.entrega.distancia_texto ? `, cerca de ${data.entrega.distancia_texto}` : ''}.`
        : `Usei a media da casa por enquanto: ${data.entrega.texto_tempo}.`;
      falarMarco(`${trecho} Se quiser, ja sigo pro pagamento daqui.`, 5200);
    } catch (err) {
      setEntregaError(err.message || 'Nao consegui calcular essa entrega agora.');
    } finally {
      setEntregaLoading(false);
    }
  };

  const criarCheckoutStripe = async () => {
    if (!carrinho.length) return;
    const erro = validarCheckoutDados();
    if (erro) {
      setCheckoutError(erro);
      vibrate(35);
      return;
    }

    const { logradouro, numero } = splitRuaNumero(checkoutDados.ruaNumero);
    const endereco = {
      logradouro,
      numero,
      bairro: checkoutDados.bairro.trim(),
      cidade: 'Curitiba',
      uf: 'PR',
    };

    setCheckoutLoading(true);
    setCheckoutError('');
    try {
      const r = await fetch(GARCOM_RESPONDER_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({
          acao: 'criar_pagamento_stripe',
          cliente: {
            nome: checkoutDados.nome.trim(),
            whatsapp: checkoutDados.whatsapp.replace(/\D/g, ''),
            email: checkoutDados.email.trim() || null,
          },
          endereco,
          itens: carrinho,
          cupom_codigo: cupomResumo.ok && cupomAplicado?.codigo ? String(cupomAplicado.codigo).toUpperCase() : null,
          entrega_google: !!entregaEstimativa,
          device_id: chatDeviceId.current,
          site_url: window.location.origin + window.location.pathname,
          idempotency_key: `dl-stripe-${chatDeviceId.current}-${Date.now()}`,
        }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data?.stripe?.client_secret) {
        throw new Error(data?.error || 'Nao consegui iniciar o pagamento seguro.');
      }
      setStripeCheckout({
        client_secret: data.stripe.client_secret,
        publishable_key: data.stripe.publishable_key,
        payment_intent_id: data.stripe.payment_intent_id,
        pedido: data.pedido,
      });
      setCheckoutStage('pagamento');
      falarMarco('Prontinho. Agora e so escolher como quer pagar com seguranca.', 4200);
    } catch (err) {
      setCheckoutError(err.message || 'Nao consegui preparar o pagamento agora.');
    } finally {
      setCheckoutLoading(false);
    }
  };

  const confirmarPagamentoStripe = async () => {
    if (!stripeRef.current || !stripeElementsRef.current || !stripeCheckout?.client_secret) {
      setCheckoutError('O pagamento ainda nao carregou. Aguarde um instante.');
      return;
    }

    setCheckoutLoading(true);
    setCheckoutError('');
    try {
      const submit = await stripeElementsRef.current.submit();
      if (submit?.error) throw new Error(submit.error.message);

      const pedidoNumero = stripeCheckout?.pedido?.numero_pedido || '';
      const returnUrl = new URL(window.location.origin + window.location.pathname);
      returnUrl.searchParams.set('pagamento', 'sucesso');
      if (pedidoNumero) returnUrl.searchParams.set('pedido', pedidoNumero);

      const { error, paymentIntent } = await stripeRef.current.confirmPayment({
        elements: stripeElementsRef.current,
        clientSecret: stripeCheckout.client_secret,
        confirmParams: {
          return_url: returnUrl.href,
          payment_method_data: {
            billing_details: {
              name: checkoutDados.nome.trim(),
              phone: checkoutDados.whatsapp.replace(/\D/g, ''),
              email: checkoutDados.email.trim() || undefined,
            },
          },
        },
        redirect: 'if_required',
      });

      if (error) throw new Error(error.message || 'Pagamento nao aprovado.');

      if (['succeeded', 'processing', 'requires_capture'].includes(paymentIntent?.status)) {
        setCheckoutStage('sucesso');
        setMensagens(m => [...m, {
          id: `stripe-ok-${Date.now()}`,
          autor: 'marco',
          texto: paymentIntent.status === 'succeeded'
            ? 'Pagamento aprovado. O pedido ja entrou para o Dom preparar.'
            : 'Pagamento enviado. A confirmacao pode levar alguns instantes, mas ja estou de olho por aqui.',
        }]);
        trackMeta('Purchase', {
          value: totalComEntrega,
          currency: 'BRL',
          num_items: totalItens,
          content_type: 'product',
          content_ids: carrinho.map(item => String(item.prato_id || item.local_id || item.nome)).slice(0, 20),
        });
        setCarrinho([]);
        setCarrinhoTotal(0);
        vibrate([20, 40, 20]);
      } else {
        throw new Error('Pagamento ficou pendente. Tente outro metodo ou chame a gente no WhatsApp.');
      }
    } catch (err) {
      setCheckoutError(err.message || 'Nao consegui confirmar o pagamento.');
    } finally {
      setCheckoutLoading(false);
    }
  };

  const pratosVisiveis = categoriaAtiva === 'todos'
    ? pratos
    : pratos.filter(p => String(p.categoria_id) === String(categoriaAtiva));
  const destaques = pratos
    .filter(p => p.badge_destaque || p.selo_experiencia || p.frase_fome)
    .slice(0, 9);
  const pratosDestaque = destaques.length ? destaques : pratos.slice(0, 6);
  const destaquesLoop = pratosDestaque.length > 1 ? [...pratosDestaque, ...pratosDestaque] : pratosDestaque;
  const maisPedidos = (pratos.filter(p => {
    const texto = `${p.badge || ''} ${p.badge_destaque || ''} ${p.selo_experiencia || ''}`.toLowerCase();
    return texto.includes('mais pedido') || texto.includes('pedido') || texto.includes('favorito');
  }).length ? pratos.filter(p => {
    const texto = `${p.badge || ''} ${p.badge_destaque || ''} ${p.selo_experiencia || ''}`.toLowerCase();
    return texto.includes('mais pedido') || texto.includes('pedido') || texto.includes('favorito');
  }) : (destaques.length ? destaques : pratos)).slice(0, 3);
  const categoriaNomePorId = categorias.reduce((acc, cat) => {
    acc[String(cat.id)] = cat.nome;
    return acc;
  }, {});
  const selecionarCategoriaCardapio = (id, nome) => {
    setCategoriaAtiva(id);
    trackMeta('MenuCategory', {
      category_id: String(id),
      category_name: nome || categoriaNomePorId[String(id)] || 'Todos',
      page_path: window.location.pathname,
    });
  };
  const secoesCardapio = categoriaAtiva === 'todos'
    ? [
        ...(maisPedidos.length ? [{ id: 'mais-pedidos', titulo: 'Mais pedidos', pratos: maisPedidos }] : []),
        ...categorias
          .map(cat => ({
            id: String(cat.id),
            titulo: cat.nome,
            pratos: pratos.filter(p => String(p.categoria_id) === String(cat.id)),
          }))
          .filter(sec => sec.pratos.length && !/mais\s*pedido/i.test(sec.titulo || '')),
        ...(categorias.length ? [] : [{ id: 'todos', titulo: 'Cardapio', pratos }]),
      ]
    : [{
        id: String(categoriaAtiva),
        titulo: categoriaNomePorId[String(categoriaAtiva)] || 'Cardapio',
        pratos: pratosVisiveis,
      }];

  const tamanhosDoPrato = (prato) => {
    const list = (prato?.tamanhos ?? []).filter(t => t.ativo !== false);
    return list.length ? list : [{
      id: `padrao-${prato?.id}`,
      nome: 'Padrao serve 1 pessoa',
      peso_g: '',
      preco_delta: 0,
      padrao: true,
    }];
  };

  const gruposDoPrato = (prato) => (prato?.grupos ?? [])
    .filter(g => g.ativo !== false)
    .map(g => ({ ...g, opcionais: (g.opcionais ?? []).filter(o => o.ativo !== false) }));

  const primeiroTamanho = (prato) => {
    const tamanhos = tamanhosDoPrato(prato);
    return (tamanhos.find(t => t.padrao) ?? tamanhos[0])?.id ?? null;
  };

  const abrirDetalhe = (prato) => {
    vibrate(14);
    trackMeta('ViewContent', {
      content_name: prato?.nome || 'Prato',
      content_ids: [String(prato?.id || prato?.nome || '')],
      content_type: 'product',
      value: Number(prato?.preco || 0),
      currency: 'BRL',
      content_category: categoriaNomePorId[String(prato?.categoria_id)] || 'Cardapio',
    });
    abriuPratoRef.current = true;
    detailInteragiuRef.current = false;
    clearTimeout(detailGuideTimer.current);
    setPratoAberto(prato);
    setDetailQty(1);
    setDetailSizeId(primeiroTamanho(prato));
    setDetailOptions({});
    setDetailObs('');
    detailGuideTimer.current = setTimeout(() => {
      if (detailInteragiuRef.current || chatOpen) return;
      falarMarco('Toca no tamanho ou no + para selecionar. Duvida grande? Aperta no Marco fixo aqui embaixo e cai na cozinha.', 7200);
    }, 3800);
  };

  const abrirFoto = (src, alt = '') => {
    if (!src) return;
    vibrate(10);
    trackMeta('PhotoView', {
      content_name: alt || pratoAberto?.nome || 'Foto do prato',
      content_type: 'product',
    });
    setFotoAberta({ src, alt });
  };

  const fecharDetalhe = () => {
    clearTimeout(detailGuideTimer.current);
    setPratoAberto(null);
    setDetailOptions({});
    setDetailObs('');
  };

  const quantidadeGrupo = (grupoId, options = detailOptions) => {
    const map = options[String(grupoId)] ?? {};
    return Object.values(map).reduce((s, qtd) => s + Number(qtd || 0), 0);
  };

  const qtdOpcional = (grupoId, opcionalId) => {
    return Number(detailOptions[String(grupoId)]?.[String(opcionalId)] ?? 0);
  };

  const alterarOpcional = (grupo, opcional, delta) => {
    detailInteragiuRef.current = true;
    setDetailOptions(prev => {
      const gid = String(grupo.id);
      const oid = String(opcional.id);
      const atualGrupo = { ...(prev[gid] ?? {}) };
      const atual = Number(atualGrupo[oid] ?? 0);
      const max = Math.max(1, Number(grupo.max_escolhas || 1));

      if (delta > 0) {
        if (max === 1) {
          return { ...prev, [gid]: { [oid]: 1 } };
        }
        const totalGrupo = Object.values(atualGrupo).reduce((s, qtd) => s + Number(qtd || 0), 0);
        if (totalGrupo >= max) {
          vibrate(35);
          setBalaoTexto(`Nesse grupo da pra escolher ate ${max}.`);
          setTimeout(() => setBalaoTexto(null), 3200);
          return prev;
        }
      }

      const novo = Math.max(0, atual + delta);
      if (novo <= 0) delete atualGrupo[oid];
      else atualGrupo[oid] = novo;
      return { ...prev, [gid]: atualGrupo };
    });
  };

  const opcionaisSelecionados = (prato = pratoAberto) => {
    return gruposDoPrato(prato).flatMap(grupo => {
      const map = detailOptions[String(grupo.id)] ?? {};
      return (grupo.opcionais ?? [])
        .map(opcional => ({ ...opcional, grupo_id: grupo.id, grupo_nome: grupo.nome, qtd: Number(map[String(opcional.id)] ?? 0) }))
        .filter(opcional => opcional.qtd > 0);
    });
  };

  const tamanhoSelecionado = (prato = pratoAberto) => {
    return tamanhosDoPrato(prato).find(t => String(t.id) === String(detailSizeId)) ?? null;
  };

  const selecionarTamanho = (tamanho) => {
    detailInteragiuRef.current = true;
    clearTimeout(detailGuideTimer.current);
    setDetailSizeId(tamanho.id);
    vibrate(10);
    const key = String(tamanho?.peso_g || tamanho?.nome || tamanho?.id || '');
    if (!sizeGuideShownRef.current.has(key)) {
      sizeGuideShownRef.current.add(key);
      falarMarco(fraseTamanho(tamanho), 6200);
    }
  };

  const calcularUnitarioDetalhe = (prato = pratoAberto) => {
    if (!prato) return 0;
    const tamanho = tamanhoSelecionado(prato);
    const tamanhoDelta = Number(tamanho?.preco_delta || 0);
    const opcionaisTotal = opcionaisSelecionados(prato).reduce((s, op) => s + Number(op.preco_delta || 0) * Number(op.qtd || 0), 0);
    return Number(prato.preco || 0) + tamanhoDelta + opcionaisTotal;
  };

  const detalheValido = (prato = pratoAberto) => {
    if (!prato) return false;
    if (tamanhosDoPrato(prato).length && !detailSizeId) return false;
    return gruposDoPrato(prato).every(grupo => quantidadeGrupo(grupo.id) >= Number(grupo.min_escolhas || 0));
  };

  const adicionarDetalheNaSacola = () => {
    if (!pratoAberto || !detalheValido(pratoAberto)) return;
    detailInteragiuRef.current = true;
    resetStripeCheckout();
    const tamanho = tamanhoSelecionado(pratoAberto);
    const opcionais = opcionaisSelecionados(pratoAberto).map(op => ({
      id: op.id,
      grupo_id: op.grupo_id,
      grupo_nome: op.grupo_nome,
      nome: op.nome,
      qtd: op.qtd,
      preco_delta: Number(op.preco_delta || 0),
    }));
    const unitario = calcularUnitarioDetalhe(pratoAberto);
    const item = {
      local_id: crypto.randomUUID(),
      prato_id: pratoAberto.id,
      nome: pratoAberto.nome,
      foto: pratoAberto.foto,
      qtd: detailQty,
      preco: unitario,
      subtotal: unitario * detailQty,
      tamanho: tamanho ? {
        id: tamanho.id,
        nome: tamanho.nome,
        peso_g: tamanho.peso_g,
        preco_delta: Number(tamanho.preco_delta || 0),
      } : null,
      opcionais,
      obs: detailObs.trim(),
    };
    trackMeta('AddToCart', {
      content_name: item.nome,
      content_ids: [String(item.prato_id)],
      content_type: 'product',
      value: item.subtotal,
      currency: 'BRL',
      quantity: item.qtd,
      tamanho: item.tamanho ? labelTamanho(item.tamanho) : '',
      opcionais: item.opcionais.map(op => `${op.qtd}x ${op.nome}`),
    });
    const novos = [...carrinho, item];
    setCarrinho(novos);
    setCarrinhoTotal(calcSubtotal(novos));
    setCarrinhoPulse(true);
    setTimeout(() => setCarrinhoPulse(false), 700);
    fecharDetalhe();
    falarMarco('Sacola pronta. Voce pode finalizar o pedido ou adicionar mais. Qualquer duvida, me chama aqui.');
    vibrate([20, 30, 20]);
  };

  const removerItemSacola = (localId) => {
    resetStripeCheckout();
    const novos = carrinho.filter(it => it.local_id !== localId);
    setCarrinho(novos);
    setCarrinhoTotal(calcSubtotal(novos));
    vibrate(18);
  };

  const aplicarCupom = (cupomOuCodigo) => {
    const codigo = typeof cupomOuCodigo === 'string' ? cupomOuCodigo : cupomOuCodigo?.codigo;
    const limpo = String(codigo || '').trim().toUpperCase();
    if (!limpo) {
      setCupomErro('Digite ou escolha um cupom.');
      return;
    }
    const cupom = cuponsDisponiveis.find(c => String(c.codigo || '').toUpperCase() === limpo);
    if (!cupom) {
      setCupomAplicado(null);
      setCupomErro('Nao encontrei esse cupom ativo agora.');
      vibrate(30);
      return;
    }
    const avaliacao = avaliarCupom(cupom);
    if (!avaliacao.ok) {
      setCupomAplicado(null);
      setCupomErro(avaliacao.motivo);
      vibrate(30);
      return;
    }
    setCupomAplicado(cupom);
    setCupomCodigo(String(cupom.codigo || '').toUpperCase());
    setCupomErro('');
    resetStripeCheckout();
    trackMeta('CouponApply', {
      coupon: String(cupom.codigo || '').toUpperCase(),
      value: Number(avaliacao.desconto || 0),
      currency: 'BRL',
      cart_value: carrinhoTotal,
      free_shipping: !!avaliacao.freteGratis,
    });
    setBalaoTexto(`Cupom ${String(cupom.codigo || '').toUpperCase()} aplicado.`);
    setTimeout(() => setBalaoTexto(null), 3200);
    vibrate([15, 20, 15]);
  };

  const removerCupom = () => {
    if (cupomAplicado?.codigo) {
      trackMeta('CouponRemove', {
        coupon: String(cupomAplicado.codigo || '').toUpperCase(),
        cart_value: carrinhoTotal,
        currency: 'BRL',
      });
    }
    setCupomAplicado(null);
    setCupomCodigo('');
    setCupomErro('');
    resetStripeCheckout();
  };

  const abrirSacola = () => {
    trackMeta('CartOpen', {
      value: totalComEntrega,
      currency: 'BRL',
      num_items: totalItens,
      content_ids: carrinho.map(item => String(item.prato_id || item.local_id || item.nome)).slice(0, 20),
    });
    setSacolaOpen(true);
  };

  // Tap no Marco - abre chat
  const tapMarco = () => {
    vibrate(15);
    abrirChat();
  };

  const abrirChat = async () => {
    trackMeta('ChatOpen', {
      cart_value: carrinhoTotal,
      num_items: totalItens,
      page_context: pratoAberto?.nome || (sacolaOpen ? 'sacola' : 'cardapio'),
    });
    setPratoAberto(null);
    setSacolaOpen(false);
    setFotoAberta(null);
    setChatOpen(true);
    setBalaoTexto(null);
    setGarcomState('peek');
    if (mensagens.length === 0) {
      const saudacao = sortear(chatConfig.saudacoes ?? SAUDACOES_INICIAIS);
      const mensagem = sortear(chatConfig.mensagens_automaticas ?? DEFAULT_CHAT_CONFIG.mensagens_automaticas);
      setMensagens([
        { id: Date.now(), autor: 'marco', texto: saudacao },
        { id: Date.now() + 1, autor: 'marco', texto: mensagem },
      ]);
    }
  };

  const fecharChat = () => {
    setChatOpen(false);
  };

  // Long-press no Marco
  const onPressStart = () => {
    lpTimer.current = setTimeout(() => {
      vibrate(40);
      abrirChat();
    }, 500);
  };
  const onPressEnd = () => {
    clearTimeout(lpTimer.current);
  };

  const mostrarMensagemAutomatica = (texto) => {
    setPratoAberto(null);
    setSacolaOpen(false);
    setFotoAberta(null);
    setChatOpen(true);
    setBalaoTexto(null);
    setMensagens(m => [...m, { id: Date.now(), autor: 'marco', texto }]);
  };

  const registrarMensagemCliente = async (texto) => {
    const r = await fetch(GARCOM_RESPONDER_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({
        acao: 'registrar_atendimento',
        device_id: chatDeviceId.current,
        cliente_nome: null,
        texto,
        contexto: {
          carrinho_total: carrinhoTotal,
          total_itens: totalItens,
          pagina: pratoAberto?.nome || (sacolaOpen ? 'sacola' : 'cardapio'),
        },
      }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data?.error || 'Nao consegui enviar a mensagem.');
    return data;
  };

  const enviarMensagemChat = async () => {
    const texto = chatInput.trim();
    if (!texto || chatSending) return;
    if (!chatLeadTrackedRef.current) {
      chatLeadTrackedRef.current = true;
      trackMeta('Lead', {
        lead_type: 'chat_message',
        value: carrinhoTotal,
        currency: 'BRL',
        num_items: totalItens,
      });
    }
    const localId = `local-${Date.now()}`;
    setChatInput('');
    setChatSending(true);
    setMensagens(m => [...m, { id: localId, autor: 'cliente', texto }]);
    try {
      const data = await registrarMensagemCliente(texto);
      if (data?.mensagem?.id) {
        setMensagens(m => m.map(msg => msg.id === localId ? { ...msg, remote_id: data.mensagem.id } : msg));
      }
      setMensagens(m => [...m, {
        id: `ack-${Date.now()}`,
        autor: 'marco',
        texto: 'Recebi aqui. O pessoal do Dom vai conseguir ver essa mensagem pelo painel.',
      }]);
    } catch (err) {
      setMensagens(m => [...m, { id: `err-${Date.now()}`, autor: 'marco', texto: err.message || 'Nao consegui enviar agora. Tenta de novo em instantes.' }]);
    } finally {
      setChatSending(false);
    }
  };

  const finalizarPedidoDireto = (opts = {}) => {
    if (!carrinho.length) return;
    abrirWhatsApp('sacola', opts);
  };

  const fecharPedido = async () => {
    trackMeta('InitiateCheckout', {
      value: totalComEntrega,
      currency: 'BRL',
      num_items: totalItens,
      content_type: 'product',
      content_ids: carrinho.map(item => String(item.prato_id || item.local_id || item.nome)).slice(0, 20),
      coupon: cupomAplicado?.codigo ? String(cupomAplicado.codigo).toUpperCase() : '',
    });
    setCheckoutDados(prev => ({
      ...prev,
      ruaNumero: prev.ruaNumero || whatsEndereco.ruaNumero || '',
      bairro: prev.bairro || whatsEndereco.bairro || '',
    }));
    setCheckoutStage('dados');
    setCheckoutError('');
    setWhatsEnderecoOpen(true);
  };

  // Long-press num prato -> fala do Marco
  const longPressPrato = (prato) => {
    vibrate(30);
    setBalaoTexto(`Boa escolha! ${prato.nome.split(' ').slice(0,2).join(' ')} e dos meus favoritos.`);
    setTimeout(() => setBalaoTexto(null), 3500);
  };

  const renderPratoCard = (p, prefix = 'prato') => (
    <article
      key={`${prefix}-${p.id}`}
      className="prato-card compact relative"
      data-prato-id={p.id}
      data-prato-nome={p.nome}
      onClick={() => abrirDetalhe(p)}
      onContextMenu={(e) => { e.preventDefault(); longPressPrato(p); }}
      onTouchStart={() => { lpTimer.current = setTimeout(() => longPressPrato(p), 520); }}
      onTouchEnd={() => clearTimeout(lpTimer.current)}
    >
      <div className="prato-copy">
        <div>
          {p.badge && (
            <span className="inline-block mb-2 px-2.5 py-1 rounded-full text-[10px] uppercase tracking-[0.08em]" style={{background:'rgba(212,175,55,0.12)', color:'var(--gold)', border:'1px solid rgba(212,175,55,0.2)'}}>
              {p.badge}
            </span>
          )}
          <h3 className="font-serif prato-title">{p.nome}</h3>
          {introPrato(p) && <p className="prato-desc">{introPrato(p)}</p>}
        </div>
        <div className="mt-3 flex items-end justify-between gap-2">
          <span className="prato-price">a partir de {fmtBRL(p.preco)}</span>
          <button
            className="prato-cta"
            onClick={(e) => { e.stopPropagation(); abrirDetalhe(p); }}
          >
            Ver
          </button>
        </div>
      </div>
      <div className="relative">
        <img src={p.foto} alt={p.nome} loading="lazy" />
      </div>
    </article>
  );

  const topo = { ...DEFAULT_TOPO_CONFIG, ...(deliveryConfig.topo || {}) };
  const heroLogoUrl = String(topo.logo_url || '').trim();
  const heroCapaUrl = String(topo.capa_url || '').trim();
  const heroVideoUrl = String(topo.capa_video_url || '').trim();
  const heroTipo = String(topo.capa_tipo || 'imagem').toLowerCase();
  const heroMediaUrl = heroTipo === 'video' ? (heroVideoUrl || heroCapaUrl) : heroCapaUrl;
  const heroIsVideo = heroTipo === 'video' && !!heroMediaUrl;
  const heroHasMedia = !!heroMediaUrl;
  const heroShellClass = ['hero-shell', heroHasMedia ? 'has-media' : '', heroLogoUrl ? 'has-logo' : ''].filter(Boolean).join(' ');

  return (
    <div className="min-h-dvh">
      {heroHasMedia && (
        <div className="hero-media-shell">
          <div className="hero-media-frame">
            {heroIsVideo ? (
              <video src={heroMediaUrl} muted loop autoPlay playsInline preload="metadata" />
            ) : (
              <img src={heroMediaUrl} alt="" loading="eager" />
            )}
          </div>
          {heroLogoUrl && (
            <div className="hero-logo-float">
              <img src={heroLogoUrl} alt={topo.nome || 'Dom Leonardo'} />
            </div>
          )}
        </div>
      )}

      <header className={heroShellClass}>
        <div className="hero-kicker">{topo.kicker}</div>
        <h1 className="font-serif hero-title">{topo.nome}</h1>
        <p className="hero-copy">{topo.descricao}</p>
        <div className="trust-row">
          <div className="trust-chip"><span>{topo.chip_1_label}</span><strong>{topo.chip_1_valor}</strong></div>
          <div className="trust-chip"><span>{topo.chip_2_label}</span><strong>{topo.chip_2_valor}</strong></div>
          <div className="trust-chip"><span>{topo.chip_3_label}</span><strong>{topo.chip_3_valor}</strong></div>
        </div>
        <div className="frete-chef-hero">
          <strong>{topo.faixa_titulo}</strong> {topo.faixa_texto}
        </div>
      </header>

      {cuponsDisponiveis.length > 0 && (
        <section className="px-5 pt-5 coupon-section">
          <div className="section-head">
            <div>
              <h2 className="font-serif text-xl" style={{color:'var(--gold)'}}>{deliveryConfig.cupons_titulo || 'Cupons do Dom'}</h2>
              <p>{deliveryConfig.cupons_descricao || 'Toque em um cupom para deixar salvo na sacola.'}</p>
            </div>
          </div>
          <div className="coupon-strip">
            {cuponsDisponiveis.slice(0, 6).map(cupom => (
              <button
                key={cupom.id}
                className={`coupon-chip ${String(cupomAplicado?.id) === String(cupom.id) ? 'active' : ''}`}
                onClick={() => aplicarCupom(cupom)}
              >
                <small>{String(cupom.codigo || '').toUpperCase()}</small>
                <strong>{labelCupom(cupom)}</strong>
                <span>{textoCupom(cupom)}</span>
              </button>
            ))}
          </div>
        </section>
      )}

      <section className="px-5 pt-6">
        <div className="section-head">
          <div>
            <h2 className="font-serif text-2xl" style={{color:'var(--gold)'}}>Hoje o Dom recomenda</h2>
            <p>Fotos grandes, escolhas seguras e pratos que chegam bem.</p>
          </div>
        </div>
        <div className="destaques-strip">
          <div className={`destaques-track ${pratosDestaque.length > 1 ? 'is-looping' : ''}`}>
            {destaquesLoop.map((p, index) => (
              <button className="destaque-card" key={`${p.id}-${index}`} onClick={() => abrirDetalhe(p)}>
                <div className="relative">
                  <img src={p.foto} alt={p.nome} loading="lazy" />
                  <span className="prato-badge">{p.badge_destaque || p.selo_experiencia || 'Escolha segura'}</span>
                </div>
                <div className="destaque-body">
                  <strong>{p.nome}</strong>

          <>
            <div
              className={`cart-pill ${carrinhoPulse ? 'pulse' : ''}`}
              onClick={() => { vibrate(15); setCarrinhoOpen(o => !o); }}
            >
              <div className="cart-left">
                <span className="cart-emoji">Sacola</span>
                <div className="cart-count">
                  <strong>{carrinho.reduce((s, it) => s + it.qtd, 0)}</strong> {carrinho.reduce((s, it) => s + it.qtd, 0) === 1 ? 'item' : 'itens'}
                  <br/>
                  <span style={{fontSize: '11px', color: 'var(--text-dim)'}}>{carrinhoOpen ? 'tap pra esconder' : 'tap pra ver'}</span>
                </div>
              </div>
              <span className="cart-total">{fmtBRL(carrinhoTotal)}</span>
            </div>
            <div className={`cart-drawer ${carrinhoOpen ? 'open' : ''}`}>
              {carrinho.map((it, i) => (
                <div key={i} className="cart-item">
                  <div className="qty">{it.qtd}</div>
                  <div className="info">
                    <div className="nome">{it.nome}</div>
                    {it.obs && <div className="obs">obs: {it.obs}</div>}
                  </div>
                  <div className="preco">{fmtBRL(it.preco * it.qtd)}</div>
                </div>
              ))}
              <button className="checkout-btn" onClick={() => { setChatOpen(false); setSacolaOpen(true); }}>Fechar pedido</button>
            </div>
          </>
        )}

        <div className="messages">
          {mensagens.map(m => (
            <div key={m.id} className={`msg ${m.autor}`}>{m.texto}</div>
          ))}
        </div>
        <div className="chat-compose">
          <input
            className="chat-input"
            value={chatInput}
            onChange={e => setChatInput(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') enviarMensagemChat(); }}
            placeholder="Mensagem para o Marco..."
            autoComplete="off"
          />
          <button className="chat-send" onClick={enviarMensagemChat} disabled={!chatInput.trim() || chatSending} aria-label="Enviar mensagem">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  // Limpa service workers antigos do Garcom para o cardapio sempre vir do painel.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(reg => {
          if (reg.scope.includes('/garcom/')) reg.unregister().catch(() => {});
        });
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
