<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Dom Leonardo — Cardápio (protótipo mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0a0908; --ink-2:#0e0b09;
    --gold:#d4af37; --gold-soft:#e8d28f; --gold-dim:#8a6f1f;
    --cream:#efe7d6; --muted:#b3a587;
    --line:rgba(212,175,55,.22);
    --col:440px;            /* largura "do celular" */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:#050403;                 /* fora do celular = mais escuro */
    color:var(--cream);
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:19px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ====== o "aparelho": coluna estreita centralizada ====== */
  .device{
    position:relative;
    width:100%; max-width:var(--col);
    margin:0 auto; min-height:100vh;
    background:var(--ink);
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(212,175,55,.10), 0 24px 90px rgba(0,0,0,.7);
  }
  .device::before{ /* brilho dourado no topo + vinheta */
    content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(120% 50% at 50% -5%, rgba(212,175,55,.10), transparent 55%),
      radial-gradient(100% 60% at 50% 120%, rgba(0,0,0,.55), transparent 60%);
  }
  .device>*{position:relative;z-index:1}
  .pad{padding:0 22px}

  /* ====== barra de topo ====== */
  .topbar{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    height:54px;padding:0 18px;
    background:linear-gradient(180deg, rgba(10,9,8,.97), rgba(10,9,8,.78) 78%, transparent);
    backdrop-filter:blur(6px);
  }
  .topbar .bm{font-family:'Jost',sans-serif;letter-spacing:.34em;font-size:11px;text-transform:uppercase;color:var(--gold-soft)}
  .topbar .open{font-family:'Jost',sans-serif;letter-spacing:.16em;font-size:9.5px;text-transform:uppercase;color:var(--gold-dim);border:1px solid rgba(212,175,55,.3);padding:5px 9px;border-radius:999px}

  /* chips de categoria (scroll horizontal) */
  .chips{position:sticky;top:54px;z-index:38;display:flex;gap:9px;overflow-x:auto;padding:11px 18px;background:rgba(10,9,8,.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(212,175,55,.10);-ms-overflow-style:none;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips a{flex:0 0 auto;font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid rgba(212,175,55,.22);padding:8px 13px;border-radius:999px;transition:.25s;white-space:nowrap}
  .chips a:active,.chips a:hover{color:#1a1206;background:var(--gold);border-color:var(--gold)}

  /* ====== capa ====== */
  .hero{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:54px 22px 48px;position:relative}
  .hero .eyebrow{font-family:'Jost',sans-serif;letter-spacing:.42em;text-transform:uppercase;font-size:10.5px;color:var(--gold);margin-bottom:22px}
  .hero h1{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(44px,15vw,72px);line-height:.95;letter-spacing:-.01em}
  .hero h1 .it{font-style:italic;font-weight:600;color:var(--gold-soft);display:block;font-size:.66em}
  .orn{display:flex;align-items:center;justify-content:center;gap:14px;margin:26px auto 18px;width:78%}
  .orn .l{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .orn .r{flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
  .orn .d{color:var(--gold);font-size:12px;transform:rotate(45deg)}
  .hero .sub{font-style:italic;font-size:20px;color:var(--muted);max-width:34ch}
  .hero .meta{margin-top:24px;font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-dim)}
  .cue{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-family:'Jost',sans-serif;font-size:9.5px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(5px)}}

  /* ====== cabeçalho de capítulo ====== */
  .chapter{padding:54px 22px 8px;text-align:center}
  .chapter .num{font-family:'Jost',sans-serif;letter-spacing:.36em;text-transform:uppercase;font-size:10px;color:var(--gold)}
  .chapter h2{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(28px,8vw,40px);margin:11px 0 6px}
  .chapter .flank{display:flex;align-items:center;justify-content:center;gap:13px;margin:6px auto 0;width:62%}
  .chapter .flank .l,.chapter .flank .r{flex:1;height:1px;background:var(--line)}
  .chapter .flank .d{color:var(--gold);font-size:10px;transform:rotate(45deg)}
  .chapter .desc{font-style:italic;color:var(--muted);max-width:36ch;margin:13px auto 0;font-size:18px}

  /* ====== card do prato (foto em cima, texto embaixo) ====== */
  .dish{padding-top:10px}
  .dish .ph{position:relative}
  .dish .ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;filter:saturate(1.05) contrast(1.03)}
  .dish .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(10,9,8,.55));pointer-events:none}
  .seal{position:absolute;top:13px;left:13px;z-index:3;background:var(--gold);color:#1a1206;font-family:'Jost',sans-serif;font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:6px 10px;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.5)}
  .dish .body{padding:18px 22px 26px}
  .dish h3{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(23px,6.4vw,29px);line-height:1.1;margin-bottom:10px}
  .dish p{color:var(--muted);font-size:18px;line-height:1.5;margin-bottom:16px}
  .priceline{display:flex;align-items:baseline;gap:11px;margin-bottom:18px}
  .priceline .lead{font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .priceline .dots{flex:1;border-bottom:1px dotted rgba(212,175,55,.4);transform:translateY(-5px)}
  .priceline .val{font-family:'Playfair Display',serif;font-size:26px;color:var(--gold-soft);font-weight:600}
  .priceline .val s{color:var(--gold-dim);font-size:.6em;margin-right:8px;opacity:.7}
  .btn-order{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font-family:'Jost',sans-serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-soft);background:transparent;border:1px solid var(--gold-dim);padding:15px;cursor:pointer;transition:.3s}
  .btn-order:active,.btn-order:hover{background:var(--gold);color:#1a1206;border-color:var(--gold)}
  .dish + .dish{border-top:1px solid rgba(212,175,55,.09);margin-top:8px}

  /* ====== destaque full-bleed ====== */
  .feature{position:relative;min-height:74vh;display:flex;align-items:flex-end;overflow:hidden}
  .feature img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .feature::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,7,6,.1) 0%,rgba(8,7,6,.25) 40%,rgba(8,7,6,.94) 100%)}
  .feature .fc{position:relative;z-index:2;padding:26px 22px 30px;width:100%}
  .feature .kicker{font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
  .feature h3{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(30px,9vw,46px);line-height:1.03;margin-bottom:12px}
  .feature p{color:#e7dcc5;font-size:18px;max-width:40ch;margin-bottom:18px}

  .wave{display:block;width:100%;height:46px;color:var(--gold-dim);opacity:.5;margin:8px 0}

  /* ====== barra inferior fixa (sacola) ====== */
  .cart{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(var(--col),100%);z-index:50;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(8,7,6,.96) 30%)}
  .cart button{flex:1;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:15px;border:none;cursor:pointer}
  .cart .bell{flex:0 0 auto;background:transparent;color:var(--gold-soft);border:1px solid var(--gold-dim)}
  .cart .bag{background:var(--gold);color:#1a1206;font-weight:500}

  footer{padding:64px 22px 120px;text-align:center}
  footer .mk{font-family:'Playfair Display',serif;font-style:italic;font-size:26px;color:var(--gold-soft)}
  footer .sm{font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-top:12px}

  .protonote{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:60;font-family:'Jost',sans-serif;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dim);background:rgba(5,4,3,.85);border:1px solid rgba(212,175,55,.2);padding:4px 10px;border-radius:999px;pointer-events:none}
  .loading{min-height:70vh;display:flex;align-items:center;justify-content:center;font-style:italic;color:var(--muted);font-size:20px;text-align:center;padding:0 24px}
</style>
</head>
<body>

<div class="protonote">protótipo claude · mobile</div>

<div class="device" id="device">
  <div class="loading">Servindo o cardápio…</div>
</div>

<script>
const GARCOM_RESPONDER_URL = 'https://jewamqbdonudiapxbzay.supabase.co/functions/v1/garcom-responder';
const ANON = 'sb_publishable_VeJTrMvtl5PAEvvc6R0CKA_nzjxQiAY';
const ROMAN = ['','I','II','III','IV','V','VI','VII','VIII','IX','X'];

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function brl(v){return 'R$ '+Number(v||0).toFixed(2).replace('.',',');}
function foto(p){return p.foto_url||p.foto||'';}
function preco(p){return p.preco_promocional||p.preco_base||p.preco||0;}
function desc(p){return p.descricao_curta||p.descricao_completa||p.descricao||p.frase_fome||'';}

const WAVE = `<svg class="wave" viewBox="0 0 440 46" preserveAspectRatio="none" fill="none"><path d="M0 23 C 60 4, 120 42, 180 23 S 300 4, 360 23 440 23 440 23" stroke="currentColor" stroke-width="1.1"/><circle cx="220" cy="23" r="2.6" fill="currentColor"/></svg>`;

async function carregar(){
  const r = await fetch(GARCOM_RESPONDER_URL+'?_='+Date.now(),{
    method:'POST',cache:'no-store',
    headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},
    body:JSON.stringify({acao:'listar_pratos'})
  });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

function pedir(nome){
  alert('🔔 (protótipo) Aqui abriria o pedido de:\n\n'+nome+'\n\nNo cardápio real, leva pra sacola/checkout.');
}

function dishCard(p){
  const badge = p.badge_destaque ? `<span class="seal">${esc(p.badge_destaque)}</span>`:'';
  const promo = (p.preco_promocional && p.preco_base && p.preco_promocional<p.preco_base) ? `<s>${brl(p.preco_base)}</s>`:'';
  return `
  <article class="dish">
    <div class="ph">${badge}<img loading="lazy" src="${esc(foto(p))}" alt="${esc(p.nome)}" /></div>
    <div class="body">
      <h3>${esc(p.nome)}</h3>
      <p>${esc(desc(p))}</p>
      <div class="priceline"><span class="lead">Valor</span><span class="dots"></span><span class="val">${promo}${brl(preco(p))}</span></div>
      <button class="btn-order" onclick="pedir('${esc(p.nome)}')">Pedir agora →</button>
    </div>
  </article>`;
}

function featureCard(p){
  return `
  <section class="feature">
    <img loading="lazy" src="${esc(foto(p))}" alt="${esc(p.nome)}" />
    <div class="fc">
      <div class="kicker">Para dividir · mesa cheia</div>
      <h3>${esc(p.nome)}</h3>
      <p>${esc(desc(p))}</p>
      <div class="priceline"><span class="lead">Valor</span><span class="dots"></span><span class="val">${brl(preco(p))}</span></div>
      <button class="btn-order" onclick="pedir('${esc(p.nome)}')">Pedir agora →</button>
    </div>
  </section>`;
}

function render(data){
  const cats = (data.categorias||[]).slice().sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  const pratos = data.pratos||[];
  const cfg = data.config||{};
  const byCat = {};
  for(const p of pratos){ (byCat[p.categoria_id]||=[]).push(p); }
  for(const k in byCat){ byCat[k].sort((a,b)=>(a.ordem||0)-(b.ordem||0)); }

  const nome = cfg.restaurante_nome || 'Dom Leonardo';
  const partes = String(nome).trim().split(' ');
  const heroNome = partes.length>1 ? `${esc(partes[0])}<span class="it">${esc(partes.slice(1).join(' '))}</span>` : esc(nome);

  let body = `
  <div class="topbar"><span class="bm">Dom Leonardo</span><span class="open">● Aberto</span></div>
  <nav class="chips" id="chips"></nav>
  <header class="hero">
    <div class="eyebrow">Cozinha Italiana · Curitiba</div>
    <h1>${heroNome}</h1>
    <div class="orn"><span class="l"></span><span class="d">◆</span><span class="r"></span></div>
    <p class="sub">${esc(cfg.restaurante_descricao || 'Risotos cremosos, massas da casa e o pão recheado que pede pra ser dividido.')}</p>
    <div class="meta">${cats.length} capítulos · ${pratos.length} pratos</div>
    <div class="cue">role o menu ↓</div>
  </header>`;

  const nav=[];
  cats.forEach((c,idx)=>{
    const list=byCat[c.id]||[];
    if(!list.length) return;
    const anchor='cap'+idx;
    nav.push(`<a href="#${anchor}">${esc(c.nome)}</a>`);
    body += `<section id="${anchor}">
      <div class="chapter">
        <div class="num">Capítulo ${ROMAN[idx+1]||(idx+1)}</div>
        <h2>${esc(c.nome)}</h2>
        <div class="flank"><span class="l"></span><span class="d">◆</span><span class="r"></span></div>
        ${c.descricao?`<p class="desc">${esc(c.descricao)}</p>`:''}
      </div>`;
    if(list.length===1){ body += featureCard(list[0]); }
    else { list.forEach(p=>{ body += dishCard(p); }); }
    body += `</section>`;
    if(idx<cats.length-1) body += `<div class="pad">${WAVE}</div>`;
  });

  body += `
  <footer><div class="mk">Dom Leonardo</div><div class="sm">feito com fogo · servido com cuidado</div></footer>
  <div class="cart"><button class="bell" onclick="pedir('chamar o garçom')">🔔 Garçom</button><button class="bag" onclick="pedir('ver sacola')">Ver sacola</button></div>`;

  const dev=document.getElementById('device');
  dev.innerHTML=body;
  document.getElementById('chips').innerHTML=nav.join('');
}

carregar().then(render).catch(err=>{
  document.getElementById('device').innerHTML='<div class="loading">Não consegui carregar o cardápio ao vivo.<br><br>'+esc(err.message||err)+'</div>';
});
</script>
</body>
</html>
