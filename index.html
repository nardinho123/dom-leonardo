        <div className="card" style={{background:'var(--card-2)'}}>
          <div className="card-title">Ranking por prato/adicional</div>
          <div className="table-wrap"><table><thead><tr><th></th><th>Prato</th><th>Qtd</th><th>Qtd/dia</th><th>Receita</th><th>CMV</th><th>Lucro</th><th>Margem</th><th>Food cost</th></tr></thead><tbody>
            {ranking.map((r,i) => {
              const m = r.margem_pct, fc = r.food_cost;
              return <tr key={r.receita_id}><td>{i+1}</td><td><b>{r.nome}</b></td><td>{fmt(r.qtd,0)}</td><td className="muted">{fmt(r.qtd/qtdDias,1)}</td><td className="green">{fmtR$(r.receita)}</td><td className="red">{fmtR$(r.cmv)}</td><td className={r.lucro>=0?'green':'red'}>{fmtR$(r.lucro)}</td><td className={m>=40?'green':m>=25?'yellow':'red'}>{fmtPct(m)}</td><td className={fc<32?'green':fc<38?'yellow':'red'}>{fmtPct(fc)}</td></tr>;
            })}
          </tbody></table></div>
        </div>
      )}
      {porDia.length > 0 && <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}><div className="card" style={{background:'var(--card-2)'}}><div className="card-title">Vendas por dia</div><div className="chart-wrap"><canvas ref={chartLineRef}/></div></div><div className="card" style={{background:'var(--card-2)'}}><div className="card-title">Receita por prato/adicional</div><div className="chart-wrap"><canvas ref={chartPieRef}/></div></div></div>}
      <div className="table-wrap" style={{marginTop:14}}>
        <table>
          <thead><tr><th>Data</th><th>Prato</th><th>Tipo / Peso</th><th>Qtd</th><th>Preco</th><th>Total</th><th>Canal</th><th>CMV</th><th>Lucro</th><th>Acoes</th></tr></thead>
          <tbody>
            {loading && <tr><td colSpan="10"><Skeleton rows={3}/></td></tr>}
            {!loading && extratoAgrupado.length === 0 && <tr><td colSpan="10" className="empty">Nenhuma venda no periodo</td></tr>}
            {!loading && extratoAgrupado.map(r => <Fragment key={r.id}>
              <tr>
                <td className="muted">{fmtDate(r.vendas?.movimentacoes?.data_movimentacao)}</td>
                <td><b>{r.receitas_ficha_tecnica?.nome}</b>{r.adicionais?.length > 0 && <div className="muted" style={{fontSize:11}}>{r.adicionais.length} opcional(is) junto</div>}</td>
                <td><span className="badge badge-blue">Principal</span>{r.peso_real_gramas != null && <div className="muted" style={{fontSize:11}}>Peso: {fmt(r.peso_real_gramas,0)}g</div>}</td>
                <td>{fmt(r.quantidade,0)}</td><td>{fmtR$(r.valor_unitario)}</td><td className="green">{fmtR$(r.valor_total)}</td>
                <td><span className="badge badge-blue">{CANAL_LABEL[r.vendas?.canal_venda]||'--'}</span></td><td className="red">{fmtR$(r.cmv_total)}</td><td className={Number(r.lucro_bruto)>=0?'green':'red'}>{fmtR$(r.lucro_bruto)}</td>
                <td><div style={{display:'flex',gap:6,flexWrap:'wrap'}}><EditRowButton onClick={()=>setEditing(r)}/><button className="btn btn-outline btn-sm" onClick={()=>setAddingOpcional(r)}>+ Opcional</button><DeleteRowButton onClick={()=>setConfirmDelete(r)}/></div></td>
              </tr>
              {r.adicionais?.length > 0 && <tr className="expanded"><td colSpan="10"><div className="table-wrap"><table style={{background:'transparent'}}><thead><tr><th>Opcional</th><th>Tipo / Peso</th><th>Qtd</th><th>Preco</th><th>Total</th><th>CMV</th><th>Lucro</th><th>Acoes</th></tr></thead><tbody>
                {r.adicionais.map(ad => <tr key={ad.id}><td>{ad.receitas_ficha_tecnica?.nome}{ad.observacoes && <div className="muted" style={{fontSize:11}}>{ad.observacoes}</div>}</td><td><span className={`badge badge-${ad.tipo_item==='cortesia'?'yellow':'green'}`}>{ad.tipo_item==='cortesia'?'Cortesia':'Adicional'}</span>{ad.peso_real_gramas != null && <div className="muted" style={{fontSize:11}}>Peso: {fmt(ad.peso_real_gramas,0)}g</div>}</td><td>{fmt(ad.quantidade,0)}</td><td>{fmtR$(ad.valor_unitario)}</td><td className={ad.tipo_item==='cortesia'?'yellow':'green'}>{fmtR$(ad.valor_total)}</td><td className="red">{fmtR$(ad.cmv_total)}</td><td className={Number(ad.lucro_bruto)>=0?'green':'red'}>{fmtR$(ad.lucro_bruto)}</td><td><div style={{display:'flex',gap:6,flexWrap:'wrap'}}><EditRowButton onClick={()=>setEditing(ad)}/><DeleteRowButton onClick={()=>setConfirmDeleteItem(ad)}/></div></td></tr>)}
              </tbody></table></div></td></tr>}
            </Fragment>)}
          </tbody>
        </table>
      </div>
      <EditVendaModal open={!!editing} onClose={()=>setEditing(null)} row={editing} receitas={receitas} sb={sb} toast={toast} onSaved={load}/>
      <AddVendaOpcionalModal open={!!addingOpcional} onClose={()=>setAddingOpcional(null)} parent={addingOpcional} receitas={receitas} precos={precos} sb={sb} toast={toast} onSaved={load}/>
      <ConfirmModal open={!!confirmDelete} onClose={()=>setConfirmDelete(null)} onConfirm={()=>excluirVenda(confirmDelete)} title="Excluir venda inteira" message={`Excluir a venda inteira de "${confirmDelete?.receitas_ficha_tecnica?.nome||''}"? Se a venda tiver mais pratos, todos os itens dessa venda tambem serao apagados do estoque, CMV e caixa.`} danger requireText="EXCLUIR"/>
      <ConfirmModal open={!!confirmDeleteItem} onClose={()=>setConfirmDeleteItem(null)} onConfirm={()=>excluirVendaItem(confirmDeleteItem)} title="Excluir item da venda" message={`Excluir "${confirmDeleteItem?.receitas_ficha_tecnica?.nome||''}" desta venda? O caixa, o CMV e o estoque serao recalculados.`} danger requireText="EXCLUIR"/>
    </div>
  );
}

function VendaHistorico({ sb, receitas, precos, produtos, unidades, toast, refreshKey }) {
  const [periodo, setPeriodo] = useState('mes');
  const [custom, setCustom] = useState({});
  const [filtroPrato, setFiltroPrato] = useState('');
  const [filtroCanal, setFiltroCanal] = useState('');
  const [rows, setRows] = useState([]);
  const [custosByItem, setCustosByItem] = useState({});
  const [descontosByVenda, setDescontosByVenda] = useState({});
  const [editing, setEditing] = useState(null);
  const [editingDescontos, setEditingDescontos] = useState(null);
  const [addingOpcional, setAddingOpcional] = useState(null);
  const [addingCusto, setAddingCusto] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [confirmDeleteItem, setConfirmDeleteItem] = useState(null);
  const [confirmCancel, setConfirmCancel] = useState(null);
  const [confirmDeleteCusto, setConfirmDeleteCusto] = useState(null);
  const [loading, setLoading] = useState(false);
  const [expandedPedidos, setExpandedPedidos] = useState(new Set());
  const [diaAtivoIdx, setDiaAtivoIdx] = useState(0);
  const chartLineRef = useRef(null);
  const chartPieRef = useRef(null);

  function togglePedido(vendaId) {
    setExpandedPedidos(prev => {
      const n = new Set(prev);
      if (n.has(vendaId)) n.delete(vendaId); else n.add(vendaId);
      return n;
    });
  }

  async function load() {
    setLoading(true);
    const { from, to } = periodToDates(periodo, custom);
    let q = sb.from('vendas_itens').select(`
      id, venda_id, quantidade, valor_unitario, valor_total, desconto_item, cmv_total, custo_extra_total, lucro_bruto, receita_id,
      tipo_item, venda_item_pai_id, peso_real_gramas, observacoes, cancelado, cancelado_em, cancelamento_motivo,
      receitas_ficha_tecnica(nome),
      vendas!inner(canal_venda, desconto_plataforma, valor_bruto, valor_liquido, numero_pedido, movimentacao_id, movimentacoes!inner(data_movimentacao))
    `).gte('vendas.movimentacoes.data_movimentacao', from.toISOString()).lte('vendas.movimentacoes.data_movimentacao', to.toISOString());
    if (filtroPrato) q = q.eq('receita_id', filtroPrato);
    if (filtroCanal) q = q.eq('vendas.canal_venda', filtroCanal);
    const { data } = await q.order('id',{ascending:false}).limit(500);
    const baseRows = data || [];
    setRows(baseRows);

    const itemIds = baseRows.map(r=>r.id);
    if (itemIds.length) {
      const { data: custos } = await sb.from('vendas_custos_extras')
        .select('id,venda_id,venda_item_id,produto_id,quantidade,quantidade_gramas,custo_total,observacoes,produtos(nome,tipo),unidades(codigo,nome)')
        .in('venda_item_id', itemIds)
        .order('created_at',{ascending:true});
      setCustosByItem(groupBy(custos||[], x=>x.venda_item_id));
    } else {
      setCustosByItem({});
    }

    const vendaIds = [...new Set(baseRows.map(r=>r.venda_id).filter(Boolean))];
    if (vendaIds.length) {
      const { data: descs } = await sb.from('vendas_descontos')
        .select('id,venda_id,tipo_desconto,valor,observacoes')
        .in('venda_id', vendaIds)
        .order('created_at',{ascending:true});
      setDescontosByVenda(groupBy(descs||[], x=>x.venda_id));
    } else {
      setDescontosByVenda({});
    }

    setLoading(false);
  }
  useEffect(() => { load(); }, [periodo, custom, filtroPrato, filtroCanal, refreshKey]);

  async function excluirVenda(row) {
    try {
      const { error } = await sb.rpc('rpc_excluir_venda', { p_venda_id: row.venda_id });
      if (error) throw error;
      toast('Venda excluida completamente','success');
      setConfirmDelete(null);
      load();
    } catch(e) { toast('Erro: '+e.message,'error'); }
  }

  async function excluirVendaItem(row) {
    try {
      const { error } = await sb.rpc('rpc_excluir_venda_item', { p_venda_item_id: row.id });
      if (error) throw error;
      toast('Item removido da venda','success');
      setConfirmDeleteItem(null);
      load();
    } catch(e) { toast('Erro: '+e.message,'error'); }
  }

  async function cancelarVendaItem(row) {
    try {
      const { error } = await sb.rpc('rpc_cancelar_venda_item', { p_venda_item_id: row.id, p_motivo: row.cancelamento_motivo || 'Receita devolvida ao cliente' });
      if (error) throw error;
      toast('Receita do item zerada; custo e estoque mantidos','success');
      setConfirmCancel(null);
      load();
    } catch(e) { toast('Erro: '+e.message,'error'); }
  }

  async function excluirCustoExtra(row) {
    try {
      const { error } = await sb.rpc('rpc_excluir_venda_custo_extra', { p_custo_extra_id: row.id });
      if (error) throw error;
      toast('Custo extra removido','success');
      setConfirmDeleteCusto(null);
      load();
    } catch(e) { toast('Erro: '+e.message,'error'); }
  }

  const totalBruto = sumBy(rows,'valor_total');
  const totalDescontos = sumBy(rows,'desconto_item');
  const totalCMV = sumBy(rows, r => Number(r.cmv_total||0) + Number(r.custo_extra_total||0));
  const totalLucro = sumBy(rows,'lucro_bruto');

  const ranking = useMemo(() => {
    const m = {};
    rows.forEach(r => {
      const k = r.receita_id;
      if (!m[k]) m[k] = { receita_id:k, nome:r.receitas_ficha_tecnica?.nome||'?', qtd:0, receita:0, cmv:0, lucro:0 };
      m[k].qtd += Number(r.quantidade);
      m[k].receita += Number(r.valor_total);
      m[k].cmv += Number(r.cmv_total||0) + Number(r.custo_extra_total||0);
      m[k].lucro += Number(r.lucro_bruto);
    });
    return Object.values(m).map(x => ({
      ...x,
      margem_pct: x.receita > 0 ? (x.lucro/x.receita)*100 : 0,
      food_cost: x.receita > 0 ? (x.cmv/x.receita)*100 : 0,
    })).sort((a,b)=>b.lucro-a.lucro);
  }, [rows]);

  const { from, to } = periodToDates(periodo, custom);
  const qtdDias = Math.max(1, Math.ceil((to-from)/86400000));
  const porDia = useMemo(() => {
    const m = {}; rows.forEach(r => { const k = r.vendas?.movimentacoes?.data_movimentacao?.slice(0,10); if (k) m[k] = (m[k]||0) + Number(r.valor_total); });
    return Object.entries(m).sort();
  }, [rows]);

  // Agrupa em dois niveis: por venda (pedido) e dentro de cada venda, adicionais sob o principal
  const pedidosAgrupados = useMemo(() => {
    const filhos = {};
    rows.forEach(r => { if (r.venda_item_pai_id) (filhos[r.venda_item_pai_id] = filhos[r.venda_item_pai_id] || []).push(r); });
    const principais = rows.filter(r => !r.venda_item_pai_id);
    const ids = new Set(principais.map(r => r.id));
    rows.forEach(r => { if (r.venda_item_pai_id && !ids.has(r.venda_item_pai_id)) principais.push(r); });
    const principaisEnriquecidos = principais.map(r => ({...r, adicionais: filhos[r.id] || [], custos_extras: custosByItem[r.id] || []}));

    // agrupa por venda_id
    const porVenda = {};
    principaisEnriquecidos.forEach(p => {
      if (!porVenda[p.venda_id]) {
        porVenda[p.venda_id] = {
          venda_id: p.venda_id,
          numero_pedido: p.vendas?.numero_pedido || null,
          data_movimentacao: p.vendas?.movimentacoes?.data_movimentacao,
          canal_venda: p.vendas?.canal_venda,
          valor_bruto: Number(p.vendas?.valor_bruto || 0),
          valor_liquido: Number(p.vendas?.valor_liquido || 0),
          descontos: descontosByVenda[p.venda_id] || [],
          principais: []
        };
      }
      porVenda[p.venda_id].principais.push(p);
    });
    return Object.values(porVenda).sort((a,b) => (b.data_movimentacao||'').localeCompare(a.data_movimentacao||'') || (b.venda_id||'').localeCompare(a.venda_id||''));
  }, [rows, custosByItem, descontosByVenda]);

  // Agrupa pedidos por dia (YYYY-MM-DD) para o carrossel
  const diasAgrupados = useMemo(() => {
    const m = {};
    pedidosAgrupados.forEach(ped => {
      const d = (ped.data_movimentacao||'').slice(0,10);
      if (!d) return;
      if (!m[d]) m[d] = { data:d, pedidos:[], bruto:0, descontos:0, cmv:0, lucroReal:0 };
      const totalDescPed = sumBy(ped.descontos||[], 'valor');
      const totalCmvPed = sumBy(ped.principais, p => Number(p.cmv_total||0)+Number(p.custo_extra_total||0)+sumBy(p.adicionais||[], a=>Number(a.cmv_total||0)+Number(a.custo_extra_total||0))+sumBy(p.custos_extras||[],'custo_total'));
      m[d].pedidos.push(ped);
      m[d].bruto    += Number(ped.valor_bruto||0);
      m[d].descontos+= totalDescPed;
      m[d].cmv      += totalCmvPed;
      m[d].lucroReal+= Number(ped.valor_bruto||0) - totalDescPed - totalCmvPed;
    });
    return Object.values(m).sort((a,b) => b.data.localeCompare(a.data));
  }, [pedidosAgrupados]);

  // Reseta dia ativo quando os dados mudam
  useEffect(() => { setDiaAtivoIdx(0); }, [periodo, custom, filtroPrato, filtroCanal]);
  // Mantem o dia ativo dentro dos limites se a lista encurtar
  useEffect(() => {
    if (diaAtivoIdx >= diasAgrupados.length && diasAgrupados.length > 0) setDiaAtivoIdx(0);
  }, [diasAgrupados.length]);

  const diaAtivo = diasAgrupados[diaAtivoIdx];
  function dataLabel(d) {
    try {
      const dt = new Date(d + 'T12:00:00');
      const dias = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
      return `${dias[dt.getDay()]}, ${fmtDate(d)}`;
    } catch { return d; }
  }

  useChart(chartLineRef, () => {
    if (porDia.length === 0) return null;
    return { type:'line', data:{ labels:porDia.map(x=>fmtDate(x[0]).slice(0,5)), datasets:[{ data:porDia.map(x=>x[1]), borderColor:cssVar('--green'), backgroundColor:'rgba(52,211,153,.15)', fill:true, tension:.3 }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} }, scales:{ x:{ ticks:{color:cssVar('--muted'),font:{size:10}}, grid:{display:false} }, y:{ ticks:{color:cssVar('--muted'),callback:v=>'R$ '+fmt(v,0)}, grid:{color:cssVar('--border')} } } } };
  }, [porDia]);

  useChart(chartPieRef, () => {
    if (ranking.length === 0) return null;
    const top = ranking.slice(0,8);
    return { type:'doughnut', data:{ labels:top.map(x=>x.nome), datasets:[{ data:top.map(x=>x.receita), backgroundColor:['#34d399','#4a90d9','#fbbf24','#a78bfa','#f87171','#22d3ee','#fb923c','#94a3b8'] }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'right', labels:{color:cssVar('--text-2'),font:{size:11},boxWidth:12} } } } };
  }, [ranking]);

  return (
    <div className="card" style={{marginTop:18}}>
      <div className="card-title">Historico de vendas</div>
      <DatePeriodFilter value={periodo} onChange={setPeriodo} custom={custom} onCustomChange={setCustom}/>
      <div className="form-row">
        <div className="form-group"><label>Filtrar prato</label><SearchableDropdown value={filtroPrato} onChange={setFiltroPrato} options={receitas} placeholder="Todos"/></div>
        <div className="form-group"><label>Filtrar canal</label><select value={filtroCanal} onChange={e=>setFiltroCanal(e.target.value)}><option value="">Todos</option>{Object.entries(CANAL_LABEL).map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></div>
      </div>
      <div className="stat-grid">
        <div className="stat-card tinted-green"><div className="stat-value green">{fmtR$(totalBruto)}</div><div className="stat-label">Receita bruta</div></div>
        <div className="stat-card tinted-red"><div className="stat-value red">{fmtR$(totalDescontos)}</div><div className="stat-label">Descontos</div></div>
        <div className="stat-card tinted-red"><div className="stat-value red">{fmtR$(totalCMV)}</div><div className="stat-label">CMV + erros</div></div>
        <div className="stat-card tinted-blue"><div className={`stat-value ${totalLucro>=0?'green':'red'}`}>{fmtR$(totalLucro)}</div><div className="stat-label">Lucro bruto real</div></div>
      </div>

      {/* Extrato diario - carrossel */}
      <div className="card" style={{padding:0,overflow:'hidden'}}>
        {loading && <div style={{padding:18}}><Skeleton rows={4}/></div>}
        {!loading && diasAgrupados.length === 0 && <div className="empty" style={{padding:24,textAlign:'center'}}>Nenhuma venda no periodo</div>}
        {!loading && diaAtivo && (
          <Fragment>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,padding:'14px 16px',background:'var(--card-2)',borderBottom:'1px solid var(--border)'}}>
              <button className="btn btn-outline" onClick={()=>setDiaAtivoIdx(i=>Math.min(i+1, diasAgrupados.length-1))} disabled={diaAtivoIdx >= diasAgrupados.length-1} title="Dia anterior">◂</button>
              <div style={{textAlign:'center',flex:1}}>
                <div style={{fontSize:18,fontWeight:700}}>📅 {dataLabel(diaAtivo.data)}</div>
                <div className="muted" style={{fontSize:12,marginTop:2}}>{diaAtivo.pedidos.length} pedido{diaAtivo.pedidos.length===1?'':'s'} · dia {diaAtivoIdx+1} de {diasAgrupados.length}</div>
              </div>
              <button className="btn btn-outline" onClick={()=>setDiaAtivoIdx(i=>Math.max(i-1, 0))} disabled={diaAtivoIdx === 0} title="Próximo dia">▸</button>
            </div>
            <div className="stat-grid" style={{padding:14,marginBottom:0}}>
              <div className="stat-card tinted-green"><div className="stat-value green">{fmtR$(diaAtivo.bruto)}</div><div className="stat-label">Faturamento bruto</div></div>
              <div className="stat-card tinted-red"><div className="stat-value red">{fmtR$(diaAtivo.descontos)}</div><div className="stat-label">Desconto iFood</div></div>
              <div className="stat-card tinted-red"><div className="stat-value red">{fmtR$(diaAtivo.cmv)}</div><div className="stat-label">CMV</div></div>
              <div className="stat-card tinted-blue"><div className={`stat-value ${diaAtivo.lucroReal>=0?'green':'red'}`}>{fmtR$(diaAtivo.lucroReal)}</div><div className="stat-label">Lucro real</div></div>
            </div>
            <div style={{padding:'0 14px 14px',display:'flex',flexDirection:'column',gap:10}}>
              {diaAtivo.pedidos.map(ped => {
                const isOpen = expandedPedidos.has(ped.venda_id);
                const totalDesc = sumBy(ped.descontos||[], 'valor');
                const totalCmv = sumBy(ped.principais, p => Number(p.cmv_total||0)+Number(p.custo_extra_total||0)+sumBy(p.adicionais||[], a=>Number(a.cmv_total||0)+Number(a.custo_extra_total||0))+sumBy(p.custos_extras||[],'custo_total'));
                const qtdPratos = ped.principais.length;
                const qtdAdicionais = sumBy(ped.principais, p => (p.adicionais||[]).length);
                const algumCancelado = ped.principais.some(p => p.cancelado || (p.adicionais||[]).some(a=>a.cancelado));
                return (
                  <div className="card" key={ped.venda_id} style={{padding:0,background:algumCancelado?'var(--red-bg)':'var(--card)'}}>
                    <div onClick={()=>togglePedido(ped.venda_id)} style={{cursor:'pointer',padding:'12px 14px',display:'flex',flexWrap:'wrap',gap:10,alignItems:'center',justifyContent:'space-between'}}>
                      <div style={{display:'flex',gap:14,alignItems:'center',flexWrap:'wrap'}}>
                        <span style={{fontSize:18}}>{isOpen?'▾':'▸'}</span>
                        <b>📦 #{ped.numero_pedido || 's/n'}</b>
                        <span className={`badge badge-${CANAL_COR[ped.canal_venda]||'blue'}`}>{CANAL_LABEL[ped.canal_venda]||ped.canal_venda}</span>
                        <span className="muted">{qtdPratos} prato{qtdPratos===1?'':'s'}{qtdAdicionais>0?` + ${qtdAdicionais} adicional${qtdAdicionais===1?'':'is'}`:''}</span>
                      </div>
                      <div style={{display:'flex',gap:14,alignItems:'center'}}>
                        <span>Bruto <b className="green">{fmtR$(ped.valor_bruto)}</b></span>
                        <span>Desc <b className="red">{fmtR$(totalDesc)}</b></span>
                        <span>CMV <b className="red">{fmtR$(totalCmv)}</b></span>
                        <span>Lucro real <b className={(ped.valor_bruto - totalDesc - totalCmv)>=0?'green':'red'}>{fmtR$(ped.valor_bruto - totalDesc - totalCmv)}</b></span>
                      </div>
                    </div>
                    {isOpen && (

      <ConfirmModal open={!!confirmCancel} onClose={()=>setConfirmCancel(null)} onConfirm={()=>cancelarVendaItem(confirmCancel)} title="Zerar receita" message={`Zerar a receita de "${confirmCancel?.receitas_ficha_tecnica?.nome||''}"? O estoque e o custo permanecem, porque o pedido foi produzido/enviado.`} danger requireText="ZERAR"/>

function TelaPerda() {
  const sb = getClient();
  const toast = useToast();
  const [produtos, setProdutos] = useState([]);
  const [unidades, setUnidades] = useState([]);
  const [refreshHistKey, setRefreshHistKey] = useState(0);
  const [tipoLanc, setTipoLanc] = useState('uso'); // 'uso' | 'perda'
  const [filtroTipo, setFiltroTipo] = useState(''); // '' | 'cru' | 'preparado'
  const [data, setData] = useState(todayISO());
  const [f, setF] = useState({ produto_id:'', quantidade:'', unidade_id:'', motivo:'vencimento', obs:'' });
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    sb.from('produtos').select('id,nome,tipo').eq('ativo',true).order('nome').then(r=>setProdutos(r.data||[]));
    sb.from('unidades').select('id,codigo,nome,fator_gramas').order('nome').then(r=>setUnidades(r.data||[]));
  }, []);

  const produtosFiltrados = useMemo(() => {
    if (!filtroTipo) return produtos.filter(p => p.tipo !== 'embalagem'); // por padrao oculta embalagem
    return produtos.filter(p => p.tipo === filtroTipo);
  }, [produtos, filtroTipo]);

  async function lancar() {
    if (!f.produto_id || !f.quantidade || !f.unidade_id) return toast('Preencha produto, quantidade e unidade','error');
    setLoading(true);
    try {
      const prod = produtos.find(p=>p.id===f.produto_id);
      if (tipoLanc === 'perda') {
        const { error } = await sb.rpc('rpc_lancar_perda', {
          p_data_movimentacao: dateInputToIso(data),
          p_produto_id: f.produto_id,
          p_quantidade: parseDecimal(f.quantidade),
          p_unidade_id: f.unidade_id,
          p_motivo_perda: f.motivo,
          p_observacoes: f.obs || null
        });
        if (error) throw error;
        toast(`Perda registrada: ${f.quantidade} ${unidades.find(u=>u.id===f.unidade_id)?.nome||''} de ${prod?.nome}`,'warn');
      } else {
        const { error } = await sb.rpc('rpc_lancar_uso', {
          p_data_movimentacao: dateInputToIso(data),
          p_produto_id: f.produto_id,
          p_quantidade: parseDecimal(f.quantidade),
          p_unidade_id: f.unidade_id,
          p_observacoes: f.obs || null
        });
        if (error) throw error;
        toast(`Uso registrado: ${f.quantidade} ${unidades.find(u=>u.id===f.unidade_id)?.nome||''} de ${prod?.nome}`,'success');
      }
      setF({ produto_id:'', quantidade:'', unidade_id:'', motivo:'vencimento', obs:'' });
      setRefreshHistKey(k=>k+1);
    } catch(e) { toast('Erro: '+e.message,'error'); }
    setLoading(false);
  }

  const isPerda = tipoLanc === 'perda';

  return (
    <div className="content">
      <div className="section-header"><div className="section-title">🪣 Usos e Perdas</div></div>
      <div className="card">
        <div style={{display:'flex',gap:6,marginBottom:14}}>
          <button className={`btn ${tipoLanc==='uso'?'btn-success':'btn-outline'}`} style={{flex:1}} onClick={()=>setTipoLanc('uso')}>USO (consumo operacional)</button>
          <button className={`btn ${tipoLanc==='perda'?'btn-danger':'btn-outline'}`} style={{flex:1}} onClick={()=>setTipoLanc('perda')}>PERDA (desperdicio)</button>
        </div>
        <div className="muted" style={{fontSize:12,marginBottom:14,padding:'8px 12px',background:'var(--card-2)',borderRadius:6}}>
          {isPerda
            ? 'Use para registrar itens estragados, vencidos ou quebrados. Da baixa no estoque com etiqueta de PERDA.'
            : 'Use para dar baixa de oleo, sal, acucar, gas, cafe etc — itens consumidos no dia a dia sem precisar de ficha tecnica. Da baixa no estoque sem mexer no caixa.'
          }
        </div>

        <div className="form-row">
          <div className="form-group"><label>Data</label><input type="date" value={data} onChange={e=>setData(e.target.value)}/></div>
          <div className="form-group">
            <label>Tipo de produto</label>
            <select value={filtroTipo} onChange={e=>setFiltroTipo(e.target.value)}>
              <option value="">Todos (cru + preparado + insumo)</option>
              <option value="cru">Apenas In Natura (cru)</option>
              <option value="preparado">Apenas Preparado</option>
              <option value="insumo">Apenas Insumo</option>
              <option value="embalagem">Apenas Embalagem</option>
            </select>
          </div>
        </div>

        {isPerda && (
          <div className="form-group">
            <label>Motivo da perda</label>
            <select value={f.motivo} onChange={e=>setF({...f,motivo:e.target.value})}>
              {MOTIVO_PERDA.map(m=><option key={m} value={m}>{MOTIVO_LABEL[m]}</option>)}
            </select>
          </div>
        )}

        <div className="form-group">
          <label>Produto</label>
          <SearchableDropdown value={f.produto_id} onChange={v=>setF({...f,produto_id:v})} options={produtosFiltrados} placeholder="Buscar produto..." renderOption={p=><div>{p.nome} <span className="muted">({TIPO_LABEL[p.tipo]||p.tipo})</span></div>}/>
        </div>
        <div className="form-row">
          <div className="form-group"><label>Quantidade</label><input type="number" step="0.001" value={f.quantidade} onChange={e=>setF({...f,quantidade:e.target.value})}/></div>
          <div className="form-group"><label>Unidade</label><SearchableDropdown value={f.unidade_id} onChange={v=>setF({...f,unidade_id:v})} options={unidades} placeholder="Un..." getLabel={u=>u.nome}/></div>
        </div>
        <div className="form-group">
          <label>Observação (opcional)</label>
          <textarea rows="2" value={f.obs} onChange={e=>setF({...f,obs:e.target.value})} placeholder="Detalhes..."/>
        </div>
        <button className={`btn ${isPerda?'btn-danger':'btn-success'} btn-lg btn-block`} onClick={lancar} disabled={loading}>
          {loading?'Registrando...':(isPerda?'Registrar Perda':'Registrar Uso')}
        </button>
      </div>

      <UsoPerdaHistorico sb={sb} produtos={produtos} unidades={unidades} toast={toast} refreshKey={refreshHistKey}/>
    </div>
  );
}

function UsoPerdaHistorico({ sb, produtos, unidades, toast, refreshKey }) {
  const [periodo, setPeriodo] = useState('mes');
  const [custom, setCustom] = useState({});
  const [filtroTipo, setFiltroTipo] = useState(''); // '' | 'uso' | 'perda'
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(false);

  async function load() {
    setLoading(true);
    const { from, to } = periodToDates(periodo, custom);
    let q = sb.from('ajustes_estoque').select(`
      id, tipo, quantidade, quantidade_gramas, motivo_perda, motivo, observacoes,
      produto_id, produtos(nome,tipo),
      unidade_id, unidades(nome,codigo),
      movimentacao_id, movimentacoes!inner(data_movimentacao)
    `).in('tipo', ['perda','ajuste_negativo'])
      .gte('movimentacoes.data_movimentacao', from.toISOString())
      .lte('movimentacoes.data_movimentacao', to.toISOString())
      .order('id',{ascending:false}).limit(500);
    if (filtroTipo === 'uso') q = q.eq('tipo','ajuste_negativo');
    if (filtroTipo === 'perda') q = q.eq('tipo','perda');
    const { data } = await q;
    setRows(data||[]);
    setLoading(false);
  }
  useEffect(() => { load(); }, [periodo, custom, filtroTipo, refreshKey]);

  const totalQuantidadeG = sumBy(rows, 'quantidade_gramas');
  const qtdUsos = rows.filter(r => r.tipo === 'ajuste_negativo').length;
  const qtdPerdas = rows.filter(r => r.tipo === 'perda').length;

  return (
    <div className="card" style={{marginTop:14}}>
      <div className="card-title">Histórico de usos e perdas</div>
      <DatePeriodFilter value={periodo} onChange={setPeriodo} custom={custom} onCustomChange={setCustom}/>
      <div className="form-row">
        <div className="form-group">
          <label>Filtrar tipo</label>
          <select value={filtroTipo} onChange={e=>setFiltroTipo(e.target.value)}>
            <option value="">Todos (usos + perdas)</option>
            <option value="uso">Apenas Usos</option>
            <option value="perda">Apenas Perdas</option>
          </select>
        </div>
      </div>
      <div className="stat-grid">
        <div className="stat-card tinted-green"><div className="stat-value">{qtdUsos}</div><div className="stat-label">Usos no periodo</div></div>
        <div className="stat-card tinted-red"><div className="stat-value">{qtdPerdas}</div><div className="stat-label">Perdas no periodo</div></div>
        <div className="stat-card tinted-blue"><div className="stat-value">{fmtG(totalQuantidadeG)}</div><div className="stat-label">Total dado baixa</div></div>
      </div>
      <div className="table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Tipo</th><th>Produto</th><th>Qtd</th><th>Motivo / Obs</th></tr></thead>
          <tbody>
            {loading && <tr><td colSpan="5"><Skeleton rows={3}/></td></tr>}
            {!loading && rows.length === 0 && <tr><td colSpan="5" className="empty">Nenhum lançamento no periodo</td></tr>}
            {!loading && rows.map(r => (
              <tr key={r.id}>
                <td className="muted">{fmtDate(r.movimentacoes?.data_movimentacao)}</td>
                <td><span className={`badge badge-${r.tipo==='perda'?'red':'green'}`}>{r.tipo==='perda'?'PERDA':'USO'}</span></td>
                <td><b>{r.produtos?.nome}</b> <span className="muted" style={{fontSize:11}}>({TIPO_LABEL[r.produtos?.tipo]||r.produtos?.tipo})</span></td>
                <td>{fmt(r.quantidade,2)} {r.unidades?.codigo}</td>
                <td className="muted" style={{fontSize:12}}>
                  {r.tipo === 'perda' && r.motivo_perda && <span className="badge badge-yellow" style={{marginRight:6}}>{MOTIVO_LABEL[r.motivo_perda]}</span>}
                  {r.observacoes || (r.tipo==='ajuste_negativo' ? 'Uso operacional' : '—')}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function PerdaHistorico({ sb, produtos, unidades, toast, refreshKey }) {
  const [periodo, setPeriodo] = useState('mes');
  const [custom, setCustom] = useState({});
  const [rows, setRows] = useState([]);
  const [editing, setEditing] = useState(null);
  const [loading, setLoading] = useState(false);
  const chartPieRef = useRef(null);
  const chartBarRef = useRef(null);

  async function load() {
    setLoading(true);
    const { from, to } = periodToDates(periodo, custom);
    const { data } = await sb.from('ajustes_estoque').select(`
      id, quantidade, quantidade_gramas, motivo_perda, observacoes,
      produto_id, produtos(nome),
      unidade_id, unidades(nome,codigo),
      movimentacao_id, movimentacoes!inner(data_movimentacao)
    `).eq('tipo','perda').gte('movimentacoes.data_movimentacao', from.toISOString()).lte('movimentacoes.data_movimentacao', to.toISOString()).order('id',{ascending:false}).limit(500);
    setRows(data||[]);
    setLoading(false);
  }
  useEffect(() => { load(); }, [periodo, custom, refreshKey]);

  // Estimar valor das perdas usando estoque_movimentacoes (custo registrado)
  const [valorPorRegistro, setValorPorRegistro] = useState({});
  useEffect(() => {
    if (rows.length === 0) { setValorPorRegistro({}); return; }
    const movIds = [...new Set(rows.map(r=>r.movimentacao_id))];
    if (movIds.length === 0) return;
    sb.from('estoque_movimentacoes').select('movimentacao_id,produto_id,custo_total').in('movimentacao_id', movIds).then(({ data }) => {
      const m = {};
      (data||[]).forEach(x => { const k = `${x.movimentacao_id}-${x.produto_id}`; m[k] = (m[k]||0) + Number(x.custo_total||0); });
      setValorPorRegistro(m);
    });
  }, [rows]);

  const totalPerdido = sumBy(rows, r => valorPorRegistro[`${r.movimentacao_id}-${r.produto_id}`] || 0);

  const porMotivo = useMemo(() => {
    const m = {};
    rows.forEach(r => { const v = valorPorRegistro[`${r.movimentacao_id}-${r.produto_id}`] || 0; m[r.motivo_perda] = (m[r.motivo_perda]||0) + v; });
    return Object.entries(m).filter(([_,v])=>v>0);
  }, [rows, valorPorRegistro]);

  const porProduto = useMemo(() => {
    const m = {};
    rows.forEach(r => { const v = valorPorRegistro[`${r.movimentacao_id}-${r.produto_id}`] || 0; const n = r.produtos?.nome||'?'; m[n] = (m[n]||0) + v; });
    return Object.entries(m).filter(([_,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,10);
  }, [rows, valorPorRegistro]);

  useChart(chartPieRef, () => {
    if (porMotivo.length === 0) return null;
    return {
      type:'doughnut',
      data:{ labels:porMotivo.map(x=>MOTIVO_LABEL[x[0]]||x[0]), datasets:[{ data:porMotivo.map(x=>x[1]), backgroundColor:['#f87171','#fbbf24','#a78bfa','#94a3b8','#4a90d9'] }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'right', labels:{color:cssVar('--text-2'),font:{size:11}} } } }
    };
  }, [porMotivo]);

  useChart(chartBarRef, () => {
    if (porProduto.length === 0) return null;
    return {
      type:'bar',
      data:{ labels:porProduto.map(x=>x[0]), datasets:[{ data:porProduto.map(x=>x[1]), backgroundColor:'rgba(248,113,113,.7)', borderRadius:6 }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
