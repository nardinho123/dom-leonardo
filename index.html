// ── CMV & ANÁLISE ───────────────────────────────────────────────────────────
function TelaCMV() {
  const sb = getClient();
  const [periodo, setPeriodo] = useState('mes');
  const [custom, setCustom] = useState({});
  const [cmvData, setCmvData] = useState([]);
  const [vendasItens, setVendasItens] = useState([]);
  const [precos, setPrecos] = useState({});
  const [loading, setLoading] = useState(true);
  const [sort, setSort] = useState({ col:'lucro_total', asc:false });
  const [expanded, setExpanded] = useState(null);
  const [ingredientesPrato, setIngredientesPrato] = useState({});

  async function load() {
    setLoading(true);
    const { from, to } = periodToDates(periodo, custom);
    const [cmv, vi, pc] = await Promise.all([
      sb.from('v_cmv_pratos').select('receita_id,nome,cmv_total'),
      sb.from('vendas_itens').select(`receita_id,quantidade,valor_total,cmv_total,lucro_bruto,vendas!inner(canal_venda,movimentacao_id,movimentacoes!inner(data_movimentacao))`).gte('vendas.movimentacoes.data_movimentacao', from.toISOString()).lte('vendas.movimentacoes.data_movimentacao', to.toISOString()),
      sb.from('precos_venda').select('receita_id,canal,preco').eq('ativo',true),
    ]);
    setCmvData(cmv.data||[]);
    setVendasItens(vi.data||[]);
    const pm = {}; (pc.data||[]).forEach(x => { (pm[x.receita_id]=pm[x.receita_id]||{})[x.canal] = Number(x.preco); });
    setPrecos(pm);
    setLoading(false);
  }
  useEffect(() => { load(); }, [periodo, custom]);

  // Linhas consolidadas
  const linhas = useMemo(() => {
    const m = {};
    cmvData.forEach(c => { m[c.receita_id] = { receita_id:c.receita_id, nome:c.nome, cmv:Number(c.cmv_total)||0, qtd:0, receita:0, cmv_total:0, lucro:0 }; });
    vendasItens.forEach(v => {
      const r = m[v.receita_id]; if (!r) return;
      r.qtd += Number(v.quantidade); r.receita += Number(v.valor_total);
      r.cmv_total += Number(v.cmv_total); r.lucro += Number(v.lucro_bruto);
    });
    return Object.values(m).map(r => {
      const preco = precos[r.receita_id]?.ifood || 0;
      const margem_unit = preco - r.cmv;
      const fc = preco > 0 ? (r.cmv/preco)*100 : null;
      const margem_pct = preco > 0 ? ((preco-r.cmv)/preco)*100 : null;
      return { ...r, preco, margem_unit, fc, margem_pct, lucro_total: r.lucro };
    });
  }, [cmvData, vendasItens, precos]);

  const sorted = [...linhas].sort((a,b) => {
    const va = a[sort.col] ?? 0, vb = b[sort.col] ?? 0;
    const cmp = typeof va === 'string' ? va.localeCompare(vb) : (parseFloat(va)||0) - (parseFloat(vb)||0);
    return sort.asc ? cmp : -cmp;
  });
  function sortBy(c) { setSort(s => s.col===c ? { col:c, asc:!s.asc } : { col:c, asc:false }); }

  const campeao = sorted.length > 0 ? [...sorted].sort((a,b)=>b.lucro_total-a.lucro_total)[0] : null;

  // Expand: ingredientes do prato
  async function toggleExpand(receita_id) {
    if (expanded === receita_id) { setExpanded(null); return; }
    setExpanded(receita_id);
    if (!ingredientesPrato[receita_id]) {
      const { data } = await sb.from('receita_itens').select(`quantidade,quantidade_gramas,fator_rendimento,produto_id,produtos(nome,tipo,categorias(nome))`).eq('receita_id', receita_id);
      const ids = (data||[]).map(x => x.produto_id);
      let custos = {};
      if (ids.length > 0) {
        const { data: ce } = await sb.from('v_estoque_atual').select('produto_id,custo_medio_grama').in('produto_id', ids);
        (ce||[]).forEach(x => custos[x.produto_id] = Number(x.custo_medio_grama)||0);
      }
      const enriched = (data||[]).map(it => {
        const cg = custos[it.produto_id]||0;
        const c = (Number(it.quantidade_gramas)||0)/(Number(it.fator_rendimento)||1) * cg;
        return { ...it, custo: c, grupo: categorizar(it.produtos, it.produtos?.categorias?.nome) };
      });
      setIngredientesPrato(prev => ({...prev, [receita_id]: enriched }));
    }
  }

  // Projeção
  const dias7 = vendasItens.filter(v => new Date(v.vendas?.movimentacoes?.data_movimentacao) >= addDays(new Date(),-7));
  const lucro7 = sumBy(dias7,'lucro_bruto');
  const receita7 = sumBy(dias7,'valor_total');
  const lucroProjMes = lucro7/7 * 30;
  const receitaProjMes = receita7/7 * 30;

  // Mapa de calor — top 8 pratos × dia da semana
  const heatmap = useMemo(() => {
    const top = sorted.slice(0,8);
    const dias = ['dom','seg','ter','qua','qui','sex','sab'];
    const m = {}; top.forEach(p => m[p.receita_id] = [0,0,0,0,0,0,0]);
    vendasItens.forEach(v => {
      const dt = new Date(v.vendas?.movimentacoes?.data_movimentacao);
      if (m[v.receita_id]) m[v.receita_id][dt.getDay()] += Number(v.quantidade);
    });
    return { top, m, dias };
  }, [sorted, vendasItens]);
  const maxHeat = Math.max(1, ...Object.values(heatmap.m||{}).flatMap(arr=>arr));

  return (
    <div className="content">
      <div className="section-header">
        <div className="section-title">📊 CMV & Análise</div>
        <button className="btn btn-outline btn-sm" onClick={load}>↻ Atualizar</button>
      </div>
      <DatePeriodFilter value={periodo} onChange={setPeriodo} custom={custom} onCustomChange={setCustom}/>

      {(receita7 > 0 || lucro7 !== 0) && (
        <div className="card" style={{borderLeft:'4px solid var(--blue)'}}>
          <div className="card-title">🔮 Projeção mensal (baseada nos últimos 7 dias)</div>
          <div className="stat-grid">
            <div className="stat-card"><div className="stat-value green">{fmtR$(receitaProjMes)}</div><div className="stat-label">Receita estimada</div></div>
            <div className="stat-card"><div className={`stat-value ${lucroProjMes>=0?'green':'red'}`}>{fmtR$(lucroProjMes)}</div><div className="stat-label">Lucro estimado</div></div>
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-title">Pratos · receita, CMV e lucro do período</div>
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th></th>
                <th className="sortable" onClick={()=>sortBy('nome')}>Prato</th>
                <th className="sortable" onClick={()=>sortBy('preco')}>Preço</th>
                <th className="sortable" onClick={()=>sortBy('cmv')}>CMV unit</th>
                <th className="sortable" onClick={()=>sortBy('margem_unit')}>Margem R$</th>
                <th className="sortable" onClick={()=>sortBy('fc')}>Food cost</th>
                <th className="sortable" onClick={()=>sortBy('qtd')}>Qtd</th>
                <th className="sortable" onClick={()=>sortBy('receita')}>Receita</th>
                <th className="sortable" onClick={()=>sortBy('lucro_total')}>Lucro</th>
              </tr>
            </thead>
            <tbody>
              {loading && <tr><td colSpan="9"><Skeleton rows={4}/></td></tr>}
              {!loading && sorted.length === 0 && <tr><td colSpan="9" className="empty">Sem dados</td></tr>}
              {!loading && sorted.map(r => {
                const fc = r.fc; const corFC = fc==null?'muted':fc<32?'green':fc<38?'yellow':'red';
                const isCampeao = campeao && campeao.receita_id === r.receita_id && r.lucro_total > 0;
                return (
                  <Fragment key={r.receita_id}>
                    <tr className="clickable" onClick={()=>toggleExpand(r.receita_id)}>
                      <td>{expanded===r.receita_id?'▾':'▸'}</td>
                      <td><b>{r.nome}</b> {isCampeao && <span className="badge badge-green">🏆 CAMPEÃO</span>}</td>
                      <td>{r.preco>0?fmtR$(r.preco):'—'}</td>
                      <td className="red">{fmtR$(r.cmv)}</td>
                      <td className={r.margem_unit>=0?'green':'red'}>{r.preco>0?fmtR$(r.margem_unit):'—'}</td>
                      <td className={corFC}>{fc!=null?fmtPct(fc):'—'}</td>
                      <td>{fmt(r.qtd,0)}</td>
                      <td className="green">{fmtR$(r.receita)}</td>
                      <td className={r.lucro_total>=0?'green':'red'}><b>{fmtR$(r.lucro_total)}</b></td>
                    </tr>
                    {expanded === r.receita_id && ingredientesPrato[r.receita_id] && (
                      <tr className="expanded"><td colSpan="9"><PratoExpand ingredientes={ingredientesPrato[r.receita_id]}/></td></tr>
                    )}
                  </Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {heatmap.top.length > 0 && (
        <div className="card">
          <div className="card-title">🔥 Mapa de calor — vendas por dia da semana</div>
          <div style={{overflowX:'auto'}}>
            <div className="heatmap" style={{gridTemplateColumns:'180px repeat(7, 1fr)',minWidth:600}}>
              <div></div>
              {['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=><div key={d} style={{textAlign:'center',color:'var(--muted)',fontSize:11,fontWeight:600}}>{d}</div>)}
              {heatmap.top.map(p => (
                <Fragment key={p.receita_id}>
                  <div style={{padding:'8px',fontSize:12,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{p.nome}</div>
                  {(heatmap.m[p.receita_id]||[]).map((v,i) => {
                    const intensity = v/maxHeat;
                    return <div key={i} className="heatmap-cell" style={{background: v===0?'var(--card-2)':`rgba(52,211,153, ${0.2 + intensity*0.7})`}}>{v>0?fmt(v,0):''}</div>;
                  })}
                </Fragment>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function PratoExpand({ ingredientes }) {
  const chartRef = useRef(null);
  const groups = { carboidrato:0, proteina:0, queijo:0, molho:0, embalagem:0, extras:0 };
  ingredientes.forEach(it => groups[it.grupo] += it.custo);
  const total = sumBy(Object.values(groups), v=>v);
  useChart(chartRef, () => {
    const data = Object.entries(groups).filter(([_,v])=>v>0);
    if (data.length === 0) return null;
    return {
      type:'doughnut',
      data:{ labels:data.map(x=>GRUPO_LABEL[x[0]]), datasets:[{ data:data.map(x=>x[1]), backgroundColor:data.map(x=>GRUPO_COR[x[0]]) }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'right', labels:{color:cssVar('--text-2'),font:{size:10}} } } }
    };
  }, [ingredientes]);
  const maior = Object.entries(groups).sort((a,b)=>b[1]-a[1])[0];
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,padding:'10px 0'}}>
      <div>
        <div className="card-title">Ingredientes</div>
        <div style={{maxHeight:200,overflowY:'auto'}}>
          {ingredientes.map((it,i) => (
            <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border)',fontSize:12}}>
              <span>{it.produtos?.nome} <span className="muted">({fmtG(it.quantidade_gramas)})</span></span>
              <span className="red">{fmtR$(it.custo)}</span>
            </div>
          ))}
        </div>
      </div>
      <div>
        <div className="card-title">Distribuição</div>
        {total > 0 ? <div className="chart-wrap sm"><canvas ref={chartRef}/></div> : <div className="empty">Sem custos</div>}
        {maior && maior[1] > 0 && (
          <div className="muted" style={{fontSize:12,marginTop:6}}>💡 Maior custo: <b style={{color:GRUPO_COR[maior[0]]}}>{GRUPO_LABEL[maior[0]]}</b> ({fmtPct(maior[1]/total*100)})</div>
        )}
      </div>
    </div>
  );
}

function LancamentoCaixaModal({ open, onClose, tipo, categorias, sb, toast, onSaved }) {
  const [f, setF] = useState({ valor:'', descricao:'', data:todayISO(), forma_pagamento:'pix', categoria_id:'', observacoes:'' });
  const [loading, setLoading] = useState(false);
  useEffect(() => { if (open) setF({ valor:'', descricao:'', data:todayISO(), forma_pagamento:'pix', categoria_id:'', observacoes:'' }); }, [open, tipo]);
  if (!open) return null;
  const catsDoTipo = (categorias||[]).filter(c => c.tipo === tipo);
  const titulo = tipo === 'receita' ? '+ Entrada avulsa' : '- Saída avulsa';
  const corBtn = tipo === 'receita' ? 'btn-success' : 'btn-danger';
  async function salvar() {
    if (!f.valor || parseDecimal(f.valor) <= 0) return toast('Informe o valor','error');
    if (!f.descricao.trim()) return toast('Informe a descricao','error');
    setLoading(true);
    try {
      const { error } = await sb.rpc('rpc_lancar_caixa_avulso', {
        p_tipo: tipo,
        p_valor: parseDecimal(f.valor),
        p_descricao: f.descricao.trim(),
        p_data: dateInputToIso(f.data),
        p_forma_pagamento: f.forma_pagamento,
        p_categoria_id: f.categoria_id || null,
        p_observacoes: f.observacoes || null
      });
      if (error) throw error;
      toast(`${tipo==='receita'?'Entrada':'Saída'} de ${fmtR$(parseDecimal(f.valor))} registrada`, 'success');
      onClose();
      onSaved && onSaved();
    } catch(e) { toast('Erro: '+e.message,'error'); }
    setLoading(false);
  }
  return (
    <Modal open={true} onClose={onClose} title={titulo} size="md">
      <div className="form-row">
        <div className="form-group"><label>Data</label><input type="date" value={f.data} onChange={e=>setF({...f,data:e.target.value})}/></div>
        <div className="form-group"><label>Valor (R$)</label><input type="number" step="0.01" value={f.valor} onChange={e=>setF({...f,valor:e.target.value})} autoFocus/></div>
      </div>
      <div className="form-group">
        <label>Descrição</label>
        <input value={f.descricao} onChange={e=>setF({...f,descricao:e.target.value})} placeholder={tipo==='receita'?'Ex: Pix do João, devolução do fornecedor':'Ex: Conta de luz, cerâmica quebrada'}/>
      </div>
      <div className="form-row">
        <div className="form-group">
          <label>Categoria</label>
          <select value={f.categoria_id} onChange={e=>setF({...f,categoria_id:e.target.value})}>
            <option value="">Sem categoria</option>
            {catsDoTipo.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
          </select>
        </div>
        <div className="form-group">
          <label>Forma de pagamento</label>
          <select value={f.forma_pagamento} onChange={e=>setF({...f,forma_pagamento:e.target.value})}>
            {FORMA_PGTO.map(([v,l]) => <option key={v} value={v}>{l}</option>)}
          </select>
        </div>
      </div>
      <div className="form-group">
        <label>Observações (opcional)</label>
        <textarea rows="2" value={f.observacoes} onChange={e=>setF({...f,observacoes:e.target.value})} placeholder="Detalhes adicionais..."/>
      </div>
      <button className={`btn ${corBtn} btn-lg btn-block`} onClick={salvar} disabled={loading}>
        {loading?'Registrando...':`Registrar ${tipo==='receita'?'entrada':'saída'} de ${fmtR$(parseDecimal(f.valor)||0)}`}
      </button>
    </Modal>
  );
}

function TelaCaixa() {
  const sb = getClient();
  const [periodo, setPeriodo] = useState('mes');
  const [custom, setCustom] = useState({});
  const [rows, setRows] = useState([]);
  const [vendas, setVendas] = useState([]);
  const [vendasItens, setVendasItens] = useState([]);
  const [categorias, setCategorias] = useState([]);
  const [modalLanc, setModalLanc] = useState(null); // null | 'receita' | 'despesa'
  const [loading, setLoading] = useState(true);
  const toast = useToast();
  const chartBarRef = useRef(null);
  const chartPieRef = useRef(null);
  const chartLineRef = useRef(null);
  const chartWeekRef = useRef(null);

  async function load() {
    setLoading(true);
    const { from, to } = periodToDates(periodo, custom);
    const [fc, vd, vi, cats] = await Promise.all([
      sb.from('fluxo_caixa').select('id,tipo,valor,descricao,pago,forma_pagamento,created_at,categoria_id,categorias_caixa(nome,tipo),movimentacoes!inner(data_movimentacao)').gte('movimentacoes.data_movimentacao', from.toISOString()).lte('movimentacoes.data_movimentacao', to.toISOString()).order('created_at',{ascending:false}),
      sb.from('vendas').select('id,valor_bruto,valor_liquido,desconto_plataforma,canal_venda,movimentacao_id,movimentacoes!inner(data_movimentacao)').gte('movimentacoes.data_movimentacao', from.toISOString()).lte('movimentacoes.data_movimentacao', to.toISOString()),
      sb.from('vendas_itens').select('cmv_total,vendas!inner(movimentacao_id,movimentacoes!inner(data_movimentacao))').gte('vendas.movimentacoes.data_movimentacao', from.toISOString()).lte('vendas.movimentacoes.data_movimentacao', to.toISOString()),
      sb.from('categorias_caixa').select('id,tipo,nome').order('tipo').order('nome'),
    ]);
    setRows(fc.data||[]); setVendas(vd.data||[]); setVendasItens(vi.data||[]); setCategorias(cats.data||[]);
    setLoading(false);
  }
  useEffect(() => { load(); }, [periodo, custom]);

  const receita = sumBy(rows.filter(r=>r.tipo==='receita'),'valor');
  const despesa = sumBy(rows.filter(r=>r.tipo==='despesa'),'valor');
  const saldo = receita - despesa;
  const cmvVendas = sumBy(vendasItens,'cmv_total');
  const fcPct = receita > 0 ? (cmvVendas/receita)*100 : 0;

  // DRE
  const dreReceitaBruta = sumBy(vendas,'valor_bruto');
  const dreDescontos    = sumBy(vendas,'desconto_plataforma');
  const dreReceitaLiq   = dreReceitaBruta - dreDescontos;
  const dreCMV          = cmvVendas;
  const dreLucroBruto   = dreReceitaLiq - dreCMV;
  const dreFixas        = sumBy(rows.filter(r => r.tipo==='despesa' && (r.categorias_caixa?.nome||'') !== 'Compra de insumos'),'valor');
  const dreLucroOp      = dreLucroBruto - dreFixas;
  const dreMargemOp     = dreReceitaLiq > 0 ? (dreLucroOp/dreReceitaLiq)*100 : 0;

  // Por dia para gráficos
  const porDia = useMemo(() => {
    const m = {}; rows.forEach(r => { const k = movimentoDate(r)?.slice(0,10); if (!k) return; if (!m[k]) m[k] = { r:0, d:0 }; (r.tipo==='receita'?m[k].r+=Number(r.valor):m[k].d+=Number(r.valor)); });
    return Object.entries(m).sort();
  }, [rows]);

  // Despesas por categoria (pie)
  const despesasCat = useMemo(() => {
    const m = {}; rows.filter(r=>r.tipo==='despesa').forEach(r => { const k = r.categorias_caixa?.nome||'Sem categoria'; m[k] = (m[k]||0)+Number(r.valor); });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  }, [rows]);

  // Saldo acumulado
  const acumulado = useMemo(() => {
    let acc = 0;
    return porDia.map(([k,v]) => { acc += v.r - v.d; return { d:k, saldo: acc }; });
  }, [porDia]);

  // Lucro por semana
  const porSemana = useMemo(() => {
    const m = {};
    porDia.forEach(([k,v]) => {
      const dt = new Date(k);
      const sem = `${dt.getFullYear()}-W${Math.ceil(((dt-new Date(dt.getFullYear(),0,1))/86400000+new Date(dt.getFullYear(),0,1).getDay()+1)/7)}`;
      m[sem] = (m[sem]||0) + (v.r - v.d);
    });
    return Object.entries(m);
  }, [porDia]);

  useChart(chartBarRef, () => {
    if (porDia.length === 0) return null;
    return {
      type:'bar',
      data:{ labels:porDia.map(x=>fmtDate(x[0]).slice(0,5)), datasets:[
        { label:'Receita', data:porDia.map(x=>x[1].r), backgroundColor:'rgba(52,211,153,.7)', borderRadius:6 },
        { label:'Despesa', data:porDia.map(x=>x[1].d), backgroundColor:'rgba(248,113,113,.7)', borderRadius:6 },
      ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{color:cssVar('--text-2'),boxWidth:12} } },
        scales:{ x:{ ticks:{color:cssVar('--muted'),font:{size:10}}, grid:{display:false} }, y:{ ticks:{color:cssVar('--muted'),callback:v=>'R$ '+fmt(v,0)}, grid:{color:cssVar('--border')} } }
      }
    };
  }, [porDia]);

  useChart(chartPieRef, () => {
    if (despesasCat.length === 0) return null;
    return {
      type:'doughnut',
      data:{ labels:despesasCat.map(x=>x[0]), datasets:[{ data:despesasCat.map(x=>x[1]), backgroundColor:['#f87171','#fbbf24','#a78bfa','#94a3b8','#4a90d9','#22d3ee','#fb923c','#34d399'] }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'right', labels:{color:cssVar('--text-2'),font:{size:11}} } } }
    };
  }, [despesasCat]);

  useChart(chartLineRef, () => {
    if (acumulado.length === 0) return null;
    return {
      type:'line',
      data:{ labels:acumulado.map(x=>fmtDate(x.d).slice(0,5)), datasets:[{ label:'Saldo acumulado', data:acumulado.map(x=>x.saldo), borderColor:cssVar('--blue'), backgroundColor:'rgba(74,144,217,.15)', fill:true, tension:.2 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} },
        scales:{ x:{ ticks:{color:cssVar('--muted'),font:{size:10}}, grid:{display:false} }, y:{ ticks:{color:cssVar('--muted'),callback:v=>'R$ '+fmt(v,0)}, grid:{color:cssVar('--border')} } }
      }
    };
  }, [acumulado]);

  useChart(chartWeekRef, () => {
    if (porSemana.length === 0) return null;
    return {
      type:'bar',
      data:{ labels:porSemana.map(x=>x[0]), datasets:[{ data:porSemana.map(x=>x[1]), backgroundColor:porSemana.map(x=>x[1]>=0?'rgba(52,211,153,.7)':'rgba(248,113,113,.7)'), borderRadius:6 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} },
        scales:{ x:{ ticks:{color:cssVar('--muted'),font:{size:10}}, grid:{display:false} }, y:{ ticks:{color:cssVar('--muted'),callback:v=>'R$ '+fmt(v,0)}, grid:{color:cssVar('--border')} } }
      }
    };
  }, [porSemana]);

  return (
    <div className="content">
      <div className="section-header" style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        <div className="section-title">💵 Fluxo de Caixa</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn btn-success btn-sm" onClick={()=>setModalLanc('receita')}>+ Entrada avulsa</button>
          <button className="btn btn-danger btn-sm" onClick={()=>setModalLanc('despesa')}>- Saída avulsa</button>
        </div>
      </div>
      <DatePeriodFilter value={periodo} onChange={setPeriodo} custom={custom} onCustomChange={setCustom}/>

      <div className="stat-grid">
        <div className="stat-card tinted-green"><div className="stat-value green">{fmtR$(receita)}</div><div className="stat-label">Receita</div></div>
        <div className="stat-card tinted-red"><div className="stat-value red">{fmtR$(despesa)}</div><div className="stat-label">Despesa</div></div>
        <div className="stat-card tinted-blue"><div className={`stat-value ${saldo>=0?'green':'red'}`}>{fmtR$(saldo)}</div><div className="stat-label">Saldo</div></div>
        <div className={`stat-card tinted-${fcPct<32?'green':fcPct<38?'yellow':'red'}`}><div className={`stat-value ${fcPct<32?'green':fcPct<38?'yellow':'red'}`}>{receita>0?fmtPct(fcPct):'—'}</div><div className="stat-label">Food cost</div></div>
      </div>

      {/* DRE */}
      <div className="card" style={{borderLeft:'4px solid var(--blue)'}}>
        <div className="card-title">📑 DRE Gerencial</div>
        <div style={{fontSize:14}}>
          <DreLine label="Receita Bruta (vendas)" valor={dreReceitaBruta} positive/>
          <DreLine label="(−) Descontos plataformas" valor={-dreDescontos} negative indent/>
          <DreLine label="(=) Receita Líquida" valor={dreReceitaLiq} bold/>
          <DreLine label="(−) CMV" valor={-dreCMV} negative indent/>
          <DreLine label="(=) Lucro Bruto" valor={dreLucroBruto} bold positive={dreLucroBruto>=0} negative={dreLucroBruto<0}/>
          <DreLine label="(−) Despesas Fixas" valor={-dreFixas} negative indent/>
          <DreLine label="(=) Lucro Operacional" valor={dreLucroOp} bold positive={dreLucroOp>=0} negative={dreLucroOp<0} big/>
          <div style={{marginTop:14,padding:12,background:'var(--card-2)',borderRadius:8,fontSize:13}}>
            <b>Margem operacional:</b> <span className={dreMargemOp>=0?'green':'red'}><b>{dreReceitaLiq>0?fmtPct(dreMargemOp):'—'}</b></span>
          </div>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div className="card">
          <div className="card-title">Receita vs Despesa por dia</div>
          <div className="chart-wrap"><canvas ref={chartBarRef}/></div>
        </div>
        <div className="card">
          <div className="card-title">Despesas por categoria</div>
          <div className="chart-wrap"><canvas ref={chartPieRef}/></div>
        </div>
        <div className="card">
          <div className="card-title">Saldo acumulado</div>
          <div className="chart-wrap"><canvas ref={chartLineRef}/></div>
        </div>
        <div className="card">
          <div className="card-title">Lucro por semana</div>
          <div className="chart-wrap"><canvas ref={chartWeekRef}/></div>
        </div>
      </div>

      <div className="card">
        <div className="card-title">Lançamentos do período</div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th>Pgto</th><th>Pago</th></tr></thead>
            <tbody>
              {loading && <tr><td colSpan="7"><Skeleton rows={4}/></td></tr>}
              {!loading && rows.length === 0 && <tr><td colSpan="7" className="empty">Nenhum lançamento</td></tr>}
              {!loading && rows.map(r => (
                <tr key={r.id}>
                  <td className="muted">{fmtDate(movimentoDate(r))}</td>
                  <td><span className={`badge badge-${r.tipo==='receita'?'green':'red'}`}>{r.tipo}</span></td>
                  <td className="muted" style={{fontSize:12}}>{r.categorias_caixa?.nome||'—'}</td>
                  <td>{r.descricao}</td>
                  <td className={r.tipo==='receita'?'green':'red'} style={{fontWeight:600}}>{fmtR$(r.valor)}</td>
                  <td className="muted" style={{fontSize:12}}>{r.forma_pagamento ? FORMA_PGTO.find(x=>x[0]===r.forma_pagamento)?.[1] : '—'}</td>
                  <td>{r.pago?'✅':'⏳'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <LancamentoCaixaModal
        open={!!modalLanc}
        onClose={()=>setModalLanc(null)}
        tipo={modalLanc}
        categorias={categorias}
        sb={sb}
        toast={toast}
        onSaved={load}
      />
    </div>
  );
}

function DreLine({ label, valor, positive, negative, bold, indent, big }) {
  const cor = positive ? 'green' : negative ? 'red' : '';
  return (
    <div style={{display:'flex',justifyContent:'space-between',padding:big?'14px 0':'8px 0',borderBottom:'1px solid var(--border)',paddingLeft: indent?20:0,fontSize:big?16:14,fontWeight:bold?700:500}}>
      <span style={{color:indent?'var(--muted)':'var(--text)'}}>{label}</span>
      <span className={cor}>{fmtR$(valor)}</span>
    </div>
  );
}

function TelaAuditoria() {
  const sb = getClient();
  const toast = useToast();
  const [data, setData] = useState(todayISO());
  const [estoque, setEstoque] = useState([]);
  const [reais, setReais] = useState({}); // produto_id -> gramas (real)
  const [loading, setLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [resumo, setResumo] = useState(null);
  const [historico, setHistorico] = useState([]);
  const [unidades, setUnidades] = useState([]);
  const [search, setSearch] = useState('');
  const [filtroTipo, setFiltroTipo] = useState('todos');

  async function load() {
    setLoading(true);
    const [e, h, u] = await Promise.all([
      sb.from('v_estoque_atual').select('*').order('nome'),
      sb.from('ajustes_estoque').select('id,quantidade_gramas,observacoes,tipo,produto_id,produtos(nome),movimentacoes(data_movimentacao)').like('observacoes','Balanço%').order('id',{ascending:false}).limit(200),
      sb.from('unidades').select('id,codigo').eq('codigo','g').limit(1),
    ]);
    setEstoque(e.data||[]);
    setHistorico(h.data||[]);
    setUnidades(u.data||[]);
    const init = {}; (e.data||[]).forEach(p => init[p.produto_id] = '');
    setReais(init);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const filtered = estoque
    .filter(p => filtroTipo==='todos' || p.tipo===filtroTipo)
    .filter(p => !search || p.nome.toLowerCase().includes(search.toLowerCase()));

  const diffs = filtered.map(p => {
    const sistema = Number(p.estoque_gramas)||0;
    const realStr = reais[p.produto_id];
    const real = realStr === '' ? null : parseDecimal(realStr);
    const diff = real == null ? 0 : real - sistema;
    return { ...p, sistema, real, diff };
  });
  const okCount = diffs.filter(d => d.real != null && d.diff === 0).length;
  const comDiff = diffs.filter(d => d.real != null && d.diff !== 0);
  const totalPerdas = sumBy(comDiff.filter(d=>d.diff<0), d => Math.abs(d.diff) * Number(d.custo_medio_grama||0));
  const totalSobras = sumBy(comDiff.filter(d=>d.diff>0), d => d.diff * Number(d.custo_medio_grama||0));

  async function salvar() {
    const lancar = diffs.filter(d => d.real != null && Math.abs(d.diff) > 0.01);
    if (lancar.length === 0) return toast('Nada a registrar (sem diferenças)','info');
    setSaving(true);
    try {
      const { data: res, error } = await sb.rpc('rpc_salvar_balanco', {
        p_data_movimentacao: dateInputToIso(data),
        p_itens: diffs
          .filter(d => d.real != null)
          .map(d => ({ produto_id: d.produto_id, estoque_real_gramas: d.real }))
      });
      if (error) throw error;
      const lancados = Number(res?.lancados||0);
      setResumo({
        ok: Number(res?.ok||okCount),
        lancados,
        fail: 0,
        perdas: Number(res?.perdas||totalPerdas),
        sobras: Number(res?.sobras||totalSobras)
      });
      toast(`✅ ${lancados} ajustes lançados`,'success');
      load();
    } catch(e) {
      toast('Erro: '+e.message,'error');
    }
    setSaving(false);
  }

  return (
    <div className="content">
      <div className="section-header"><div className="section-title">🔍 Auditoria / Balanço</div></div>

          {['todos','cru','insumo','embalagem','preparado'].map(t => (
            <button key={t} className={`chip${filtroTipo===t?' active':''}`} onClick={()=>setFiltroTipo(t)}>{t==='todos'?'Todos':TIPO_LABEL[t]||t}</button>
          ))}
        </div>

        <div className="stat-grid">
          <div className="stat-card"><div className="stat-value blue">{filtered.length}</div><div className="stat-label">Produtos a contar</div></div>
          <div className="stat-card tinted-green"><div className="stat-value green">{okCount}</div><div className="stat-label">Conferidos sem diferença</div></div>
          <div className="stat-card tinted-yellow"><div className="stat-value yellow">{comDiff.length}</div><div className="stat-label">Com diferença</div></div>
          <div className="stat-card tinted-red"><div className="stat-value red">{fmtR$(totalPerdas)}</div><div className="stat-label">Perdas estimadas</div></div>
        </div>

        <div className="table-wrap" style={{maxHeight:'60vh',overflowY:'auto'}}>
          <table>
            <thead style={{position:'sticky',top:0}}>
              <tr><th>Produto</th><th>Tipo</th><th>Sistema (g)</th><th>Contagem real (g)</th><th>Diferença</th><th>Valor</th></tr>
            </thead>
            <tbody>
              {loading && <tr><td colSpan="6"><Skeleton rows={5}/></td></tr>}
              {!loading && diffs.map(d => (
                <tr key={d.produto_id}>
                  <td><b>{d.nome}</b></td>
                  <td><span className={`badge badge-${d.tipo==='preparado'?'blue':d.tipo==='embalagem'?'yellow':'green'}`}>{TIPO_LABEL[d.tipo]||d.tipo}</span></td>

                  <td><input type="number" step="0.001" value={reais[d.produto_id]||''} onChange={e=>setReais({...reais, [d.produto_id]: e.target.value})} placeholder="g real" style={{padding:'6px 10px',minHeight:32,maxWidth:140}}/></td>
                  <td className={d.real==null?'muted':d.diff===0?'green':d.diff>0?'green':'red'}>{d.real==null?'—':d.diff===0?'OK':(d.diff>0?'+':'')+fmtG(d.diff)}</td>
                  <td className={d.diff<0?'red':d.diff>0?'green':'muted'}>{d.real==null||d.diff===0?'—':fmtR$(Math.abs(d.diff)*Number(d.custo_medio_grama||0))}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <button className="btn btn-success btn-lg btn-block" style={{marginTop:14}} onClick={salvar} disabled={saving || comDiff.length===0}>{saving?'Salvando...':`Salvar balanço (${comDiff.length} ajustes)`}</button>
      </div>

      {resumo && (
        <div className="card" style={{borderLeft:'4px solid var(--blue)'}}>
          <div className="card-title">Resumo do balanço</div>
          <div style={{display:'flex',gap:16,flexWrap:'wrap',fontSize:14}}>
            <span><b>{resumo.ok}</b> sem diferença</span>
            <span><b>{resumo.lancados}</b> ajustes lançados</span>
            {resumo.fail > 0 && <span className="red"><b>{resumo.fail}</b> falharam</span>}
            <span className="red">Perdas: <b>{fmtR$(resumo.perdas)}</b></span>
            <span className="green">Sobras: <b>{fmtR$(resumo.sobras)}</b></span>
          </div>
        </div>
      )}

      {historico.length > 0 && (
        <div className="card">
          <div className="card-title">📜 Histórico de balanços</div>
          <div className="table-wrap">
            <table>
              <thead><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Quantidade</th></tr></thead>
              <tbody>
                {historico.map(h => (
                  <tr key={h.id}>
                    <td className="muted">{fmtDate(h.movimentacoes?.data_movimentacao)}</td>
                    <td>{h.produtos?.nome}</td>
                    <td><span className={`badge badge-${h.tipo==='perda'?'red':'green'}`}>{h.tipo==='perda'?'Perda':'Sobra'}</span></td>
                    <td>{fmtG(h.quantidade_gramas)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}
function TelaCadastros() {
  const sb = getClient();
  const toast = useToast();
  const [tab, setTab] = useState('produtos');
  const [search, setSearch] = useState('');
  const [loading, setLoading] = useState(true);
  const [produtos, setProdutos] = useState([]);
  const [fornecedores, setFornecedores] = useState([]);
  const [categorias, setCategorias] = useState([]);
  const [categoriasCaixa, setCategoriasCaixa] = useState([]);
  const [unidades, setUnidades] = useState([]);
  const [modal, setModal] = useState(null);
  const [confirm, setConfirm] = useState(null);

  async function reload() {
    setLoading(true);
    const [p, f, c, cx, u] = await Promise.all([
      sb.from('produtos').select('id,nome,tipo,categoria_id,unidade_id,ativo,categorias(nome),unidades(codigo,nome)').order('nome'),
      sb.from('fornecedores').select('id,nome,cnpj,contato,telefone,ativo').order('nome'),
      sb.from('categorias').select('id,nome,descricao,ativo').order('nome'),
      sb.from('categorias_caixa').select('id,tipo,nome,descricao').order('tipo').order('nome'),
      sb.from('unidades').select('id,codigo,nome,fator_gramas').order('nome'),
    ]);
    setProdutos(p.data||[]);
    setFornecedores(f.data||[]);
    setCategorias(c.data||[]);
    setCategoriasCaixa(cx.data||[]);
    setUnidades(u.data||[]);
    setLoading(false);
  }
  useEffect(() => { reload(); }, []);

  const q = search.trim().toLowerCase();
  const filterBy = (arr, fields) => q ? arr.filter(x => fields.some(f => String(x?.[f]||'').toLowerCase().includes(q))) : arr;
  const produtosFiltrados = filterBy(produtos, ['nome','tipo']);
  const fornecedoresFiltrados = filterBy(fornecedores, ['nome','cnpj','telefone']);
  const categoriasFiltradas = filterBy(categorias, ['nome','descricao']);
  const categoriasCaixaFiltradas = filterBy(categoriasCaixa, ['nome','tipo','descricao']);

  async function toggleAtivo(table, row) {
    if (!row || row.ativo == null) return;
    const { error } = await sb.from(table).update({ ativo: !row.ativo }).eq('id', row.id);
    if (error) return toast('Erro: '+error.message,'error');
    toast(row.ativo ? 'Desativado' : 'Ativado','success');
    reload();
  }

  async function deletarConfirmado() {
    const c = confirm;
    if (!c) return;
    const { error } = await sb.from(c.table).delete().eq('id', c.id);
    if (error) toast('Erro ao excluir: '+error.message,'error');
    else { toast('Excluido','info'); reload(); }
  }

  const tabTitle = {
    produtos:'Produtos',
    fornecedores:'Fornecedores',
    categorias:'Categorias',
    caixa:'Categorias de caixa',
  }[tab];

  return (
    <div className="content">
      <div className="section-header">
        <div className="section-title">⚙️ Cadastros</div>
        <button className="btn btn-success btn-sm" onClick={()=>setModal({kind:tab,row:null})}>+ Novo</button>
      </div>
      <div className="tabs">
        <button className={`tab${tab==='produtos'?' active':''}`} onClick={()=>{setTab('produtos');setSearch('');}}>Produtos</button>
        <button className={`tab${tab==='fornecedores'?' active':''}`} onClick={()=>{setTab('fornecedores');setSearch('');}}>Fornecedores</button>
        <button className={`tab${tab==='categorias'?' active':''}`} onClick={()=>{setTab('categorias');setSearch('');}}>Categorias</button>
        <button className={`tab${tab==='caixa'?' active':''}`} onClick={()=>{setTab('caixa');setSearch('');}}>Caixa</button>
      </div>

      <div className="card">
        <div className="section-header">
          <div>
            <div className="card-title" style={{marginBottom:4}}>{tabTitle}</div>
            <div className="muted" style={{fontSize:12}}>Cadastros usados nos lancamentos, fichas e relatorios</div>
          </div>
          <button className="btn btn-outline btn-sm" onClick={reload}>↻ Atualizar</button>
        </div>
        <div className="form-group">
          <label>Buscar</label>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Digite para filtrar..."/>
        </div>

        {tab === 'produtos' && (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Produto</th><th>Tipo</th><th>Categoria</th><th>Unidade</th><th>Status</th><th>Acoes</th></tr></thead>
              <tbody>
                {loading && <tr><td colSpan="6"><Skeleton rows={4}/></td></tr>}
                {!loading && produtosFiltrados.length === 0 && <tr><td colSpan="6" className="empty">Nenhum produto</td></tr>}
                {!loading && produtosFiltrados.map(p => (
                  <tr key={p.id}>
                    <td><b>{p.nome}</b></td>
                    <td><span className={`badge badge-${p.tipo==='preparado'?'blue':p.tipo==='embalagem'?'yellow':'green'}`}>{TIPO_LABEL[p.tipo]||p.tipo}</span></td>
                    <td className="muted">{p.categorias?.nome||'—'}</td>
                    <td className="muted">{p.unidades?.codigo||'—'}</td>
                    <td>{p.ativo ? <span className="badge badge-green">Ativo</span> : <span className="badge badge-red">Inativo</span>}</td>
                    <td>
                      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                        <button className="btn btn-outline btn-sm" onClick={()=>setModal({kind:'produtos',row:p})}>Editar</button>

                        <button className="btn btn-danger btn-sm" onClick={()=>setConfirm({table:'produtos',id:p.id,label:p.nome})}>Excluir</button>

            </table>
          </div>
        )}

        {tab === 'fornecedores' && (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Fornecedor</th><th>Telefone</th><th>CNPJ</th><th>Status</th><th>Acoes</th></tr></thead>
              <tbody>
                {loading && <tr><td colSpan="5"><Skeleton rows={4}/></td></tr>}
                {!loading && fornecedoresFiltrados.length === 0 && <tr><td colSpan="5" className="empty">Nenhum fornecedor</td></tr>}
                {!loading && fornecedoresFiltrados.map(f => (
                  <tr key={f.id}>
                    <td><b>{f.nome}</b><div className="muted" style={{fontSize:11}}>{f.contato||''}</div></td>
                    <td className="muted">{f.telefone||'—'}</td>
                    <td className="muted">{f.cnpj||'—'}</td>
                    <td>{f.ativo ? <span className="badge badge-green">Ativo</span> : <span className="badge badge-red">Inativo</span>}</td>
                    <td>
                      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                        <button className="btn btn-outline btn-sm" onClick={()=>setModal({kind:'fornecedores',row:f})}>Editar</button>
                        <button className="btn btn-outline btn-sm" onClick={()=>toggleAtivo('fornecedores', f)}>{f.ativo?'Desativar':'Ativar'}</button>
                        <button className="btn btn-danger btn-sm" onClick={()=>setConfirm({table:'fornecedores',id:f.id,label:f.nome})}>Excluir</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        {tab === 'categorias' && (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Categoria</th><th>Descricao</th><th>Status</th><th>Acoes</th></tr></thead>
              <tbody>
                {loading && <tr><td colSpan="4"><Skeleton rows={4}/></td></tr>}
                {!loading && categoriasFiltradas.length === 0 && <tr><td colSpan="4" className="empty">Nenhuma categoria</td></tr>}
                {!loading && categoriasFiltradas.map(c => (
                  <tr key={c.id}>
                    <td><b>{c.nome}</b></td>
                    <td className="muted">{c.descricao||'—'}</td>
                    <td>{c.ativo ? <span className="badge badge-green">Ativa</span> : <span className="badge badge-red">Inativa</span>}</td>
                    <td>
                      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                        <button className="btn btn-outline btn-sm" onClick={()=>setModal({kind:'categorias',row:c})}>Editar</button>
                        <button className="btn btn-outline btn-sm" onClick={()=>toggleAtivo('categorias', c)}>{c.ativo?'Desativar':'Ativar'}</button>
                        <button className="btn btn-danger btn-sm" onClick={()=>setConfirm({table:'categorias',id:c.id,label:c.nome})}>Excluir</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        {tab === 'caixa' && (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Categoria</th><th>Tipo</th><th>Descricao</th><th>Acoes</th></tr></thead>
              <tbody>
                {loading && <tr><td colSpan="4"><Skeleton rows={4}/></td></tr>}
                {!loading && categoriasCaixaFiltradas.length === 0 && <tr><td colSpan="4" className="empty">Nenhuma categoria de caixa</td></tr>}
                {!loading && categoriasCaixaFiltradas.map(c => (
                  <tr key={c.id}>
                    <td><b>{c.nome}</b></td>
                    <td><span className={`badge badge-${c.tipo==='receita'?'green':'red'}`}>{c.tipo}</span></td>
                    <td className="muted">{c.descricao||'—'}</td>

                      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>

      <CadastroModal modal={modal} onClose={()=>setModal(null)} onSaved={()=>{setModal(null); reload();}} sb={sb} toast={toast} categorias={categorias} unidades={unidades}/>

    </div>
  );
}

function CadastroModal({ modal, onClose, onSaved, sb, toast, categorias, unidades }) {
  const [f, setF] = useState({});
  useEffect(() => {
    if (!modal) return;
    const r = modal.row || {};
    if (modal.kind === 'produtos') setF({ nome:r.nome||'', tipo:r.tipo||'cru', categoria_id:r.categoria_id||'', unidade_id:r.unidade_id||'', ativo:r.ativo !== false });
    if (modal.kind === 'fornecedores') setF({ nome:r.nome||'', telefone:r.telefone||'', cnpj:r.cnpj||'', contato:r.contato||'', ativo:r.ativo !== false });
    if (modal.kind === 'categorias') setF({ nome:r.nome||'', descricao:r.descricao||'', ativo:r.ativo !== false });
    if (modal.kind === 'caixa') setF({ nome:r.nome||'', tipo:r.tipo||'despesa', descricao:r.descricao||'' });
  }, [modal?.kind, modal?.row?.id]);

  if (!modal) return null;
  const isEdit = !!modal.row;
  const title = `${isEdit?'Editar':'Novo'} ${modal.kind === 'caixa' ? 'categoria de caixa' : modal.kind}`;

  async function salvar() {
    try {
      let table = modal.kind;
      let payload = {};
      if (modal.kind === 'produtos') {
        if (!f.nome || !f.tipo) return toast('Nome e tipo sao obrigatorios','error');
        payload = { nome:f.nome.trim().toLowerCase(), tipo:f.tipo, categoria_id:f.categoria_id||null, unidade_id:f.unidade_id||null, ativo:!!f.ativo };
      }
      if (modal.kind === 'fornecedores') {
        if (!f.nome) return toast('Nome obrigatorio','error');
        payload = { nome:f.nome.trim(), telefone:f.telefone||null, cnpj:f.cnpj||null, contato:f.contato||null, ativo:!!f.ativo };
      }
      if (modal.kind === 'categorias') {
        if (!f.nome) return toast('Nome obrigatorio','error');
        payload = { nome:f.nome.trim(), descricao:f.descricao||null, ativo:!!f.ativo };
      }
      if (modal.kind === 'caixa') {
        table = 'categorias_caixa';
        if (!f.nome || !f.tipo) return toast('Nome e tipo sao obrigatorios','error');
        payload = { nome:f.nome.trim(), tipo:f.tipo, descricao:f.descricao||null };
      }

      if (modal.kind === 'produtos' && !isEdit) {
        const { error } = await sb.rpc('rpc_criar_produto_seguro', {
          p_nome: f.nome,
          p_tipo: f.tipo,
          p_categoria_id: f.categoria_id || null,
          p_unidade_id: f.unidade_id || null
        });
        if (error) throw error;
        toast('Cadastro criado','success');
        onSaved();
        return;
      }

      const req = isEdit ? sb.from(table).update(payload).eq('id', modal.row.id) : sb.from(table).insert(payload);
      const { error } = await req;
      if (error) throw error;
      toast(isEdit ? 'Cadastro atualizado' : 'Cadastro criado','success');
      onSaved();
    } catch(e) {
      toast('Erro: '+e.message,'error');
    }
  }

  return (
    <Modal open={!!modal} onClose={onClose} title={title} size="lg">
      {modal.kind === 'produtos' && (
        <Fragment>
          <div className="form-group"><label>Nome</label><input value={f.nome||''} onChange={e=>setF({...f,nome:e.target.value})}/></div>
          <div className="form-row">
            <div className="form-group">
              <label>Tipo</label>
              <select value={f.tipo||'cru'} onChange={e=>setF({...f,tipo:e.target.value})}>
                <option value="cru">In Natura</option>
                <option value="preparado">Preparado</option>
                <option value="embalagem">Embalagem</option>
                <option value="insumo">Insumo</option>
              </select>
            </div>
            <div className="form-group">
              <label>Status</label>
              <label style={{display:'flex',alignItems:'center',gap:8,textTransform:'none',letterSpacing:0,paddingTop:10}}>
                <input type="checkbox" checked={!!f.ativo} onChange={e=>setF({...f,ativo:e.target.checked})}/> Ativo
              </label>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group"><label>Categoria</label><SearchableDropdown value={f.categoria_id||''} onChange={v=>setF({...f,categoria_id:v})} options={categorias} placeholder="Opcional"/></div>
            <div className="form-group"><label>Unidade padrao</label><SearchableDropdown value={f.unidade_id||''} onChange={v=>setF({...f,unidade_id:v})} options={unidades} placeholder="Opcional" getLabel={u=>`${u.nome} (${u.codigo})`}/></div>
          </div>
        </Fragment>
      )}

      {modal.kind === 'fornecedores' && (
        <Fragment>
          <div className="form-group"><label>Nome</label><input value={f.nome||''} onChange={e=>setF({...f,nome:e.target.value})}/></div>
          <div className="form-row">
            <div className="form-group"><label>Telefone</label><input value={f.telefone||''} onChange={e=>setF({...f,telefone:e.target.value})}/></div>
            <div className="form-group"><label>CNPJ</label><input value={f.cnpj||''} onChange={e=>setF({...f,cnpj:e.target.value})}/></div>
          </div>
          <div className="form-group"><label>Contato</label><input value={f.contato||''} onChange={e=>setF({...f,contato:e.target.value})}/></div>
          <label style={{display:'flex',alignItems:'center',gap:8,textTransform:'none',letterSpacing:0,marginBottom:12}}>
            <input type="checkbox" checked={!!f.ativo} onChange={e=>setF({...f,ativo:e.target.checked})}/> Ativo
          </label>
        </Fragment>
      )}

      {modal.kind === 'categorias' && (
        <Fragment>
          <div className="form-group"><label>Nome</label><input value={f.nome||''} onChange={e=>setF({...f,nome:e.target.value})}/></div>
          <div className="form-group"><label>Descricao</label><textarea rows="2" value={f.descricao||''} onChange={e=>setF({...f,descricao:e.target.value})}/></div>
          <label style={{display:'flex',alignItems:'center',gap:8,textTransform:'none',letterSpacing:0,marginBottom:12}}>
            <input type="checkbox" checked={!!f.ativo} onChange={e=>setF({...f,ativo:e.target.checked})}/> Ativa
          </label>
        </Fragment>
      )}

      {modal.kind === 'caixa' && (
        <Fragment>
          <div className="form-row">
            <div className="form-group"><label>Nome</label><input value={f.nome||''} onChange={e=>setF({...f,nome:e.target.value})}/></div>
            <div className="form-group">
              <label>Tipo</label>
              <select value={f.tipo||'despesa'} onChange={e=>setF({...f,tipo:e.target.value})}>
                <option value="despesa">Despesa</option>
                <option value="receita">Receita</option>
              </select>
            </div>
          </div>
          <div className="form-group"><label>Descricao</label><textarea rows="2" value={f.descricao||''} onChange={e=>setF({...f,descricao:e.target.value})}/></div>
        </Fragment>
      )}

      <button className="btn btn-success btn-block" onClick={salvar}>Salvar</button>
    </Modal>
  );
}

function TelaDashboardBackend({ refreshKey }) {

  const [custom, setCustom] = useState({});
  const [data, setData] = useState(null);
  const [qtdPratos, setQtdPratos] = useState(0);
  const [lucroMes, setLucroMes] = useState(0);
  const [perdasMes, setPerdasMes] = useState(0);
  const [periodoEstoque, setPeriodoEstoque] = useState('7d');
  const [evolEstoque, setEvolEstoque] = useState(null);
  const [planejamento, setPlanejamento] = useState(null);
  const [diasCobertura, setDiasCobertura] = useState(7);
  const [mesesReserva, setMesesReserva] = useState(3);
  const [showItensComprar, setShowItensComprar] = useState(false);
  const [showItensProduzir, setShowItensProduzir] = useState(false);
  const [showContas, setShowContas] = useState(false);
  const [loading, setLoading] = useState(true);
  const chartRef = useRef(null);

  async function load() {
    setLoading(true);
    const { from, to } = periodToDates(periodo, custom);
    const hoje = new Date();
    const inicioMes = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    const [resp, pratos, mesAtual] = await Promise.all([
      sb.rpc('rpc_dashboard_financeiro_v1', { p_inicio: from.toISOString(), p_fim: to.toISOString() }),
      sb.from('vendas_itens')
        .select('quantidade,tipo_item,cancelado,vendas!inner(movimentacao_id,movimentacoes!inner(data_movimentacao))', { count:'exact' })
        .eq('tipo_item','principal')
        .eq('cancelado', false)
        .gte('vendas.movimentacoes.data_movimentacao', from.toISOString())
        .lte('vendas.movimentacoes.data_movimentacao', to.toISOString()),
      sb.rpc('rpc_dashboard_financeiro_v1', { p_inicio: inicioMes.toISOString(), p_fim: hoje.toISOString() })
    ]);
    if (!resp.error) setData(resp.data);
    const totalQtd = (pratos.data||[]).reduce((acc,r)=>acc + Number(r.quantidade||0), 0);
    setQtdPratos(totalQtd);
    if (!mesAtual.error) {
      const lucroPosCmv = Number(mesAtual.data?.cards?.lucro_pos_taxas_cmv || 0);
      const perdas = Number(mesAtual.data?.cards?.custos_variaveis_mes || 0);
      setLucroMes(lucroPosCmv - perdas);
      setPerdasMes(perdas);
    }
    setLoading(false);
  }

  async function loadEvolEstoque() {
    const dias = { 'hoje':0, '7d':6, '30d':29 }[periodoEstoque] ?? 6;
    const fim = new Date();
    const inicio = new Date(); inicio.setDate(inicio.getDate() - dias); inicio.setHours(0,0,0,0);
    const { data: r, error } = await sb.rpc('rpc_evolucao_estoque', {
      p_inicio: inicio.toISOString(),
      p_fim: fim.toISOString()
    });
    if (!error) setEvolEstoque(r);
  }

  async function loadPlanejamento() {
    const { data: r, error } = await sb.rpc('rpc_planejamento_gerencial', {
      p_meta_breakeven_mes: META_BREAKEVEN_MES,
      p_dias_cobertura: diasCobertura,
      p_meses_reserva: mesesReserva
    });
    if (!error) setPlanejamento(r);
  }

  useEffect(() => { load(); }, [periodo, custom, refreshKey]);
  useEffect(() => { loadEvolEstoque(); }, [periodoEstoque, refreshKey]);
  useEffect(() => { loadPlanejamento(); }, [diasCobertura, mesesReserva, refreshKey]);

  const cards = data?.cards || {};
  const serie = data?.serie || [];
  const foodCost = Number(cards.food_cost_percentual || 0);
  const custosExtras = Number(cards.custos_fixos_diluidos || 0) + Number(cards.custos_variaveis_periodo || 0);
  const custoExtraPorPrato = qtdPratos > 0 ? (custosExtras / qtdPratos) : 0;

  // KPIs principais alinhados com Historico de Vendas
  const fatBruto      = Number(cards.receita_bruta || 0);
  const taxasDesc     = Number(cards.taxas_plataforma || 0);
  const cmvDash       = Number(cards.cmv || 0);
  const lucroRealKpi  = Number(cards.lucro_pos_taxas_cmv || 0); // bruto - taxas - cmv

  // Breakeven — sempre olha o MES ATUAL inteiro
  const breakevenPct  = META_BREAKEVEN_MES > 0 ? (lucroMes / META_BREAKEVEN_MES) * 100 : 0;
  const faltaMeta     = Math.max(0, META_BREAKEVEN_MES - lucroMes);
  const corBarra      = breakevenPct >= 100 ? 'var(--green)' : breakevenPct >= 50 ? 'var(--yellow)' : 'var(--red)';
  const corTexto      = breakevenPct >= 100 ? 'green' : breakevenPct >= 50 ? 'yellow' : 'red';

  useChart(chartRef, () => {
    if (!serie.length) return null;
    return {
      type:'bar',
      data:{
        labels: serie.map(x => fmtDate(x.data).slice(0,5)),
        datasets:[
          { type:'line', label:'Receita bruta', data:serie.map(x=>Number(x.receita_bruta||0)), borderColor:cssVar('--green'), backgroundColor:'rgba(52,211,153,.12)', tension:.3, yAxisID:'y' },
          { type:'line', label:'Despesa total', data:serie.map(x=>Number(x.taxas_plataforma||0)+Number(x.cmv||0)+Number(x.custos_fixos||0)+Number(x.custos_variaveis||0)), borderColor:cssVar('--red'), backgroundColor:'rgba(248,113,113,.12)', tension:.3, yAxisID:'y' },
          { label:'Lucro real', data:serie.map(x=>Number(x.lucro_real||0)), backgroundColor:serie.map(x=>Number(x.lucro_real||0)>=0?'rgba(52,211,153,.65)':'rgba(248,113,113,.65)'), borderRadius:6, yAxisID:'y' }
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{color:cssVar('--text-2'),boxWidth:14} } },
        scales:{
          x:{ ticks:{color:cssVar('--muted'),font:{size:10}}, grid:{display:false} },
          y:{ ticks:{color:cssVar('--muted'),callback:v=>'R$ '+fmt(v,0)}, grid:{color:cssVar('--border')} }
        }
      }
    };
  }, [serie]);

  if (loading && !data) return <div className="content"><Skeleton rows={8}/></div>;

  return (
    <div className="content">
      <div className="section-header">
        <div className="section-title">Painel financeiro</div>
        <button className="btn btn-outline btn-sm" onClick={load}>Atualizar</button>
      </div>
      <DatePeriodFilter value={periodo} onChange={setPeriodo} custom={custom} onCustomChange={setCustom}/>

      <div className="stat-grid">
        <div className="stat-card tinted-green"><div className="stat-value green">{fmtR$(fatBruto)}</div><div className="stat-label">Faturamento bruto</div><div className="stat-sub">Tudo que vendeu no filtro</div></div>
        <div className="stat-card tinted-red"><div className="stat-value red">{fmtR$(taxasDesc)}</div><div className="stat-label">Descontos e taxas</div><div className="stat-sub">Comissao, pg online e promocao</div></div>
        <div className="stat-card tinted-red"><div className="stat-value red">{fmtR$(cmvDash)}</div><div className="stat-label">CMV</div><div className="stat-sub">Food cost {fatBruto>0?fmtPct(foodCost):'--'}</div></div>
        <div className="stat-card tinted-blue"><div className={`stat-value ${lucroRealKpi>=0?'green':'red'}`}>{fmtR$(lucroRealKpi)}</div><div className="stat-label">Lucro real</div><div className="stat-sub">Bruto − descontos − CMV</div></div>
      </div>

      <div className="card" style={{borderLeft:`6px solid ${corBarra}`,padding:18}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:14}}>
          <div>
            <div style={{fontSize:13,opacity:.7,marginBottom:4}}>🎯 BREAKEVEN DO MÊS — cobrir as contas pessoais</div>
            <div style={{fontSize:28,fontWeight:800}} className={corTexto}>{fmtR$(lucroMes)} <span style={{fontSize:18,opacity:.6,fontWeight:500}}>/ {fmtR$(META_BREAKEVEN_MES)}</span></div>
            {perdasMes > 0 && (
              <div className="muted" style={{fontSize:12,marginTop:4}}>
                Já descontadas perdas/auditoria do mês: <b className="red">−{fmtR$(perdasMes)}</b>
              </div>
            )}
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:38,fontWeight:800}} className={corTexto}>{fmtPct(breakevenPct)}</div>
            <div className="muted" style={{fontSize:12}}>
              {breakevenPct >= 100
                ? `✅ Contas pagas! Sobrou ${fmtR$(lucroMes - META_BREAKEVEN_MES)}`
                : `Falta ${fmtR$(faltaMeta)} pra cobrir as contas`}
            </div>
          </div>
        </div>
        <div style={{height:24,background:'var(--card-2)',borderRadius:12,overflow:'hidden',position:'relative'}}>
          <div style={{height:'100%',width:`${Math.min(100, breakevenPct)}%`,background:corBarra,transition:'width .5s ease',borderRadius:12}}/>
          {breakevenPct > 100 && <div style={{position:'absolute',top:0,right:8,height:'100%',display:'flex',alignItems:'center',fontSize:12,fontWeight:700,color:'#fff'}}>+{fmtPct(breakevenPct-100)} acima!</div>}
        </div>

        {planejamento && (() => {
          const m = planejamento.metricas || {};
          const b = planejamento.breakeven || {};
          if (Number(b.pedidos_faltam||0) === 0) return null;
          return (
            <div style={{marginTop:14,padding:12,background:'var(--card-2)',borderRadius:8}}>
              <div className="muted" style={{fontSize:11,marginBottom:6}}>📐 QUANTOS PEDIDOS FALTAM PRA FECHAR O MÊS</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:10,fontSize:13}}>
                <div>
                  <div className="muted" style={{fontSize:11}}>Ticket médio líquido</div>
                  <div style={{fontWeight:700}}>{fmtR$(m.ticket_medio_liquido)}</div>
                </div>
                <div>
                  <div className="muted" style={{fontSize:11}}>Lucro líquido / pedido</div>
                  <div style={{fontWeight:700}}>{fmtR$(m.lucro_liquido_por_pedido)} <span className="muted" style={{fontSize:11}}>({fmtPct(m.margem_pct)})</span></div>
                </div>
                <div>
                  <div className="muted" style={{fontSize:11}}>Faltam</div>
                  <div style={{fontWeight:800,fontSize:20}} className="yellow">≈ {b.pedidos_faltam} pedidos</div>
                </div>
                <div>
                  <div className="muted" style={{fontSize:11}}>No ritmo de {fmt(m.media_pedidos_dia,1)}/dia</div>
                  <div style={{fontWeight:700}}>≈ {b.dias_estimados_no_ritmo} dias</div>
                </div>
              </div>
            </div>
          );
        })()}

        <div style={{marginTop:12,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span className="muted" style={{fontSize:12}}>Lucro real (bruto − descontos − CMV) do mês atual</span>
          <button className="btn btn-outline btn-sm" onClick={()=>setShowContas(s=>!s)}>{showContas?'Ocultar':'Ver'} detalhes das contas</button>
        </div>
        {showContas && (
          <div style={{marginTop:10,padding:'10px 14px',background:'var(--card-2)',borderRadius:8}}>
            <div className="muted" style={{fontSize:11,marginBottom:6}}>Custos pessoais que precisam ser cobertos por mês:</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'4px 14px',fontSize:13}}>
              {CONTAS_FIXAS_MES.map((c,i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'4px 0',borderBottom:'1px dashed var(--border)'}}>
                  <span>{c.label}</span>
                  <span className="red">{fmtR$(c.valor)}</span>
                </div>
              ))}
            </div>
            <div style={{display:'flex',justifyContent:'space-between',marginTop:8,paddingTop:8,borderTop:'1px solid var(--border)',fontWeight:700}}>
              <span>Total mensal</span>
              <span className="red">{fmtR$(META_BREAKEVEN_MES)}</span>
            </div>
          </div>
        )}
      </div>

      {/* Evolução do Estoque */}
      <div className="card" style={{borderLeft:'6px solid var(--blue)',padding:18}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:14}}>
          <div className="card-title" style={{margin:0}}>📦 Evolução do Estoque</div>
          <div style={{display:'flex',gap:6}}>
            {[['hoje','Hoje'],['7d','7 dias'],['30d','30 dias']].map(([v,l]) => (
              <button key={v} className={`btn btn-sm ${periodoEstoque===v?'btn-success':'btn-outline'}`} onClick={()=>setPeriodoEstoque(v)}>{l}</button>
            ))}
          </div>
        </div>
        {!evolEstoque && <Skeleton rows={3}/>}
        {evolEstoque && (() => {
          const variacao = Number(evolEstoque.variacao||0);
          const corVar = variacao > 0 ? 'blue' : variacao < 0 ? 'yellow' : 'muted';
          const setaVar = variacao > 0 ? '↑ Cresceu' : variacao < 0 ? '↓ Reduziu' : '= Estável';
          return (
            <Fragment>
              <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:18,flexWrap:'wrap',marginBottom:14}}>
                <div style={{textAlign:'center'}}>
                  <div className="muted" style={{fontSize:12}}>Início do período</div>
                  <div style={{fontSize:24,fontWeight:700}}>{fmtR$(evolEstoque.valor_inicio)}</div>
                </div>
                <div style={{fontSize:32,opacity:.5}}>→</div>
                <div style={{textAlign:'center'}}>
                  <div className="muted" style={{fontSize:12}}>Estoque hoje</div>
                  <div style={{fontSize:24,fontWeight:700}}>{fmtR$(evolEstoque.valor_fim)}</div>
                </div>
                <div style={{textAlign:'center',marginLeft:18,padding:'10px 16px',background:'var(--card-2)',borderRadius:8}}>
                  <div className="muted" style={{fontSize:11}}>{setaVar}</div>
                  <div style={{fontSize:22,fontWeight:800}} className={corVar}>{variacao >= 0 ? '+' : ''}{fmtR$(variacao)}</div>
                </div>
              </div>

              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
                <div style={{padding:12,background:'var(--card-2)',borderRadius:8}}>
                  <div className="muted" style={{fontSize:11,marginBottom:6}}>📥 ENTRADAS NO PERÍODO</div>
                  <div style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:13}}>
                    <span>+ Compras</span><span className="green">{fmtR$(evolEstoque.compras)}</span>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:13}}>
                    <span>+ Auditoria positiva</span><span className="green">{fmtR$(evolEstoque.ajustes_positivos)}</span>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',paddingTop:6,marginTop:4,borderTop:'1px solid var(--border)',fontSize:13,fontWeight:700}}>
                    <span>Total entrada</span>
                    <span className="green">{fmtR$(Number(evolEstoque.compras)+Number(evolEstoque.ajustes_positivos))}</span>
                  </div>
                </div>
                <div style={{padding:12,background:'var(--card-2)',borderRadius:8}}>
                  <div className="muted" style={{fontSize:11,marginBottom:6}}>📤 SAÍDAS NO PERÍODO</div>
                  <div style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:13}}>
                    <span>− Vendas (CMV)</span><span className="red">{fmtR$(evolEstoque.vendas_cmv)}</span>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:13}}>
                    <span>− Perdas</span><span className="red">{fmtR$(evolEstoque.perdas)}</span>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:13}}>
                    <span>− Auditoria negativa</span><span className="red">{fmtR$(evolEstoque.ajustes_negativos)}</span>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',paddingTop:6,marginTop:4,borderTop:'1px solid var(--border)',fontSize:13,fontWeight:700}}>
                    <span>Total saída</span>
                    <span className="red">{fmtR$(Number(evolEstoque.vendas_cmv)+Number(evolEstoque.perdas)+Number(evolEstoque.ajustes_negativos))}</span>
                  </div>
                </div>
              </div>

              {Number(evolEstoque.itens_negativos_ignorados||0) > 0 && (
                <div className="muted" style={{fontSize:11,marginTop:10,textAlign:'center'}}>
                  ⚠️ {evolEstoque.itens_negativos_ignorados} item(ns) com saldo negativo ignorado(s) no cálculo
                </div>
              )}
            </Fragment>
          );
        })()}
      </div>

      {/* Zona 2: Próximas Compras & Produções */}
      <div className="card" style={{borderLeft:'6px solid var(--yellow)',padding:18}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:14}}>
          <div className="card-title" style={{margin:0}}>🛒 Próximas Compras & Produções</div>
          <div style={{display:'flex',gap:6}}>
            {[5,7,10,15].map(d => (
              <button key={d} className={`btn btn-sm ${diasCobertura===d?'btn-success':'btn-outline'}`} onClick={()=>setDiasCobertura(d)}>{d}d</button>
            ))}
          </div>
        </div>
        <div className="muted" style={{fontSize:12,marginBottom:12}}>Cobertura alvo: <b>{diasCobertura} dias</b> · baseado no consumo dos últimos 7 dias</div>

        {!planejamento && <Skeleton rows={3}/>}
        {planejamento && (() => {
          const e = planejamento.estoque || {};
          const itensC = e.itens_comprar || [];
          const itensP = e.itens_produzir || [];
          if (!itensC.length && !itensP.length) {
            return <div className="empty" style={{padding:20,textAlign:'center'}}>✅ Estoque coberto pra {diasCobertura} dias — nada pra repor</div>;
          }
          return (
            <Fragment>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10,marginBottom:14}}>
                <div className="stat-card tinted-red"><div className="stat-value red">{fmtR$(e.total_comprar_valor)}</div><div className="stat-label">Total a comprar</div><div className="stat-sub">{itensC.length} item(ns) in natura</div></div>
                <div className="stat-card tinted-yellow"><div className="stat-value yellow">{fmtR$(e.total_produzir_valor)}</div><div className="stat-label">Total a produzir</div><div className="stat-sub">{itensP.length} preparado(s)</div></div>
                <div className="stat-card tinted-blue"><div className="stat-value blue">{fmtR$(e.total_geral)}</div><div className="stat-label">Total geral</div><div className="stat-sub">≈ {e.pedidos_para_repor} pedidos pra repor</div></div>
              </div>

              {itensC.length > 0 && (
                <div style={{marginBottom:12}}>
                  <div onClick={()=>setShowItensComprar(s=>!s)} style={{cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 12px',background:'var(--card-2)',borderRadius:8}}>
                    <b>📦 COMPRAR (in natura) — {itensC.length} item(ns)</b>
                    <span className="muted">{showItensComprar?'▾':'▸'} Ver lista</span>
                  </div>
                  {showItensComprar && (
                    <div style={{padding:'10px 12px',background:'var(--card-2)',borderTop:'1px solid var(--border)',borderRadius:'0 0 8px 8px'}}>
                      {itensC.map((it,i) => (
                        <div key={i} style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr',gap:8,padding:'6px 0',borderBottom:i===itensC.length-1?'none':'1px dashed var(--border)',fontSize:13,alignItems:'center'}}>
                          <span><b>{it.nome}</b> <span className="muted" style={{fontSize:11}}>({TIPO_LABEL[it.tipo]||it.tipo})</span></span>
                          <span className={`badge badge-${it.dias_cobertura<1?'red':it.dias_cobertura<3?'yellow':'green'}`} style={{justifySelf:'start'}}>{fmt(it.dias_cobertura,1)}d cobertura</span>
                          <span>Faltam <b>{fmtG(it.gramas_falta)}</b></span>
                          <span className="red" style={{textAlign:'right',fontWeight:600}}>{fmtR$(it.custo_estimado)}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {itensP.length > 0 && (
                <div>
                  <div onClick={()=>setShowItensProduzir(s=>!s)} style={{cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 12px',background:'var(--card-2)',borderRadius:8}}>
                    <b>🍳 PRODUZIR (preparados) — {itensP.length} item(ns)</b>
                    <span className="muted">{showItensProduzir?'▾':'▸'} Ver lista</span>
                  </div>
                  {showItensProduzir && (
                    <div style={{padding:'10px 12px',background:'var(--card-2)',borderTop:'1px solid var(--border)',borderRadius:'0 0 8px 8px'}}>
                      {itensP.map((it,i) => (
                        <div key={i} style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr',gap:8,padding:'6px 0',borderBottom:i===itensP.length-1?'none':'1px dashed var(--border)',fontSize:13,alignItems:'center'}}>
                          <span><b>{it.nome}</b></span>
                          <span className={`badge badge-${it.dias_cobertura<1?'red':it.dias_cobertura<3?'yellow':'green'}`} style={{justifySelf:'start'}}>{fmt(it.dias_cobertura,1)}d cobertura</span>
                          <span>Produzir <b>{fmtG(it.gramas_falta)}</b></span>
                          <span className="yellow" style={{textAlign:'right',fontWeight:600}}>{fmtR$(it.custo_estimado)}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </Fragment>
          );
        })()}
      </div>

      <div className="card" style={{background:'var(--card-2)'}}>
        <div className="card-title">📈 Indicadores secundários do período</div>
        <div className="stat-grid" style={{marginBottom:0}}>
          <div className="stat-card"><div className="stat-value blue">{fmtR$(cards.dinheiro_conta)}</div><div className="stat-label">Vai cair na conta</div><div className="stat-sub">Receita − descontos</div></div>
          <div className="stat-card"><div className="stat-value yellow">{fmtR$(cards.custos_fixos_diluidos)}</div><div className="stat-label">Fixos diluídos</div><div className="stat-sub">Rateado pelos dias do filtro</div></div>
          <div className="stat-card"><div className="stat-value red">{fmtR$(cards.custos_variaveis_periodo)}</div><div className="stat-label">Variáveis (perdas)</div><div className="stat-sub">Perdas/ajustes no período</div></div>
          <div className="stat-card"><div className="stat-value yellow">{fmtR$(custoExtraPorPrato)}</div><div className="stat-label">Custo extra por prato</div><div className="stat-sub">{qtdPratos} prato(s) · {fmtR$(custosExtras)}</div></div>
        </div>
      </div>

      {(Number(cards.cancelamentos_mes||0) > 0 || Number(cards.cortesias_mes||0) > 0) && (
        <div className="card" style={{background:'var(--card-2)'}}>
          <div className="card-title">Custos especiais do mes</div>
          <div className="stat-grid" style={{marginBottom:0}}>
