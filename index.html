              <div style={{marginTop:14,padding:12,background:'var(--card-2)',borderRadius:8}}>
                <div className="muted" style={{fontSize:11,marginBottom:6}}>📐 PRA CONSTRUIR ESSA RESERVA</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:10,fontSize:13}}>
                  <div>
                    <div className="muted" style={{fontSize:11}}>Falta construir</div>
                    <div style={{fontWeight:700,fontSize:18}} className="red">{fmtR$(r.falta_para_reserva)}</div>
                  </div>
                  <div>
                    <div className="muted" style={{fontSize:11}}>Pedidos necessários</div>
                    <div style={{fontWeight:700,fontSize:18}} className="purple">≈ {r.pedidos_para_reserva}</div>
                    <div className="muted" style={{fontSize:11}}>× {fmtR$(m.ticket_medio_bruto)} = {fmtR$(r.receita_bruta_necessaria)}</div>
                  </div>
                  <div>
                    <div className="muted" style={{fontSize:11}}>No ritmo de {fmt(m.media_pedidos_dia,1)}/dia</div>
                    <div style={{fontWeight:700,fontSize:18}}>≈ {r.dias_estimados_ritmo_atual} dias</div>
                    <div className="muted" style={{fontSize:11}}>(~{fmt(r.meses_estimados,1)} meses)</div>
                  </div>
                </div>
              </div>

              <div className="muted" style={{fontSize:11,marginTop:10,padding:'8px 10px',background:'var(--card-2)',borderRadius:6,opacity:.7}}>
                ⓘ Tecnicamente isso se chama <b>runway</b> ou <b>fundo de reserva operacional</b>. EBITDA é outra coisa — uma métrica de lucro do DRE, não de reserva de caixa.
              </div>
            </Fragment>
          );
        })()}
      </div>
    </div>
  );
}

function TelaCMVBackend() {
  const sb = getClient();
  const [periodo, setPeriodo] = useState('mes');
  const [custom, setCustom] = useState({});
  const [linhas, setLinhas] = useState([]);
  const [projecao, setProjecao] = useState(null);
  const [loading, setLoading] = useState(true);
  const [sort, setSort] = useState({ col:'lucro_total', asc:false });
  const [expanded, setExpanded] = useState(null);
  const [ingredientesPrato, setIngredientesPrato] = useState({});

  async function load() {
    setLoading(true);
    const { from, to } = periodToDates(periodo, custom);
    const { data, error } = await sb.rpc('rpc_cmv_analise_v1', { p_inicio: from.toISOString(), p_fim: to.toISOString() });
    if (!error) {
      setLinhas(data?.linhas || []);
      setProjecao(data?.projecao || null);
    }
    setLoading(false);
  }
  useEffect(() => { load(); }, [periodo, custom]);

  const sorted = [...linhas].sort((a,b) => {
    const va = a[sort.col] ?? 0, vb = b[sort.col] ?? 0;
    const cmp = typeof va === 'string' ? String(va).localeCompare(String(vb)) : (Number(va)||0) - (Number(vb)||0);
    return sort.asc ? cmp : -cmp;
  });
  function sortBy(c) { setSort(s => s.col===c ? { col:c, asc:!s.asc } : { col:c, asc:false }); }

  async function toggleExpand(receita_id) {
    if (expanded === receita_id) { setExpanded(null); return; }
    setExpanded(receita_id);
    if (!ingredientesPrato[receita_id]) {
      const { data } = await sb.from('receita_itens').select(`quantidade,quantidade_gramas,fator_rendimento,produto_id,produtos(nome,tipo,categorias(nome))`).eq('receita_id', receita_id);
      const ids = (data||[]).map(x => x.produto_id);
      let custos = {};
      if (ids.length > 0) {
        const { data: ce } = await sb.from('v_estoque_atual').select('produto_id,custo_medio_grama').in('produto_id', ids);
        (ce||[]).forEach(x => custos[x.produto_id] = Number(x.custo_medio_grama)||0);
      }
      setIngredientesPrato(prev => ({...prev, [receita_id]:(data||[]).map(it => {
        const cg = custos[it.produto_id]||0;
        return { ...it, custo:(Number(it.quantidade_gramas)||0)/(Number(it.fator_rendimento)||1)*cg, grupo:categorizar(it.produtos, it.produtos?.categorias?.nome) };
      })}));
    }
  }

  return (
    <div className="content">
      <div className="section-header">
        <div className="section-title">CMV & Analise</div>
        <button className="btn btn-outline btn-sm" onClick={load}>Atualizar</button>
      </div>
      <DatePeriodFilter value={periodo} onChange={setPeriodo} custom={custom} onCustomChange={setCustom}/>

      {projecao && (Number(projecao.dinheiro_conta_7d||0) > 0 || Number(projecao.lucro_7d||0) !== 0) && (
        <div className="card" style={{borderLeft:'4px solid var(--blue)'}}>
          <div className="card-title">Projecao mensal baseada nos ultimos 7 dias</div>
          <div className="stat-grid">
            <div className="stat-card"><div className="stat-value blue">{fmtR$(projecao.dinheiro_conta_30d)}</div><div className="stat-label">Vai cair na conta estimado</div></div>
            <div className="stat-card"><div className={`stat-value ${Number(projecao.lucro_30d||0)>=0?'green':'red'}`}>{fmtR$(projecao.lucro_30d)}</div><div className="stat-label">Lucro estimado</div></div>
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-title">Pratos no periodo</div>
        <div className="table-wrap">
          <table>
            <thead><tr>
              <th></th>
              <th className="sortable" onClick={()=>sortBy('nome')}>Prato</th>
              <th className="sortable" onClick={()=>sortBy('preco')}>Preco</th>
              <th className="sortable" onClick={()=>sortBy('cmv_unitario')}>CMV unit</th>
              <th className="sortable" onClick={()=>sortBy('food_cost_percentual')}>Food cost</th>
              <th className="sortable" onClick={()=>sortBy('qtd')}>Qtd</th>
              <th className="sortable" onClick={()=>sortBy('receita_bruta')}>Receita</th>
              <th className="sortable" onClick={()=>sortBy('taxa_plataforma')}>Taxa plataforma</th>
              <th className="sortable" onClick={()=>sortBy('dinheiro_conta')}>Vai cair</th>
              <th className="sortable" onClick={()=>sortBy('cmv_total')}>CMV periodo</th>
              <th className="sortable" onClick={()=>sortBy('lucro_total')}>Lucro</th>
            </tr></thead>
            <tbody>
              {loading && <tr><td colSpan="11"><Skeleton rows={4}/></td></tr>}
              {!loading && sorted.length === 0 && <tr><td colSpan="11" className="empty">Sem dados</td></tr>}
              {!loading && sorted.map(r => {
                const fc = r.food_cost_percentual;
                return <Fragment key={r.receita_id}>
                  <tr className="clickable" onClick={()=>toggleExpand(r.receita_id)}>
                    <td>{expanded===r.receita_id?'v':'>'}</td>
                    <td><b>{r.nome}</b></td>
                    <td>{Number(r.preco)>0?fmtR$(r.preco):'--'}</td>
                    <td className="red">{fmtR$(r.cmv_unitario)}</td>
                    <td className={fc==null?'muted':fc<32?'green':fc<38?'yellow':'red'}>{fc!=null?fmtPct(fc):'--'}</td>
                    <td>{fmt(r.qtd,0)}</td>
                    <td className="green">{fmtR$(r.receita_bruta)}</td>
                    <td className="red">{fmtR$(r.taxa_plataforma)}</td>
                    <td className="blue">{fmtR$(r.dinheiro_conta)}</td>
                    <td className="red">{fmtR$(r.cmv_total)}</td>
                    <td className={Number(r.lucro_total)>=0?'green':'red'}><b>{fmtR$(r.lucro_total)}</b></td>
                  </tr>
                  {expanded === r.receita_id && ingredientesPrato[r.receita_id] && (
                    <tr className="expanded"><td colSpan="11"><PratoExpand ingredientes={ingredientesPrato[r.receita_id]}/></td></tr>
                  )}
                </Fragment>;
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function StatusChips({ value, onChange, options }) {
  return (
    <div className="status-chip-group">
      {options.map((o,i) => {
        const n = Number(o);
        const cls = Number.isFinite(n) ? (n >= 3 ? 'good' : n === 2 ? 'mid' : 'bad') : (i === 0 ? 'good' : i === 1 ? 'mid' : 'bad');
        return <button key={o} className={`status-chip ${value===o?'active '+cls:''}`} onClick={()=>onChange(o)}>{o}</button>;
      })}
    </div>
  );
}

function TelaRelatorioDiario() {
  const sb = getClient();
  const toast = useToast();
  const [dataRel, setDataRel] = useState(todayISO());
  const [input, setInput] = useState(relatorioInputInicial());
  const [relatorio, setRelatorio] = useState(null);
  const [loading, setLoading] = useState(false);
  const reportRef = useRef(null);

  function setStatus(k,v) { setInput({...input, status_cozinha:{...input.status_cozinha, [k]:v}}); }
  function setGeladeira(grupo,item,v) { setInput({...input, geladeira:{...input.geladeira, [grupo]:{...input.geladeira[grupo], [item]:v}}}); }
  function setQuantidade(k,v) { setInput({...input, quantidades:{...input.quantidades, [k]:v}}); }

  async function gerar() {
    setLoading(true);
    try {
      const { data, error } = await sb.rpc('rpc_relatorio_diario_operacional_v1', {
        p_data: dataRel,
        p_inputs: input
      });
      if (error) throw error;
      setRelatorio(data);
      toast('Relatorio gerado','success');
    } catch(e) {
      toast('Erro ao gerar relatorio: '+e.message,'error');
    }
    setLoading(false);
  }

  async function baixarPdf() {
    if (!reportRef.current) return toast('Gere o relatorio antes de baixar','error');
    const filename = `dom-leonardo-relatorio-${dataRel}.pdf`;
    if (window.html2pdf) {
      await window.html2pdf().set({
        margin: 8,
        filename,
        image: { type:'jpeg', quality:0.98 },
        html2canvas: { scale:2, useCORS:true, backgroundColor:'#f8fafc' },
        jsPDF: { unit:'mm', format:'a4', orientation:'portrait' }
      }).from(reportRef.current).save();
    } else {
      window.print();
    }
  }

  const statusOpts = {
    chao:['limpo','sujo','muito sujo'],
    bancadas:['limpo','sujo'],
    louca:['limpa','suja','muito suja'],
    geladeira_preta:['organizada','desorganizada'],
    geladeira_branca:['organizada','desorganizada'],
    freezer:['organizado','desorganizado','muito desorganizado'],
    armarios:['organizado','desorganizado','muito desorganizado']
  };
  const statusLabels = { chao:'Chao', bancadas:'Bancadas', louca:'Louca', geladeira_preta:'Geladeira preta', geladeira_branca:'Geladeira branca', freezer:'Freezer', armarios:'Armarios' };
  const potes = ['cheio','metade','baixo'];
  const porcoes = ['4','3','2','1','0'];
  const grupos = [
    ['proteinas','Proteinas', ['bacon','alcatra','blumenal','carne_moida']],
    ['carboidratos_bacias','Bacias grandes de carboidratos', ['arroz','penne','spaghetti','fettuccine','nhoque']],
    ['molhos','Molhos', ['pesto','branco','vermelho']],
    ['queijos','Queijos em bacia', ['parmesao','provolone','gorgonzola']]
  ];
  const gruposPorcionados = [
    ['carboidratos_porcionados','Carboidratos porcionados', ['arroz','penne','spaghetti','fettuccine','nhoque']],
    ['opcionais_porcionados','Geladeira branca - opcionais porcionados', ['alcatra','bacon','parmesao','provolone','gorgonzola','costela']]
  ];

  return (
    <div className="content">
      <div className="section-header">
        <div className="section-title">Relatorio Diario</div>
        <div className="report-actions">
          <button className="btn btn-primary" onClick={gerar} disabled={loading}>{loading?'Gerando...':'Gerar relatorio'}</button>
          <button className="btn btn-success" onClick={baixarPdf} disabled={!relatorio}>Baixar PDF</button>
        </div>
      </div>

      <div className="card no-print">
        <div className="form-row">
          <div className="form-group"><label>Data do fechamento</label><input type="date" value={dataRel} onChange={e=>setDataRel(e.target.value)}/></div>
          <div className="form-group"><label>Observacoes do dia</label><input value={input.observacoes} onChange={e=>setInput({...input,observacoes:e.target.value})} placeholder="Ex: movimento fraco, fornecedor atrasou, ajuste de rotina..."/></div>
        </div>
        <div className="divider"/>
        <div className="card-title">Status da cozinha</div>
        <div className="report-grid">
          {Object.entries(statusOpts).map(([k,opts]) => (
            <div className="form-group" key={k}>
              <label>{statusLabels[k]}</label>
              <StatusChips value={input.status_cozinha[k]} onChange={v=>setStatus(k,v)} options={opts}/>
            </div>
          ))}
        </div>
        <div className="divider"/>
        <div className="card-title">Geladeira e bacias</div>
        {grupos.map(([grupo,label,itens]) => (
          <div key={grupo} style={{marginBottom:12}}>
            <div className="muted" style={{fontSize:12,fontWeight:700,marginBottom:8}}>{label}</div>
            <div className="report-grid">
              {itens.map(item => (
                <div className="form-group" key={item}>
                  <label>{item.replace('_',' ')}</label>
                  <StatusChips value={input.geladeira[grupo][item]} onChange={v=>setGeladeira(grupo,item,v)} options={potes}/>
                </div>
              ))}
            </div>
          </div>
        ))}
        {gruposPorcionados.map(([grupo,label,itens]) => (
          <div key={grupo} style={{marginBottom:12}}>
            <div className="muted" style={{fontSize:12,fontWeight:700,marginBottom:8}}>{label} (0 a 4)</div>
            <div className="report-grid">
              {itens.map(item => (
                <div className="form-group" key={item}>
                  <label>{item.replace('_',' ')}</label>

          <div className="form-group"><label>Panacota pronta</label><input type="number" value={input.quantidades.panacota} onChange={e=>setQuantidade('panacota',e.target.value)}/></div>

      </div>

      {relatorio && <RelatorioPreview refEl={reportRef} relatorio={relatorio}/>}
    </div>
  );
}

          <div className="report-metric" style={{borderLeftColor:'#2563eb'}}><div className="label">Vai cair na conta</div><div className="value">{fmtR$(m.dinheiro_conta)}</div></div>
          <div className="report-metric" style={{borderLeftColor:'#dc2626'}}><div className="label">CMV vendas</div><div className="value">{fmtR$(m.cmv)}</div></div>
          <div className="report-metric" style={{borderLeftColor:'#16a34a'}}><div className="label">Lucro pos taxas + CMV</div><div className="value">{fmtR$(m.lucro_pos_taxas_cmv)}</div></div>
          <div className="report-metric" style={{borderLeftColor:'#f59e0b'}}><div className="label">Custos fixos diluidos</div><div className="value">{fmtR$(m.custos_fixos_diluidos)}</div></div>
          <div className="report-metric" style={{borderLeftColor:'#dc2626'}}><div className="label">Custos variaveis mes</div><div className="value">{fmtR$(m.custos_variaveis_mes)}</div></div>
          <div className="report-metric" style={{borderLeftColor:'#dc2626'}}><div className="label">Taxas plataforma</div><div className="value">{fmtR$(m.taxas_plataforma)}</div></div>
          <div className="report-metric" style={{borderLeftColor:Number(m.lucro_real)>=0?'#16a34a':'#dc2626'}}><div className="label">Lucro real</div><div className="value">{fmtR$(m.lucro_real)}</div></div>
        </div>
        <div style={{fontSize:12,color:'#64748b',marginTop:10}}>Top pratos: {pratos(relatorio.top_pratos)}. Bottom: {pratos(relatorio.bottom_pratos)}.</div>
      </div>

      <div className="report-cols">
        <StatusBlock title="Status da cozinha" obj={relatorio.status_cozinha}/>
        <StatusBlock title="Geladeira e bacias" obj={relatorio.geladeira}/>
      </div>

      <div className="report-cols">
        <TaskList title="Urgente - parar e resolver" rows={urgentes}/>
        <TaskList title="Limpar / organizar" rows={byCat('limpar')}/>
      </div>
      <div className="report-cols">
        <TaskList title="Preparar para amanha" rows={byCat('preparar')}/>
        <TaskList title="Comprar" rows={byCat('comprar')}/>
      </div>

      <div className="report-cols">
        <EstoqueTable title="Estoque preparado" rows={estoquePrep}/>
        <EstoqueTable title="Estoque in natura e embalagens" rows={estoqueCru}/>
      </div>

      <div className="report-band">
        <h2>Observacoes</h2>
        <div style={{fontSize:13,color:'#334155'}}>{relatorio.observacoes || 'Sem observacoes.'}</div>
      </div>
      <div className="report-print-footer">Relatorio gerado pelo ERP Dom Leonardo. Este modulo apenas le dados e nao altera estoque, vendas, compras ou caixa.</div>
    </div>
  );
}

function PlaceholderScreen({ name }) {
  return (
    <div className="content">
      <div className="section-header"><div className="section-title">⏳ {name}</div></div>
      <div className="card"><div className="empty">Em construção...</div></div>
    </div>
  );
}

// ── APP SHELL ───────────────────────────────────────────────────────────────
const SCREENS = [
  { id:'home',          label:'Dashboard',        icon:'🏠', group:'geral' },
  { id:'relatorio',     label:'Relatório Diário', icon:'PDF', group:'geral' },
  { id:'compra',        label:'Lançar Compra',    icon:'🛒', group:'lancamentos' },
  { id:'producao',      label:'Lançar Produção',  icon:'🍳', group:'lancamentos' },
  { id:'venda',         label:'Lançar Venda',     icon:'💰', group:'lancamentos' },
  { id:'perda',         label:'Usos e Perdas',    icon:'🪣', group:'lancamentos' },
  { id:'despesa',       label:'Despesa Fixa',     icon:'💸', group:'lancamentos' },
  { id:'fichas',        label:'Fichas Técnicas',  icon:'📋', group:'gestao' },
  { id:'estoque-cru',   label:'Estoque In Natura',icon:'📦', group:'gestao' },
  { id:'estoque-prep',  label:'Estoque Preparado',icon:'🥘', group:'gestao' },
  { id:'cmv',           label:'CMV & Análise',    icon:'📊', group:'gestao' },
  { id:'caixa',         label:'Fluxo de Caixa',   icon:'💵', group:'gestao' },
  { id:'auditoria',     label:'Auditoria',        icon:'🔍', group:'gestao' },
  { id:'cadastros',     label:'Cadastros',        icon:'⚙️', group:'gestao' },
];

const GROUP_LABEL = { geral:'', lancamentos:'Lançamentos', gestao:'Gestão' };

function Sidebar({ open, onClose, screen, onNavigate }) {
  const groups = [...new Set(SCREENS.map(s=>s.group))];
  return (
    <Fragment>
      <div className={`sidebar-overlay${open?' show':''}`} onClick={onClose}/>
      <nav className={`sidebar${open?' open':''}`}>
        <div className="sidebar-logo"><span>🍝</span> Dom Leonardo</div>
        {groups.map(g => (
          <div key={g}>
            {GROUP_LABEL[g] && <div className="nav-section">{GROUP_LABEL[g]}</div>}
            {SCREENS.filter(s=>s.group===g).map(s => (
              <div key={s.id} className={`nav-item${screen===s.id?' active':''}`} onClick={()=>onNavigate(s.id)}>
                <span className="nav-icon">{s.icon}</span>{s.label}
              </div>
            ))}
          </div>
        ))}
        <div className="sidebar-footer">
          <button className="btn btn-outline btn-sm btn-block" onClick={()=>{
            localStorage.removeItem('sb_url'); localStorage.removeItem('sb_key');
            resetClient(); window.location.reload();
          }}>Trocar conexão</button>
        </div>
      </nav>
    </Fragment>
  );
}

function Topbar({ onToggleSidebar, title }) {
  const { theme, toggle } = useTheme();
  return (
    <div className="topbar">
      <button className="hamburger" onClick={onToggleSidebar}>☰</button>
      <div className="topbar-title">{title}</div>
      <button className="theme-toggle" onClick={toggle} title="Alternar tema">
        {theme === 'dark' ? '☀️ Claro' : '🌙 Escuro'}
      </button>
    </div>
  );
}

function App() {
  const [loggedIn, setLoggedIn] = useState(() => {
    ensureErpSupabaseConfig();
    return true;
  });
  const [screen, setScreen] = useState('home');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [refreshKey, setRefreshKey] = useState(0);

  useAutoRefresh(() => setRefreshKey(k => k+1), 60000, loggedIn);

  function navigate(id) { setScreen(id); setSidebarOpen(false); }
  const current = SCREENS.find(s=>s.id===screen);

  if (!loggedIn) return <ToastProvider><Login onLogin={()=>setLoggedIn(true)}/></ToastProvider>;

  return (
    <ToastProvider>
      <Sidebar open={sidebarOpen} onClose={()=>setSidebarOpen(false)} screen={screen} onNavigate={navigate}/>
      <div className="main">
        <Topbar onToggleSidebar={()=>setSidebarOpen(o=>!o)} title={`${current?.icon||''} ${current?.label||''}`}/>
        {screen==='home'           && <TelaDashboardBackend refreshKey={refreshKey}/>}
        {screen==='relatorio'      && <TelaRelatorioDiario/>}
        {screen==='compra'         && <TelaCompra/>}
        {screen==='producao'       && <TelaProducao/>}
        {screen==='venda'          && <TelaVenda/>}
        {screen==='perda'          && <TelaPerda/>}
        {screen==='despesa'        && <TelaDespesa/>}
        {screen==='fichas'         && <TelaFichas/>}
        {screen==='estoque-cru'    && <TelaEstoqueInNatura/>}
        {screen==='estoque-prep'   && <TelaEstoquePreparado/>}
        {screen==='cmv'            && <TelaCMVBackend/>}
        {screen==='caixa'          && <TelaCaixa/>}
        {screen==='auditoria'      && <TelaAuditoria/>}
        {screen==='cadastros'      && <TelaCadastros/>}
      </div>
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ThemeProvider><App/></ThemeProvider>
);
</script>
</body>
</html>
