function CompraExtrato({ produtos, fornecedores, unidades, toast, sb }) {
  const [periodo, setPeriodo] = useState('mes');
  const [custom, setCustom] = useState({ from:'', to:'' });
  const [filtroProd, setFiltroProd] = useState('');
  const [filtroForn, setFiltroForn] = useState('');
  const [evolucaoProd, setEvolucaoProd] = useState('');
  const [rows, setRows] = useState([]);
  const [editing, setEditing] = useState(null);
  const [addingOpcional, setAddingOpcional] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [confirmDeleteItem, setConfirmDeleteItem] = useState(null);
  const [loading, setLoading] = useState(false);
  const chartBarRef = useRef(null);
  const chartLineRef = useRef(null);

  async function load() {
    setLoading(true);
    const { from, to } = periodToDates(periodo, custom);
    let q = sb.from('compras_itens').select(`
      id, quantidade, quantidade_gramas, preco_total,
      produto_id, produtos(nome,tipo),
      unidade_id, unidades(nome,codigo),
      compra_id, compras!inner(fornecedor_id, fornecedores(nome), movimentacao_id, movimentacoes!inner(data_movimentacao))
    `).gte('compras.movimentacoes.data_movimentacao', from.toISOString()).lte('compras.movimentacoes.data_movimentacao', to.toISOString());
    if (filtroProd) q = q.eq('produto_id', filtroProd);
    if (filtroForn) q = q.eq('compras.fornecedor_id', filtroForn);
    const { data, error } = await q.order('compra_id',{ascending:false}).limit(500);
    setRows(error ? [] : (data||[]));
    setLoading(false);
  }
  useEffect(() => { load(); }, [periodo, custom, filtroProd, filtroForn]);

  async function excluirCompra(row) {
    try {
      const { error } = await sb.rpc('rpc_excluir_compra', { p_compra_id: row.compra_id });
      if (error) throw error;
      toast('Compra excluida completamente','success');
      setConfirmDelete(null);
      load();
    } catch(e) {
      toast('Erro: '+e.message,'error');
    }
  }

  const total = sumBy(rows,'preco_total');
  const porProduto = useMemo(() => {
    const m = {}; rows.forEach(r=>{ const n = r.produtos?.nome||'?'; m[n] = (m[n]||0) + Number(r.preco_total||0); });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,15);
  }, [rows]);

  useChart(chartBarRef, () => {
    if (porProduto.length === 0) return null;
    return {
      type:'bar',
      data:{ labels:porProduto.map(x=>x[0]), datasets:[{ data:porProduto.map(x=>x[1]), backgroundColor:'rgba(74,144,217,.7)', borderRadius:6 }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ x:{ ticks:{color:cssVar('--muted'),callback:v=>'R$ '+fmt(v,0)}, grid:{color:cssVar('--border')} }, y:{ ticks:{color:cssVar('--muted'),font:{size:11}}, grid:{display:false} } }
      }
    };
  }, [porProduto]);

  // Evolução de preço de um produto selecionado
  const [serieEvolucao, setSerieEvolucao] = useState(null);
  useEffect(() => {
    if (!evolucaoProd) { setSerieEvolucao(null); return; }
    (async () => {
      const { data } = await sb.from('compras_itens').select(`
        preco_total, quantidade_gramas, compras!inner(movimentacoes!inner(data_movimentacao))
      `).eq('produto_id', evolucaoProd).order('compras.movimentacao_id');
      const pts = (data||[]).map(x => ({
        d: x.compras?.movimentacoes?.data_movimentacao,
        p: x.quantidade_gramas > 0 ? Number(x.preco_total)/Number(x.quantidade_gramas) : 0
      })).filter(x=>x.d).sort((a,b)=>new Date(a.d)-new Date(b.d));
      setSerieEvolucao(pts);
    })();
  }, [evolucaoProd]);

  useChart(chartLineRef, () => {
    if (!serieEvolucao || serieEvolucao.length === 0) return null;
    return {
      type:'line',
      data:{ labels: serieEvolucao.map(x=>fmtDate(x.d)), datasets:[{ label:'R$/g', data: serieEvolucao.map(x=>x.p), borderColor:cssVar('--blue'), backgroundColor:'rgba(74,144,217,.15)', fill:true, tension:.3 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ x:{ ticks:{color:cssVar('--muted'),font:{size:10}}, grid:{color:cssVar('--border')} }, y:{ ticks:{color:cssVar('--muted'),callback:v=>'R$ '+fmt(v,4)}, grid:{color:cssVar('--border')} } }
      }
    };
  }, [serieEvolucao]);

  return (
    <div className="card" style={{marginTop:18}}>
      <div className="card-title">📜 Extrato de compras</div>
      <DatePeriodFilter value={periodo} onChange={setPeriodo} custom={custom} onCustomChange={setCustom}/>
      <div className="form-row">
        <div className="form-group">
          <label>Filtrar produto</label>
          <SearchableDropdown value={filtroProd} onChange={setFiltroProd} options={produtos} placeholder="Todos os produtos" renderOption={p=><div>{p.nome}</div>}/>
        </div>
        <div className="form-group">
          <label>Filtrar fornecedor</label>
          <SearchableDropdown value={filtroForn} onChange={setFiltroForn} options={fornecedores} placeholder="Todos os fornecedores"/>
        </div>
      </div>
      <div style={{padding:'10px 14px',background:'var(--card-2)',borderRadius:8,marginBottom:10,fontSize:14}}>
        <b>{rows.length}</b> registros · Total no período: <b className="green">{fmtR$(total)}</b>
      </div>
      <div className="table-wrap" style={{marginBottom:14}}>
        <table>
          <thead><tr><th>Data</th><th>Produto</th><th>Qtd</th><th>Un</th><th>Valor</th><th>R$/g</th><th>Fornecedor</th><th>Acoes</th></tr></thead>
          <tbody>
            {loading && <tr><td colSpan="8"><Skeleton rows={4}/></td></tr>}
            {!loading && rows.length === 0 && <tr><td colSpan="8" className="empty">Nenhuma compra no período</td></tr>}
            {!loading && rows.map(r => {
              const cg = Number(r.quantidade_gramas)>0 ? Number(r.preco_total)/Number(r.quantidade_gramas) : 0;
              return (
                <tr key={r.id}>
                  <td className="muted">{fmtDate(r.compras?.movimentacoes?.data_movimentacao)}</td>
                  <td><b>{r.produtos?.nome}</b></td>
                  <td>{fmt(r.quantidade,2)}</td>
                  <td className="muted">{r.unidades?.nome}</td>
                  <td className="green">{fmtR$(r.preco_total)}</td>
                  <td>R$ {fmt(cg,4)}</td>
                  <td className="muted">{r.compras?.fornecedores?.nome||'—'}</td>
                  <td>
                    <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                      <EditRowButton onClick={()=>setEditing(r)}/>
                      <DeleteRowButton onClick={()=>setConfirmDelete(r)}/>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {porProduto.length > 0 && (
        <div className="card" style={{background:'var(--card-2)'}}>
          <div className="card-title">Top gastos por produto</div>
          <div className="chart-wrap lg"><canvas ref={chartBarRef}/></div>
        </div>
      )}
      <div className="card" style={{background:'var(--card-2)'}}>
        <div className="card-title">📈 Evolução de preço por produto</div>
        <div className="form-group">
          <SearchableDropdown value={evolucaoProd} onChange={setEvolucaoProd} options={produtos} placeholder="Selecione um produto..." renderOption={p=><div>{p.nome}</div>}/>
        </div>
        {evolucaoProd && serieEvolucao && serieEvolucao.length > 0 && <div className="chart-wrap"><canvas ref={chartLineRef}/></div>}
        {evolucaoProd && serieEvolucao && serieEvolucao.length === 0 && <div className="empty">Sem histórico desse produto</div>}
      </div>
      <EditCompraModal open={!!editing} onClose={()=>setEditing(null)} row={editing} produtos={produtos} fornecedores={fornecedores} unidades={unidades} sb={sb} toast={toast} onSaved={load}/>
      <ConfirmModal
        open={!!confirmDelete}
        onClose={()=>setConfirmDelete(null)}
        onConfirm={()=>excluirCompra(confirmDelete)}
        title="Excluir compra inteira"
        message={`Excluir a compra inteira de "${confirmDelete?.produtos?.nome||''}"? Se ela veio de uma lista, todos os itens dessa mesma compra tambem serao apagados do estoque e do caixa.`}
        danger
        requireText="EXCLUIR"
      />
    </div>
  );
}

function TelaProducao() {
  const sb = getClient();
  const toast = useToast();
  const [tab, setTab] = useState('unica');
  const [preparados, setPreparados] = useState([]);
  const [insumos, setInsumos] = useState([]);
  const [unidades, setUnidades] = useState([]);
  const [refreshHistKey, setRefreshHistKey] = useState(0);

  async function reload() {
    const [p, i, u] = await Promise.all([
      sb.from('produtos').select('id,nome,tipo').eq('ativo',true).eq('tipo','preparado').order('nome'),
      sb.from('produtos').select('id,nome,tipo').eq('ativo',true).in('tipo',['cru','insumo','embalagem']).order('nome'),
      sb.from('unidades').select('id,codigo,nome,fator_gramas').order('nome'),
    ]);
    setPreparados(p.data||[]); setInsumos(i.data||[]); setUnidades(u.data||[]);
  }
  useEffect(() => { reload(); }, []);

  return (
    <div className="content">
      <div className="section-header"><div className="section-title">🍳 Lançar Produção</div></div>
      <div className="tabs">
        <button className={`tab${tab==='unica'?' active':''}`} onClick={()=>setTab('unica')}>Produção Única</button>
        <button className={`tab${tab==='lote'?' active':''}`} onClick={()=>setTab('lote')}>Produção em Lote</button>
      </div>
      {tab==='unica' && <ProducaoUnica preparados={preparados} insumos={insumos} unidades={unidades} sb={sb} toast={toast} onSuccess={()=>setRefreshHistKey(k=>k+1)}/>}
      {tab==='lote' && <ProducaoLote preparados={preparados} insumos={insumos} unidades={unidades} sb={sb} toast={toast} onSuccess={()=>setRefreshHistKey(k=>k+1)}/>}
      <ProducaoHistorico sb={sb} preparados={preparados} insumosProdutos={insumos} unidades={unidades} toast={toast} refreshKey={refreshHistKey}/>
    </div>
  );
}

async function lancarUmaProducao(sb, { data, produto_saida_id, quantidade, unidade_saida_id, insumos }) {
  const { data: result, error } = await sb.rpc('rpc_lancar_producao', {
    p_data_movimentacao: dateInputToIso(data),
    p_produto_saida_id: produto_saida_id,
    p_quantidade: parseDecimal(quantidade),
    p_unidade_saida_id: unidade_saida_id,
    p_insumos: insumos
      .filter(it => it.produto_id && it.quantidade && it.unidade_id)
      .map(it => ({ produto_id: it.produto_id, quantidade: parseDecimal(it.quantidade), unidade_id: it.unidade_id }))
  });
  if (error) throw error;
  return result;
}

function ProducaoUnica({ preparados, insumos, unidades, sb, toast, onSuccess }) {

  const [saida, setSaida] = useState({ produto_id:'', quantidade:'', unidade_id:'' });
  const [itens, setItens] = useState([{ produto_id:'', quantidade:'', unidade_id:'' }]);
  const [loading, setLoading] = useState(false);
  const [resultado, setResultado] = useState(null);

  function add() { setItens([...itens, { produto_id:'', quantidade:'', unidade_id:'' }]); }
  function remove(i) { setItens(itens.filter((_,idx)=>idx!==i)); }
  function upd(i,k,v) { setItens(itens.map((it,idx)=>idx===i?{...it,[k]:v}:it)); }

  async function lancar() {
    if (!saida.produto_id || !saida.quantidade || !saida.unidade_id) return toast('Preencha o produto de saída','error');
    const validos = itens.filter(it => it.produto_id && it.quantidade && it.unidade_id);
    if (validos.length === 0) return toast('Adicione ao menos um insumo','error');
    setLoading(true);
    try {
      const r = await lancarUmaProducao(sb, { data, produto_saida_id: saida.produto_id, quantidade: saida.quantidade, unidade_saida_id: saida.unidade_id, insumos: validos });
      const prod = preparados.find(p=>p.id===saida.produto_id);
      setResultado({ prod: prod?.nome, ...r });
      toast(`✅ ${prod?.nome} produzido — Custo ${fmtR$(r.custo_total)} · Rendimento ${r.rendimento_percentual!=null?fmtPct(r.rendimento_percentual):'—'}`,'success');
      setSaida({ produto_id:'', quantidade:'', unidade_id:'' });
      setItens([{ produto_id:'', quantidade:'', unidade_id:'' }]);
      onSuccess && onSuccess();
    } catch(e) { toast('Erro: '+e.message,'error'); }
    setLoading(false);
  }

  return (
    <div className="card">
      <div className="form-row">
        <div className="form-group"><label>Data</label><input type="date" value={data} onChange={e=>setData(e.target.value)}/></div>
        <div></div>
      </div>
      <div className="card-title">Produto de saída (preparado)</div>
      <div className="form-row-3">
        <div className="form-group"><label>Produto</label><SearchableDropdown value={saida.produto_id} onChange={v=>setSaida({...saida,produto_id:v})} options={preparados} placeholder="Buscar preparado..."/></div>
        <div className="form-group"><label>Quantidade</label><input type="number" step="0.01" value={saida.quantidade} onChange={e=>setSaida({...saida,quantidade:e.target.value})}/></div>
        <div className="form-group"><label>Unidade</label><SearchableDropdown value={saida.unidade_id} onChange={v=>setSaida({...saida,unidade_id:v})} options={unidades.filter(u=>['kg','g','l','ml'].includes(u.codigo))} placeholder="Un..." getLabel={u=>u.nome}/></div>
      </div>
      <div className="divider"/>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <div className="card-title" style={{margin:0}}>Insumos utilizados</div>
        <button className="btn btn-outline btn-sm" onClick={add}>+ Adicionar</button>
      </div>
      <div className="row-list">
        {itens.map((it,i) => (
          <div className="row-item cols-3" key={i}>
            <SearchableDropdown value={it.produto_id} onChange={v=>upd(i,'produto_id',v)} options={insumos} placeholder="Insumo..." renderOption={p=><div>{p.nome} <span className="muted">({TIPO_LABEL[p.tipo]})</span></div>}/>
            <input type="number" step="0.001" value={it.quantidade} onChange={e=>upd(i,'quantidade',e.target.value)} placeholder="Qtd"/>
            <SearchableDropdown value={it.unidade_id} onChange={v=>upd(i,'unidade_id',v)} options={unidades} placeholder="Un" getLabel={u=>u.nome}/>
            <button className="btn-icon" onClick={()=>remove(i)}>✕</button>
          </div>
        ))}
      </div>
      <button className="btn btn-success btn-lg btn-block" onClick={lancar} disabled={loading}>{loading?'Registrando...':'Lançar Produção'}</button>

      {resultado && (
        <div className="card" style={{marginTop:14,background:'var(--card-2)',borderLeft:'4px solid var(--green)'}}>
          <div className="card-title green">✅ Produção registrada</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:10}}>
            <div><div className="muted" style={{fontSize:11}}>Produto</div><div style={{fontSize:14,fontWeight:600}}>{resultado.prod}</div></div>
            <div><div className="muted" style={{fontSize:11}}>Custo total</div><div style={{fontSize:14,fontWeight:700}} className="red">{fmtR$(resultado.custo_total)}</div></div>
            <div><div className="muted" style={{fontSize:11}}>Custo/g</div><div style={{fontSize:14,fontWeight:700}}>R$ {fmt(resultado.custo_unitario_grama,4)}</div></div>
            <div><div className="muted" style={{fontSize:11}}>Rendimento</div><div style={{fontSize:14,fontWeight:700}} className={resultado.rendimento_percentual>=80?'green':resultado.rendimento_percentual>=60?'yellow':'red'}>{resultado.rendimento_percentual!=null?fmtPct(resultado.rendimento_percentual):'—'}</div></div>
          </div>
        </div>
      )}
    </div>
  );
}

function ProducaoLote({ preparados, insumos, unidades, sb, toast, onSuccess }) {
  const [data, setData] = useState(todayISO());
  const [cards, setCards] = useState([{ produto_id:'', quantidade:'', unidade_id:'', insumos:[{produto_id:'',quantidade:'',unidade_id:''}] }]);
  const [loading, setLoading] = useState(false);

  function addCard() { setCards([...cards, { produto_id:'', quantidade:'', unidade_id:'', insumos:[{produto_id:'',quantidade:'',unidade_id:''}] }]); }
  function removeCard(i) { setCards(cards.filter((_,idx)=>idx!==i)); }
  function updCard(i, patch) { setCards(cards.map((c,idx)=>idx===i?{...c,...patch}:c)); }
  function addInsumo(i) { updCard(i, { insumos:[...cards[i].insumos, {produto_id:'',quantidade:'',unidade_id:''}] }); }
  function removeInsumo(i, j) { updCard(i, { insumos: cards[i].insumos.filter((_,idx)=>idx!==j) }); }
  function updInsumo(i, j, k, v) { updCard(i, { insumos: cards[i].insumos.map((it,idx)=>idx===j?{...it,[k]:v}:it) }); }

  async function lancarTudo() {
    const validos = cards.filter(c => c.produto_id && c.quantidade && c.unidade_id && c.insumos.some(it=>it.produto_id && it.quantidade && it.unidade_id));
    if (validos.length === 0) return toast('Nenhuma produção válida','error');
    setLoading(true);
    let ok = 0, fail = 0;
    for (const c of validos) {
      try {
        await lancarUmaProducao(sb, { data, produto_saida_id: c.produto_id, quantidade: c.quantidade, unidade_saida_id: c.unidade_id, insumos: c.insumos.filter(it=>it.produto_id&&it.quantidade&&it.unidade_id) });
        ok++;
      } catch(e) { console.error(e); fail++; }
    }
    toast(`✅ ${ok} produções lançadas${fail>0?` · ${fail} falharam`:''}`, fail>0?'warn':'success');
    setCards([{ produto_id:'', quantidade:'', unidade_id:'', insumos:[{produto_id:'',quantidade:'',unidade_id:''}] }]);
    onSuccess && onSuccess();
    setLoading(false);
  }

  return (
    <div className="card">
      <div className="form-row">
        <div className="form-group"><label>Data (vale para todas)</label><input type="date" value={data} onChange={e=>setData(e.target.value)}/></div>
        <div></div>
      </div>
      {cards.map((c,i) => (
        <div className="card" style={{background:'var(--card-2)',marginBottom:10}} key={i}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div className="card-title" style={{margin:0}}>Produção #{i+1}</div>
            {cards.length > 1 && <button className="btn-icon" onClick={()=>removeCard(i)}>✕ remover</button>}
          </div>
          <div className="form-row-3">
            <div className="form-group"><label>Produto saída</label><SearchableDropdown value={c.produto_id} onChange={v=>updCard(i,{produto_id:v})} options={preparados} placeholder="Buscar..."/></div>
            <div className="form-group"><label>Qtd</label><input type="number" step="0.01" value={c.quantidade} onChange={e=>updCard(i,{quantidade:e.target.value})}/></div>
            <div className="form-group"><label>Un</label><SearchableDropdown value={c.unidade_id} onChange={v=>updCard(i,{unidade_id:v})} options={unidades.filter(u=>['kg','g','l','ml'].includes(u.codigo))} placeholder="Un..." getLabel={u=>u.nome}/></div>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
            <div className="card-title" style={{margin:0,fontSize:11}}>Insumos</div>
            <button className="btn btn-outline btn-sm" onClick={()=>addInsumo(i)}>+ insumo</button>
          </div>
          <div className="row-list">
            {c.insumos.map((it,j) => (
              <div className="row-item cols-3" key={j}>
                <SearchableDropdown value={it.produto_id} onChange={v=>updInsumo(i,j,'produto_id',v)} options={insumos} placeholder="Insumo..."/>
                <input type="number" step="0.001" value={it.quantidade} onChange={e=>updInsumo(i,j,'quantidade',e.target.value)} placeholder="Qtd"/>
                <SearchableDropdown value={it.unidade_id} onChange={v=>updInsumo(i,j,'unidade_id',v)} options={unidades} placeholder="Un" getLabel={u=>u.nome}/>
                <button className="btn-icon" onClick={()=>removeInsumo(i,j)}>✕</button>
              </div>
            ))}
          </div>
        </div>
      ))}
      <button className="btn btn-outline btn-block" onClick={addCard} style={{marginBottom:10}}>+ Adicionar produção</button>
      <button className="btn btn-success btn-lg btn-block" onClick={lancarTudo} disabled={loading}>{loading?'Registrando...':`Lançar ${cards.length} produções`}</button>
    </div>
  );
}

function ProducaoHistorico({ sb, preparados, insumosProdutos, unidades, toast, refreshKey }) {
  const [periodo, setPeriodo] = useState('mes');
  const [custom, setCustom] = useState({});
  const [rows, setRows] = useState([]);
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [insumos, setInsumos] = useState({});
  const [loading, setLoading] = useState(false);

  async function load() {
    setLoading(true);
    const { from, to } = periodToDates(periodo, custom);
    const { data } = await sb.from('producoes').select(`
      id, quantidade_produzida, quantidade_produzida_gramas, custo_total_producao, custo_unitario_grama, rendimento_percentual,
      produto_saida_id, produtos!producoes_produto_saida_id_fkey(nome),
      unidade_saida_id, unidades!producoes_unidade_saida_id_fkey(nome,codigo),
      movimentacao_id, movimentacoes!inner(data_movimentacao)
    `).gte('movimentacoes.data_movimentacao', from.toISOString()).lte('movimentacoes.data_movimentacao', to.toISOString()).order('movimentacao_id',{ascending:false}).limit(200);
    setRows(data||[]);
    setLoading(false);
  }
  useEffect(() => { load(); }, [periodo, custom, refreshKey]);

  async function excluirProducao(row) {
    try {
      const { error } = await sb.rpc('rpc_excluir_producao', { p_producao_id: row.id });
      if (error) throw error;
      toast('Producao excluida completamente','success');
      setConfirmDelete(null);
      load();
    } catch(e) {
      toast('Erro: '+e.message,'error');
    }
  }

  // Rendimento médio histórico por produto
  const rendMedio = useMemo(() => {
    const m = {};
    rows.forEach(r => { if (r.rendimento_percentual != null) { m[r.produto_saida_id] = m[r.produto_saida_id] || []; m[r.produto_saida_id].push(Number(r.rendimento_percentual)); } });
    const out = {};
    Object.entries(m).forEach(([k,arr]) => out[k] = arr.reduce((a,b)=>a+b,0)/arr.length);
    return out;
  }, [rows]);

  async function expandirProducao(id) {
    if (expanded === id) { setExpanded(null); return; }
    setExpanded(id);
    if (!insumos[id]) {
      const { data } = await sb.from('producao_insumos')
        .select('id,producao_id,produto_id,quantidade_usada,quantidade_gramas,unidade_id,custo_total,unidades(codigo,nome,fator_gramas),produtos(nome,tipo)')
        .eq('producao_id', id)
        .order('id');
      setInsumos(prev => ({...prev, [id]: data||[]}));
    }
  }

  return (
    <div className="card" style={{marginTop:18}}>
      <div className="card-title">📜 Histórico de produções</div>
      <DatePeriodFilter value={periodo} onChange={setPeriodo} custom={custom} onCustomChange={setCustom}/>
      <div className="table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Produto saída</th><th>Qtd</th><th>Custo total</th><th>Custo/g</th><th>Rend %</th><th>Rend médio</th><th></th></tr></thead>
          <tbody>
            {loading && <tr><td colSpan="8"><Skeleton rows={3}/></td></tr>}
            {!loading && rows.length === 0 && <tr><td colSpan="8" className="empty">Nenhuma produção no período</td></tr>}
            {!loading && rows.map(r => (
              <Fragment key={r.id}>
                <tr className="clickable" onClick={()=>expandirProducao(r.id)}>
                  <td className="muted">{fmtDate(r.movimentacoes?.data_movimentacao)}</td>
                  <td><b>{r.produtos?.nome}</b></td>
                  <td>{fmt(r.quantidade_produzida,2)} {r.unidades?.codigo}</td>
                  <td className="red">{fmtR$(r.custo_total_producao)}</td>
                  <td>R$ {fmt(r.custo_unitario_grama,4)}</td>
                  <td className={r.rendimento_percentual>=80?'green':r.rendimento_percentual>=60?'yellow':'red'}>{r.rendimento_percentual!=null?fmtPct(r.rendimento_percentual):'—'}</td>
                  <td className="muted">{rendMedio[r.produto_saida_id]!=null?fmtPct(rendMedio[r.produto_saida_id]):'—'}</td>
                  <td style={{display:'flex',gap:8,alignItems:'center'}}>
                    <EditRowButton onClick={()=>setEditing(r)}/>
                    <DeleteRowButton onClick={()=>setConfirmDelete(r)}/>
                    <span>{expanded===r.id?'▾':'▸'}</span>
                  </td>
                </tr>
                {expanded === r.id && insumos[r.id] && (
                  <tr className="expanded"><td colSpan="8">
                    <div style={{padding:'8px 0'}}>
                      <div style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'center',marginBottom:8}}>
                        <div className="card-title" style={{fontSize:11,margin:0}}>Insumos usados nesta producao</div>
                        <button className="btn btn-outline btn-sm" onClick={()=>setEditing(r)}>Editar / adicionar insumos</button>
                      </div>
                      <table style={{background:'transparent'}}>
                        <thead><tr><th>Insumo</th><th>Qtd lancada</th><th>Base</th><th>Custo</th></tr></thead>
                        <tbody>
                          {insumos[r.id].length === 0 && <tr><td colSpan="4" className="empty">Sem insumos vinculados</td></tr>}
                          {insumos[r.id].map((it,k) => (
                            <tr key={it.id||k}><td>{it.produtos?.nome}</td><td>{fmtFlex(it.quantidade_usada,3)} {it.unidades?.codigo||it.unidades?.nome||''}</td><td>{fmtG(it.quantidade_gramas)}</td><td>{fmtR$(it.custo_total)}</td></tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </td></tr>
                )}
              </Fragment>
            ))}
          </tbody>
        </table>
      </div>
      <EditProducaoModal open={!!editing} onClose={()=>setEditing(null)} row={editing} preparados={preparados} insumosProdutos={insumosProdutos} unidades={unidades} sb={sb} toast={toast} onSaved={async()=>{setInsumos({}); await load();}}/>
      <ConfirmModal
        open={!!confirmDelete}
        onClose={()=>setConfirmDelete(null)}
        onConfirm={()=>excluirProducao(confirmDelete)}
        title="Excluir producao"
        message={`Excluir a producao de "${confirmDelete?.produtos?.nome||''}"? Isso remove a entrada do preparado e devolve a visao do estoque como se essa producao nunca tivesse existido.`}
        danger
        requireText="EXCLUIR"
      />
    </div>
  );
}

function TelaVenda() {
  const sb = getClient();
  const toast = useToast();
  const [receitas, setReceitas] = useState([]);
  const [precos, setPrecos] = useState({});
  const [produtos, setProdutos] = useState([]);
  const [unidades, setUnidades] = useState([]);
  const [tab, setTab] = useState('unica');
  const [refreshHistKey, setRefreshHistKey] = useState(0);

  async function reload() {
    const [r, p, prod, un] = await Promise.all([
      sb.from('receitas_ficha_tecnica').select('id,nome').eq('ativo',true).order('nome'),
      sb.from('precos_venda').select('receita_id,canal,preco').eq('ativo',true),
      sb.from('produtos').select('id,nome,tipo,unidade_id,unidades(codigo,nome,fator_gramas)').eq('ativo',true).order('nome'),
      sb.from('unidades').select('id,codigo,nome,fator_gramas').order('nome'),
    ]);
    setReceitas(r.data||[]);
    setProdutos(prod.data||[]);
    setUnidades(un.data||[]);
    const m = {}; (p.data||[]).forEach(x => { (m[x.receita_id]=m[x.receita_id]||{})[x.canal] = Number(x.preco); });
    setPrecos(m);
  }
  useEffect(() => { reload(); }, []);

  return (
    <div className="content">
      <div className="section-header"><div className="section-title">💰 Lançar Venda</div></div>
      <div className="tabs">
        <button className={`tab${tab==='unica'?' active':''}`} onClick={()=>setTab('unica')}>Venda unica</button>
        <button className={`tab${tab==='lote'?' active':''}`} onClick={()=>setTab('lote')}>Vendas em massa</button>
      </div>
      {tab === 'unica' && <VendaForm receitas={receitas} precos={precos} produtos={produtos} unidades={unidades} sb={sb} toast={toast} onSuccess={()=>setRefreshHistKey(k=>k+1)}/>}
      {tab === 'lote' && <VendaLote receitas={receitas} precos={precos} produtos={produtos} unidades={unidades} sb={sb} toast={toast} onSuccess={()=>setRefreshHistKey(k=>k+1)}/>}
      <VendaHistorico sb={sb} receitas={receitas} precos={precos} produtos={produtos} unidades={unidades} toast={toast} refreshKey={refreshHistKey}/>
    </div>
  );
}

function LegacyVendaForm({ receitas, precos, sb, toast, onSuccess }) {
  const [data, setData] = useState(todayISO());
  const [canal, setCanal] = useState('ifood');
  const [desconto, setDesconto] = useState('0');
  const [itens, setItens] = useState([{ receita_id:'', quantidade:'1', valor_unitario:'' }]);
  const [loading, setLoading] = useState(false);

  function add() { setItens([...itens, { receita_id:'', quantidade:'1', valor_unitario:'' }]); }
  function remove(i) { setItens(itens.filter((_,idx)=>idx!==i)); }
  function upd(i, k, v) {
    setItens(itens.map((it,idx) => {
      if (idx !== i) return it;
      const next = {...it, [k]:v};
      if (k === 'receita_id' && precos[v]) next.valor_unitario = String(precos[v][canal] || precos[v]['ifood'] || '');
      return next;
    }));
  }
  // Atualiza preços automaticamente quando muda canal
  useEffect(() => {
    setItens(prev => prev.map(it => {
      if (!it.receita_id || !precos[it.receita_id]) return it;
      return { ...it, valor_unitario: String(precos[it.receita_id][canal] || precos[it.receita_id]['ifood'] || it.valor_unitario || '') };
    }));
  }, [canal]);

  const bruto = sumBy(itens, it => (parseDecimal(it.valor_unitario)||0) * (parseDecimal(it.quantidade)||0));
  const liquido = bruto - (parseDecimal(desconto)||0);

  async function lancar() {
    const validos = itens.filter(it => it.receita_id && it.quantidade && it.valor_unitario);
    if (validos.length === 0) return toast('Adicione ao menos um prato','error');
    setLoading(true);
    try {
      const { data: res, error } = await sb.rpc('rpc_lancar_venda', {
        p_data_movimentacao: dateInputToIso(data),
        p_canal_venda: canal,
        p_desconto_plataforma: parseDecimal(desconto)||0,
        p_itens: validos.map(it => ({
          receita_id: it.receita_id,
          quantidade: parseDecimal(it.quantidade),
          valor_unitario: parseDecimal(it.valor_unitario)
        }))
      });
      if (error) throw error;
      toast(`✅ Venda ${CANAL_LABEL[canal]}: Bruto ${fmtR$(res?.valor_bruto||bruto)} · Líq ${fmtR$(res?.valor_liquido||liquido)} · CMV ${fmtR$(res?.cmv_total||0)}`,'success');
      setItens([{ receita_id:'', quantidade:'1', valor_unitario:'' }]);
      setDesconto('0');
      onSuccess && onSuccess();
    } catch(e) { toast('Erro: '+e.message,'error'); }
    setLoading(false);
  }

  return (
    <div className="card">
      <div className="form-row-3">
        <div className="form-group"><label>Data</label><input type="date" value={data} onChange={e=>setData(e.target.value)}/></div>
        <div className="form-group">
          <label>Canal</label>
          <select value={canal} onChange={e=>setCanal(e.target.value)}>
            {Object.entries(CANAL_LABEL).map(([v,l])=><option key={v} value={v}>{l}</option>)}
          </select>
        </div>
        <div className="form-group"><label>Desconto plataforma (R$)</label><input type="number" step="0.01" value={desconto} onChange={e=>setDesconto(e.target.value)}/></div>
      </div>
      <div className="divider"/>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <div className="card-title" style={{margin:0}}>Pratos vendidos</div>
        <button className="btn btn-outline btn-sm" onClick={add}>+ Adicionar prato</button>
      </div>
      <div className="row-list">
        {itens.map((it,i) => (
          <div className="row-item cols-3" key={i}>
            <SearchableDropdown value={it.receita_id} onChange={v=>upd(i,'receita_id',v)} options={receitas} placeholder="Buscar prato..."/>
            <input type="number" step="1" value={it.quantidade} onChange={e=>upd(i,'quantidade',e.target.value)} placeholder="Qtd"/>
            <input type="number" step="0.01" value={it.valor_unitario} onChange={e=>upd(i,'valor_unitario',e.target.value)} placeholder="R$ unit."/>
            <button className="btn-icon" onClick={()=>remove(i)}>✕</button>
          </div>
        ))}
      </div>
      <div className="preview-line" style={{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>

function LegacyVendaFormAtual({ receitas, precos, sb, toast, onSuccess }) {
  const [data, setData] = useState(todayISO());
  const [canal, setCanal] = useState('ifood');
  const [desconto, setDesconto] = useState('0');
  const [itens, setItens] = useState([novoItemVenda()]);
  const [loading, setLoading] = useState(false);

  function add() { setItens([...itens, novoItemVenda()]); }
  function remove(i) { setItens(itens.length > 1 ? itens.filter((_,idx)=>idx!==i) : [novoItemVenda()]); }
  function upd(i, k, v) {
    setItens(itens.map((it,idx) => {
      if (idx !== i) return it;
      const next = {...it, [k]:v};
      if (k === 'receita_id') next.valor_unitario = precoReceitaCanal(precos, v, canal);
      return next;
    }));
  }
  function addOpcional(i) {
    setItens(itens.map((it,idx)=>idx===i?{...it,adicionais:[...(it.adicionais||[]), novoOpcionalVenda()]}:it));
  }
  function removeOpcional(i,j) {
    setItens(itens.map((it,idx)=>idx===i?{...it,adicionais:(it.adicionais||[]).filter((_,k)=>k!==j)}:it));
  }
  function updOpcional(i,j,k,v) {
    setItens(itens.map((it,idx) => {
      if (idx !== i) return it;
      const adicionais = (it.adicionais||[]).map((ad,kidx) => {
        if (kidx !== j) return ad;
        const next = {...ad, [k]:v};
        if (k === 'receita_id') next.valor_unitario = next.tipo_item === 'cortesia' ? '0' : precoReceitaCanal(precos, v, canal);
        if (k === 'tipo_item' && v === 'cortesia') next.valor_unitario = '0';
        if (k === 'tipo_item' && v === 'adicional' && next.receita_id && !next.valor_unitario) next.valor_unitario = precoReceitaCanal(precos, next.receita_id, canal);
        return next;
      });
      return {...it, adicionais};
    }));
  }

  useEffect(() => {
    setItens(prev => prev.map(it => ({
      ...it,
      valor_unitario: it.receita_id ? (precoReceitaCanal(precos, it.receita_id, canal) || it.valor_unitario || '') : it.valor_unitario,
      adicionais:(it.adicionais||[]).map(ad => ({
        ...ad,
        valor_unitario: ad.tipo_item === 'cortesia' ? '0' : (ad.receita_id ? (precoReceitaCanal(precos, ad.receita_id, canal) || ad.valor_unitario || '') : ad.valor_unitario)
      }))
    })));
  }, [canal]);

  const bruto = sumBy(itens, it => vendaItemValorTotal(it) + sumBy(it.adicionais||[], vendaItemValorTotal));
  const liquido = bruto - (parseDecimal(desconto)||0);

  function buildPayload() {
    const out = [];
    itens.forEach((it,i) => {
      if (!it.receita_id || !(parseDecimal(it.quantidade) > 0) || it.valor_unitario === '') return;
      const ref = `p${i}`;
      out.push({
        ref,
        receita_id: it.receita_id,
        quantidade: parseDecimal(it.quantidade),
        valor_unitario: parseDecimal(it.valor_unitario),
        tipo_item: 'principal',
        peso_real_gramas: pesoRealPayload(it.peso_real_gramas),
        observacoes: it.observacoes || null
      });
      (it.adicionais||[]).forEach((ad,j) => {
        if (!ad.receita_id || !(parseDecimal(ad.quantidade) > 0)) return;
        if (ad.tipo_item !== 'cortesia' && ad.valor_unitario === '') return;
        out.push({
          ref: `a${i}_${j}`,
          parent_ref: ref,
          receita_id: ad.receita_id,
          quantidade: parseDecimal(ad.quantidade),
          valor_unitario: ad.tipo_item === 'cortesia' ? 0 : parseDecimal(ad.valor_unitario),
          tipo_item: ad.tipo_item || 'adicional',
          peso_real_gramas: pesoRealPayload(ad.peso_real_gramas),
          observacoes: ad.observacoes || null
        });
      });
    });
    return out;
  }

  async function lancar() {
    const validos = buildPayload();
    if (validos.filter(x => x.tipo_item === 'principal').length === 0) return toast('Adicione ao menos um prato principal','error');
    setLoading(true);
    try {
      const { data: res, error } = await sb.rpc('rpc_lancar_venda', {
        p_data_movimentacao: dateInputToIso(data),
        p_canal_venda: canal,
        p_desconto_plataforma: parseDecimal(desconto)||0,
        p_itens: validos
      });
      if (error) throw error;
      toast(`Venda ${CANAL_LABEL[canal]}: Bruto ${fmtR$(res?.valor_bruto||bruto)} - Liq ${fmtR$(res?.valor_liquido||liquido)} - CMV ${fmtR$(res?.cmv_total||0)}`,'success');
      setItens([novoItemVenda()]);
      setDesconto('0');
      onSuccess && onSuccess();
    } catch(e) { toast('Erro: '+e.message,'error'); }
    setLoading(false);
  }

  return (
    <div className="card">
      <div className="form-row-3">
        <div className="form-group"><label>Data</label><input type="date" value={data} onChange={e=>setData(e.target.value)}/></div>
        <div className="form-group">
          <label>Canal</label>
          <select value={canal} onChange={e=>setCanal(e.target.value)}>
            {Object.entries(CANAL_LABEL).map(([v,l])=><option key={v} value={v}>{l}</option>)}
          </select>
        </div>
        <div className="form-group"><label>Desconto plataforma (R$)</label><input type="number" step="0.01" value={desconto} onChange={e=>setDesconto(e.target.value)}/></div>
      </div>
      <div className="divider"/>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <div className="card-title" style={{margin:0}}>Pratos vendidos</div>
        <button className="btn btn-outline btn-sm" onClick={add}>+ Adicionar prato</button>
      </div>
      <div className="row-list">
        {itens.map((it,i) => (
          <div key={i} style={{padding:12,borderBottom:i===itens.length-1?'none':'1px solid var(--border)'}}>
            <div className="row-item" style={{gridTemplateColumns:'minmax(180px,2fr) 80px 120px 120px auto',padding:0,borderBottom:'none'}}>
              <SearchableDropdown value={it.receita_id} onChange={v=>upd(i,'receita_id',v)} options={receitas} placeholder="Buscar prato..."/>
              <input type="number" step="1" value={it.quantidade} onChange={e=>upd(i,'quantidade',e.target.value)} placeholder="Qtd"/>
              <input type="number" step="0.01" value={it.valor_unitario} onChange={e=>upd(i,'valor_unitario',e.target.value)} placeholder="R$ unit."/>
              <input type="number" step="1" value={it.peso_real_gramas} onChange={e=>upd(i,'peso_real_gramas',e.target.value)} placeholder="Peso g"/>
              <button className="btn-icon" onClick={()=>remove(i)}>x</button>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:8,gap:8}}>
              <input value={it.observacoes||''} onChange={e=>upd(i,'observacoes',e.target.value)} placeholder="Observacao opcional do prato" style={{minHeight:34,padding:'6px 10px'}}/>
              <button className="btn btn-outline btn-sm" onClick={()=>addOpcional(i)}>+ Adicional</button>
            </div>
            {(it.adicionais||[]).length > 0 && (
              <div className="row-list" style={{marginTop:8,marginBottom:0}}>
                {(it.adicionais||[]).map((ad,j) => {
                  const cortesia = ad.tipo_item === 'cortesia';
                  return (
                    <div className="row-item" key={j} style={{gridTemplateColumns:'120px minmax(160px,2fr) 70px 110px 110px auto'}}>
                      <select value={ad.tipo_item} onChange={e=>updOpcional(i,j,'tipo_item',e.target.value)}>
                        <option value="adicional">Adicional</option>
                        <option value="cortesia">Cortesia</option>
                      </select>
                      <SearchableDropdown value={ad.receita_id} onChange={v=>updOpcional(i,j,'receita_id',v)} options={receitas} placeholder="Opcional..."/>
                      <input type="number" step="1" value={ad.quantidade} onChange={e=>updOpcional(i,j,'quantidade',e.target.value)} placeholder="Qtd"/>
                      <input type="number" step="0.01" value={cortesia?'0':ad.valor_unitario} disabled={cortesia} onChange={e=>updOpcional(i,j,'valor_unitario',e.target.value)} placeholder="R$"/>
                      <input type="number" step="1" value={ad.peso_real_gramas} onChange={e=>updOpcional(i,j,'peso_real_gramas',e.target.value)} placeholder="Peso g"/>
                      <button className="btn-icon" onClick={()=>removeOpcional(i,j)}>x</button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        ))}
      </div>
      <div className="preview-line" style={{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
        <span>Bruto: <b className="green">{fmtR$(bruto)}</b></span>
        <span>Desconto: <b className="red">{fmtR$(parseDecimal(desconto)||0)}</b></span>
        <span>Liquido: <b className="blue">{fmtR$(liquido)}</b></span>
      </div>
      <button className="btn btn-success btn-lg btn-block" onClick={lancar} disabled={loading}>{loading?'Registrando...':'Lancar Venda'}</button>
    </div>
  );
}

                      <input type="number" step="1" value={ad.quantidade} onChange={e=>updOpcional(i,j,'quantidade',e.target.value)} placeholder="Qtd"/>
                      <input type="number" step="0.01" value={cortesia?'0':ad.valor_unitario} disabled={cortesia} onChange={e=>updOpcional(i,j,'valor_unitario',e.target.value)} placeholder="R$"/>
                      <input type="number" step="1" value={ad.peso_real_gramas} onChange={e=>updOpcional(i,j,'peso_real_gramas',e.target.value)} placeholder="Peso g"/>
                      <button className="btn-icon" onClick={()=>removeOpcional(i,j)}>x</button>
                    </div>
                  );
                })}
              </div>
            )}
            {(it.custos_extras||[]).length > 0 && (
              <div className="row-list" style={{marginTop:8,marginBottom:0}}>
                {(it.custos_extras||[]).map((ce,j) => (
                  <div className="row-item" key={j} style={{gridTemplateColumns:'minmax(170px,2fr) 90px 120px minmax(120px,1fr) auto'}}>
                    <SearchableDropdown value={ce.produto_id} onChange={v=>updCustoExtra(i,j,'produto_id',v)} options={produtos} placeholder="Produto extra..." renderOption={p=><div>{p.nome} <span className="muted">({TIPO_LABEL[p.tipo]||p.tipo})</span></div>}/>
                    <input type="number" step="0.001" value={ce.quantidade} onChange={e=>updCustoExtra(i,j,'quantidade',e.target.value)} placeholder="Qtd"/>
                    <SearchableDropdown value={ce.unidade_id} onChange={v=>updCustoExtra(i,j,'unidade_id',v)} options={unidades} placeholder="Un" getLabel={u=>`${u.nome} (${u.codigo})`}/>
                    <input value={ce.observacoes||''} onChange={e=>updCustoExtra(i,j,'observacoes',e.target.value)} placeholder="Erro/obs"/>
                    <button className="btn-icon" onClick={()=>removeCustoExtra(i,j)}>x</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>
      <div className="preview-line" style={{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
        <span>Bruto: <b className="green">{fmtR$(bruto)}</b></span>
        <span>Descontos: <b className="red">{fmtR$(totalDescontos)}</b></span>
        <span>Liquido: <b className="blue">{fmtR$(liquido)}</b></span>
      </div>
      <button className="btn btn-success btn-lg btn-block" onClick={lancar} disabled={loading}>{loading?'Registrando...':'Lancar Venda'}</button>
      <ConfirmModal
        open={!!confirmPayload}
        onClose={()=>setConfirmPayload(null)}
        onConfirm={()=>lancarConfirmado(confirmPayload)}
        title="Confirmar venda"
        message="Esta correto? Adicionou tudo que precisava nesta venda?"
      >
        <div className="table-wrap" style={{marginBottom:12}}>
          <table>
            <thead><tr><th>Item</th><th>Tipo</th><th>Qtd</th><th>Valor</th><th>Extras diretos</th></tr></thead>
            <tbody>
              {(confirmPayload||[]).map((it,i) => (
                <tr key={i}>
                  <td><b>{receitaNome(it.receita_id)}</b>{it.peso_real_gramas && <div className="muted" style={{fontSize:11}}>Peso real: {fmt(it.peso_real_gramas,0)}g</div>}</td>
                  <td><span className={`badge badge-${it.tipo_item==='cortesia'?'yellow':it.tipo_item==='adicional'?'green':'blue'}`}>{it.tipo_item==='cortesia'?'Cortesia':it.tipo_item==='adicional'?'Adicional':'Principal'}</span></td>
                  <td>{fmt(it.quantidade,2)}</td>
                  <td className={it.tipo_item==='cortesia'?'yellow':'green'}>{fmtR$(Number(it.valor_unitario||0) * Number(it.quantidade||0))}</td>
                  <td>{(it.custos_extras||[]).length === 0 ? <span className="muted">--</span> : (it.custos_extras||[]).map((ce,j)=><div key={j} className="red">{produtoNome(ce.produto_id)}: {fmt(ce.quantidade,3)} {unidadeLabel(ce.unidade_id)}</div>)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="preview-line" style={{display:'flex',justifyContent:'space-between',gap:10,flexWrap:'wrap'}}>
          <span>Bruto: <b className="green">{fmtR$(bruto)}</b></span>
          <span>Descontos: <b className="red">{fmtR$(totalDescontos)}</b></span>
          <span>Liquido: <b className="blue">{fmtR$(liquido)}</b></span>
        </div>
      </ConfirmModal>
    </div>
  );
}

function novoPedidoLote() {
  return {
    numero_pedido:'',
    data:'',
    canal:'ifood',
    descontos:[
      { tipo_desconto:'comissao_ifood', valor:'', observacoes:'' },
      { tipo_desconto:'promocao',       valor:'', observacoes:'' }
    ],
    itens:[novoItemVenda()]
  };
}

function VendaLote({ receitas, precos, produtos, unidades, sb, toast, onSuccess }) {
  const [pedidos, setPedidos] = useState([novoPedidoLote()]);
  const [confirmPayload, setConfirmPayload] = useState(null);
  const [loading, setLoading] = useState(false);

  function receitaNome(id) { return receitas.find(r=>r.id===id)?.nome || 'Item'; }
  function produtoNome(id) { return produtos.find(p=>p.id===id)?.nome || 'Produto'; }
  function unidadeLabel(id) { const u = unidades.find(x=>x.id===id); return u ? (u.codigo || u.nome) : ''; }

  function addPedido() { setPedidos([...pedidos, novoPedidoLote()]); }
  function removePedido(pi) { setPedidos(pedidos.length > 1 ? pedidos.filter((_,idx)=>idx!==pi) : [novoPedidoLote()]); }
  function updPedido(pi, k, v) {
    setPedidos(pedidos.map((p,idx) => {
      if (idx !== pi) return p;
      const next = {...p, [k]:v};
      // Quando muda o canal, recalcula preco unitario de cada prato e adicional do pedido
      if (k === 'canal') {
        next.itens = (p.itens||[]).map(it => ({
          ...it,
          valor_unitario: it.receita_id ? (precoReceitaCanal(precos, it.receita_id, v) || it.valor_unitario || '') : it.valor_unitario,
          adicionais: (it.adicionais||[]).map(ad => ({
            ...ad,
            valor_unitario: ad.tipo_item === 'cortesia' ? '0' : (ad.receita_id ? (precoReceitaCanal(precos, ad.receita_id, v) || ad.valor_unitario || '') : ad.valor_unitario)
          }))
        }));
      }
      return next;
    }));
  }

  function addItem(pi) { setPedidos(pedidos.map((p,idx)=>idx===pi?{...p,itens:[...(p.itens||[]), novoItemVenda()]}:p)); }
  function removeItem(pi, ii) { setPedidos(pedidos.map((p,idx)=>idx===pi?{...p,itens:(p.itens.length>1?p.itens.filter((_,j)=>j!==ii):[novoItemVenda()])}:p)); }
  function updItem(pi, ii, k, v) {
    setPedidos(pedidos.map((p,idx) => {
      if (idx !== pi) return p;
      return {...p, itens:(p.itens||[]).map((it,j) => {
        if (j !== ii) return it;
        const next = {...it, [k]:v};
        if (k === 'receita_id') next.valor_unitario = precoReceitaCanal(precos, v, p.canal);
        return next;
      })};
    }));
  }
  function addAdicional(pi, ii) {
    setPedidos(pedidos.map((p,idx)=>idx===pi?{...p,itens:p.itens.map((it,j)=>j===ii?{...it,adicionais:[...(it.adicionais||[]), novoOpcionalVenda()]}:it)}:p));
  }
  function removeAdicional(pi, ii, ai) {
    setPedidos(pedidos.map((p,idx)=>idx===pi?{...p,itens:p.itens.map((it,j)=>j===ii?{...it,adicionais:(it.adicionais||[]).filter((_,k)=>k!==ai)}:it)}:p));
  }
  function updAdicional(pi, ii, ai, k, v) {
    setPedidos(pedidos.map((p,idx) => {
      if (idx !== pi) return p;
      return {...p, itens:p.itens.map((it,j) => {
        if (j !== ii) return it;
        const adicionais = (it.adicionais||[]).map((ad,k2) => {
          if (k2 !== ai) return ad;
          const next = {...ad, [k]:v};
          if (k === 'receita_id') next.valor_unitario = next.tipo_item === 'cortesia' ? '0' : precoReceitaCanal(precos, v, p.canal);
          if (k === 'tipo_item' && v === 'cortesia') next.valor_unitario = '0';
          if (k === 'tipo_item' && v === 'adicional' && next.receita_id && !next.valor_unitario) next.valor_unitario = precoReceitaCanal(precos, next.receita_id, p.canal);
          return next;
        });
        return {...it, adicionais};
      })};
    }));
  }
  function addCustoExtra(pi, ii) {
    setPedidos(pedidos.map((p,idx)=>idx===pi?{...p,itens:p.itens.map((it,j)=>j===ii?{...it,custos_extras:[...(it.custos_extras||[]), novoCustoExtraVenda()]}:it)}:p));
  }
  function removeCustoExtra(pi, ii, ci) {
    setPedidos(pedidos.map((p,idx)=>idx===pi?{...p,itens:p.itens.map((it,j)=>j===ii?{...it,custos_extras:(it.custos_extras||[]).filter((_,k)=>k!==ci)}:it)}:p));
  }
  function updCustoExtra(pi, ii, ci, k, v) {
    setPedidos(pedidos.map((p,idx) => {
      if (idx !== pi) return p;
      return {...p, itens:p.itens.map((it,j) => {
        if (j !== ii) return it;
        const custos_extras = (it.custos_extras||[]).map((ce,k2) => {
          if (k2 !== ci) return ce;
          const next = {...ce, [k]:v};
          if (k === 'produto_id') { const prod = produtos.find(x=>x.id===v); if (prod?.unidade_id) next.unidade_id = prod.unidade_id; }
          return next;
        });
        return {...it, custos_extras};
      })};
    }));
  }

  function addDesconto(pi) { setPedidos(pedidos.map((p,idx)=>idx===pi?{...p,descontos:[...(p.descontos||[]), novoDescontoVenda()]}:p)); }
  function updDesconto(pi, di, k, v) { setPedidos(pedidos.map((p,idx)=>idx===pi?{...p,descontos:(p.descontos||[]).map((d,j)=>j===di?{...d,[k]:v}:d)}:p)); }
  function removeDesconto(pi, di) { setPedidos(pedidos.map((p,idx)=>idx===pi?{...p,descontos:(p.descontos||[]).filter((_,j)=>j!==di)}:p)); }

  function custosExtrasPayload(it) {
    return (it.custos_extras||[])
      .filter(ce => ce.produto_id && ce.unidade_id && parseDecimal(ce.quantidade) > 0)
      .map(ce => ({ produto_id:ce.produto_id, quantidade:parseDecimal(ce.quantidade), unidade_id:ce.unidade_id, observacoes:ce.observacoes||null }));
  }

  function pedidoItensPayload(pedido) {
    const out = [];
    (pedido.itens||[]).forEach((it,i) => {
      if (!it.receita_id || !(parseDecimal(it.quantidade) > 0) || it.valor_unitario === '') return;
      const ref = `p${i}`;
      out.push({
        ref, receita_id:it.receita_id, quantidade:parseDecimal(it.quantidade),
        valor_unitario:parseDecimal(it.valor_unitario), tipo_item:'principal',
        peso_real_gramas:pesoRealPayload(it.peso_real_gramas),
        observacoes:it.observacoes||null,
        custos_extras:custosExtrasPayload(it)
      });
      (it.adicionais||[]).forEach((ad,j) => {
        if (!ad.receita_id || !(parseDecimal(ad.quantidade) > 0)) return;
        if (ad.tipo_item !== 'cortesia' && ad.valor_unitario === '') return;
        out.push({
          ref:`a${i}_${j}`, parent_ref:ref, receita_id:ad.receita_id,
          quantidade:parseDecimal(ad.quantidade),
          valor_unitario:ad.tipo_item === 'cortesia' ? 0 : parseDecimal(ad.valor_unitario),
          tipo_item:ad.tipo_item || 'adicional',
          peso_real_gramas:pesoRealPayload(ad.peso_real_gramas),
          observacoes:ad.observacoes||null
        });
      });
    });
    return out;
  }

  function buildPayload() {
    return pedidos.map(pedido => {
      const itensPayload = pedidoItensPayload(pedido);
      const principais = itensPayload.filter(x => x.tipo_item === 'principal');
      if (principais.length === 0) return null;
      return {
        numero_pedido: (pedido.numero_pedido||'').trim() || null,
        data_movimentacao: dateInputToIso(pedido.data),
        canal_venda: pedido.canal,
        itens: itensPayload,
        descontos: descontosPayload(pedido.descontos)
      };
    }).filter(Boolean);
  }

  function pedidoBruto(p) { return sumBy(p.itens||[], it => vendaItemValorTotal(it) + sumBy(it.adicionais||[], vendaItemValorTotal)); }
  function pedidoDescontos(p) { return descontoTotal(p.descontos); }
  function pedidoCountPratos(p) { return (p.itens||[]).filter(it => it.receita_id && parseDecimal(it.quantidade) > 0).length; }
  function pedidoTemPrato(p) { return (p.itens||[]).some(it => it.receita_id && parseDecimal(it.quantidade) > 0 && it.valor_unitario !== ''); }

  function confirmar() {
    // valida data e numero_pedido obrigatorios nos pedidos que ja tem prato
    for (let i = 0; i < pedidos.length; i++) {
      if (pedidoTemPrato(pedidos[i])) {
        if (!pedidos[i].data) return toast(`Preencha a data do Pedido #${i+1}`,'error');
        if (!pedidos[i].numero_pedido || !pedidos[i].numero_pedido.trim()) return toast(`Preencha o nº do pedido do Pedido #${i+1}`,'error');
      }
    }
    const payload = buildPayload();
    if (payload.length === 0) return toast('Adicione ao menos um pedido com prato principal','error');
    setConfirmPayload(payload);
  }
  async function lancarConfirmado(payload) {
    setLoading(true);
    try {
      const { data: res, error } = await sb.rpc('rpc_lancar_vendas_lote_v1', { p_vendas: payload || confirmPayload || [] });
      if (error) throw error;
      toast(`Lote registrado: ${res?.vendas||0} pedido(s), liquido ${fmtR$(res?.valor_liquido||0)}`,'success');
      setPedidos([novoPedidoLote()]);
      setConfirmPayload(null);
      onSuccess && onSuccess();
    } catch(e) { toast('Erro: '+e.message,'error'); }
    setLoading(false);
  }

  const validos = buildPayload();
  const totalBruto = sumBy(pedidos, pedidoBruto);
  const totalDescontos = sumBy(pedidos, pedidoDescontos);
  const totalLiquido = Math.max(0, totalBruto - totalDescontos);
  const totalPratos = validos.reduce((acc,v)=>acc + v.itens.filter(x=>x.tipo_item==='principal').length, 0);

  return (
    <div>
      {pedidos.map((p,pi) => {
        const bruto = pedidoBruto(p);
        const desc = pedidoDescontos(p);
        const liq = Math.max(0, bruto - desc);
        return (
          <div className="card" key={pi} style={{marginBottom:14}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:10}}>
              <div className="card-title" style={{margin:0}}>📦 Pedido #{pi+1}{p.numero_pedido && <span className={`muted`} style={{fontWeight:500,marginLeft:8}}>— <span className={CANAL_COR[p.canal]||''}>{CANAL_LABEL[p.canal]||p.canal} #{p.numero_pedido}</span></span>}</div>
              <button className="btn btn-outline btn-sm" onClick={()=>removePedido(pi)} title="Remover pedido">x Remover</button>
            </div>

            <div style={{display:'grid',gridTemplateColumns:'1.2fr 1fr 1fr 0.8fr',gap:10,marginBottom:10}}>
              <div className="form-group">
                <label>Nº do pedido <span className="red">*</span></label>
                <input value={p.numero_pedido} onChange={e=>updPedido(pi,'numero_pedido',e.target.value)} placeholder="ex: 4523" style={!p.numero_pedido && pedidoTemPrato(p) ? {borderColor:'var(--red)'} : {}}/>
              </div>
              <div className="form-group">
                <label>Data <span className="red">*</span></label>
                <input type="date" value={p.data} onChange={e=>updPedido(pi,'data',e.target.value)} style={!p.data && pedidoTemPrato(p) ? {borderColor:'var(--red)'} : {}}/>
              </div>
              <div className="form-group">
                <label>Canal</label>
                <select value={p.canal} onChange={e=>updPedido(pi,'canal',e.target.value)}>
                  {Object.entries(CANAL_LABEL).map(([v,l])=><option key={v} value={v}>{l}</option>)}
                </select>
              </div>
              <div className="form-group"><label>% desconto</label><input value={fmtPct(bruto > 0 ? (desc/bruto)*100 : 0)} readOnly/></div>
            </div>

            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <div className="card-title" style={{margin:0}}>Pratos do pedido</div>
              <button className="btn btn-outline btn-sm" onClick={()=>addItem(pi)}>+ Adicionar prato</button>
            </div>
            <div className="row-list">
              {p.itens.map((it,ii) => (
                <div key={ii} style={{padding:12,borderBottom:ii===p.itens.length-1?'none':'1px solid var(--border)'}}>
                  <div className="row-item" style={{gridTemplateColumns:'minmax(180px,2fr) 80px 120px 120px auto',padding:0,borderBottom:'none'}}>
                    <SearchableDropdown value={it.receita_id} onChange={v=>updItem(pi,ii,'receita_id',v)} options={receitas} placeholder="Buscar prato..."/>
                    <input type="number" step="1" value={it.quantidade} onChange={e=>updItem(pi,ii,'quantidade',e.target.value)} placeholder="Qtd"/>
                    <input type="number" step="0.01" value={it.valor_unitario} onChange={e=>updItem(pi,ii,'valor_unitario',e.target.value)} placeholder="R$ unit."/>
                    <input type="number" step="1" value={it.peso_real_gramas} onChange={e=>updItem(pi,ii,'peso_real_gramas',e.target.value)} placeholder="Peso g"/>
                    <button className="btn-icon" onClick={()=>removeItem(pi,ii)}>x</button>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:8,gap:8}}>
                    <input value={it.observacoes||''} onChange={e=>updItem(pi,ii,'observacoes',e.target.value)} placeholder="Observacao opcional do prato" style={{minHeight:34,padding:'6px 10px'}}/>
                    <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                      <button className="btn btn-outline btn-sm" onClick={()=>addAdicional(pi,ii)}>+ Adicional</button>
                      <button className="btn btn-outline btn-sm" onClick={()=>addCustoExtra(pi,ii)}>+ Erro/custo</button>
                    </div>
                  </div>
                  {(it.adicionais||[]).length > 0 && (
                    <div className="row-list" style={{marginTop:8,marginBottom:0}}>
                      {(it.adicionais||[]).map((ad,ai) => {
                        const cortesia = ad.tipo_item === 'cortesia';
                        return (
                          <div className="row-item" key={ai} style={{gridTemplateColumns:'120px minmax(160px,2fr) 70px 110px 110px auto'}}>
                            <select value={ad.tipo_item} onChange={e=>updAdicional(pi,ii,ai,'tipo_item',e.target.value)}>
                              <option value="adicional">Adicional</option>
                              <option value="cortesia">Cortesia</option>
                            </select>
                            <SearchableDropdown value={ad.receita_id} onChange={v=>updAdicional(pi,ii,ai,'receita_id',v)} options={receitas} placeholder="Opcional..."/>
                            <input type="number" step="1" value={ad.quantidade} onChange={e=>updAdicional(pi,ii,ai,'quantidade',e.target.value)} placeholder="Qtd"/>
                            <input type="number" step="0.01" value={cortesia?'0':ad.valor_unitario} disabled={cortesia} onChange={e=>updAdicional(pi,ii,ai,'valor_unitario',e.target.value)} placeholder="R$"/>
                            <input type="number" step="1" value={ad.peso_real_gramas} onChange={e=>updAdicional(pi,ii,ai,'peso_real_gramas',e.target.value)} placeholder="Peso g"/>
                            <button className="btn-icon" onClick={()=>removeAdicional(pi,ii,ai)}>x</button>
                          </div>
                        );
                      })}
                    </div>
                  )}
                  {(it.custos_extras||[]).length > 0 && (
                    <div className="row-list" style={{marginTop:8,marginBottom:0}}>
                      {(it.custos_extras||[]).map((ce,ci) => (
                        <div className="row-item" key={ci} style={{gridTemplateColumns:'minmax(170px,2fr) 90px 120px minmax(120px,1fr) auto'}}>
                          <SearchableDropdown value={ce.produto_id} onChange={v=>updCustoExtra(pi,ii,ci,'produto_id',v)} options={produtos} placeholder="Produto extra..." renderOption={prod=><div>{prod.nome} <span className="muted">({TIPO_LABEL[prod.tipo]||prod.tipo})</span></div>}/>
                          <input type="number" step="0.001" value={ce.quantidade} onChange={e=>updCustoExtra(pi,ii,ci,'quantidade',e.target.value)} placeholder="Qtd"/>
                          <SearchableDropdown value={ce.unidade_id} onChange={v=>updCustoExtra(pi,ii,ci,'unidade_id',v)} options={unidades} placeholder="Un" getLabel={u=>`${u.nome} (${u.codigo})`}/>
                          <input value={ce.observacoes||''} onChange={e=>updCustoExtra(pi,ii,ci,'observacoes',e.target.value)} placeholder="Erro/obs"/>
                          <button className="btn-icon" onClick={()=>removeCustoExtra(pi,ii,ci)}>x</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>

            <div className="card" style={{background:'var(--card-2)',padding:12,marginTop:10,marginBottom:10}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:8}}>
                <div className="card-title" style={{margin:0}}>Descontos do pedido</div>
                <button className="btn btn-outline btn-sm" onClick={()=>addDesconto(pi)}>+ Desconto</button>
              </div>
              {(p.descontos||[]).length === 0 && <div className="muted" style={{fontSize:12}}>Sem taxa, comissao ou promocao neste pedido.</div>}
              {(p.descontos||[]).map((d,di) => (
                <div className="row-item" key={di} style={{display:'grid',gridTemplateColumns:'minmax(160px,1.4fr) 120px minmax(140px,1fr) auto',gap:8,alignItems:'center',marginTop:6}}>
                  <select value={d.tipo_desconto} onChange={e=>updDesconto(pi,di,'tipo_desconto',e.target.value)}>
                    {Object.entries(DESCONTO_LABEL).map(([v,l])=><option key={v} value={v}>{l}</option>)}
                  </select>
                  <input type="number" step="0.01" value={d.valor} onChange={e=>updDesconto(pi,di,'valor',e.target.value)} placeholder="R$"/>
                  <input value={d.observacoes||''} onChange={e=>updDesconto(pi,di,'observacoes',e.target.value)} placeholder="Obs opcional"/>
                  <button className="btn-icon" onClick={()=>removeDesconto(pi,di)}>x</button>
                </div>
              ))}
            </div>

            <div className="preview-line" style={{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
              <span>Bruto: <b className="green">{fmtR$(bruto)}</b></span>
              <span>Descontos: <b className="red">{fmtR$(desc)}</b></span>
              <span>Liquido: <b className="blue">{fmtR$(liq)}</b></span>
            </div>
          </div>
        );
      })}

      <div style={{display:'flex',justifyContent:'space-between',gap:10,marginBottom:14}}>

      </div>

      <div className="card" style={{background:'var(--card-2)',padding:14}}>

          <span>Pratos: <b>{totalPratos}</b></span>
          <span>Bruto: <b className="green">{fmtR$(totalBruto)}</b></span>
          <span>Descontos: <b className="red">{fmtR$(totalDescontos)}</b></span>
          <span>Vai cair: <b className="blue">{fmtR$(totalLiquido)}</b></span>
        </div>
        <button className="btn btn-success btn-lg btn-block" style={{marginTop:10}} onClick={confirmar} disabled={loading || validos.length===0}>
          {loading?'Registrando...':`Lancar ${validos.length} pedido${validos.length===1?'':'s'} (${totalPratos} prato${totalPratos===1?'':'s'})`}
        </button>
      </div>

      <ConfirmModal
        open={!!confirmPayload}
        onClose={()=>setConfirmPayload(null)}
        onConfirm={()=>lancarConfirmado(confirmPayload)}
        title={`Confirmar ${(confirmPayload||[]).length} pedido(s)`}
        message="Confere se todos os pedidos do lote estao corretos."
      >
        <div className="table-wrap" style={{marginBottom:12}}>
          {(confirmPayload||[]).map((v,vi) => {
            const principais = (v.itens||[]).filter(x=>x.tipo_item==='principal');
            const adicionais = (v.itens||[]).filter(x=>x.tipo_item!=='principal');
            const bruto = (v.itens||[]).reduce((acc,it)=>acc + (it.tipo_item==='cortesia'?0:Number(it.quantidade||0)*Number(it.valor_unitario||0)), 0);
            const desc = sumBy(v.descontos||[], 'valor');
            return (
              <div key={vi} style={{marginBottom:14,padding:10,background:'var(--card-2)',borderRadius:8}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                  <b>📦 Pedido #{vi+1}{v.numero_pedido?` — #${v.numero_pedido}`:''} — <span className={CANAL_COR[v.canal_venda]||''}>{CANAL_LABEL[v.canal_venda]||v.canal_venda}</span> — {fmtDate(v.data_movimentacao)}</b>
                  <span>Bruto <b className="green">{fmtR$(bruto)}</b> · Desc <b className="red">{fmtR$(desc)}</b> · Liq <b className="blue">{fmtR$(Math.max(0,bruto-desc))}</b></span>
                </div>
                <table>
                  <thead><tr><th>Prato</th><th>Tipo</th><th>Qtd</th><th>Valor</th></tr></thead>
                  <tbody>
                    {principais.map((it,i) => {
                      const filhos = adicionais.filter(a => a.parent_ref === it.ref);
                      return (<Fragment key={i}>
                        <tr><td><b>{receitaNome(it.receita_id)}</b></td><td><span className="badge badge-blue">Principal</span></td><td>{fmt(it.quantidade,2)}</td><td className="green">{fmtR$(Number(it.quantidade||0)*Number(it.valor_unitario||0))}</td></tr>
                        {filhos.map((ad,j) => (
                          <tr key={'f'+j}>
                            <td style={{paddingLeft:18}}>↳ {receitaNome(ad.receita_id)}</td>
                            <td><span className={`badge badge-${ad.tipo_item==='cortesia'?'yellow':'green'}`}>{ad.tipo_item==='cortesia'?'Cortesia':'Adicional'}</span></td>
                            <td>{fmt(ad.quantidade,2)}</td>
                            <td className={ad.tipo_item==='cortesia'?'yellow':'green'}>{fmtR$(Number(ad.quantidade||0)*Number(ad.valor_unitario||0))}</td>
                          </tr>
                        ))}
                      </Fragment>);
                    })}
                  </tbody>
                </table>
                {(v.descontos||[]).length > 0 && (
                  <div style={{marginTop:6,fontSize:12}}>
                    {v.descontos.map((d,i) => <span key={i} className="muted" style={{marginRight:10}}>{DESCONTO_LABEL[d.tipo_desconto]||d.tipo_desconto}: <b className="red">{fmtR$(d.valor)}</b></span>)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </ConfirmModal>
    </div>
  );
}

function LegacyVendaHistorico({ sb, receitas, precos, toast, refreshKey }) {
  const [periodo, setPeriodo] = useState('mes');
  const [custom, setCustom] = useState({});
  const [filtroPrato, setFiltroPrato] = useState('');
  const [filtroCanal, setFiltroCanal] = useState('');
  const [rows, setRows] = useState([]);
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [loading, setLoading] = useState(false);
  const chartLineRef = useRef(null);
  const chartPieRef = useRef(null);

  async function load() {
    setLoading(true);
    const { from, to } = periodToDates(periodo, custom);
    let q = sb.from('vendas_itens').select(`
      id, venda_id, quantidade, valor_unitario, valor_total, cmv_total, lucro_bruto, receita_id,
      tipo_item, venda_item_pai_id, peso_real_gramas, observacoes,
      receitas_ficha_tecnica(nome),
      vendas!inner(canal_venda, desconto_plataforma, movimentacao_id, movimentacoes!inner(data_movimentacao))
    `).gte('vendas.movimentacoes.data_movimentacao', from.toISOString()).lte('vendas.movimentacoes.data_movimentacao', to.toISOString());
    if (filtroPrato) q = q.eq('receita_id', filtroPrato);
    if (filtroCanal) q = q.eq('vendas.canal_venda', filtroCanal);
    const { data } = await q.order('id',{ascending:false}).limit(500);
    setRows(data||[]);
    setLoading(false);
  }
  useEffect(() => { load(); }, [periodo, custom, filtroPrato, filtroCanal, refreshKey]);

  async function excluirVenda(row) {
    try {
      const { error } = await sb.rpc('rpc_excluir_venda', { p_venda_id: row.venda_id });
      if (error) throw error;
      toast('Venda excluida completamente','success');
      setConfirmDelete(null);
      load();
    } catch(e) {
      toast('Erro: '+e.message,'error');
    }
  }

  async function excluirVendaItem(row) {
    try {
      const { error } = await sb.rpc('rpc_excluir_venda_item', { p_venda_item_id: row.id });
      if (error) throw error;
      toast('Item removido da venda','success');
      setConfirmDeleteItem(null);
      load();
    } catch(e) {
      toast('Erro: '+e.message,'error');
    }
  }

  const totalBruto = sumBy(rows,'valor_total');
  const totalCMV   = sumBy(rows,'cmv_total');
  const totalLucro = sumBy(rows,'lucro_bruto');

  // Ranking por prato
  const ranking = useMemo(() => {
    const m = {};
    rows.forEach(r => {
      const k = r.receita_id;
      if (!m[k]) m[k] = { receita_id:k, nome:r.receitas_ficha_tecnica?.nome||'?', qtd:0, receita:0, cmv:0, lucro:0 };
      m[k].qtd += Number(r.quantidade);
      m[k].receita += Number(r.valor_total);
      m[k].cmv += Number(r.cmv_total);
      m[k].lucro += Number(r.lucro_bruto);
    });
    return Object.values(m).map(x => ({
      ...x,
      margem_pct: x.receita > 0 ? (x.lucro/x.receita)*100 : 0,
      food_cost: x.receita > 0 ? (x.cmv/x.receita)*100 : 0,
    })).sort((a,b)=>b.lucro-a.lucro);
  }, [rows]);

  const { from, to } = periodToDates(periodo, custom);
  const qtdDias = Math.max(1, Math.ceil((to-from)/86400000));

  // Vendas por dia
  const porDia = useMemo(() => {
    const m = {}; rows.forEach(r => { const k = r.vendas?.movimentacoes?.data_movimentacao?.slice(0,10); if (k) m[k] = (m[k]||0) + Number(r.valor_total); });
    return Object.entries(m).sort();
  }, [rows]);

  const extratoAgrupado = useMemo(() => {
    const filhos = {};
    rows.forEach(r => {
      if (r.venda_item_pai_id) (filhos[r.venda_item_pai_id] = filhos[r.venda_item_pai_id] || []).push(r);
    });
    const principais = rows.filter(r => !r.venda_item_pai_id);
    const idsPrincipais = new Set(principais.map(r => r.id));
    rows.forEach(r => {
      if (r.venda_item_pai_id && !idsPrincipais.has(r.venda_item_pai_id)) principais.push(r);
    });
    return principais.map(r => ({...r, adicionais: filhos[r.id] || []}));
  }, [rows]);

  useChart(chartLineRef, () => {
    if (porDia.length === 0) return null;
    return {
      type:'line',
      data:{ labels:porDia.map(x=>fmtDate(x[0]).slice(0,5)), datasets:[{ data:porDia.map(x=>x[1]), borderColor:cssVar('--green'), backgroundColor:'rgba(52,211,153,.15)', fill:true, tension:.3 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ x:{ ticks:{color:cssVar('--muted'),font:{size:10}}, grid:{display:false} }, y:{ ticks:{color:cssVar('--muted'),callback:v=>'R$ '+fmt(v,0)}, grid:{color:cssVar('--border')} } }
      }
    };
  }, [porDia]);

  useChart(chartPieRef, () => {
    if (ranking.length === 0) return null;
    const top = ranking.slice(0,8);
    return {
      type:'doughnut',
      data:{ labels:top.map(x=>x.nome), datasets:[{ data:top.map(x=>x.receita), backgroundColor:['#34d399','#4a90d9','#fbbf24','#a78bfa','#f87171','#22d3ee','#fb923c','#94a3b8'] }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'right', labels:{color:cssVar('--text-2'),font:{size:11},boxWidth:12} } } }
    };
  }, [ranking]);

  return (
    <div className="card" style={{marginTop:18}}>
      <div className="card-title">📜 Histórico de vendas</div>
      <DatePeriodFilter value={periodo} onChange={setPeriodo} custom={custom} onCustomChange={setCustom}/>
      <div className="form-row">
        <div className="form-group"><label>Filtrar prato</label><SearchableDropdown value={filtroPrato} onChange={setFiltroPrato} options={receitas} placeholder="Todos"/></div>
        <div className="form-group">
          <label>Filtrar canal</label>
          <select value={filtroCanal} onChange={e=>setFiltroCanal(e.target.value)}>
            <option value="">Todos</option>
            {Object.entries(CANAL_LABEL).map(([v,l])=><option key={v} value={v}>{l}</option>)}
          </select>
        </div>
      </div>

      <div className="stat-grid">
        <div className="stat-card tinted-green"><div className="stat-value green">{fmtR$(totalBruto)}</div><div className="stat-label">Receita do período</div></div>
        <div className="stat-card tinted-red"><div className="stat-value red">{fmtR$(totalCMV)}</div><div className="stat-label">CMV total</div></div>
        <div className="stat-card tinted-blue"><div className={`stat-value ${totalLucro>=0?'green':'red'}`}>{fmtR$(totalLucro)}</div><div className="stat-label">Lucro bruto</div></div>
        <div className="stat-card"><div className="stat-value">{rows.length}</div><div className="stat-label">Itens vendidos</div></div>
      </div>

      {ranking.length > 0 && (
        <div className="card" style={{background:'var(--card-2)'}}>
          <div className="card-title">🏆 Ranking por prato</div>
          <div className="table-wrap">
            <table>
              <thead><tr><th></th><th>Prato</th><th>Qtd</th><th>Qtd/dia</th><th>Receita</th><th>CMV</th><th>Lucro</th><th>Margem</th><th>Food cost</th></tr></thead>
              <tbody>
                {ranking.map((r,i) => {
                  const m = r.margem_pct, fc = r.food_cost;
                  const corM = m>=40?'green':m>=25?'yellow':'red';
                  const corFC = fc<32?'green':fc<38?'yellow':'red';
                  return (
                    <tr key={r.receita_id}>
                      <td>{i<3?['🥇','🥈','🥉'][i]:i+1}</td>
                      <td><b>{r.nome}</b></td>
                      <td>{fmt(r.qtd,0)}</td>
                      <td className="muted">{fmt(r.qtd/qtdDias,1)}</td>
                      <td className="green">{fmtR$(r.receita)}</td>
                      <td className="red">{fmtR$(r.cmv)}</td>
                      <td className={r.lucro>=0?'green':'red'}>{fmtR$(r.lucro)}</td>
                      <td className={corM}>{fmtPct(m)}</td>
                      <td className={corFC}>{fmtPct(fc)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {porDia.length > 0 && (
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div className="card" style={{background:'var(--card-2)'}}>
            <div className="card-title">Vendas por dia</div>
            <div className="chart-wrap"><canvas ref={chartLineRef}/></div>
          </div>
          <div className="card" style={{background:'var(--card-2)'}}>
            <div className="card-title">Receita por prato (top 8)</div>
            <div className="chart-wrap"><canvas ref={chartPieRef}/></div>
          </div>
        </div>
      )}

      <div className="table-wrap" style={{marginTop:14}}>
        <table>
          <thead><tr><th>Data</th><th>Prato</th><th>Qtd</th><th>Preço</th><th>Total</th><th>Canal</th><th>CMV</th><th>Lucro</th><th>Acoes</th></tr></thead>
          <tbody>
            {loading && <tr><td colSpan="9"><Skeleton rows={3}/></td></tr>}
            {!loading && rows.length === 0 && <tr><td colSpan="9" className="empty">Nenhuma venda no período</td></tr>}
            {!loading && rows.map(r => (
              <tr key={r.id}>
                <td className="muted">{fmtDate(r.vendas?.movimentacoes?.data_movimentacao)}</td>
                <td>{r.receitas_ficha_tecnica?.nome}</td>
                <td>{fmt(r.quantidade,0)}</td>
                <td>{fmtR$(r.valor_unitario)}</td>
                <td className="green">{fmtR$(r.valor_total)}</td>
                <td><span className="badge badge-blue">{CANAL_LABEL[r.vendas?.canal_venda]||'—'}</span></td>
                <td className="red">{fmtR$(r.cmv_total)}</td>
                <td className={Number(r.lucro_bruto)>=0?'green':'red'}>{fmtR$(r.lucro_bruto)}</td>
                <td>
                  <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                    <EditRowButton onClick={()=>setEditing(r)}/>
                    <DeleteRowButton onClick={()=>setConfirmDelete(r)}/>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <EditVendaModal open={!!editing} onClose={()=>setEditing(null)} row={editing} receitas={receitas} sb={sb} toast={toast} onSaved={load}/>
      <ConfirmModal
        open={!!confirmDelete}
        onClose={()=>setConfirmDelete(null)}
        onConfirm={()=>excluirVenda(confirmDelete)}
        title="Excluir venda inteira"
        message={`Excluir a venda inteira de "${confirmDelete?.receitas_ficha_tecnica?.nome||''}"? Se a venda tiver mais pratos, todos os itens dessa venda tambem serao apagados do estoque, CMV e caixa.`}
        danger
        requireText="EXCLUIR"
      />
    </div>
  );
}
